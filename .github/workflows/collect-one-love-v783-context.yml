name: Collect ONE LOVE v783 context

on:
  push:
    branches: [one-love-v783-work]

permissions:
  contents: write

jobs:
  collect:
    if: github.event.head_commit.message == 'Collect ONE LOVE v783 precise context'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one-love-v783-work
      - name: Collect precise current-source excerpts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/one-love-context
          sed -n '7660,8020p' js/app.js > .github/one-love-context/app-events.txt
          sed -n '12090,12160p' js/app.js > .github/one-love-context/app-render-map.txt
          sed -n '14580,14790p' js/app.js > .github/one-love-context/app-kappa-render.txt
          sed -n '20460,20550p' js/app.js > .github/one-love-context/app-metal-buy.txt
          sed -n '23370,23430p' js/app.js > .github/one-love-context/app-actions.txt
          sed -n '23525,23575p' js/app.js > .github/one-love-context/app-workshop-entry.txt
          cat js/audio-scene-map.js > .github/one-love-context/audio-scene-map.txt
          python3 - <<'PY'
          from pathlib import Path
          for source, terms, out_name in [
              ('styles.css', ['visit-character-event','visit-character-area','workshop-kappa-character','event-dialogue-card','visit-event-dialogue','kappa-jade-event'], 'styles-event.txt'),
              ('js/game-data-core.js', ['events:', 'kappaJadeEvent', 'workshopKappaJadeEvent', 'yowamushiRoseQuartzEvent', 'metalMarket'], 'game-data-core.txt'),
              ('js/game-data.js', ['events:', 'kappaJadeEvent', 'workshopKappaJadeEvent', 'yowamushiRoseQuartzEvent', 'metalMarket'], 'game-data.txt'),
          ]:
              p=Path(source)
              if not p.exists():
                  continue
              lines=p.read_text(encoding='utf-8').splitlines()
              ranges=[]
              for i,line in enumerate(lines):
                  if any(t in line for t in terms):
                      lo=max(0,i-20); hi=min(len(lines),i+35)
                      if ranges and lo <= ranges[-1][1]+3:
                          ranges[-1]=(ranges[-1][0],max(ranges[-1][1],hi))
                      else:
                          ranges.append((lo,hi))
              chunks=[]
              for lo,hi in ranges:
                  chunks.append(f'===== {source}:{lo+1}-{hi} =====\n')
                  chunks.extend(f'{n+1:06d}: {lines[n]}\n' for n in range(lo,hi))
              Path('.github/one-love-context',out_name).write_text(''.join(chunks),encoding='utf-8')
          PY
      - name: Commit context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/one-love-context
          git commit -m 'Save ONE LOVE v783 precise source context'
          git push origin HEAD:one-love-v783-work
