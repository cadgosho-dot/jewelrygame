name: Phase42 Temporary Audit

on:
  push:
    branches: [protect-stage42]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect artisan progression usage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('js/app.js', 'utf8');
          function extract(name) {
            const re = new RegExp(`(?:async\\s+)?function\\s+${name}\\s*\\([^)]*\\)\\s*\\{`, 'm');
            const m = re.exec(app);
            if (!m) return null;
            const brace = app.indexOf('{', m.index);
            let depth=0, quote=null, esc=false, line=false, block=false;
            for (let i=brace;i<app.length;i++) {
              const c=app[i], n=app[i+1];
              if (line) { if (c==='\n') line=false; continue; }
              if (block) { if (c==='*'&&n==='/') { block=false; i++; } continue; }
              if (quote) { if (esc) esc=false; else if (c==='\\') esc=true; else if (c===quote) quote=null; continue; }
              if (c==='/'&&n==='/') { line=true; i++; continue; }
              if (c==='/'&&n==='*') { block=true; i++; continue; }
              if (c==='"'||c==="'"||c==='`') { quote=c; continue; }
              if (c==='{') depth++;
              else if (c==='}' && --depth===0) return app.slice(m.index, i+1);
            }
            return null;
          }
          for (const name of ['artisanLevelForXp','addArtisanXp','applyArtisanLevelPenalty','recoverArtisanLevelPenalty']) {
            console.log(`===== ${name} =====`);
            console.log(extract(name) || 'NOT FOUND');
          }
          for (const needle of ['addArtisanXp(', 'applyArtisanLevelPenalty(', 'recoverArtisanLevelPenalty(']) {
            console.log(`===== CALLS ${needle} =====`);
            app.split('\n').forEach((line, i) => {
              if (line.includes(needle) && !line.trimStart().startsWith('function ')) console.log(`${i + 1}: ${line.trim()}`);
            });
          }
          NODE
          echo '===== EXISTING TEST/CHECK REFERENCES ====='
          grep -R -n -E 'addArtisanXp|applyArtisanLevelPenalty|recoverArtisanLevelPenalty' scripts tools || true
