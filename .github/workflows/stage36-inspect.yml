name: stage36-inspect
on:
  push:
    branches: [refactor-stage36-inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect active display helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('js/app.js').read_text(encoding='utf-8')
          names = [
              'customerTemplateText', 'looseDisplayLabel', 'artisanTitle',
              'storeDisplayName', 'playerDisplayName', 'playerFirstName',
              'metalDisplayName', 'gemDisplayName', 'designDisplayName'
          ]
          for name in names:
              refs = text.count(name + '(')
              print(f'=== {name} refs={refs} ===')
              m = re.search(rf'function\s+{re.escape(name)}\s*\([^)]*\)\s*\{{', text)
              if not m:
                  print('definition: NOT FOUND')
                  continue
              start = m.start()
              depth = 0
              end = None
              for i in range(m.end()-1, len(text)):
                  ch = text[i]
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              print(text[start:end])
              print()
          PY
