name: v0.10.768 orphan chunk cleanup

on:
  push:
    branches:
      - impl/v010768-orphan-chunk-cleanup
    paths:
      - '.github/workflows/impl-v010768-orphan-chunk-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impl-v010768-orphan-chunk-cleanup
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: impl/v010768-orphan-chunk-cleanup
          fetch-depth: 20

      - name: Verify base release
        run: test "$(cat VERSION)" = "0.10.767"

      - name: Patch safe orphan cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          firebase_path = Path('js/firebase-service.js')
          text = firebase_path.read_text(encoding='utf-8')

          import_anchor = """  getFirestore,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
          """
          import_new = """  getFirestore,
            collection,
            query,
            where,
            limit,
            getDocs,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
          """
          if text.count(import_anchor) != 1:
              raise SystemExit(f'Firestore import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, import_new, 1)

          constants_anchor = """const CLOUD_CHUNK_MAX_COUNT = 64;
          const cloudStorageMetaByUid = new Map();
          """
          constants_new = """const CLOUD_CHUNK_MAX_COUNT = 64;
          // 強制終了などで参照されないまま残った世代だけを、十分な猶予後に少量ずつ掃除する。
          const ORPHAN_CHUNK_MIN_AGE_MS = 7 * 24 * 60 * 60 * 1000;
          const ORPHAN_CHUNK_CLEANUP_LIMIT = 128;
          const cloudStorageMetaByUid = new Map();
          const orphanCleanupAttemptedUids = new Set();
          """
          if text.count(constants_anchor) != 1:
              raise SystemExit(f'cleanup constants anchor count={text.count(constants_anchor)}')
          text = text.replace(constants_anchor, constants_new, 1)

          cleanup_anchor = """async function cleanupChunkGeneration(uid, metadata) {
            if (!metadata || metadata.mode !== 'chunked') return;
            const generation = String(metadata.generation || '');
            const count = Math.max(0, Math.floor(Number(metadata.count) || 0));
            if (!generation || !count) return;
            await Promise.allSettled(Array.from({ length: count }, (_, index) => (
              deleteDoc(doc(db, 'users', uid, 'saveChunks', cloudChunkDocId(generation, index)))
            )));
          }

          function shouldRetryCloudSave(error, attempt) {
          """
          cleanup_new = """async function cleanupChunkGeneration(uid, metadata) {
            if (!metadata || metadata.mode !== 'chunked') return;
            const generation = String(metadata.generation || '');
            const count = Math.max(0, Math.floor(Number(metadata.count) || 0));
            if (!generation || !count) return;
            await Promise.allSettled(Array.from({ length: count }, (_, index) => (
              deleteDoc(doc(db, 'users', uid, 'saveChunks', cloudChunkDocId(generation, index)))
            )));
          }

          async function cleanupOldOrphanChunks(uid) {
            if (previewMode || !uid || orphanCleanupAttemptedUids.has(uid)) return;
            // 保存成功の主経路を遅くしないため、同じページセッションでは1回だけ試す。
            orphanCleanupAttemptedUids.add(uid);
            try {
              const currentMetadata = await readCurrentCloudMetadata(uid);
              const firstProtectedGeneration = currentMetadata?.mode === 'chunked'
                ? String(currentMetadata.generation || '')
                : '';
              if (!firstProtectedGeneration) return;

              const cutoff = new Date(Date.now() - ORPHAN_CHUNK_MIN_AGE_MS);
              const oldChunks = await getDocs(query(
                collection(db, 'users', uid, 'saveChunks'),
                where('updatedAt', '<', cutoff),
                limit(ORPHAN_CHUNK_CLEANUP_LIMIT),
              ));
              if (oldChunks.empty) return;

              // 問い合わせ中に別タブが保存しても、問い合わせ前後の現行世代を両方保護する。
              const latestMetadata = await readCurrentCloudMetadata(uid);
              const latestProtectedGeneration = latestMetadata?.mode === 'chunked'
                ? String(latestMetadata.generation || '')
                : '';
              const protectedGenerations = new Set(
                [firstProtectedGeneration, latestProtectedGeneration].filter(Boolean),
              );
              const deletions = oldChunks.docs
                .filter((snapshot) => {
                  const generation = String(snapshot.data()?.generation || '');
                  return generation && !protectedGenerations.has(generation);
                })
                .map((snapshot) => deleteDoc(snapshot.ref));
              if (deletions.length) await Promise.allSettled(deletions);
            } catch (error) {
              // 掃除は容量最適化だけ。失敗してもゲーム保存・起動・プレゼントの成功判定へ影響させない。
              console.warn('古い未参照クラウドチャンクの掃除を見送りました。ゲーム保存は継続します。', error);
            }
          }

          function shouldRetryCloudSave(error, attempt) {
          """
          if text.count(cleanup_anchor) != 1:
              raise SystemExit(f'cleanup function anchor count={text.count(cleanup_anchor)}')
          text = text.replace(cleanup_anchor, cleanup_new, 1)

          save_anchor = """  if (previousMetadata?.mode === 'chunked' && previousMetadata.generation !== generation) {
              void cleanupChunkGeneration(uid, previousMetadata);
            }
          }

          export async function deleteGameData(uid) {
          """
          save_new = """  if (previousMetadata?.mode === 'chunked' && previousMetadata.generation !== generation) {
              void cleanupChunkGeneration(uid, previousMetadata);
            }
            void cleanupOldOrphanChunks(uid);
          }

          export async function deleteGameData(uid) {
          """
          if text.count(save_anchor) != 1:
              raise SystemExit(f'normal save cleanup anchor count={text.count(save_anchor)}')
          text = text.replace(save_anchor, save_new, 1)

          gift_anchor = """    if (expectedMetadata?.mode === 'chunked' && expectedMetadata.generation !== staged.metadata.generation) {
                void cleanupChunkGeneration(uid, expectedMetadata);
              }
              return result;
            };
          """
          gift_new = """    if (expectedMetadata?.mode === 'chunked' && expectedMetadata.generation !== staged.metadata.generation) {
                void cleanupChunkGeneration(uid, expectedMetadata);
              }
              void cleanupOldOrphanChunks(uid);
              return result;
            };
          """
          if text.count(gift_anchor) != 1:
              raise SystemExit(f'gift cleanup anchor count={text.count(gift_anchor)}')
          text = text.replace(gift_anchor, gift_new, 1)
          firebase_path.write_text(text, encoding='utf-8')

          checker = r'''#!/usr/bin/env python3
          """Validate conservative cleanup of unreferenced cloud save chunks."""
          from pathlib import Path
          import subprocess
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          FIREBASE = (ROOT / 'js/firebase-service.js').read_text(encoding='utf-8')

          start = FIREBASE.find('async function cleanupOldOrphanChunks(uid)')
          end = FIREBASE.find('function shouldRetryCloudSave', start)
          CLEANUP = FIREBASE[start:end] if start >= 0 and end > start else ''
          save_start = FIREBASE.find('export async function saveState(uid, state)')
          save_end = FIREBASE.find('export async function deleteGameData', save_start)
          SAVE = FIREBASE[save_start:save_end] if save_start >= 0 and save_end > save_start else ''
          gift_start = FIREBASE.find('async function commitGiftChunkedTransition')
          gift_end = FIREBASE.find('export function normalizeGiftCode', gift_start)
          GIFT = FIREBASE[gift_start:gift_end] if gift_start >= 0 and gift_end > gift_start else ''

          checks = {
              'Firestoreの限定一覧取得APIを使う': all(token in FIREBASE for token in ('collection,', 'query,', 'where,', 'limit,', 'getDocs,')),
              '7日以上古いチャンクだけを対象にする': 'ORPHAN_CHUNK_MIN_AGE_MS = 7 * 24 * 60 * 60 * 1000' in FIREBASE and "where('updatedAt', '<', cutoff)" in CLEANUP,
              '1回最大128件に制限する': 'ORPHAN_CHUNK_CLEANUP_LIMIT = 128' in FIREBASE and 'limit(ORPHAN_CHUNK_CLEANUP_LIMIT)' in CLEANUP,
              '1セッション1回だけ試す': 'orphanCleanupAttemptedUids = new Set()' in FIREBASE and 'orphanCleanupAttemptedUids.has(uid)' in CLEANUP and 'orphanCleanupAttemptedUids.add(uid)' in CLEANUP,
              '問い合わせ前の現行generationを保護する': 'firstProtectedGeneration' in CLEANUP and '[firstProtectedGeneration, latestProtectedGeneration]' in CLEANUP,
              '削除直前に現行metadataを再確認する': CLEANUP.count('readCurrentCloudMetadata(uid)') >= 2 and 'latestProtectedGeneration' in CLEANUP,
              '現行generationは削除対象から除外する': '!protectedGenerations.has(generation)' in CLEANUP,
              '削除は取得した古い文書refだけに限定する': '.map((snapshot) => deleteDoc(snapshot.ref))' in CLEANUP,
              '掃除失敗は保存成功を壊さない': 'catch (error)' in CLEANUP and 'ゲーム保存は継続します。' in CLEANUP,
              '通常保存成功後にベストエフォート掃除を起動する': 'void cleanupOldOrphanChunks(uid);' in SAVE,
              'プレゼント確定後にもベストエフォート掃除を起動する': 'void cleanupOldOrphanChunks(uid);' in GIFT,
              '既存の直前世代掃除を維持する': 'void cleanupChunkGeneration(uid, previousMetadata);' in SAVE and 'void cleanupChunkGeneration(uid, expectedMetadata);' in GIFT,
          }

          failed = [label for label, ok in checks.items() if not ok]
          for label, ok in checks.items():
              print(('OK' if ok else 'NG') + ': ' + label)

          proc = subprocess.run(['node', '--check', 'js/firebase-service.js'], cwd=ROOT)
          if proc.returncode != 0:
              failed.append('JavaScript構文: js/firebase-service.js')

          if failed:
              print('\nORPHAN CHUNK CLEANUP POLICY: FAIL')
              for label in failed:
                  print('- ' + label)
              sys.exit(1)
          print('\nORPHAN CHUNK CLEANUP POLICY: PASS')
          '''
          checker = '\n'.join(line[10:] if line.startswith('          ') else line for line in checker.splitlines()) + '\n'
          Path('scripts/check-orphan-chunk-cleanup.py').write_text(checker, encoding='utf-8')

          current_path = Path('scripts/check-current.py')
          current = current_path.read_text(encoding='utf-8')
          current_anchor = "    ('プレゼント分割セーブ', [sys.executable, str(ROOT / 'scripts/check-gift-chunked-save.py')]),\n"
          current_new = current_anchor + "    ('未参照クラウドチャンク掃除', [sys.executable, str(ROOT / 'scripts/check-orphan-chunk-cleanup.py')]),\n"
          if current.count(current_anchor) != 1:
              raise SystemExit(f'check-current anchor count={current.count(current_anchor)}')
          current_path.write_text(current.replace(current_anchor, current_new, 1), encoding='utf-8')
          PY

      - name: Synchronize release to v0.10.768
        run: python3 scripts/version-sync.py --set 0.10.768

      - name: Verify exact change scope
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'VERSION',
              'auth-cache-recovery.js',
              'game.html',
              'hosting-origin-guard.js',
              'index.html',
              'js/app.js',
              'js/firebase-service.js',
              'js/game-data.js',
              'js/memories-screen.js',
              'scripts/check-current.py',
              'scripts/check-orphan-chunk-cleanup.py',
              'sw.js',
          }
          tracked = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()))
          untracked = set(filter(None, subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()))
          changed = tracked | untracked
          if changed != expected:
              raise SystemExit(f'Unexpected files: changed={sorted(changed)} expected={sorted(expected)}')
          print('CHANGE SCOPE: PASS')
          PY

      - name: Install image validation dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Run focused cleanup audit
        run: python3 scripts/check-orphan-chunk-cleanup.py

      - name: Run full current build audit
        run: python3 -u scripts/check-current.py

      - name: Verify JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/firebase-service.js
          node --check js/local-save-storage.js
          node --check sw.js

      - name: Commit tested implementation to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION auth-cache-recovery.js game.html hosting-origin-guard.js index.html js/app.js js/firebase-service.js js/game-data.js js/memories-screen.js scripts/check-current.py scripts/check-orphan-chunk-cleanup.py sw.js
          git diff --cached --check
          git commit -m "v0.10.768: Clean old orphan save chunks safely"
          git push origin HEAD:impl/v010768-orphan-chunk-cleanup
