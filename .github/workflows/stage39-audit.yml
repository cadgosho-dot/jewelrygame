name: Stage 39 audit
on:
  push:
    branches: [protect-stage39]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract runEventEmergencySettlement
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path('js/app.js').read_text(encoding='utf-8')
          m = re.search(r'^(?:async\s+)?function runEventEmergencySettlement\(', src, re.M)
          if not m:
              raise SystemExit('function not found')
          following = re.search(r'^(?:async\s+)?function ', src[m.end():], re.M)
          end = m.end() + following.start() if following else len(src)
          print('=== RUN_EVENT_EMERGENCY_SETTLEMENT_BEGIN ===')
          print(src[m.start():end])
          print('=== RUN_EVENT_EMERGENCY_SETTLEMENT_END ===')
          PY
