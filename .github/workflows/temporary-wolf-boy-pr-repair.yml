name: Temporary wolf-boy PR repair

on:
  push:
    branches:
      - wolf-boy-ring-event

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: wolf-boy-ring-event
          fetch-depth: 1

      - name: Prepare asset generator
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Repair version refs and regenerate asset manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = '0.10.940'
          Path('VERSION').write_text(version + '\n', encoding='utf-8')

          for rel in (
              'js/event-bootstrap.js',
              'js/memories-backgrounds.js',
              'js/wolf-boy-ring-event.js',
          ):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              text = text.replace('?v=0.10.941', '?v=0.10.940')
              path.write_text(text, encoding='utf-8')

          generator = Path('scripts/generate-assets-manifest.py')
          text = generator.read_text(encoding='utf-8')
          anchor = "    'js/memories-backgrounds.js',\n"
          additions = (
              "    'js/event-bootstrap.js',\n"
              "    'js/wolf-boy-ring-event.js',\n"
          )
          if "    'js/wolf-boy-ring-event.js',\n" not in text:
              if anchor not in text:
                  raise SystemExit('SOURCE_ORDER insertion anchor not found')
              text = text.replace(anchor, anchor + additions, 1)
              generator.write_text(text, encoding='utf-8')
          PY

          python3 scripts/generate-assets-manifest.py --write
          python3 scripts/version-sync.py --check
          python3 scripts/generate-assets-manifest.py --check

      - name: Commit repaired generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION ASSETS.md scripts/generate-assets-manifest.py js/event-bootstrap.js js/memories-backgrounds.js js/wolf-boy-ring-event.js
          if git diff --cached --quiet; then
            echo "No repair changes were needed."
            exit 0
          fi
          git commit -m "PR検査のバージョン同期とアセット管理を修正"
          git push origin HEAD:wolf-boy-ring-event
