name: Phase46 Formal Sync v0.10.935
# Final feature validation after lightweight regression and static checks passed.
# Revalidated after removing the temporary stage46 audit report.

on:
  push:
    branches: [main, protect-stage46]
    paths:
      - '.github/workflows/phase46-sync-v010935.yml'
      - 'tools/test-emerald-captain-kebab-meal-regression.mjs'
      - 'scripts/check-emerald-captain-kebab-meal-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'protect-stage46'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate Emerald Captain kebab meal protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          test ! -e .github/workflows/stage46-audit.yml
          python3 scripts/version-sync.py --check
          python3 scripts/check-emerald-captain-kebab-meal-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.934'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('強盗事件 完成品盗難確定処理保護', [sys.executable, str(ROOT / 'scripts/check-robbery-event-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-emerald-captain-kebab-meal-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('エメラルド班班長 ケバブ食事開始・完了処理保護', [sys.executable, str(ROOT / 'scripts/check-emerald-captain-kebab-meal-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.935\n- 中核処理保護・第46段階：エメラルド班班長イベントのケバブ食事開始 `startEmeraldCaptainKebabMeal()` と食事完了 `finishEmeraldCaptainKebabMeal()` を動的回帰テストと静的検査で固定。\n- 支払い、二重課金防止、1時間消費、空腹回復、食事履歴、二重完了防止、所持金不足・読込失敗時の復旧を検証。\n- ゲーム仕様・食事価格・時間消費・空腹回復量・イベント内容・画像・音声・セーブ形式・クラウド保存形式の変更なし。\n'
          assert '## v0.10.935' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-emerald-captain-kebab-meal-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.934', '?v=0.10.935').replace("const UI_BUILD_VERSION = '0.10.934';", "const UI_BUILD_VERSION = '0.10.935';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase46-sync-v010935.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.935 第46段階正式同期'
          git push origin HEAD:main
