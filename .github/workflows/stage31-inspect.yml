name: stage31-inspect
on:
  push:
    branches: [refactor-stage31-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect active pure display candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/app.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          print('=== SAVE DIAGNOSTICS AREA ===')
          for i in range(21070, min(21360,len(lines))+1):
              print(f'{i:05d}: {lines[i-1]}')
          print('\n=== SMALL DISPLAY-LIKE FUNCTION DEFINITIONS ===')
          text='\n'.join(lines)
          pat=re.compile(r'(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(([^)]*)\)\s*\{')
          matches=list(pat.finditer(text))
          starts=[m.start() for m in matches]+[len(text)]
          for idx,m in enumerate(matches):
              name=m.group(1)
              if not re.search(r'(format|label|text|name|title|description|display|message|caption|summary)', name, re.I):
                  continue
              line=text.count('\n',0,m.start())+1
              # conservative brace scan to obtain function body length
              pos=m.end(); depth=1
              in_s=in_d=in_t=False; esc=False
              while pos < len(text) and depth:
                  c=text[pos]
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif in_s:
                      if c=="'": in_s=False
                  elif in_d:
                      if c=='"': in_d=False
                  elif in_t:
                      if c=='`': in_t=False
                  else:
                      if c=="'": in_s=True
                      elif c=='"': in_d=True
                      elif c=='`': in_t=True
                      elif c=='{': depth+=1
                      elif c=='}': depth-=1
                  pos+=1
              endline=text.count('\n',0,pos)+1
              length=endline-line+1
              calls=len(re.findall(r'\b'+re.escape(name)+r'\s*\(', text))
              if length <= 18:
                  body='\n'.join(lines[line-1:endline])
                  print(f'--- {name} line={line} lines={length} occurrences={calls} ---')
                  print(body)
          PY
