name: codex-v863-apply
'on':
  push:
    branches:
      - codex/v0-10-863-tool-brief
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source changes
        run: python3 scripts/apply-v010863-temp.py
      - name: Synchronize version and generated docs
        run: |
          python3 scripts/version-sync.py --set 0.10.863
          python3 scripts/generate-event-probability-list.py --write
      - name: Remove temporary implementation files
        run: |
          rm .github/workflows/codex-v863-apply.yml
          rm scripts/apply-v010863-temp.py
      - name: Install validation dependencies
        run: |
          python3 -m pip install pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Focused validation
        run: |
          node --check js/app.js
          node --check js/ui/tool-brief.js
          node tools/test-tool-brief.mjs
          python3 scripts/check-tool-brief.py
          python3 scripts/version-sync.py --check
          python3 scripts/generate-event-probability-list.py --check
      - name: Full current-build audit
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: python3 scripts/check-current.py
      - name: Guard final diff
        run: |
          test ! -e .github/workflows/codex-v863-apply.yml
          test ! -e scripts/apply-v010863-temp.py
          if git status --short | grep -E 'assets/images|\.(png|jpg|jpeg|webp|gif)$'; then exit 1; fi
          git status --short
      - name: Commit validated build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: extract tool brief presenter for v0.10.863 [skip ci]'
          git push
