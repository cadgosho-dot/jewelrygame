name: Temporary event transition audit

on:
  push:
    branches:
      - audit/event-transition-surfaces-20260914

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect await-based event transitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('js/app.js').read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^(?:async\s+)?function\s+(\w+)\s*\([^\n]*\)\s*\{')

          def extract(m):
              brace = source.find('{', m.start(), m.end()+1)
              depth = 0; quote = ''; escaped = False
              for i in range(brace, len(source)):
                  ch = source[i]
                  if quote:
                      if escaped: escaped = False
                      elif ch == '\\': escaped = True
                      elif ch == quote: quote = ''
                      continue
                  if ch in "'\"`": quote = ch; continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return source[m.start():i+1]
              return ''

          for m in pattern.finditer(source):
              name = m.group(1)
              body = extract(m)
              if not body or ('await wait(' not in body and 'await waitForNextPaintWithTimeout' not in body):
                  continue
              if not any(k in name.lower() for k in ('event','meal','theft','cinema','quiz','juke','wolf','friend','haunting','emerald','mystery','oyatsu')):
                  continue
              print(f'--- {name} ---')
              for line in body.splitlines():
                  stripped = line.strip()
                  if any(token in stripped for token in ('await wait(', 'await waitForNextPaintWithTimeout', '.stage =', 'saveGame()', 'setScreen(', 'render()', 'finish', 'recover', 'schedule')):
                      print(stripped[:280])
          PY
