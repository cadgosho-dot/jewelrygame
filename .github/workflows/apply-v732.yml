name: v0.10.732 正式版適用

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-v732:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: v0.10.732へ統一
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  print(f'[{path}] 対象なし: {old}')
                  return
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'[{path}] {old} -> {new}')

          # 正式ゲームバージョン
          replace('js/game-data.js', "export const VERSION = '0.10.731';", "export const VERSION = '0.10.732';")
          replace('js/app.js', "const UI_BUILD_VERSION = '0.10.731';", "const UI_BUILD_VERSION = '0.10.732';")

          # app.js先頭の実行モジュール参照（旧729のまま残っていたもの）
          replace('js/app.js', "./audio.js?v=0.10.729", "./audio.js?v=0.10.732")
          replace('js/app.js', "./audio-scene-map.js?v=0.10.729", "./audio-scene-map.js?v=0.10.732")
          replace('js/app.js', "./firebase-service.js?v=0.10.729", "./firebase-service.js?v=0.10.732")

          # HTMLとService Workerの現行731参照を732へ
          for path in ('game.html', 'index.html', 'auth.html', 'sw.js'):
              replace(path, '0.10.731', '0.10.732')
          PY

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game-data.js js/app.js game.html index.html auth.html sw.js
          if git diff --cached --quiet; then
            echo "v0.10.732への変更はすでに適用済みです。"
            exit 0
          fi
          git commit -m "v0.10.732へ正式更新"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
