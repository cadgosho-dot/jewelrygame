name: Phase28 Inspect
on:
  push:
    branches: [phase28-inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rank state-changing functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('js/app.js').read_text(encoding='utf-8')
          lines = text.splitlines()
          protected = set()
          for p in Path('scripts').glob('check-*-regression.py'):
              s = p.read_text(encoding='utf-8', errors='ignore')
              for m in re.finditer(r"\b(?:function\s+)?([A-Za-z_$][\w$]+)\s*\(", s):
                  name = m.group(1)
                  if len(name) > 2:
                      protected.add(name)

          starts=[]
          pats=[
            re.compile(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\('),
            re.compile(r'^\s*(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\([^)]*\)\s*=>\s*\{'),
          ]
          for i,line in enumerate(lines):
              for pat in pats:
                  m=pat.search(line)
                  if m:
                      starts.append((i,m.group(1))); break

          def body_from(start):
              depth=0; seen=False; out=[]
              for j in range(start, min(len(lines), start+1200)):
                  line=lines[j]; out.append(line)
                  # approximate brace count; enough for ranking/excerpt
                  depth += line.count('{') - line.count('}')
                  if '{' in line: seen=True
                  if seen and depth <= 0:
                      break
              return '\n'.join(out)

          rows=[]
          for i,name in starts:
              body=body_from(i)
              if 'state.' not in body and 'save(' not in body and 'addFinance(' not in body:
                  continue
              score=0
              score += len(re.findall(r'state\.[\w.$\[\]]+\s*(?:=|\+=|-=|\+\+|--)', body))*5
              score += len(re.findall(r'\.push\(|\.splice\(|\.pop\(|\.shift\(|\.unshift\(', body))*3
              score += body.count('save(')*4
              score += body.count('addFinance(')*3
              score += body.count('advanceTime(')*3
              score += body.count('money')
              if name in protected: score -= 20
              rows.append((score, i+1, name, name in protected, len(body.splitlines())))
          rows.sort(reverse=True)
          print('=== TOP STATE-CHANGING FUNCTIONS ===')
          for row in rows[:80]: print(row)

          targets=['startMining','runAutopilotDay','autopilot','sellDisplayed','sellShowcase','openMining','startPolish','startCraft','eatMeal','eat','sleep','goToSleep','customerOrder','startOrder','buyItem','useItem','repair','hire','fire','recruit']
          print('\n=== TARGET NAME MATCHES ===')
          for i,name in starts:
              low=name.lower()
              if any(t.lower() in low for t in targets):
                  print(f'--- {name} @ {i+1} ---')
                  print(body_from(i)[:12000])
          PY
