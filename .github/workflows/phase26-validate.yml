name: Phase26 Validate Phone Item Equipment

on:
  push:
    branches:
      - phase26-phone-item-equipment-v0.10.915

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase26-phone-item-equipment-v0.10.915
          fetch-depth: 0
      - name: Validate Stage26 protection
        shell: bash
        run: |
          node tools/test-phone-item-equipment-regression.mjs
          python3 scripts/check-phone-item-equipment-regression.py
          python3 scripts/version-sync.py --check
          git diff --exit-code af472beb56a65b38fadd5012ee5d3bb980d1bcd4 -- js/app.js
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/phase26-sync-v010915.yml',
              '.github/workflows/phase26-validate.yml',
              'scripts/check-phone-item-equipment-regression.py',
              'tools/test-phone-item-equipment-regression.mjs',
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only', 'af472beb56a65b38fadd5012ee5d3bb980d1bcd4...HEAD'
          ], text=True).splitlines())
          print('Changed files:', sorted(changed))
          if changed != expected:
              raise SystemExit(f'unexpected Stage26 diff: {sorted(changed ^ expected)}')
          print('PHASE26 FEATURE DIFF: PASS')
          PY
