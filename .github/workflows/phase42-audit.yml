name: Phase42 Temporary Audit

on:
  push:
    branches: [protect-stage42]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract unprotected core candidates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('js/app.js', 'utf8');
          function extract(name) {
            const re = new RegExp(`(?:async\\s+)?function\\s+${name}\\s*\\([^)]*\\)\\s*\\{`, 'm');
            const m = re.exec(app);
            if (!m) return null;
            const brace = app.indexOf('{', m.index);
            let depth=0, quote=null, esc=false, line=false, block=false;
            for (let i=brace;i<app.length;i++) {
              const c=app[i], n=app[i+1];
              if (line) { if (c==='\n') line=false; continue; }
              if (block) { if (c==='*'&&n==='/') { block=false; i++; } continue; }
              if (quote) { if (esc) esc=false; else if (c==='\\') esc=true; else if (c===quote) quote=null; continue; }
              if (c==='/'&&n==='/') { line=true; i++; continue; }
              if (c==='/'&&n==='*') { block=true; i++; continue; }
              if (c==='"'||c==="'"||c==='`') { quote=c; continue; }
              if (c==='{') depth++;
              else if (c==='}' && --depth===0) return app.slice(m.index, i+1);
            }
            return null;
          }
          const candidates = [
            'mine','adjustLooseInventory','repairBrokenEquipment',
            'claimCurrentDailyLogin','maybeGrantDailyLogin',
            'adjustAquariumFish','adjustAquariumPlant'
          ];
          for (const name of candidates) {
            const src=extract(name);
            console.log(`===== ${name} =====`);
            console.log(src || 'NOT FOUND');
          }
          console.log('===== HIGH MUTATION FUNCTIONS =====');
          const fnRe=/(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\([^)]*\)\s*\{/g;
          const rows=[]; let m;
          while ((m=fnRe.exec(app))) {
            const name=m[1], src=extract(name); if(!src) continue;
            const score=(src.match(/state\.[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)?\s*(?:=|\+=|-=|\+\+|--)/g)||[]).length
              +(src.match(/\.push\s*\(/g)||[]).length
              +(src.match(/\.splice\s*\(/g)||[]).length
              +(src.match(/delete\s+state\./g)||[]).length;
            if(score>=2) rows.push({name,score,len:src.length});
          }
          rows.sort((a,b)=>b.score-a.score||b.len-a.len);
          console.log(rows.slice(0,120).map(x=>`${x.score}\t${x.len}\t${x.name}`).join('\n'));
          NODE
