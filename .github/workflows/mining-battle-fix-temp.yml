name: mining-battle-fix-temp

on:
  push:
    branches:
      - work/mining-battle-final-20260916

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal retro battle regression fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          text = p.read_text(encoding='utf-8')
          old = '''function retroBattleStartOptions(session = retroBattleSession) {
            const playerName = retroBattlePlayerName();
            const inventory = retroBattleInventorySnapshot();
            if (session?.context !== 'mining') return { playerName, inventory };
            return buildMiningBattleStartOptions({
              enemy: session.enemy,
              enemyImage: session.enemy?.image,
              playerName,
              inventory,
              baseOptions: { attackMode: 'mining' },
            });
          }'''
          new = '''function retroBattleStartOptions(session = retroBattleSession) {
            const base = {
              playerName: retroBattlePlayerName(),
              inventory: retroBattleInventorySnapshot(),
            };
            if (session?.context !== 'mining') return base;
            return buildMiningBattleStartOptions({
              ...base,
              enemy: session.enemy,
              enemyImage: session.enemy?.image,
              baseOptions: { attackMode: 'mining' },
            });
          }'''
          if old not in text:
              raise SystemExit('expected retroBattleStartOptions block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused regression checks
        run: |
          python scripts/check-retro-battle-frame-loader.py
          node tools/test-mining-battle-event.mjs
          node tools/test-mining-battle-integration.mjs
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mining-battle-fix-temp.yml
          git add js/app.js
          git commit -m "採掘戦闘の既存戦闘回帰を修正"
          git push
