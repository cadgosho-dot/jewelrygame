name: Apply v0.10.725 UI and quantity fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v725_ui_quantity_fix.py'
      - '.github/workflows/apply-v725.yml'
      - 'TRIGGER_V725.txt'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_v725_ui_quantity_fix.py
      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/game-data.js
          node --check js/firebase-service.js
      - name: Validate markers
        run: |
          grep -q "0.10.725" js/game-data.js
          grep -q "longPressQuantityDelta" js/app.js
          grep -q "padding: 116px 0 0" game.html
          grep -q "v0.10.725" sw.js
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "725 portrait spacing and fast quantity hold"
          git push origin main
