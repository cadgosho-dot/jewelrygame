name: Phase35 Core Discovery

on:
  push:
    branches:
      - phase35-core-protection

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 現行中核関数を確認
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "VERSION=$(cat VERSION)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('js/app.js')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          candidates = [
              'saveGame','persist','addNotification','addFinance','recordFinance','addFinanceRecord',
              'removeJewelry','adjustLooseInventory','adjustMetalInventory','adjustRoughInventory',
              'sleep','goSleep','startSleep','confirmSleep','finishSleep','advanceDay',
              'addMoney','changeMoney','applyMoneyFeedback','saveState','migrateState'
          ]
          print(f'app.js lines={len(lines)} chars={len(text)}')
          found = []
          pat = re.compile(r'^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(')
          for i,line in enumerate(lines,1):
              m = pat.match(line.strip())
              if m:
                  name=m.group(1)
                  if any(k.lower() in name.lower() for k in ['save','finance','money','notification','inventory','jewelry','sleep','day']):
                      found.append((i,name))
          print('CANDIDATE FUNCTIONS')
          for i,name in found:
              print(f'{i}: {name}')
          print('TARGET CONTEXT')
          for target in candidates:
              hits=[]
              rx=re.compile(rf'^(?:async\s+)?function\s+{re.escape(target)}\s*\(')
              for i,line in enumerate(lines,1):
                  if rx.match(line.strip()): hits.append(i)
              for i in hits:
                  print(f'--- {target} @ {i} ---')
                  for j in range(max(1,i-3), min(len(lines),i+80)+1):
                      print(f'{j:05d}: {lines[j-1]}')
          PY
