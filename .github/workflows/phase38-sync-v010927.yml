name: Phase38 Formal Sync v0.10.927

on:
  push:
    branches: [main, phase38-core-protection]
    paths:
      - '.github/workflows/phase38-sync-v010927.yml'
      - 'tools/test-save-game-regression.mjs'
      - 'scripts/check-save-game-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'phase38-core-protection'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate save game protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-save-game-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.926'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('顧客来店管理処理保護', [sys.executable, str(ROOT / 'scripts/check-customer-visit-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-save-game-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('セーブ統括処理保護', [sys.executable, str(ROOT / 'scripts/check-save-game-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.927\n- 中核処理保護・第38段階：ローカルバックアップ・IndexedDB・クラウド保存を統括する `saveGame()` を動的回帰テストと静的検査で固定。\n- 保存前整理、認証/セッション引継ぎガード、重複指紋抑止、保存キュー直列化、端末保存フォールバック、容量不足時のクラウド継続、クラウド成功/失敗時の状態更新と通知を検証。\n- ゲーム仕様・価格・在庫・イベント・画像・音声・セーブ形式・クラウド保存形式の変更なし。\n'
          assert '## v0.10.927' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-save-game-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.926', '?v=0.10.927').replace("const UI_BUILD_VERSION = '0.10.926';", "const UI_BUILD_VERSION = '0.10.927';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase38-sync-v010927.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.927 第38段階正式同期'
          git push origin HEAD:main
