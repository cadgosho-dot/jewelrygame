name: Apply cloud save v722

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_cloud_save_v722.py'
      - 'scripts/trigger_v722.txt'
      - '.github/workflows/apply-cloud-save-v722.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and record result
        shell: bash
        run: |
          set +e
          python3 scripts/apply_cloud_save_v722.py > /tmp/v722.log 2>&1
          status=$?
          set -e
          echo "exit_status=$status" > V722_WORKFLOW_RESULT.txt
          cat /tmp/v722.log >> V722_WORKFLOW_RESULT.txt
          if [ "$status" -eq 0 ]; then
            node --check js/firebase-service.js >> V722_WORKFLOW_RESULT.txt 2>&1
            node --check js/app.js >> V722_WORKFLOW_RESULT.txt 2>&1
            node --check js/game-data.js >> V722_WORKFLOW_RESULT.txt 2>&1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "722 cloud save root-limit bypass result"
            git pull --rebase origin main
            git push origin main
          fi
          exit "$status"
