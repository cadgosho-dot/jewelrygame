name: Temporary event progression repair

on:
  push:
    branches:
      - fix/event-progression-stops-20260913

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/event-progression-stops-20260913
          fetch-depth: 1

      - name: Preserve event state object identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')

          def replace_after(anchor, old, new, max_distance):
              global text
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit(f'anchor not found: {anchor}')
              pos = text.find(old, start)
              if pos < 0 or pos - start > max_distance:
                  raise SystemExit(f'target not found near: {anchor}')
              duplicate = text.find(old, pos + len(old), start + max_distance)
              if duplicate >= 0:
                  raise SystemExit(f'ambiguous target near: {anchor}')
              text = text[:pos] + new + text[pos + len(old):]

          replace_after(
              'function normalizeOkachimachiDailyEventState(state, key, defaults) {',
              '  state.events[key] = next;\n  return next;',
              '  Object.assign(saved, next);\n  state.events[key] = saved;\n  return saved;',
              8000,
          )
          replace_after(
              'function pearlManEventState(state) {',
              '  state.events.pearlMan = next;\n  return next;',
              '  Object.assign(saved, next);\n  state.events.pearlMan = saved;\n  return saved;',
              5000,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text(encoding='utf-8')
          checks = [
              'Object.assign(saved, next);\n  state.events[key] = saved;\n  return saved;',
              'Object.assign(saved, next);\n  state.events.pearlMan = saved;\n  return saved;',
          ]
          for check in checks:
              if text.count(check) != 1:
                  raise SystemExit(f'unexpected repair count: {check}')
          PY
          node --check js/app.js

      - name: Commit repair only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git diff --cached --check
          git commit -m 'Fix stale event progression state references'
          git push origin HEAD:fix/event-progression-stops-20260913
