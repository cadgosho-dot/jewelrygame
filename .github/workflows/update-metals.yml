name: v0.10.732 宇宙画面入力復旧とGitHub Pages公開

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  apply-v732:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: v0.10.732を適用
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in ['game.html', 'index.html', 'auth.html', 'sw.js', 'js/game-data.js']:
              p = Path(path)
              text = p.read_text(encoding='utf-8').replace('0.10.731', '0.10.732')
              p.write_text(text, encoding='utf-8')

          app = Path('js/app.js')
          app_text = app.read_text(encoding='utf-8')
          app_text = app_text.replace("const UI_BUILD_VERSION = '0.10.731';", "const UI_BUILD_VERSION = '0.10.732';")
          app_text = app_text.replace("./audio.js?v=0.10.729", "./audio.js?v=0.10.732")
          app_text = app_text.replace("./audio-scene-map.js?v=0.10.729", "./audio-scene-map.js?v=0.10.732")
          app_text = app_text.replace("./firebase-service.js?v=0.10.729", "./firebase-service.js?v=0.10.732")
          app.write_text(app_text, encoding='utf-8')

          game = Path('game.html')
          text = game.read_text(encoding='utf-8')
          if 'alien-space-input-safety-v732' not in text:
              safety = '''
<style id="alien-space-input-safety-v732">
body[data-screen="main"] .alien-space-main-screen{isolation:isolate!important}
body[data-screen="main"] .alien-space-main-screen>.alien-space-status{pointer-events:none!important}
body[data-screen="main"] .alien-space-main-screen>.alien-space-menu,
body[data-screen="main"] .alien-space-main-screen>.alien-hunger-emergency-card{z-index:110!important;pointer-events:auto!important;touch-action:manipulation!important;-webkit-user-select:none!important;user-select:none!important}
body[data-screen="main"] .alien-space-main-screen>.alien-space-menu>button,
body[data-screen="main"] .alien-space-main-screen>.alien-hunger-emergency-card{position:relative!important;z-index:111!important;pointer-events:auto!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important}
</style>
<script nonce="jxj-kaitenzushi" id="alien-space-input-safety-v732-script">
(() => {
  const isAlienSpace = () => document.body && document.body.dataset.screen === 'main' && !!document.querySelector('.alien-space-main-screen');
  const repair = () => {
    if (!isAlienSpace()) return;
    const curtain = document.querySelector('#sleep-curtain');
    if (curtain && curtain.classList.contains('active')) {
      const s = getComputedStyle(curtain);
      if (s.visibility === 'hidden' || parseFloat(s.opacity || '0') < 0.05) {
        curtain.classList.remove('active','next-day-blackout','sleep-starting');
        curtain.style.pointerEvents = 'none';
      }
    }
    const morning = document.querySelector('#morning-brief');
    if (morning && morning.classList.contains('active')) {
      const s = getComputedStyle(morning);
      if (s.visibility === 'hidden' || parseFloat(s.opacity || '0') < 0.05) {
        morning.classList.remove('active','persistent');
        morning.innerHTML = '';
        morning.style.pointerEvents = 'none';
      }
    }
    const modal = document.querySelector('#modal-layer');
    if (modal && !modal.classList.contains('hidden') && !modal.querySelector('.modal-card')) {
      modal.classList.add('hidden');
      modal.innerHTML = '';
      modal.style.pointerEvents = 'none';
    }
  };
  document.addEventListener('touchend', (event) => {
    if (!isAlienSpace()) return;
    const el = event.target instanceof Element ? event.target.closest('.alien-space-menu button[data-action]:not(:disabled), .alien-hunger-emergency-card[data-action]:not(:disabled)') : null;
    if (!(el instanceof HTMLButtonElement)) return;
    event.preventDefault();
    el.click();
  }, {capture:true, passive:false});
  const schedule = () => requestAnimationFrame(() => requestAnimationFrame(repair));
  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class','data-screen']});
  window.addEventListener('pageshow',schedule);
  window.addEventListener('focus',schedule);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});
  setInterval(repair,1200);
  schedule();
})();
</script>
'''
              text = text.replace('</head>', safety + '\n</head>', 1)
              game.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html index.html auth.html sw.js js/game-data.js js/app.js
          if git diff --cached --quiet; then
            echo "v0.10.732はすでに適用済みです。"
            exit 0
          fi
          git commit -m "v0.10.732 宇宙画面の操作不能を復旧"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  build-pages:
    permissions:
      contents: read
      pages: read
    needs: [apply-v732]
    if: needs.apply-v732.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site
          rsync -a ./ _site/ --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='scripts/' --exclude='*.md' --exclude='firestore.rules'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: [build-pages]
    if: always() && needs.build-pages.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
