name: Phase22 Validate Store Level

on:
  push:
    branches:
      - phase22-protect-store-level

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase22-protect-store-level
          fetch-depth: 1
      - name: Validate Stage22 protection
        run: |
          node --check js/app.js
          node --check tools/test-upgrade-store-level-regression.mjs
          node tools/test-upgrade-store-level-regression.mjs
          python3 scripts/check-upgrade-store-level-regression.py
