name: Phase 38 core audit

on:
  push:
    branches:
      - phase38-core-protection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract save core functions
        shell: python
        run: |
          from pathlib import Path
          import re
          src = Path('js/app.js').read_text(encoding='utf-8')

          def extract(name):
            m = re.search(r'(?m)^\s*(?:async\s+)?function\s+' + re.escape(name) + r'\s*\(', src)
            if not m:
              print(f'NOT_FOUND:{name}')
              return ''
            start = m.start()
            brace = src.find('{', start)
            depth = 0; i = brace; quote = None; esc = False; line_comment=False; block_comment=False
            while i < len(src):
              c=src[i]; n=src[i+1] if i+1 < len(src) else ''
              if line_comment:
                if c == '\n': line_comment=False
              elif block_comment:
                if c == '*' and n == '/': block_comment=False; i += 1
              elif quote:
                if esc: esc=False
                elif c == '\\': esc=True
                elif c == quote: quote=None
              else:
                if c == '/' and n == '/': line_comment=True; i += 1
                elif c == '/' and n == '*': block_comment=True; i += 1
                elif c in "'\"`": quote=c
                elif c == '{': depth += 1
                elif c == '}':
                  depth -= 1
                  if depth == 0: return src[start:i+1]
              i += 1
            return ''

          for name in ['saveGame','saveLocalBackup','saveStateFingerprint','showAutosaveStatus']:
            print(f'PHASE38_SOURCE_BEGIN:{name}')
            print(extract(name))
            print(f'PHASE38_SOURCE_END:{name}')
