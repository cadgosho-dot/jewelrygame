name: Phase15 Inspect Workshop Tool Logic

on:
  push:
    branches:
      - phase15-workshop-tool-regression-v0.10.904
    paths:
      - .stage15-inspect-trigger

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase15-workshop-tool-regression-v0.10.904
          fetch-depth: 0
      - name: Extract exact workshop tool functions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('js/app.js').read_text(encoding='utf-8')

          def extract(name):
              m = re.search(rf'(?m)^\s*(?:async\s+)?function\s+{re.escape(name)}\s*\([^\n]*?\)\s*\{{', text)
              if not m:
                  raise SystemExit(f'function not found: {name}')
              open_pos = text.find('{', m.start(), m.end())
              depth = 0
              quote = None
              esc = False
              i = open_pos
              while i < len(text):
                  ch = text[i]
                  nxt = text[i+1] if i + 1 < len(text) else ''
                  if quote:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('\"', "'", '`'):
                      quote = ch
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      j = text.find('\n', i + 2)
                      i = len(text) if j < 0 else j + 1
                      continue
                  if ch == '/' and nxt == '*':
                      j = text.find('*/', i + 2)
                      i = len(text) if j < 0 else j + 2
                      continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return text[m.start():i+1]
                  i += 1
              raise SystemExit(f'unclosed function: {name}')

          names = ['workshopToolRepairPrice', 'createWorkshopToolRecord', 'buyWorkshopTool', 'repairWorkshopTool']
          out = ['PHASE15 EXACT WORKSHOP TOOL FUNCTIONS']
          for name in names:
              out += ['', '=' * 72, extract(name)]
          Path('_phase15-workshop-tool-inspection.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _phase15-workshop-tool-inspection.txt
          git commit -m '第15段階 工房工具処理の対象関数を抽出' || exit 0
          git push origin HEAD:phase15-workshop-tool-regression-v0.10.904
