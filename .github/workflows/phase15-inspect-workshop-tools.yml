name: Phase15 Inspect Workshop Tool Logic

on:
  push:
    branches:
      - phase15-workshop-tool-regression-v0.10.904
    paths:
      - .stage15-inspect-trigger

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase15-workshop-tool-regression-v0.10.904
          fetch-depth: 0
      - name: Extract compact workshop tool summary
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('js/app.js').read_text(encoding='utf-8')
          lines = text.splitlines()
          out = ['PHASE15 WORKSHOP TOOL COMPACT INSPECTION']

          # Function declarations whose name clearly suggests tool/workshop/purchase/repair behavior.
          for idx, line in enumerate(lines, 1):
              m = re.search(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', line)
              if not m:
                  continue
              name = m.group(1)
              low = name.lower()
              if any(k in low for k in ('tool', 'workshop', 'repair', 'purchase', 'buy')):
                  out.append(f'FUNCTION {idx}: {line.strip()}')

          out.append('\nKEYWORD CONTEXT')
          keywords = (
              'WORKSHOP_TOOLS', 'repairTool', 'buyTool', 'purchaseTool', 'toolRepair',
              'toolPurchase', '修理費', '工具を購入', '設備を購入', '工具を修理', '設備を修理',
              'data-action="buy-', 'data-action="repair-'
          )
          seen = set()
          for idx, line in enumerate(lines, 1):
              if any(k in line for k in keywords):
                  for j in range(max(1, idx - 2), min(len(lines), idx + 2) + 1):
                      if j not in seen:
                          seen.add(j)
                          out.append(f'{j}: {lines[j-1]}')

          Path('_phase15-workshop-tool-inspection.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('\n'.join(out[:120]))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _phase15-workshop-tool-inspection.txt
          git commit -m '第15段階 工房工具処理の小型調査結果' || exit 0
          git push origin HEAD:phase15-workshop-tool-regression-v0.10.904
