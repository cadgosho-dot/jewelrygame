name: v0.10.751 One-Time Runner

on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

jobs:
  apply-v751:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN V751 UPDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.10.751
        run: |
          set -euo pipefail
          python3 scripts/apply_update.py

      - name: Basic verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          checks = {
              'app version': "const UI_BUILD_VERSION = '0.10.751';" in (root/'js/app.js').read_text(encoding='utf-8'),
              'app 3D': 'loose-shop-original-quiz-v751.png' in (root/'js/app.js').read_text(encoding='utf-8'),
              'app storyteller': 'storyteller-v751.png' in (root/'js/app.js').read_text(encoding='utf-8'),
              'memories version': "const VERSION = '0.10.751';" in (root/'js/memories-screen.js').read_text(encoding='utf-8'),
              'memories 3D': 'loose-shop-original-quiz-v751.png' in (root/'js/memories-screen.js').read_text(encoding='utf-8'),
              'memories storyteller': 'storyteller-v751.png' in (root/'js/memories-screen.js').read_text(encoding='utf-8'),
              'game-data': "export const VERSION = '0.10.751';" in (root/'js/game-data.js').read_text(encoding='utf-8'),
              'game query': 'js/app.js?v=0.10.751' in (root/'game.html').read_text(encoding='utf-8'),
              'index query': 'game.html?v=0.10.751' in (root/'index.html').read_text(encoding='utf-8'),
              'sw': "const VERSION = '0.10.751';" in (root/'sw.js').read_text(encoding='utf-8'),
              'v750 loader removed': 'memories-3d-image-v750.js' not in (root/'hosting-origin-guard.js').read_text(encoding='utf-8'),
          }
          for rel in ('assets/images/events/loose-shop-original-quiz-v751.png','assets/images/events/storyteller-v751.png'):
              p=root/rel
              checks[rel] = p.exists() and p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('OK ' if v else 'NG ')+k)
          if failed: raise SystemExit('verification failed: '+', '.join(failed))
          PY

      - name: Restore normal workflow and remove updater
        run: |
          set -euo pipefail
          git show 7ae770c08312293827a299ee499f5d7152180016:.github/workflows/update-metals.yml > .github/workflows/update-metals.yml
          rm -f .github/workflows/v751-runner.yml
          rm -f scripts/apply_update.py scripts/verify_update.py
          rm -rf payload .chat_update_backup_20260823

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "v0.10.751 思い出画像更新とバージョン統一"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='firestore.rules'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
