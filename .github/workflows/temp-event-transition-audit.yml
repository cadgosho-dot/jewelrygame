name: Temporary event transition audit

on:
  push:
    branches:
      - audit/event-transition-surfaces-20260914

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect mystery Chinese eating reload recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('js/app.js').read_text(encoding='utf-8')
          def block(name):
              m = re.search(rf'(?m)^(?:async\s+)?function\s+{re.escape(name)}\s*\([^\n]*\)\s*\{{', source)
              if not m:
                  print(f'--- {name}: MISSING ---'); return
              brace = source.find('{', m.start(), m.end()+1)
              depth=0; quote=''; escaped=False
              for i in range(brace, len(source)):
                  ch=source[i]
                  if quote:
                      if escaped: escaped=False
                      elif ch=='\\': escaped=True
                      elif ch==quote: quote=''
                      continue
                  if ch in "'\"`": quote=ch; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          print(f'--- {name} ---')
                          print(source[m.start():i+1])
                          return
          for name in ['renderMysteryChineseMealEvent','startMysteryChineseMealEating','advanceMysteryChineseMealEvent','settleMysteryChineseMealEmergency']:
              block(name)
          PY
