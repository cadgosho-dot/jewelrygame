name: v0.10.733 おやつ大好きアイス復旧とPages公開

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  apply-and-build:
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: v0.10.733修正を適用
        run: |
          python3 scripts/apply-v733-oyatsu-fix.py
          node --check js/app.js
          if git diff --quiet -- js/app.js js/game-data.js game.html index.html auth.html sw.js; then
            echo "v0.10.733は適用済みです。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/app.js js/game-data.js game.html index.html auth.html sw.js
            git commit -m "v0.10.733 おやつ大好きアイスルート復旧"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: 公開用フォルダを作成
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='firestore.rules'

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs:
      - apply-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
