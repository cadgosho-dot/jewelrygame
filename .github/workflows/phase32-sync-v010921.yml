name: Phase32 Formal Sync v0.10.921

on:
  push:
    branches: [main, phase32-gift-inventory-protection]
    paths:
      - '.github/workflows/phase32-sync-v010921.yml'
      - 'tools/test-gift-inventory-regression.mjs'
      - 'scripts/check-gift-inventory-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'phase32-gift-inventory-protection'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate gift inventory protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-gift-inventory-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.920'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('水槽死亡・枯死確定処理保護', [sys.executable, str(ROOT / 'scripts/check-aquarium-mortality-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-gift-inventory-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('プレゼント在庫移動処理保護', [sys.executable, str(ROOT / 'scripts/check-gift-inventory-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.921\n- 中核処理保護・第32段階：プレゼント送信・受信・取消時の在庫移動処理を動的回帰テストと静的検査で固定。\n- 原石・ルース・アイテム・地金・完成品の送信減算、受信加算、地金/完成品容量、完成品ID正規化・重複防止、取消時の在庫復元、送受信履歴・通知を検証。\n- ゲーム処理・プレゼント仕様・在庫上限・価格・イベント・画像・音声・セーブ形式の変更なし。\n'
          assert '## v0.10.921' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-gift-inventory-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.920', '?v=0.10.921').replace("const UI_BUILD_VERSION = '0.10.920';", "const UI_BUILD_VERSION = '0.10.921';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase32-sync-v010921.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.921 第32段階正式同期'
          git push origin HEAD:main
