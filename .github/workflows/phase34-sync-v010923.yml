name: Phase34 Formal Sync v0.10.923

on:
  push:
    branches: [main, phase34-spend-minutes-protection]
    paths:
      - '.github/workflows/phase34-sync-v010923.yml'
      - 'tools/test-spend-minutes-regression.mjs'
      - 'scripts/check-spend-minutes-regression.py'

concurrency:
  group: phase34-formal-sync-v010923
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'phase34-spend-minutes-protection'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate shared time consumption protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-spend-minutes-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.922'
          python3 - <<'PY'
          from pathlib import import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('プレゼント取引制御処理保護', [sys.executable, str(ROOT / 'scripts/check-gift-transaction-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-spend-minutes-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('共通時間消費処理保護', [sys.executable, str(ROOT / 'scripts/check-spend-minutes-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.923\n- 中核処理保護・第34段階：ゲーム内時間・空腹・店舗営業時間・職人スタッフ進行をつなぐ `spendMinutes()` / `spendHours()` の共通時間消費処理を動的回帰テストと静的検査で固定。\n- 分単位丸め、22:00上限、店舗営業時間の交差分集計、閉店跨ぎ顧客終了、職人スタッフ経過時間、空腹消費、誕生日強制休息予約、空腹消費なしオプションを検証。\n- ゲーム処理・時間仕様・空腹度仕様・店舗仕様・スタッフ仕様・イベント・画像・音声・セーブ形式の変更なし。\n'
          assert '## v0.10.923' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-spend-minutes-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.922', '?v=0.10.923').replace("const UI_BUILD_VERSION = '0.10.922';", "const UI_BUILD_VERSION = '0.10.923';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase34-sync-v010923.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.923 第34段階正式同期'
          git push origin HEAD:main