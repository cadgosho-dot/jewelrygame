name: One-off v0.10.765 startup quota hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-off-v010765.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-off-v010765-startup-quota
  cancel-in-progress: false

jobs:
  harden-startup-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 最新mainを取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: 起動時端末保存を容量安全化
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version_path = Path('VERSION')
          current_version = version_path.read_text(encoding='utf-8').strip()
          if current_version != '0.10.764':
              raise SystemExit(f'想定外のVERSIONです: {current_version}（期待 0.10.764）')

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')

          old_helper_anchor = """function enableLocalSingleCopyMode() {
            // 容量不足時は、端末内の巨大な重複コピーを捨て、
            // 「最新の端末セーブ1本 + クラウド」を安全網にする。
            removeLocalStorageItemQuietly(localSaveBackupKey());
            removeLocalStorageItemQuietly(localSavePreMigrationKey());
            removeLocalStorageItemQuietly(localSaveCorruptKey());
            try { localStorage.setItem(localSaveStorageModeKey(), 'single-copy'); } catch (_) {}
          }

          function saveStateFingerprint(value = state) {
          """
          new_helper_anchor = """function enableLocalSingleCopyMode() {
            // 容量不足時は、端末内の巨大な重複コピーを捨て、
            // 「最新の端末セーブ1本 + クラウド」を安全網にする。
            removeLocalStorageItemQuietly(localSaveBackupKey());
            removeLocalStorageItemQuietly(localSavePreMigrationKey());
            removeLocalStorageItemQuietly(localSaveCorruptKey());
            try { localStorage.setItem(localSaveStorageModeKey(), 'single-copy'); } catch (_) {}
          }

          function persistBootLocalStateSafely(savedState, label = '起動時セーブ') {
            let serialized = '';
            try {
              serialized = JSON.stringify(savedState);
            } catch (error) {
              console.warn(`${label}の端末保存準備に失敗しました。クラウド/メモリ上のセーブで起動を続行します。`, error);
              return false;
            }

            const writePrimary = () => localStorage.setItem(localSaveKey(), serialized);
            try {
              writePrimary();
              return true;
            } catch (error) {
              if (!isLocalStorageQuotaError(error)) {
                console.warn(`${label}の端末保存に失敗しました。クラウド/メモリ上のセーブで起動を続行します。`, error);
                return false;
              }
            }

            console.warn(`${label}の端末保存容量が不足したため、端末内バックアップを整理して再保存します。`);
            enableLocalSingleCopyMode();
            try {
              writePrimary();
              return true;
            } catch (retryError) {
              console.warn(`${label}を端末へ保存できませんでした。クラウド/メモリ上のセーブで起動を続行します。`, retryError);
              return false;
            }
          }

          function saveStateFingerprint(value = state) {
          """
          if app.count(old_helper_anchor) != 1:
              raise SystemExit(f'起動時保存ヘルパー挿入アンカーが {app.count(old_helper_anchor)} 件です')
          app = app.replace(old_helper_anchor, new_helper_anchor, 1)

          cloud_old = "localStorage.setItem(localSaveKey(), JSON.stringify(preferredAtBoot.state));"
          cloud_new = "persistBootLocalStateSafely(preferredAtBoot.state, 'クラウド採用セーブ');"
          if app.count(cloud_old) != 1:
              raise SystemExit(f'クラウド採用時の直接保存アンカーが {app.count(cloud_old)} 件です')
          app = app.replace(cloud_old, cloud_new, 1)

          migrated_old = "localStorage.setItem(localSaveKey(), JSON.stringify(migratedLocal));"
          migrated_new = "persistBootLocalStateSafely(migratedLocal, '起動時ローカル移行');"
          if app.count(migrated_old) != 1:
              raise SystemExit(f'端末優先移行時の直接保存アンカーが {app.count(migrated_old)} 件です')
          app = app.replace(migrated_old, migrated_new, 1)
          app_path.write_text(app, encoding='utf-8')

          check_path = Path('scripts/check-save-storage-policy.py')
          check = check_path.read_text(encoding='utf-8')
          setup_old = "APP = (ROOT / 'js/app.js').read_text(encoding='utf-8')\n\nchecks = {"
          setup_new = """APP = (ROOT / 'js/app.js').read_text(encoding='utf-8')

          try:
              BOOT_HELPER = APP[
                  APP.index('function persistBootLocalStateSafely(savedState'):
                  APP.index('function saveStateFingerprint')
              ]
          except ValueError:
              BOOT_HELPER = ''

          checks = {"""
          if check.count(setup_old) != 1:
              raise SystemExit(f'容量検査のセットアップアンカーが {check.count(setup_old)} 件です')
          check = check.replace(setup_old, setup_new, 1)

          check_anchor = "    '端末1コピー節約モードがある': \"'single-copy'\" in APP and 'function enableLocalSingleCopyMode()' in APP,\n"
          check_extra = check_anchor + """    '起動時端末保存に安全ヘルパーがある': bool(BOOT_HELPER),
              '起動時容量不足で1コピー化して再試行する': 'isLocalStorageQuotaError(error)' in BOOT_HELPER and 'enableLocalSingleCopyMode();' in BOOT_HELPER and BOOT_HELPER.count('writePrimary();') >= 2,
              '起動時端末保存の最終失敗で起動を止めない': 'return false;' in BOOT_HELPER and 'クラウド/メモリ上のセーブで起動を続行します。' in BOOT_HELPER,
              'クラウド採用時は安全保存を使う': \"persistBootLocalStateSafely(preferredAtBoot.state, 'クラウド採用セーブ');\" in APP and 'localStorage.setItem(localSaveKey(), JSON.stringify(preferredAtBoot.state));' not in APP,
              '端末優先移行時は安全保存を使う': \"persistBootLocalStateSafely(migratedLocal, '起動時ローカル移行');\" in APP and 'localStorage.setItem(localSaveKey(), JSON.stringify(migratedLocal));' not in APP,
          """
          if check.count(check_anchor) != 1:
              raise SystemExit(f'容量検査の追加アンカーが {check.count(check_anchor)} 件です')
          check = check.replace(check_anchor, check_extra, 1)
          check_path.write_text(check, encoding='utf-8')
          PY

      - name: VERSIONを0.10.765へ同期
        run: python3 scripts/version-sync.py --set 0.10.765

      - name: 変更対象を限定確認
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'VERSION',
              'auth-cache-recovery.js',
              'game.html',
              'hosting-origin-guard.js',
              'index.html',
              'js/app.js',
              'js/game-data.js',
              'js/memories-screen.js',
              'scripts/check-save-storage-policy.py',
              'sw.js',
          }
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()))
          if changed != expected:
              raise SystemExit(f'想定外の変更ファイルです。changed={sorted(changed)} expected={sorted(expected)}')
          print('変更対象確認: PASS')
          PY

      - name: 画像検査用ライブラリを準備
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: 全自動検査
        run: python3 -u scripts/check-current.py

      - name: JavaScript構文検査
        run: |
          node --check js/app.js
          node --check js/firebase-service.js

      - name: 検査通過後だけmainへコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION auth-cache-recovery.js game.html hosting-origin-guard.js index.html js/app.js js/game-data.js js/memories-screen.js scripts/check-save-storage-policy.py sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Harden startup local persistence"
          git pull --rebase origin main
          git push origin HEAD:main
