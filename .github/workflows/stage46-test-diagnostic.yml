name: Stage46 Test Diagnostic

on:
  push:
    branches: [protect-stage46]
    paths:
      - '.github/workflows/stage46-test-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: protect-stage46
          fetch-depth: 1
      - name: Run stage46 checker and save output
        run: |
          set +e
          python3 scripts/check-emerald-captain-kebab-meal-regression.py > stage46-test-report.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> stage46-test-report.txt
          set -e
      - name: Commit diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stage46-test-report.txt
          git commit -m '第46段階 検査失敗内容を記録'
          git push origin HEAD:protect-stage46
