name: v0.10.853 販売価格長押し分離 一時検証

on:
  push:
    branches:
      - codex/v0-10-853-split-selling-price-press-hold

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 対象ブランチを取得
        uses: actions/checkout@v6
        with:
          ref: codex/v0-10-853-split-selling-price-press-hold
          fetch-depth: 1

      - name: 販売価格1領域だけ長押し処理を分離
        run: |
          python3 tools/apply-press-hold-refactor-v853.py
          python3 scripts/version-sync.py --set 0.10.853
          python3 scripts/generate-event-probability-list.py --write

      - name: 総合検査環境を準備
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/generate-assets-manifest.py --write

      - name: 専用検査
        run: |
          node --check js/app.js
          node tools/test-press-hold-controller.mjs
          python3 scripts/check-press-hold-controller.py

      - name: 現行ビルド総合検査
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 8m python3 -u scripts/check-current.py

      - name: 検査済み実装をブランチへ反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md CHANGELOG.md GAME_RULES.md ASSETS.md TODO.md EVENT_PROBABILITY_LIST.md \
            auth-cache-recovery.js auth.html game.html hosting-origin-guard.js index.html sw.js \
            js/app.js js/audio.js js/firebase-service.js js/game-data-core.js js/game-data.js js/memories-screen.js \
            js/ui/press-hold-controller.js tools/test-press-hold-controller.mjs scripts/check-press-hold-controller.py
          git commit -m "refactor: split selling-price press handling (v0.10.853)"
          git push origin HEAD:codex/v0-10-853-split-selling-price-press-hold
