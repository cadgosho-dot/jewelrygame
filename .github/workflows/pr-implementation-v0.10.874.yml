name: v0.10.874 第26段階 実装・検証
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  implement-and-validate:
    if: github.head_ref == 'codex/v0.10.874-metal-price-date-label'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 第26段階ブランチを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: 地金価格日時表示helperを実装
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          ROOT = Path('.')
          NEW_VERSION = '0.10.874'
          WORKFLOW = ROOT / '.github/workflows/pr-implementation-v0.10.874.yml'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          def insert_after_line(text, needle, new_line, label):
              lines = text.splitlines()
              matches = [i for i, line in enumerate(lines) if needle in line]
              if len(matches) != 1:
                  raise RuntimeError(f'{label}: expected 1 matching line, got {len(matches)}')
              lines.insert(matches[0] + 1, new_line)
              suffix = '\n' if text.endswith('\n') else ''
              return '\n'.join(lines) + suffix

          helper_path = ROOT / 'js/ui/metal-price-date-label.js'
          checker_path = ROOT / 'scripts/check-metal-price-date-label.py'
          test_path = ROOT / 'tools/test-metal-price-date-label.mjs'
          for path in (helper_path, checker_path, test_path):
              if path.exists():
                  raise RuntimeError(f'already exists: {path}')

          app = read('js/app.js')
          app = insert_after_line(
              app,
              "import { formatMetalMarketDateLabel } from './ui/metal-market-date-label.js?v=",
              "import { formatMetalPriceDateLabel } from './ui/metal-price-date-label.js?v=0.10.873';",
              'app helper import',
          )
          legacy = """function metalPriceDateLabel(value) {
            const date = new Date(value || '');
            if (!Number.isFinite(date.getTime())) return '';
            return new Intl.DateTimeFormat('ja-JP', {
              timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric',
              hour: '2-digit', minute: '2-digit', hour12: false,
            }).format(date);
          }"""
          wrapper = """function metalPriceDateLabel(value) {
            return formatMetalPriceDateLabel(value);
          }"""
          app = replace_once(app, legacy, wrapper, 'metalPriceDateLabel wrapper')
          write('js/app.js', app)

          write('js/ui/metal-price-date-label.js', """export function formatMetalPriceDateLabel(value) {
            const date = new Date(value || '');
            if (!Number.isFinite(date.getTime())) return '';
            return new Intl.DateTimeFormat('ja-JP', {
              timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric',
              hour: '2-digit', minute: '2-digit', hour12: false,
            }).format(date);
          }
          """)

          write('tools/test-metal-price-date-label.mjs', """import assert from 'node:assert/strict';
          import { formatMetalPriceDateLabel } from '../js/ui/metal-price-date-label.js';

          for (const value of [undefined, null, '', 'bad']) {
            assert.equal(formatMetalPriceDateLabel(value), '');
          }

          const options = {
            timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric',
            hour: '2-digit', minute: '2-digit', hour12: false,
          };
          for (const value of ['2026-09-04T12:35:00Z', '2026-01-01T00:05:00Z', '2026-12-31T15:00:00Z']) {
            const expected = new Intl.DateTimeFormat('ja-JP', options).format(new Date(value));
            assert.equal(formatMetalPriceDateLabel(value), expected);
          }

          console.log('METAL PRICE DATE LABEL TEST: PASS');
          """)

          write('scripts/check-metal-price-date-label.py', r'''#!/usr/bin/env python3
          """Verify metal-market timestamp formatting stays a pure UI helper."""
          from __future__ import annotations

          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          VERSION = (ROOT / 'VERSION').read_text(encoding='utf-8').strip()
          APP_PATH = ROOT / 'js/app.js'
          HELPER_PATH = ROOT / 'js/ui/metal-price-date-label.js'
          SW_PATH = ROOT / 'sw.js'
          VS_PATH = ROOT / 'scripts/version-sync.py'
          CURRENT_PATH = ROOT / 'scripts/check-current.py'

          APP = APP_PATH.read_text(encoding='utf-8')
          HELPER = HELPER_PATH.read_text(encoding='utf-8')
          SW = SW_PATH.read_text(encoding='utf-8')
          VS = VS_PATH.read_text(encoding='utf-8')
          CURRENT = CURRENT_PATH.read_text(encoding='utf-8')

          legacy_function = """function metalPriceDateLabel(value) {
            const date = new Date(value || '');
            if (!Number.isFinite(date.getTime())) return '';
            return new Intl.DateTimeFormat('ja-JP', {
              timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric',
              hour: '2-digit', minute: '2-digit', hour12: false,
            }).format(date);
          }"""
          wrapper = """function metalPriceDateLabel(value) {
            return formatMetalPriceDateLabel(value);
          }"""

          checks = {
              'versioned helper import exists': f"from './ui/metal-price-date-label.js?v={VERSION}';" in APP,
              'app keeps thin metalPriceDateLabel wrapper': wrapper in APP,
              'legacy implementation removed from app': legacy_function not in APP,
              'existing metalPriceDateLabel references retained': APP.count('metalPriceDateLabel(') == 3,
              'wrapper delegates once': APP.count('return formatMetalPriceDateLabel(value);') == 1,
              'helper exports formatter': 'export function formatMetalPriceDateLabel(value)' in HELPER,
              'helper keeps invalid-date fallback': "if (!Number.isFinite(date.getTime())) return '';" in HELPER,
              'helper keeps Japanese locale': "new Intl.DateTimeFormat('ja-JP'" in HELPER,
              'helper keeps JST timezone': "timeZone: 'Asia/Tokyo'" in HELPER,
              'helper keeps date fields': "year: 'numeric', month: 'numeric', day: 'numeric'" in HELPER,
              'helper keeps time fields': "hour: '2-digit', minute: '2-digit', hour12: false" in HELPER,
              'service worker precaches helper': f"./js/ui/metal-price-date-label.js?v={VERSION}" in SW,
              'version sync knows helper precache': "'metal-price-date-label.js precache key'" in VS,
              'version sync knows helper import': "'metal-price-date-label.js import key'" in VS,
              'current audit registers checker': "'地金価格日時表示'" in CURRENT and 'check-metal-price-date-label.py' in CURRENT,
          }

          for forbidden in (
              'state.', 'state =', 'saveGame', 'localStorage', 'sessionStorage', 'indexedDB', 'firebase',
              'money', 'inventory', 'aquarium', 'eventState', 'screenData', 'document.', 'window.',
              'navigator.', 'setTimeout', 'setInterval', './assets/', 'Math.random', 'metalMarket',
              'validSpotPrice', 'normalizeMetalHistory', 'applyMetalMarketData', 'advanceTime',
          ):
              checks[f'helper has no reverse dependency: {forbidden}'] = forbidden not in HELPER

          failed = []
          for label, ok in checks.items():
              print(('OK' if ok else 'NG') + ': ' + label)
              if not ok:
                  failed.append(label)

          for source in (APP_PATH, HELPER_PATH):
              syntax = subprocess.run(['node', '--check', str(source)], cwd=ROOT, text=True, capture_output=True)
              if syntax.returncode:
                  failed.append(f'{source.name} JavaScript syntax')
                  print(syntax.stdout)
                  print(syntax.stderr)

          unit = subprocess.run(['node', 'tools/test-metal-price-date-label.mjs'], cwd=ROOT, text=True, capture_output=True)
          print(unit.stdout, end='')
          if unit.stderr:
              print(unit.stderr, file=sys.stderr, end='')
          if unit.returncode:
              failed.append('metal price date label unit test')

          if failed:
              print('\nMETAL PRICE DATE LABEL INTEGRATION: FAIL')
              for label in failed:
                  print(f'- {label}')
              sys.exit(1)

          print('\nMETAL PRICE DATE LABEL INTEGRATION: PASS')
          print('地金相場の最終更新日時表示だけをUI helperへ分離し、価格・前日比・履歴・キャッシュ・売買・セーブ処理はapp.js側に維持しています。')
          ''')

          sw = read('sw.js')
          sw = insert_after_line(
              sw,
              "'./js/ui/metal-market-date-label.js?v=",
              "  './js/ui/metal-price-date-label.js?v=0.10.873',",
              'service worker helper precache',
          )
          write('sw.js', sw)

          vs = read('scripts/version-sync.py')
          vs = insert_after_line(
              vs,
              "'metal-market-date-label.js precache key'",
              "    Rule('sw.js', 'metal-price-date-label.js precache key', qparam(r'\\./js/ui/metal-price-date-label\\.js'), keep_prefix),",
              'version sync precache rule',
          )
          vs = insert_after_line(
              vs,
              "'metal-market-date-label.js import key'",
              "    Rule('js/app.js', 'metal-price-date-label.js import key', qparam(r'\\./ui/metal-price-date-label\\.js'), keep_prefix),",
              'version sync import rule',
          )
          write('scripts/version-sync.py', vs)

          current = read('scripts/check-current.py')
          current = insert_after_line(
              current,
              "('地金相場日付表示',",
              "    ('地金価格日時表示', [sys.executable, str(ROOT / 'scripts/check-metal-price-date-label.py')]),",
              'current audit checker',
          )
          write('scripts/check-current.py', current)

          changelog = read('CHANGELOG.md')
          if '## v0.10.874' in changelog:
              raise RuntimeError('CHANGELOG already contains v0.10.874')
          entry = """## v0.10.874
          - 地金相場の最終更新日時を日本時間の年月日・時分表示へ整える純粋な文字列変換だけを `js/ui/metal-price-date-label.js` へ分離。
          - 既存 `metalPriceDateLabel()` は薄いラッパーとして残し、無効日時の空文字化・日本語ロケール・Asia/Tokyo固定・24時間表記という既存規則と呼び出し位置2か所を維持。
          - 地金価格・前日比・履歴・キャッシュ・売買・所持金・在庫・セーブ・イベント・画像には変更なし。
          - 新UI helperをService Workerと `version-sync.py` へ正式登録し、専用単体/統合検査を総合監査へ追加。

          """
          changelog = replace_once(changelog, '## v0.10.873\n', entry + '## v0.10.873\n', 'CHANGELOG insertion')
          write('CHANGELOG.md', changelog)

          subprocess.run(['python3', 'scripts/version-sync.py', '--set', NEW_VERSION], check=True)
          subprocess.run(['python3', 'scripts/generate-event-probability-list.py', '--write'], check=True)
          subprocess.run(['python3', 'scripts/generate-assets-manifest.py', '--write'], check=True)
          subprocess.run(['python3', 'scripts/version-sync.py', '--check'], check=True)

          if WORKFLOW.exists():
              WORKFLOW.unlink()
          PY
      - name: 画像・実ブラウザ検査環境を準備
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: 第26段階の総合監査
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 10m python3 -u scripts/check-current.py
      - name: 検証済み変更をPRブランチへ反映
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'v0.10.874 地金価格日時表示をhelperへ分離' -m '地金相場の最終更新日時表示だけをUI helperへ分離します。価格・前日比・履歴・キャッシュ・売買・所持金・在庫・セーブ・イベント・画像は変更しません。'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
