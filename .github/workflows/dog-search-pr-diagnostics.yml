name: Dog search PR diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Show dog-search click routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('js/app.js').read_text(encoding='utf-8')
          needles = [
            "case 'nav'", "case 'eat'", "case 'meal'", "case 'mine'",
            "case 'kaitenzushi'", "case 'supplier-category'",
            "eatMeal(", "startKaitenzushi(", "selectedMeal =",
            "enterOkachimachiFromOutside()"
          ]
          lines=app.splitlines()
          seen=set()
          for i,line in enumerate(lines):
              if any(n in line for n in needles):
                  lo=max(0,i-5); hi=min(len(lines),i+12)
                  key=(lo,hi)
                  if key in seen: continue
                  seen.add(key)
                  print(f"\n===== lines {lo+1}-{hi} =====")
                  print("\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi)))
          PY
      - name: Verify approved dog-search PNG files
        run: |
          file assets/images/events/dog-search-cabbage.png assets/images/events/dog-search-shepherd.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for path in [Path('assets/images/events/dog-search-cabbage.png'), Path('assets/images/events/dog-search-shepherd.png')]:
              data=path.read_bytes()
              print(path, 'bytes=',len(data),'sha256=',hashlib.sha256(data).hexdigest(),'head=',data[:32].hex())
              try:
                  from PIL import Image
                  with Image.open(path) as im:
                      im.verify()
                  with Image.open(path) as im:
                      print('PIL', im.format, im.size, im.mode, 'alpha=', 'A' in im.mode)
              except Exception as e:
                  print('PIL_ERROR', type(e).__name__, str(e))
          PY
      - name: Show expected asset manifest changes
        run: |
          cp ASSETS.md /tmp/ASSETS.before
          python3 scripts/generate-assets-manifest.py --write
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          a=Path('/tmp/ASSETS.before').read_text(encoding='utf-8').splitlines()
          b=Path('ASSETS.md').read_text(encoding='utf-8').splitlines()
          print('\n===== MANIFEST SUMMARY DIFF =====')
          for line in difflib.unified_diff(a,b,fromfile='ASSETS.before',tofile='ASSETS.expected',n=2):
              if ('dog-search-' in line or line.startswith('@@') or '総ファイル数' in line or '画像:' in line or '静的な直接参照' in line):
                  print(line)
          print('\n===== DOG ASSET ROWS =====')
          for line in b:
              if 'dog-search-' in line:
                  print(line)
          PY
      - name: Show app size
        run: wc -c js/app.js
