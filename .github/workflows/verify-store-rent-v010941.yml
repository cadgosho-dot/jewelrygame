name: Verify store rent modularization v0.10.941

on:
  push:
    branches:
      - feature/store-rent-escalation-v010941

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Prepare image and browser audit environment
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Run full current audit
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-store-rent-escalation.py
          timeout 8m python3 -u scripts/check-current.py
