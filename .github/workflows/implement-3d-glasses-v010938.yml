name: Implement 3D Glasses v0.10.938

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/implement-3d-glasses-v010938.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved implementation
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/implement-3d-glasses-v010938.py
          node --check js/app.js
          node --check memories-event-image-overrides-v751.js

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/implement-3d-glasses-v010938.py
          git add -A
          git commit -m "v0.10.938 3Dメガネイベント承認済みUIと進行を本番反映"
          git push origin HEAD:main
