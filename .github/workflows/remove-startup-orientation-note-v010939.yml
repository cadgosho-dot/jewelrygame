name: Remove startup orientation note v0.10.939

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-startup-orientation-note-v010939.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove orientation recommendation and bump build
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          test "$(tr -d '\r\n' < VERSION)" = "0.10.938"
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          sentence = 'このゲームは横画面でのプレイをおすすめしています。'
          old = f'        <p class="title-orientation-note">{sentence}</p>\n'
          if app.count(sentence) != 1:
              raise SystemExit(f'unexpected orientation sentence count: {app.count(sentence)}')
          if old not in app:
              raise SystemExit('startup orientation note markup did not match expected source')
          app = app.replace(old, '', 1)
          if sentence in app:
              raise SystemExit('orientation recommendation sentence still remains')
          app_path.write_text(app, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '> **新規更新は「1更新 = 1つの変更目的」を原則**とし、依頼箇所以外は変更しない。\n'
          entry = (
              '\n## v0.10.939\n'
              '- ゲームスタート画面の「このゲームは横画面でのプレイをおすすめしています。」表示を廃止。\n'
              '- セーブ確認・スタート処理、タイトル画像、既存UI、ゲーム仕様、画像・音声・セーブ形式は変更なし。\n'
          )
          if '## v0.10.939\n' in changelog:
              raise SystemExit('v0.10.939 changelog entry already exists')
          if marker not in changelog:
              raise SystemExit('CHANGELOG insertion marker not found')
          changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

          python3 scripts/version-sync.py --bump-patch
          node --check js/app.js
          python3 scripts/version-sync.py --check
          python3 scripts/check-regression-baseline.py
          if grep -Fq 'このゲームは横画面でのプレイをおすすめしています。' js/app.js; then
            echo 'startup orientation recommendation still exists' >&2
            exit 1
          fi

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-startup-orientation-note-v010939.yml
          git add -A
          git commit -m "v0.10.939 起動時の横画面推奨文を削除"
          git push origin HEAD:main
