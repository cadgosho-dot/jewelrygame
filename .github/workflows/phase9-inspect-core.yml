name: phase9 inspect core
on:
  push:
    branches: [phase9-protect-core-v010898]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect purchase core
        run: |
          echo '=== PURCHASE CONTEXT ==='
          sed -n '21490,21545p' js/app.js
          echo '=== PURCHASE CALL SITES ==='
          grep -nE 'purchase\(' js/app.js || true
