name: codex v0.10.861 diagnose

on:
  push:
    branches:
      - codex/v0-10-861-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare safest candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          targets = ['giftStatusLabel', 'giftCategoryLabel', 'clampViewportValue']
          for name in targets:
              print(f'=== {name} ===')
              hits = []
              rx = re.compile(rf'\b{re.escape(name)}\b')
              for i, line in enumerate(lines):
                  if rx.search(line):
                      hits.append(i)
              print(f'occurrences={len(hits)}')
              for hit in hits:
                  lo = max(0, hit - 8)
                  hi = min(len(lines), hit + 10)
                  print(f'--- context lines {lo+1}-{hi} ---')
                  for j in range(lo, hi):
                      print(f'{j+1:05d}: {lines[j]}')
              print()
          PY
