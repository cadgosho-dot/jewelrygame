name: stage17-diagnose
on:
  push:
    branches:
      - jxj-stage17-v0.10.865
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: jxj-stage17-v0.10.865
      - name: Scan short low-risk functions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('js/app.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          forbidden = (
              'state.', 'state =', 'saveGame', 'localStorage', 'indexedDB', 'firebase',
              'document.', 'window.', 'screenData', 'eventState', 'money', 'inventory',
              'aquarium', 'setTimeout', 'setInterval', 'addEventListener', 'querySelector',
              'innerHTML', 'classList', 'playSfx', 'showToast', 'showModal', 'closeModal',
              'navigate', 'render', 'await ', 'fetch(', 'Math.random', './assets/'
          )

          def strip_js(line, in_block):
              out = []
              i = 0
              quote = None
              escape = False
              while i < len(line):
                  c = line[i]
                  n = line[i+1] if i + 1 < len(line) else ''
                  if in_block:
                      if c == '*' and n == '/':
                          in_block = False
                          out.extend('  ')
                          i += 2
                          continue
                      out.append(' ')
                      i += 1
                      continue
                  if quote:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      out.append(' ')
                      i += 1
                      continue
                  if c == '/' and n == '*':
                      in_block = True
                      out.extend('  ')
                      i += 2
                      continue
                  if c == '/' and n == '/':
                      out.extend(' ' * (len(line) - i))
                      break
                  if c in ('\"', "'", '`'):
                      quote = c
                      out.append(' ')
                      i += 1
                      continue
                  out.append(c)
                  i += 1
              if len(out) < len(line):
                  out.extend(' ' * (len(line) - len(out)))
              return ''.join(out), in_block

          funcs = []
          start_re = re.compile(r'^\s*function\s+([A-Za-z_$][\w$]*)\s*\(')
          for idx, line in enumerate(lines):
              m = start_re.match(line)
              if not m:
                  continue
              in_block = False
              paren_depth = 0
              saw_open_paren = False
              body_started = False
              brace_depth = 0
              end = None
              for j in range(idx, min(len(lines), idx + 160)):
                  clean, in_block = strip_js(lines[j], in_block)
                  start_col = m.end() - 1 if j == idx else 0
                  for ch in clean[start_col:]:
                      if not body_started:
                          if ch == '(':
                              paren_depth += 1
                              saw_open_paren = True
                          elif ch == ')' and saw_open_paren:
                              paren_depth -= 1
                          elif ch == '{' and saw_open_paren and paren_depth == 0:
                              body_started = True
                              brace_depth = 1
                      else:
                          if ch == '{':
                              brace_depth += 1
                          elif ch == '}':
                              brace_depth -= 1
                              if brace_depth == 0:
                                  end = j
                                  break
                  if end is not None:
                      break
              if end is None:
                  continue
              body = '\n'.join(lines[idx:end+1])
              span = end - idx + 1
              lowrisk = span <= 14 and not any(token in body for token in forbidden)
              funcs.append((0 if lowrisk else 1, span, idx+1, end+1, m.group(1), body))

          funcs.sort(key=lambda x: (x[0], x[1], x[2]))
          print(f'TOTAL_FUNCTIONS={len(funcs)}')
          print('=== LOW-RISK SHORT CANDIDATES ===')
          shown = 0
          for risk, span, start, end, name, body in funcs:
              if risk != 0:
                  continue
              print(f'--- {name} lines={start}-{end} span={span} ---')
              print(body)
              shown += 1
              if shown >= 50:
                  break
          print(f'LOW_RISK_SHOWN={shown}')
          print('=== OTHER SHORTEST FUNCTIONS ===')
          shown = 0
          for risk, span, start, end, name, body in funcs:
              if risk == 0:
                  continue
              print(f'--- {name} lines={start}-{end} span={span} ---')
              print(body)
              shown += 1
              if shown >= 20:
                  break
          PY
