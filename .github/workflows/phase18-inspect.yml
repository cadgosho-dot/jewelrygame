name: Phase18 Inspect Core Candidates
on:
  push:
    branches: [phase18-inspect]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Locate actual payment UI and handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('js/app.js').read_text(encoding='utf-8')
          lines=text.splitlines()
          for token in ['pay-outstanding-all','pay-outstanding','select-outstanding-target','set-outstanding-amount','現在、未払いはありません。']:
            print(f'===== OCCURRENCES {token} =====')
            for i,line in enumerate(lines,1):
              if token in line:
                print(f'{i}: {line}')
                lo=max(1,i-12); hi=min(len(lines),i+12)
                for j in range(lo,hi+1): print(f'{j}: {lines[j-1]}')
          print('===== FUNCTION NAMES containing outstanding/payment =====')
          for m in re.finditer(r'(?m)^function\s+([A-Za-z_$][\w$]*)\s*\([^\n]*\)\s*\{', text):
            name=m.group(1)
            if 'outstanding' in name.lower() or 'payment' in name.lower() or 'phone' in name.lower():
              print(text.count('\n',0,m.start())+1, repr(text[m.start():text.find('\n',m.start())]))
          PY
