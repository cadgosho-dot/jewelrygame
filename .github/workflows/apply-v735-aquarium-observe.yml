name: v0.10.735 水槽観察仕様更新

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-v735-aquarium-observe.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: 水槽観察仕様を適用
        run: python3 scripts/apply-v735-aquarium-observe.py

      - name: JavaScript構文確認
        run: node --check js/app.js

      - name: 変更をコミット
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/minigames/aquarium/index.html js/app.js js/game-data.js game.html index.html auth.html sw.js
          git commit -m "v0.10.735 水槽観察を購入済み項目に限定"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
