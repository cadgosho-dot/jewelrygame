name: 地金相場更新とGitHub Pages公開

on:
  push:
    branches:
      - main
  schedule:
    # GitHub ActionsのcronはUTC。日本時間の平日9:43と14:17。
    - cron: '43 0 * * 1-5'
    - cron: '17 5 * * 1-5'
  workflow_dispatch:

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  update-metals:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Push前の正常な相場履歴を引き継ぐ
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "比較できるPush前コミットがないため、履歴引き継ぎを省略します。"
            exit 0
          fi
          if ! curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/data/metals.json?ref=${BEFORE_SHA}" \
            --output /tmp/metals-before-push.json; then
            echo "Push前の地金相場ファイルを取得できなかったため、履歴引き継ぎを省略します。"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          current_path = Path('data/metals.json')
          previous_path = Path('/tmp/metals-before-push.json')
          try:
              current = json.loads(current_path.read_text(encoding='utf-8'))
              previous = json.loads(previous_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError):
              print('履歴引き継ぎ用JSONを読み取れなかったため省略します。')
              raise SystemExit(0)

          previous_spot = previous.get('spotPerGram') or {}
          previous_is_live = (
              previous.get('status') == 'live'
              and all(isinstance(previous_spot.get(key), (int, float)) and previous_spot[key] > 0
                      for key in ('gold', 'silver', 'platinum'))
          )
          if current.get('status') != 'live' and previous_is_live:
              current_path.write_text(
                  json.dumps(previous, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print('Push前の正常な相場・前日比・履歴を引き継ぎました。')
          else:
              print('現在の相場JSONをそのまま更新基準にします。')
          PY

      - name: Metals.Devから価格を取得して計算
        # ゲーム本体のpushではAPI枠を消費しない。定期実行・手動実行時だけ取得する。
        if: github.event_name != 'push'
        env:
          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}
        run: |
          cp data/metals.json /tmp/metals-before-api.json
          if [ -z "$METALS_DEV_API_KEY" ]; then
            echo "::warning::METALS_DEV_API_KEYが未設定です。既存の正常な地金相場を使ってPages公開を続行します。"
            exit 0
          fi
          echo "::add-mask::$METALS_DEV_API_KEY"
          if ! python3 scripts/update-metals.py; then
            echo "::warning::Metals.Devから地金相場を取得できませんでした。既存の正常な地金相場へ戻してPages公開を続行します。"
            cp /tmp/metals-before-api.json data/metals.json
          fi

      - name: 公開に使う地金相場JSONを検証
        run: |
          python3 -m json.tool data/metals.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/metals.json').read_text(encoding='utf-8'))
          if data.get('status') != 'live':
              raise SystemExit('既存の地金相場もlive状態ではないため、安全のため公開を中止します。')
          spot = data.get('spotPerGram') or {}
          for metal in ('gold', 'silver', 'platinum'):
              value = spot.get(metal)
              if not isinstance(value, (int, float)) or value <= 0:
                  raise SystemExit(f'{metal}の地金相場が不正なため、安全のため公開を中止します。')
          PY

      - name: ASSETS一覧を公開環境基準へ同期
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/generate-assets-manifest.py --write

      - name: 更新結果をコミット
        run: |
          if git diff --quiet -- data/metals.json ASSETS.md; then
            echo "地金相場・ASSETS一覧に変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metals.json ASSETS.md
          git commit -m "公開データを自動同期"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate-build:
    permissions:
      contents: read
    if: needs.update-metals.result == 'success'
    needs:
      - update-metals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 検証する最新版を取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: 画像・実ブラウザ検査環境を準備
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: 公開前の現行ビルド検査
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          echo "Python: $(python3 --version)"
          echo "Node: $(node --version)"
          timeout 8m python3 -u scripts/check-current.py

      - name: 検査通過を記録
        run: |
          echo "CURRENT BUILD AUDIT: PASS — GitHub Pages公開を許可します。"

  build-pages:
    permissions:
      contents: read
      pages: read
    if: needs.validate-build.result == 'success'
    needs:
      - validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 公開する最新版を取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: 公開用フォルダを作成
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='tools/' \
            --exclude='docs/' \
            --exclude='*.md' \
            --exclude='.firebaserc' \
            --exclude='.gitignore' \
            --exclude='firebase.json' \
            --exclude='firestore.rules' \
            --exclude='HANDOFF_MANDATORY_REGRESSION_RULES.txt' \
            --exclude='quiz-layout-test.html'

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: always() && needs.build-pages.result == 'success'
    needs:
      - build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
