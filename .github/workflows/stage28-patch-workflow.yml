name: 第28段階 検証資料同期修正

on:
  push:
    branches:
      - codex/v0.10.876-save-diagnostic-date-label

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/v0.10.876-save-diagnostic-date-label
          fetch-depth: 1
      - name: イベント確率資料の再生成を追加
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/stage28-implement.yml')
          text = path.read_text(encoding='utf-8')
          old = """      - name: ASSETS棚卸しを公開環境と同じ条件で確定
        run: |
          python3 scripts/generate-assets-manifest.py --write
"""
          new = """      - name: 管理資料を公開環境と同じ条件で確定
        run: |
          python3 scripts/generate-assets-manifest.py --write
          python3 scripts/generate-event-probability-list.py --write
"""
          if text.count(old) != 1:
              raise SystemExit('修正対象ブロックを一意に確認できません。')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/stage28-patch-workflow.yml').unlink()
          PY
          git config user.name "cadgosho-dot"
          git config user.email "cadgosho@gmail.com"
          git add -A
          git commit -m "第28段階の管理資料同期を補完"
          git push origin HEAD:codex/v0.10.876-save-diagnostic-date-label
