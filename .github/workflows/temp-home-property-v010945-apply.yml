name: temp-home-property-v010945-apply

on:
  push:
    branches:
      - feature/home-property-b-v010945-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-property-b-v010945-clean
          fetch-depth: 0

      - name: Apply home property feature
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/home-property-b-v010944-clean
          mkdir -p js/finance tools
          for f in \
            js/finance/home-property.js \
            js/finance/home-property-controller.js \
            scripts/check-home-property.py \
            scripts/check-home-rent-regression.py \
            tools/test-home-rent-regression.mjs; do
            git show origin/feature/home-property-b-v010944-clean:$f > "$f"
          done
          python3 scripts/temp-apply-home-property-v010945.py
          python3 scripts/temp-version-sync-event-rules-v010945.py
          python3 scripts/version-sync.py --set 0.10.945
          python3 scripts/generate-event-probability-list.py --write
          node --check js/app.js
          node --check js/finance/home-property.js
          node --check js/finance/home-property-controller.js
          python3 scripts/version-sync.py --check
          python3 scripts/check-home-rent-regression.py
          python3 scripts/check-storyteller-hunger-progression.py
          python3 scripts/check-regression-baseline.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/generate-event-probability-list.py --check

      - name: Commit applied feature
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-home-property-v010945-apply.yml
          rm -f scripts/temp-apply-home-property-v010945.py
          rm -f scripts/temp-version-sync-event-rules-v010945.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.10.945 自宅物件機能を最新mainへ安全適用"
          git push origin HEAD:feature/home-property-b-v010945-clean
