name: v0.10.937 version sync repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-v010937-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize active version references
        run: |
          python3 scripts/version-sync.py --set 0.10.937
          python3 scripts/generate-event-probability-list.py --write
          python3 scripts/version-sync.py --check
          python3 scripts/generate-event-probability-list.py --check
          git diff --check

      - name: Commit synchronized files
        run: |
          if git diff --quiet; then
            echo 'No synchronization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.10.937 バージョン参照とイベント確率資料を同期'
          git push origin HEAD:main
