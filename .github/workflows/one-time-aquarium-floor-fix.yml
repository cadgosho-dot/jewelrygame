name: 一時・水槽床砂境界修整

on:
  push:
    branches:
      - main

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 最新mainを取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 水槽床砂境界を局所修整してv0.10.827へ同期
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(cat VERSION)"
          if [ "$CURRENT_VERSION" != "0.10.826" ]; then
            echo "想定外のVERSION: $CURRENT_VERSION"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          aquarium = Path('assets/minigames/aquarium/index.html')
          text = aquarium.read_text(encoding='utf-8')

          css_old = '.subfront{z-index:16}.floorclip{'
          css_new = '.subfront{z-index:16}.substrate-seam-patch{z-index:18;pointer-events:none}.floorclip{'
          if css_old not in text:
              raise SystemExit('水槽CSSの修整対象が見つかりません')
          text = text.replace(css_old, css_new, 1)

          marker = 'const dwarfGouramiSrc='
          if marker not in text:
              raise SystemExit('水槽JSの挿入位置が見つかりません')

          patch_lines = [
              '// v0.10.827: 背面ベース画像の黒い矩形境界が床砂上へ露出する隙間だけ、既存の床砂レイヤーから複写して埋める。',
              'function installAquariumSubstrateSeamPatch(){',
              " const stage=document.querySelector('.stage');",
              " const substrate=document.querySelector('.subback');",
              " if(!stage||!substrate||stage.querySelector('.substrate-seam-patch'))return;",
              ' const build=()=>{',
              "  if(stage.querySelector('.substrate-seam-patch')||!substrate.naturalWidth||!substrate.naturalHeight)return;",
              "  const canvas=document.createElement('canvas');",
              "  canvas.className='full substrate-seam-patch';",
              '  canvas.width=substrate.naturalWidth;',
              '  canvas.height=substrate.naturalHeight;',
              "  const ctx=canvas.getContext('2d');",
              '  if(!ctx)return;',
              '  const w=canvas.width,h=canvas.height;',
              '  const sx=Math.round(w*(270/900));',
              '  const sy=Math.round(h*(386/600));',
              '  const sw=Math.round(w*((646-270)/900));',
              '  const sh=Math.max(1,Math.round(h*(13/600)));',
              '  const dy=Math.round(h*(373/600));',
              '  ctx.drawImage(substrate,sx,sy,sw,sh,sx,dy,sw,sh);',
              "  const clip=stage.querySelector('.clip');",
              '  stage.insertBefore(canvas,clip||stage.firstChild);',
              ' };',
              ' if(substrate.complete)build();',
              " else substrate.addEventListener('load',build,{once:true});",
              '}',
              'installAquariumSubstrateSeamPatch();',
          ]
          patch_js = '\n'.join(patch_lines) + '\n'
          text = text.replace(marker, patch_js + marker, 1)
          aquarium.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          log = changelog.read_text(encoding='utf-8')
          anchor = '## v0.10.826 (2026-09-01)'
          if anchor not in log:
              raise SystemExit('CHANGELOGのv0.10.826位置が見つかりません')
          entry = '## v0.10.827 (2026-09-02)\n- 水槽の横画面で床砂上に見えていた、背面ベース画像の黒い矩形境界を修整。\n- 床砂画像は再生成・色変更せず、既存の床砂レイヤーから境界部分だけをCanvasへ複写する局所補正とした。魚・水草・ディスプレイ・セーブ仕様は変更しない。\n\n'
          log = log.replace(anchor, entry + anchor, 1)
          changelog.write_text(log, encoding='utf-8')
          PY

          python3 scripts/version-sync.py --bump-patch
          python3 scripts/generate-event-probability-list.py --write
          rm .github/workflows/one-time-aquarium-floor-fix.yml
          python3 scripts/generate-assets-manifest.py --write
          python3 scripts/check-current.py

          test "$(cat VERSION)" = "0.10.827"
          git status --short

      - name: 修整をmainへコミット
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix aquarium substrate seam in v0.10.827"
          git pull --rebase origin main
          git push origin HEAD:main

  validate-build:
    permissions:
      contents: read
    needs:
      - patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: v0.10.827を取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: 画像・実ブラウザ検査環境を準備
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: 公開前の現行ビルド検査
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          test "$(cat VERSION)" = "0.10.827"
          timeout 8m python3 -u scripts/check-current.py

  build-pages:
    permissions:
      contents: read
      pages: read
    needs:
      - validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 公開するv0.10.827を取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: 公開用フォルダを作成
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='tools/' \
            --exclude='docs/' \
            --exclude='*.md' \
            --exclude='.firebaserc' \
            --exclude='.gitignore' \
            --exclude='firebase.json' \
            --exclude='firestore.rules' \
            --exclude='HANDOFF_MANDATORY_REGRESSION_RULES.txt' \
            --exclude='quiz-layout-test.html'

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs:
      - build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
