name: phase11 finishMiningRock regression check

on:
  push:
    branches:
      - phase11-finish-mining-rock-regression-v0.10.900

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase11-finish-mining-rock-regression-v0.10.900
          fetch-depth: 0
      - name: 採掘結果確定処理の専用保護を検査
        run: |
          set -euo pipefail
          node --check tools/test-finish-mining-rock-regression.mjs
          node tools/test-finish-mining-rock-regression.mjs
          python3 scripts/check-finish-mining-rock-regression.py
      - name: ゲーム本体が基準HEADから未変更であることを確認
        run: |
          set -euo pipefail
          git diff --exit-code 50200ad2973d740567fef60db7d9114d2fe58bd8 -- js/app.js
          echo "APP.JS UNCHANGED: PASS"
