name: Apply v0.10.840 integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v840.yml'

permissions:
  contents: write

jobs:
  apply-v840:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.10.840 integration
        run: python .github/apply_v840.py

      - name: Verify synchronized build
        run: |
          python scripts/version-sync.py --check
          node --check js/app.js
          git diff --check

      - name: Commit integrated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate workshop UI fixes v0.10.840"
          git push origin HEAD:main
