name: apply-v0.10.734-oyatsu-character

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: v0.10.734へ更新
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              Path('js/app.js'),
              Path('js/game-data.js'),
              Path('game.html'),
              Path('index.html'),
              Path('auth.html'),
              Path('sw.js'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = text.replace('0.10.733', '0.10.734')
              path.write_text(text, encoding='utf-8')
          PY
      - name: 変更をコミット
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/game-data.js game.html index.html auth.html sw.js
          git commit -m "v0.10.734 お菓子大好きキャラクター更新"
          git pull --rebase origin main
          git push origin HEAD:main
