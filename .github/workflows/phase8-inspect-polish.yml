name: phase8 inspect polishRough

on:
  push:
    branches:
      - phase8-protect-polish-rough-v010897

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: polishRough現行処理を表示
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('js/app.js').read_text(encoding='utf-8')
          start = app.index('function polishRough()')
          end = app.index('function qualityProbabilities()', start)
          block = app[start:end]
          print('=== POLISH_ROUGH_BEGIN ===')
          print(block)
          print('=== POLISH_ROUGH_END ===')
          PY
