<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JEWELRY×JEWELRY｜3Dメガネイベント 実素材確認</title>
<style>
:root{
  --safe-top:max(8px,env(safe-area-inset-top));
  --safe-right:max(8px,env(safe-area-inset-right));
  --safe-bottom:max(8px,env(safe-area-inset-bottom));
  --safe-left:max(8px,env(safe-area-inset-left));
  --gold:#e7bd67;
  --text:#fff7e9;
  --line:rgba(232,191,104,.48);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0806;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
body{position:relative;background:#0b0806 url('../assets/images/loose-shop-v385.webp') center/cover no-repeat}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.05) 48%,rgba(0,0,0,.28))}
#root,.event-shell,.screen-content{position:absolute;inset:0;overflow:hidden}
#root{z-index:1}
.stage{position:absolute;inset:0;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;isolation:isolate;text-shadow:0 2px 6px rgba(0,0,0,.96),0 0 10px rgba(0,0,0,.72)}
.character-area{min-width:0;min-height:0;overflow:hidden;pointer-events:none}
.character{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom;user-select:none;pointer-events:none;filter:drop-shadow(0 14px 24px rgba(0,0,0,.54))}
.dialogue-panel,.question-panel{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,rgba(27,20,14,.92),rgba(12,9,7,.84));box-shadow:0 16px 42px rgba(0,0,0,.42),inset 0 0 24px rgba(255,193,79,.025);backdrop-filter:blur(5px)}
.name{display:block;width:100%;margin:0;color:var(--gold);font-size:clamp(.72rem,2.9vw,.9rem);font-weight:800;line-height:1.2;text-align:left}
.dialogue-panel{display:flex;flex-direction:column;gap:7px}
.dialogue-panel strong{display:block;font-size:clamp(.9rem,4vw,1.05rem);font-weight:800;line-height:1.5}
.tap{display:block;align-self:flex-end;margin-top:1px;color:#bdc9cd;font-size:.82rem;font-weight:800;line-height:1.15;animation:tap 1.35s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0);opacity:.72}50%{transform:translateY(-3px);opacity:1}}
.question-panel{display:flex;flex-direction:column;gap:6px;padding:9px 10px;overflow:auto}
.kicker{align-self:flex-start;display:inline-flex;width:auto;padding:.22rem .58rem;border:1px solid rgba(231,189,103,.48);border-radius:999px;color:var(--gold);font-size:.68rem;font-weight:900;line-height:1.1;letter-spacing:.08em}
.question-panel h2{margin:0;font-size:clamp(.86rem,4.1vw,1.02rem);line-height:1.32}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;margin-top:auto}
.answer{min-width:0;min-height:48px;display:grid;grid-template-columns:1.65rem minmax(0,1fr);align-items:center;gap:.42rem;padding:.4rem .48rem;border:1px solid rgba(232,191,104,.40);border-radius:10px;background:rgba(28,20,13,.90);color:#fff;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
.answer>span{display:grid;place-items:center;width:1.65rem;height:1.65rem;border:1px solid rgba(255,255,255,.52);border-radius:50%;font-size:.76rem;font-weight:900}
.answer strong{font-size:clamp(.72rem,3.2vw,.9rem);line-height:1.25;overflow-wrap:anywhere}
.preview-controls{position:fixed;right:max(8px,var(--safe-right));top:max(8px,var(--safe-top));z-index:50;display:flex;gap:5px;padding:5px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(0,0,0,.74);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.preview-controls button{border:1px solid rgba(255,229,160,.48);border-radius:7px;padding:6px 9px;background:#241b15;color:#fff;font-weight:800;font-size:12px}
.preview-controls button.active{background:#c6973d;color:#17100a}
.preview-badge{position:fixed;left:max(8px,var(--safe-left));top:max(8px,var(--safe-top));z-index:49;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.72);font-size:11px;color:#eee;pointer-events:none}

@media (orientation:portrait),(max-aspect-ratio:1/1){
  body{background-image:url('../assets/images/loose-shop-portrait-v385.webp')}
  .dialogue-stage{display:block!important;padding:0!important}
  .dialogue-stage>.character-area{position:absolute!important;z-index:1!important;left:50%!important;top:max(44px,var(--safe-top))!important;bottom:132px!important;width:min(92vw,460px)!important;transform:translateX(-50%)!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;overflow:hidden!important}
  .dialogue-stage .character{max-width:min(82vw,430px)!important;max-height:100%!important;object-position:center bottom!important}
  .dialogue-stage>.dialogue-panel{position:absolute!important;z-index:20!important;left:7px!important;right:7px!important;bottom:max(14px,calc(var(--safe-bottom) + 9px))!important;top:auto!important;width:auto!important;max-height:34dvh!important;margin:0!important;padding:12px 14px!important;overflow-y:auto!important}

  .question-stage{display:grid!important;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,56%) minmax(0,44%)!important;gap:4px!important;padding:max(4px,var(--safe-top)) 6px max(14px,calc(var(--safe-bottom) + 10px))!important}
  .question-stage>.character-area{position:relative!important;grid-column:1!important;grid-row:1!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;overflow:hidden!important;z-index:1!important}
  .question-stage .character{max-width:min(78vw,390px)!important;max-height:100%!important;object-position:center bottom!important}
  .question-stage>.question-panel{position:relative!important;grid-column:1!important;grid-row:2!important;align-self:stretch!important;max-height:100%!important;z-index:20!important;padding:8px 8px 9px!important;gap:5px!important}
  .preview-badge{top:52px}
}

@media (orientation:landscape),(min-aspect-ratio:1/1){
  .dialogue-stage{display:block!important;padding:0!important}
  .dialogue-stage>.character-area{position:absolute!important;z-index:1!important;left:0!important;right:0!important;top:max(4px,var(--safe-top))!important;bottom:clamp(104px,26dvh,150px)!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;overflow:visible!important}
  .dialogue-stage .character{max-width:min(48vw,560px)!important;max-height:100%!important;object-position:center top!important}
  .dialogue-stage>.dialogue-panel{position:absolute!important;z-index:20!important;left:8px!important;right:8px!important;bottom:max(6px,var(--safe-bottom))!important;top:auto!important;max-height:34dvh!important;margin:0!important;padding:12px 14px!important;overflow-y:auto!important}

  .question-stage{display:grid!important;grid-template-columns:minmax(180px,38%) minmax(0,62%)!important;grid-template-rows:minmax(0,1fr)!important;gap:7px!important;padding:5px 7px!important}
  .question-stage>.character-area{position:relative!important;grid-column:1!important;grid-row:1!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;overflow:hidden!important;z-index:1!important}
  .question-stage .character{max-width:100%!important;max-height:100%!important;object-position:center bottom!important}
  .question-stage>.question-panel{position:relative!important;grid-column:2!important;grid-row:1!important;align-self:stretch!important;width:100%!important;height:100%!important;max-height:100%!important;z-index:20!important;overflow-y:auto!important}
  .question-panel h2{font-size:clamp(.78rem,2.6vh,.94rem)}
  .answer{min-height:44px;padding:.32rem .42rem}
}
</style>
</head>
<body data-screen="looseShopOriginalQuizEvent">
<div id="root">
  <div class="event-shell"><div class="screen-content">
    <section id="eventStage" class="stage dialogue-stage">
      <div class="character-area">
        <img class="character" src="../assets/images/events/loose-shop-original-quiz.png" alt="3Dメガネ">
      </div>
      <div id="dialoguePanel" class="dialogue-panel">
        <span class="name">3Dメガネ</span>
        <strong>「ちょっと面白いクイズがあるんだけど、付き合わない？」</strong>
        <span class="tap">タップして進む</span>
      </div>
      <div id="questionPanel" class="question-panel" hidden>
        <span class="name">3Dメガネ</span>
        <span class="kicker">4択クイズ</span>
        <h2>宝石についての問題。正しい答えはどれ？</h2>
        <div class="answers">
          <button class="answer" type="button"><span>A</span><strong>ダイヤモンド</strong></button>
          <button class="answer" type="button"><span>B</span><strong>エメラルド</strong></button>
          <button class="answer" type="button"><span>C</span><strong>ルビー</strong></button>
          <button class="answer" type="button"><span>D</span><strong>サファイア</strong></button>
        </div>
      </div>
    </section>
  </div></div>
</div>
<div class="preview-badge" id="badge">携帯確認用｜実素材表示</div>
<div class="preview-controls">
  <button id="dialogueBtn" class="active" type="button">会話</button>
  <button id="quizBtn" type="button">4択</button>
</div>
<script>
(()=>{
  const s=document.getElementById('eventStage');
  const d=document.getElementById('dialoguePanel');
  const q=document.getElementById('questionPanel');
  const db=document.getElementById('dialogueBtn');
  const qb=document.getElementById('quizBtn');
  const b=document.getElementById('badge');
  function dialogue(){s.className='stage dialogue-stage';d.hidden=false;q.hidden=true;db.classList.add('active');qb.classList.remove('active')}
  function quiz(){s.className='stage question-stage';d.hidden=true;q.hidden=false;qb.classList.add('active');db.classList.remove('active')}
  function badge(){b.textContent='携帯確認用｜実素材｜'+(innerWidth>innerHeight?'横画面':'縦画面')}
  db.addEventListener('click',dialogue);qb.addEventListener('click',quiz);addEventListener('resize',badge);addEventListener('orientationchange',badge);badge();
})();
</script>
</body>
</html>
