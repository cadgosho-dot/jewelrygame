name: Validate sellRough stage12

on:
  push:
    branches:
      - protect-sell-rough-stage12

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: protect-sell-rough-stage12
      - name: Node syntax
        run: |
          node --check js/app.js
          node --check tools/test-sell-rough-regression.mjs
      - name: Dynamic regression
        run: node tools/test-sell-rough-regression.mjs
      - name: Python checker
        run: python3 scripts/check-sell-rough-regression.py
