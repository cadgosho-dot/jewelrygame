name: Temporary version reference scan

on:
  push:
    branches:
      - fix/event-progression-stops-20260913

permissions:
  contents: read

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-progression-stops-20260913
          fetch-depth: 1
      - name: Find current version references
        run: |
          echo 'FILES_WITH_0.10.944:'
          git grep -l '0\.10\.944' || true
