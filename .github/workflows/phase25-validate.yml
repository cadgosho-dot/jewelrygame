name: Phase25 Validate Staff Operations

on:
  push:
    branches:
      - phase25-staff-operations-regression-v0.10.914
    paths:
      - tmp/phase25-validate-trigger.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase25-staff-operations-regression-v0.10.914
          fetch-depth: 0
      - name: Validate Stage25 protection
        run: |
          node --check js/app.js
          node --check tools/test-staff-operations-regression.mjs
          node tools/test-staff-operations-regression.mjs
          python3 scripts/check-staff-operations-regression.py
          git diff --exit-code 2c0244c22d098b23ad7321ec32e25fc360eeb369 -- js/app.js
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/phase25-sync-v010914.yml',
              '.github/workflows/phase25-validate.yml',
              'scripts/check-staff-operations-regression.py',
              'tmp/phase25-validate-trigger.txt',
              'tools/test-staff-operations-regression.mjs',
          }
          actual = set(subprocess.check_output([
              'git', 'diff', '--name-only', '2c0244c22d098b23ad7321ec32e25fc360eeb369...HEAD'
          ], text=True).splitlines())
          print('CHANGED FILES:', sorted(actual))
          if actual != expected:
              raise SystemExit(f'EXPECTED FILES: FAIL expected={sorted(expected)} actual={sorted(actual)}')
          print('EXPECTED FILES: PASS')
          print('APP.JS UNCHANGED: PASS')
          PY
