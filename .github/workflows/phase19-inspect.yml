name: Phase19 Inspect Core Candidate

on:
  push:
    branches:
      - phase19-inspect

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract current tropical shop transaction
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('js/app.js').read_text(encoding='utf-8')

          def extract(name):
              m = re.search(rf'(?m)^function\s+{re.escape(name)}\s*\(', text)
              if not m:
                  print(f'NOT FOUND: {name}')
                  return ''
              start = m.start()
              brace = text.find('{', start)
              depth = 0; i = brace; quote = None; esc = False
              while i < len(text):
                  c = text[i]
                  if quote:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == quote: quote = None
                  else:
                      if c in "'\"`": quote = c
                      elif c == '/' and i + 1 < len(text) and text[i+1] == '/':
                          j = text.find('\n', i+2); i = len(text) if j < 0 else j; continue
                      elif c == '/' and i + 1 < len(text) and text[i+1] == '*':
                          j = text.find('*/', i+2); i = len(text) if j < 0 else j+1
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              body = text[start:i+1]
                              line = text.count('\n', 0, start) + 1
                              print(f'===== {name} line={line} size={len(body)} =====')
                              print(body)
                              return body
                  i += 1
              return ''

          body = extract('purchaseTropicalShopItem')
          names = sorted(set(re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(', body)))
          print('\nCALLED NAMES:', ', '.join(names))
          for name in ['tropicalShopItemById','tropicalShopQuantity','ensureAquariumState','tropicalShopMaxQuantity','tropicalShopCategoryForItem']:
              extract(name)
          PY
