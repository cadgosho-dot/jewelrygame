name: TEMP bank background transfer

on:
  push:
    branches:
      - fix/bank-background-original-png-20261001

permissions:
  contents: write

jobs:
  transfer:
    if: ${{ !contains(github.event.head_commit.message, '[bank-bg-transfer-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact user-provided bank backgrounds
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfOnNz-j82iejsdGB4Y8FAv91Jq8Ciz-pivH2mjKRtC9sdMMpeX6aasxflYChQSoBHrM7EuwvnV85iwBFnFUkddFIK-P4Vp03AmUKXchl1yFYKQmBQ-h5ORgw3QpcGc9kR79GsaQtPXxiJbda03qWK89pfTH9dusWxjjYty03dO0LOreRc=nw?key=rG_RN9xnnxaEww9uSUkv8A' -o assets/images/backgrounds/bank-okachimachi-landscape.jpg
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUeWW99bDs29lFpBHO2GT7A_w1GAoSyMKu2xZ9dbUcAISIVxHP21Ffo42yRMlz75STP4PLX9CZv1Wwd_lkwR7vFkrDbap8cuSbJanW4OH6MQIrC4HqZ5PwP_iwZsSeDghYW2Dgh5Qq2WMkZjT2NzYwCkpx5A9o1APt-wMorH_lXW8NOaRnY=nw?key=rG_RN9xnnxaEww9uSUkv8A' -o assets/images/backgrounds/bank-okachimachi-portrait.jpg

      - name: Verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          echo 'b3d305d85a5b8c80869cf15059527af805eba09ee571bba1b7496e8c1cf59a2b  assets/images/backgrounds/bank-okachimachi-landscape.jpg' | sha256sum -c -
          echo '8d4ef397962eba026238d7f3d8c7083fea93ffb052b3dc0d16d320e1cf91a6d3  assets/images/backgrounds/bank-okachimachi-portrait.jpg' | sha256sum -c -
          test "$(stat -c%s assets/images/backgrounds/bank-okachimachi-landscape.jpg)" = '397148'
          test "$(stat -c%s assets/images/backgrounds/bank-okachimachi-portrait.jpg)" = '476320'

      - name: Replace bank backgrounds only
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/backgrounds/bank-okachimachi-landscape.webp
          rm -f assets/images/backgrounds/bank-okachimachi-portrait.webp
          sed -i 's/bank-okachimachi-landscape\.webp/bank-okachimachi-landscape.jpg/g' js/finance/bank-ui.js tools/test-bank-regression.mjs
          sed -i 's/bank-okachimachi-portrait\.webp/bank-okachimachi-portrait.jpg/g' js/finance/bank-ui.js tools/test-bank-regression.mjs
          mkdir -p docs/archive/asset-manifests
          cat > docs/archive/asset-manifests/TOOL_IMAGE_INTAKE_MANIFEST_BANK_20261001.json <<'JSON'
          {
            "items": [
              {
                "sourceFilename": "1000024869.png",
                "outputPath": "assets/images/backgrounds/bank-okachimachi-landscape.jpg"
              },
              {
                "sourceFilename": "1000024870.png",
                "outputPath": "assets/images/backgrounds/bank-okachimachi-portrait.jpg"
              }
            ]
          }
          JSON
          python3 scripts/generate-assets-manifest.py --write
          node tools/test-bank-regression.mjs

      - name: Commit exact originals and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-bank-background-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[bank-bg-transfer-done] Use exact original bank backgrounds'
          git push
