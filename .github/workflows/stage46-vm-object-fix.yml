name: Stage46 VM Object Fix

on:
  push:
    branches: [protect-stage46]
    paths:
      - '.github/workflows/stage46-vm-object-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: protect-stage46
          fetch-depth: 1
      - name: Replace cross-realm object assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/test-emerald-captain-kebab-meal-regression.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  assert.deepEqual(ctx.state.daily.meals[0], { id: 'kebab', name: 'ケバブ', price: 1200, recovery: 3 });"
          new = "  assert.equal(ctx.state.daily.meals[0].id, 'kebab');\n  assert.equal(ctx.state.daily.meals[0].name, 'ケバブ');\n  assert.equal(ctx.state.daily.meals[0].price, 1200);\n  assert.equal(ctx.state.daily.meals[0].recovery, 3);"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run lightweight stage46 checker
        run: |
          set +e
          python3 scripts/check-emerald-captain-kebab-meal-regression.py > stage46-vm-fix-result.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> stage46-vm-fix-result.txt
          set -e
      - name: Commit fix, result, and remove one-shot workflow
        run: |
          git rm .github/workflows/stage46-vm-object-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/test-emerald-captain-kebab-meal-regression.mjs stage46-vm-fix-result.txt
          git commit -m '第46段階 VM跨ぎの食事履歴比較を修正'
          git push origin HEAD:protect-stage46
