name: inspect phase14 jewelry shop trade
on:
  push:
    branches:
      - phase14-jewelry-shop-trade-regression-v0.10.903
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract current jewelry shop trade implementation
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('js/app.js').read_text(encoding='utf-8')
          starts = list(re.finditer(r'(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(', text))
          by = {m.group(1):(i,m) for i,m in enumerate(starts)}
          for name in ['createJewelryShopStock','beginJewelryShopTrade','confirmJewelryShopTrade']:
            i,m = by[name]
            end = starts[i+1].start() if i+1 < len(starts) else len(text)
            print(f'\n=== {name} ===')
            print(text[m.start():end].rstrip())
          print('\n=== EXISTING CHECK REFERENCES ===')
          files = list(Path('scripts').glob('*.py')) + list(Path('tools').glob('*'))
          for name in ['confirmJewelryShopTrade','beginJewelryShopTrade','createJewelryShopStock']:
            refs=[]
            for p in files:
              if not p.is_file(): continue
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              if name in s: refs.append(str(p))
            print(name, refs or ['NONE'])
          PY
