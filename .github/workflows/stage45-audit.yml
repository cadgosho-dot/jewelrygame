name: Stage45 Audit

on:
  push:
    branches: [protect-stage45]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect stage45 candidate bodies
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path('js/app.js').read_text(encoding='utf-8')
          names = [
            'maybeTriggerRobberyEvent',
            'startEmeraldCaptainKebabMeal',
            'finishEmeraldCaptainKebabMeal',
            'receiveYowamushiRoseQuartzReward',
          ]
          pat = re.compile(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(')
          def body_for(m):
              i = src.find('{', m.end())
              if i < 0: return ''
              depth = 0; j = i; quote = None; esc = False
              while j < len(src):
                  c = src[j]
                  if quote:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == quote: quote = None
                  else:
                      if c in ('\"', "'", '`'): quote = c
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              j += 1; break
                  j += 1
              return src[m.start():j]
          matches = {m.group(1): m for m in pat.finditer(src)}
          for name in names:
              m = matches.get(name)
              print(f'\n===== {name} =====')
              if not m:
                  print('NOT FOUND')
                  continue
              print(body_for(m))
          PY
