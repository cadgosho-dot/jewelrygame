name: 母親・執事イベント安全ブランチ同期

on:
  push:
    branches:
      - feature/wolf-mother-butler-event-safe
    paths:
      - '.github/workflows/wmb-safe-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: feature/wolf-mother-butler-event-safe
          fetch-depth: 0

      - name: 現行VERSIONへイベント参照を同期
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          for rel in ('js/event-bootstrap.js', 'js/wolf-mother-butler-event.js'):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              import re
              text = re.sub(r'(?P<prefix>\.\/[^\'\"]+\.js\?v=)0\.10\.\d+', lambda m: m.group('prefix') + version, text)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/wmb-safe-sync.yml

      - name: 同期内容をコミット
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/event-bootstrap.js js/wolf-mother-butler-event.js .github/workflows/wmb-safe-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m '母親・執事イベント参照を現行VERSIONへ同期'
          git push origin HEAD:feature/wolf-mother-butler-event-safe
