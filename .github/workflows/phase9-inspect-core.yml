name: phase9 inspect core
on:
  push:
    branches: [phase9-protect-core-v010898]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: List app function definitions
        run: |
          echo '=== FUNCTION DEFINITIONS ==='
          grep -nE '^[[:space:]]*(async[[:space:]]+)?function[[:space:]]+[A-Za-z0-9_]+' js/app.js || true
          echo '=== MONEY / INVENTORY / TIME CANDIDATES ==='
          grep -nE 'function[[:space:]]+(buy|sell|purchase|pay|eat|sleep|mine|collect|repair|use|hire|fire|open|close|start|finish|advance|.*Order|.*Customer|.*Shop|.*Store|.*Inventory)[A-Za-z0-9_]*' js/app.js || true
