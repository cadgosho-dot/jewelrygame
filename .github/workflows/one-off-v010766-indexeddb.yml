name: One-off v0.10.766 IndexedDB migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-off-v010766-indexeddb.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-off-v010766-indexeddb
  cancel-in-progress: false

jobs:
  migrate-device-save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 最新mainを取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: IndexedDB端末セーブを実装
        run: python3 scripts/.apply-v010766-indexeddb.py

      - name: VERSIONを0.10.766へ同期
        run: python3 scripts/version-sync.py --set 0.10.766

      - name: 変更対象を限定確認
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'VERSION',
              'auth-cache-recovery.js',
              'game.html',
              'hosting-origin-guard.js',
              'index.html',
              'js/app.js',
              'js/firebase-service.js',
              'js/game-data.js',
              'js/local-save-storage.js',
              'js/memories-screen.js',
              'scripts/check-current.py',
              'scripts/check-indexeddb-save-policy.py',
              'sw.js',
          }
          tracked = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          changed = set(filter(None, tracked + untracked))
          if changed != expected:
              raise SystemExit(f'想定外の変更ファイルです。changed={sorted(changed)} expected={sorted(expected)}')
          print('変更対象確認: PASS')
          PY

      - name: IndexedDB専用検査
        run: python3 scripts/check-indexeddb-save-policy.py

      - name: 画像検査用ライブラリを準備
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: 全自動検査
        run: python3 -u scripts/check-current.py

      - name: JavaScript構文検査
        run: |
          node --check js/local-save-storage.js
          node --check js/app.js
          node --check js/firebase-service.js

      - name: 検査通過後だけmainへコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION auth-cache-recovery.js game.html hosting-origin-guard.js index.html js/app.js js/firebase-service.js js/game-data.js js/local-save-storage.js js/memories-screen.js scripts/check-current.py scripts/check-indexeddb-save-policy.py sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Migrate device saves to IndexedDB"
          git pull --rebase origin main
          git push origin HEAD:main
