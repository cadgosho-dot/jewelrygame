name: stage37-inspect
on:
  push:
    branches: [refactor-stage37-inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect stage37 candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('js/app.js').read_text(encoding='utf-8')
          names = ['storeDisplayName','artisanTitle','looseDisplayLabel']
          for name in names:
              refs = text.count(name + '(')
              print(f'=== {name} refs={refs} ===')
              m = re.search(rf'function\s+{re.escape(name)}\s*\([^)]*\)\s*\{{', text)
              if not m:
                  print('definition: NOT FOUND')
                  continue
              depth = 0
              end = None
              for i in range(m.end()-1, len(text)):
                  ch = text[i]
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              start_line = text[:m.start()].count('\n') + 1
              print(f'line={start_line}')
              print(text[m.start():end])
              print('--- call lines ---')
              for line_no, line in enumerate(text.splitlines(), 1):
                  if name + '(' in line:
                      print(f'{line_no}: {line.strip()}')
              print()
          PY
