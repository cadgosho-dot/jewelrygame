name: 3Dメガネ横画面確認レイアウト修正

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-3d-glasses-landscape-spacing-fix.yml'

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested landscape fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('preview/3d-glasses-event-layout.html')
          s = p.read_text(encoding='utf-8')
          marker = "@media (orientation:portrait),(max-aspect-ratio:1/1){"
          if marker not in s:
              raise SystemExit('portrait media marker not found')
          css = """@media (orientation:landscape) and (min-aspect-ratio:1/1){
            .dialogue-layout{display:block!important}
            .dialogue-character{position:absolute!important;left:50%!important;right:auto!important;top:max(24px,var(--safe-top))!important;bottom:-8px!important;width:min(92vw,760px)!important;min-height:0!important;transform:translateX(-50%)!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;overflow:visible!important;padding-bottom:0!important;z-index:2!important}
            .dialogue-character img{width:auto!important;max-width:70vw!important;max-height:88dvh!important;object-position:center top!important}
            .dialogue-panel{position:absolute!important;left:7px!important;right:7px!important;bottom:max(10px,calc(var(--safe-bottom) + 6px))!important;width:auto!important;margin:0!important;z-index:3!important}
            .question-panel .answers{margin-top:10px!important}
          }
          """
          if '@media (orientation:landscape) and (min-aspect-ratio:1/1){' in s:
              raise SystemExit('landscape fix already present')
          s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify requested behavior only
        shell: bash
        run: |
          grep -Fq "max-height:88dvh!important" preview/3d-glasses-event-layout.html
          grep -Fq ".question-panel .answers{margin-top:10px!important}" preview/3d-glasses-event-layout.html
          grep -Fq "top:max(24px,var(--safe-top))!important" preview/3d-glasses-event-layout.html
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/preview-3d-glasses-landscape-spacing-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/3d-glasses-event-layout.html .github/workflows/preview-3d-glasses-landscape-spacing-fix.yml
          git commit -m '3Dメガネ横画面の人物サイズとクイズ余白を修正'
          git push
