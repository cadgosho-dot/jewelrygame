name: 母親・執事イベント 総合検査逐次診断

on:
  push:
    branches:
      - feature/wolf-mother-butler-event-safe

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/wolf-mother-butler-event-safe
          fetch-depth: 0

      - name: 検査環境を準備
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: 総合検査を1本ずつ実行
        env:
          JXJ_CHECK_WORKERS: '1'
        run: python3 -u scripts/check-current.py
