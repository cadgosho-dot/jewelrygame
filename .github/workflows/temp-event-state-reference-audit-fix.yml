name: Temporary event state reference audit fix

on:
  push:
    branches:
      - fix/event-state-reference-audit-20260914

permissions:
  contents: write

jobs:
  patch-event-state-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal event state reference fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          app_path = root / 'js/app.js'
          app = app_path.read_text(encoding='utf-8')

          def function_section(source, name):
              match = re.search(rf'(?m)^function {re.escape(name)}\(\) \{{', source)
              if not match:
                  raise SystemExit(f'{name}: function not found')
              following = re.search(r'(?m)^(?:async\s+)?function ', source[match.end():])
              end = match.end() + following.start() if following else len(source)
              return match.start(), end, source[match.start():end]

          def replace_section(source, name, old_parts, new_parts):
              start, end, section = function_section(source, name)
              for old, new in zip(old_parts, new_parts):
                  if section.count(old) != 1:
                      raise SystemExit(f'{name}: expected one occurrence for patch target: {old!r}')
                  section = section.replace(old, new, 1)
              return source[:start] + section + source[end:]

          app = replace_section(
              app,
              'alienAbductionEventState',
              [
                  '  state.events.alienAbductionEvent = {',
                  "  };\n  return state.events.alienAbductionEvent;",
              ],
              [
                  '  const next = {',
                  "  };\n  Object.assign(saved, next);\n  state.events.alienAbductionEvent = saved;\n  return saved;",
              ],
          )

          app = replace_section(
              app,
              'emeraldCaptainKebabEventState',
              [
                  '  state.events.emeraldCaptainKebabEvent = {',
                  "  };\n  if (!state.events.emeraldCaptainKebabEvent.active && !['idle', 'completed'].includes(state.events.emeraldCaptainKebabEvent.stage)) {\n    state.events.emeraldCaptainKebabEvent.stage = 'completed';\n  }\n  return state.events.emeraldCaptainKebabEvent;",
              ],
              [
                  '  const next = {',
                  "  };\n  Object.assign(saved, next);\n  state.events.emeraldCaptainKebabEvent = saved;\n  if (!saved.active && !['idle', 'completed'].includes(saved.stage)) {\n    saved.stage = 'completed';\n  }\n  return saved;",
              ],
          )

          app_path.write_text(app, encoding='utf-8')

          guard = r'''#!/usr/bin/env python3
          """Regression guard for event-state object identity where callers retain references."""
          from pathlib import Path
          import re
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          APP = (ROOT / 'js/app.js').read_text(encoding='utf-8')

          def section(name: str) -> str:
              match = re.search(r'(?m)^(?:async\s+)?function ' + re.escape(name) + r'\([^\n]*\) \{', APP)
              if not match:
                  raise AssertionError(f'{name}: declaration not found')
              following = re.search(r'(?m)^(?:async\s+)?function ', APP[match.end():])
              end = match.end() + following.start() if following else len(APP)
              return APP[match.start():end]

          checks = {}
          for function_name, event_key in [
              ('alienAbductionEventState', 'alienAbductionEvent'),
              ('emeraldCaptainKebabEventState', 'emeraldCaptainKebabEvent'),
          ]:
              body = section(function_name)
              checks[f'{function_name}: normalized through next object'] = 'const next = {' in body
              checks[f'{function_name}: existing object updated in place'] = 'Object.assign(saved, next);' in body
              checks[f'{function_name}: saved reference restored'] = f'state.events.{event_key} = saved;' in body
              checks[f'{function_name}: same reference returned'] = 'return saved;' in body
              checks[f'{function_name}: replacement assignment removed'] = f'state.events.{event_key} = {{' not in body

          alien_complete = section('completeAlienReturnEvent')
          checks['alien return grants chip through nested state accessor'] = 'grantAlienBodyChip();' in alien_complete
          checks['alien return completes retained reference after grant'] = (
              alien_complete.index('grantAlienBodyChip();') < alien_complete.index("eventState.active = false;")
              and alien_complete.index('grantAlienBodyChip();') < alien_complete.index("eventState.stage = 'completed';")
          )

          emerald_advance = section('advanceEmeraldCaptainKebabEvent')
          checks['emerald purchase uses nested state accessor before retained stage write'] = (
              'applyEmeraldCaptainKebabPurchase()' in emerald_advance
              and emerald_advance.index('applyEmeraldCaptainKebabPurchase()') < emerald_advance.index("eventState.stage = 'purchaseResult';")
          )
          emerald_meal = section('startEmeraldCaptainKebabMeal')
          checks['emerald meal retains event reference across preload await'] = (
              'const eventState = emeraldCaptainKebabEventState();' in emerald_meal
              and 'await preloadEmeraldCaptainMealAssets();' in emerald_meal
              and 'eventState.mealPaid = true;' in emerald_meal
              and emerald_meal.index('await preloadEmeraldCaptainMealAssets();') < emerald_meal.index('eventState.mealPaid = true;')
          )

          for name, ok in checks.items():
              print(f"{'OK' if ok else 'NG'}: {name}")
          if not all(checks.values()):
              sys.exit('EVENT STATE REFERENCE AUDIT PROTECTION: FAIL')
          print('EVENT STATE REFERENCE AUDIT PROTECTION: PASS')
          '''
          # Dedent the heredoc-friendly indentation above.
          import textwrap
          guard_path = root / 'scripts/check-event-state-reference-audit-regression.py'
          guard_path.write_text(textwrap.dedent(guard), encoding='utf-8')

          current_path = root / 'scripts/check-current.py'
          current = current_path.read_text(encoding='utf-8')
          registration = "    ('イベント状態参照追加保護', [sys.executable, str(ROOT / 'scripts/check-event-state-reference-audit-regression.py')]),\n"
          if registration not in current:
              marker = "    ('映画館イベント状態参照保護', [sys.executable, str(ROOT / 'scripts/check-cinema-event-state-reference-regression.py')]),\n"
              if current.count(marker) != 1:
                  raise SystemExit('check-current.py: cinema state reference marker not found exactly once')
              current = current.replace(marker, marker + registration, 1)
              current_path.write_text(current, encoding='utf-8')
          PY

      - name: Run focused regression guard
        run: python scripts/check-event-state-reference-audit-regression.py

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js scripts/check-event-state-reference-audit-regression.py scripts/check-current.py
          if git diff --cached --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git commit -m "イベント状態参照切れを追加修正"
          git push origin HEAD
