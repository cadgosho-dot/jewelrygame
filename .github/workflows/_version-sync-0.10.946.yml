name: Temporary VERSION sync 0.10.946

on:
  push:
    branches:
      - chore/version-0.10.946-battle

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/version-0.10.946-battle
          fetch-depth: 0
      - name: Extend VERSION sync coverage for current event modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/version-sync.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    # main modules\n"
          addition = """    # standalone event module cache keys\n    Rule('js/memories-backgrounds.js', 'event-bootstrap.js import key', qparam(r'\\./event-bootstrap\\.js'), keep_prefix),\n    Rule('js/event-bootstrap.js', 'wolf-boy-ring-event.js import key', qparam(r'\\./wolf-boy-ring-event\\.js'), keep_prefix),\n    Rule('js/event-bootstrap.js', 'wolf-mother-butler-event.js import key', qparam(r'\\./wolf-mother-butler-event\\.js'), keep_prefix),\n    Rule('js/wolf-boy-ring-event.js', 'audio.js import key', qparam(r'\\./audio\\.js'), keep_prefix),\n    Rule('js/wolf-mother-butler-event.js', 'audio.js import key', qparam(r'\\./audio\\.js'), keep_prefix),\n\n"""
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('version-sync insertion anchor not found')
              text = text.replace(anchor, addition + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Set VERSION 0.10.946
        run: python3 scripts/version-sync.py --set 0.10.946
      - name: Verify VERSION sync
        run: python3 scripts/version-sync.py --check
      - name: Remove temporary workflow and commit synchronized VERSION
        run: |
          rm .github/workflows/_version-sync-0.10.946.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "VERSIONを0.10.946へ更新"
          git push origin HEAD:chore/version-0.10.946-battle
