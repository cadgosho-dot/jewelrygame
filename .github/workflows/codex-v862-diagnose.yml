name: codex v0.10.862 diagnose

on:
  push:
    branches:
      - codex/v0-10-862-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare safest candidate dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('js/app.js').read_text(encoding='utf-8')
          lines = text.splitlines()
          targets = [
              'validFinancePeriod',
              'mainStatusHeader',
              'installStatusText',
              'craftSurfaceParts',
              'craftSurfaceFinishId',
              'renderToolBrief',
          ]
          for name in targets:
              print(f'=== {name} ===')
              rx = re.compile(rf'\b{re.escape(name)}\b')
              hits = [i for i, line in enumerate(lines) if rx.search(line)]
              print(f'occurrences={len(hits)}')
              for hit in hits:
                  lo = max(0, hit - 5)
                  hi = min(len(lines), hit + 7)
                  print(f'--- context {lo+1}-{hi} ---')
                  for j in range(lo, hi):
                      print(f'{j+1:05d}: {lines[j]}')
              print()
          PY
