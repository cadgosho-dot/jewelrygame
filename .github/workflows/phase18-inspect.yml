name: Phase18 Inspect Core Candidates
on:
  push:
    branches: [phase18-inspect]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print exact outstanding payment signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('js/app.js').read_text(encoding='utf-8')
          for token in ['renderOutstandingPayments', 'outstandingPaymentTargets', 'applyOutstandingPayment']:
            print(f'===== {token} =====')
            pos=0
            while True:
              i=text.find(token,pos)
              if i<0: break
              line_start=text.rfind('\n',0,i)+1
              line_end=text.find('\n',i)
              if line_end<0: line_end=len(text)
              print(repr(text[line_start:line_end]))
              pos=i+len(token)
          PY
