name: Apply v0.10.774 metal fallback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v774-metal-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v774-metal-fallback
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 最新mainを取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: v0.10.774修正を適用
        run: python3 scripts/apply-v774-metal-fallback.py

      - name: 画像検査用ライブラリを準備
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: JavaScript構文検査
        run: |
          node --check js/app.js
          node --check js/game-data.js
          node --check js/firebase-service.js
          node --check sw.js

      - name: 地金最終相場フォールバック専用検査
        run: python3 scripts/check-metal-market-fallback.py

      - name: 現行ビルド回帰検査
        run: timeout 8m python3 -u scripts/check-current.py

      - name: バージョン確認
        run: |
          test "$(cat VERSION | tr -d '\r\n')" = "0.10.774"
          grep -q "0.10.774" js/game-data.js
          grep -q "0.10.774" js/app.js
          grep -q "0.10.774" sw.js

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "v0.10.774: Keep last valid metal prices tradeable"
          git pull --rebase origin main
          git push origin HEAD:main
