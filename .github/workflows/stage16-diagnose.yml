name: stage16-diagnose
on:
  push:
    branches:
      - jxj-stage16-diagnose-20260904
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect store branch label context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('js/app.js').read_text(encoding='utf-8')
          lines = app.splitlines()
          print('=== APP IMPORTS TOP 120 ===')
          print('\n'.join(f'{i+1}: {line}' for i,line in enumerate(lines[:120])))
          print('\n=== storeBranchLabel OCCURRENCES ===')
          for idx,line in enumerate(lines,1):
            if 'storeBranchLabel' in line:
              lo=max(1,idx-4); hi=min(len(lines),idx+5)
              print(f'--- around line {idx} ---')
              for j in range(lo,hi+1): print(f'{j}: {lines[j-1]}')
          for path, needles in [
            ('sw.js',['tool-brief.js','press-hold-controller.js']),
            ('scripts/version-sync.py',['tool-brief.js precache key','tool-brief.js import key','press-hold-controller.js precache key','press-hold-controller.js import key']),
            ('scripts/check-current.py',['check-tool-brief.py','工具説明UI','press-hold']),
            ('CHANGELOG.md',['v0.10.863','0.10.863'])
          ]:
            text=Path(path).read_text(encoding='utf-8').splitlines()
            print(f'\n=== {path} CONTEXT ===')
            seen=set()
            for idx,line in enumerate(text,1):
              if any(n in line for n in needles):
                lo=max(1,idx-4); hi=min(len(text),idx+6)
                key=(lo,hi)
                if key in seen: continue
                seen.add(key)
                print(f'--- around line {idx} ---')
                for j in range(lo,hi+1): print(f'{j}: {text[j-1]}')
          PY
