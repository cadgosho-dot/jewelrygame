name: Apply v0.10.769

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v769.yml'

permissions:
  contents: write

concurrency:
  group: jewelrygame-v769-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10

      - name: Rebase latest main
        run: git pull --rebase origin main

      - name: Apply v0.10.769
        run: python3 scripts/apply-v769.py

      - name: Validate
        run: |
          node --check js/app.js
          node --check js/game-data-core.js
          python3 scripts/check-long-term-history.py
          python3 scripts/check-current.py
          git diff --check

      - name: Commit implementation and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-v769.py .github/workflows/apply-v769.yml
          git add -A
          git commit -m "v0.10.769: Compress long-term save history"
          git pull --rebase origin main
          git push origin HEAD:main
