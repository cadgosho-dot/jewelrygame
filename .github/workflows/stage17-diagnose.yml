name: stage17-diagnose
on:
  push:
    branches:
      - jxj-stage17-v0.10.865
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: jxj-stage17-v0.10.865
      - name: Inspect clampViewportValue integration points
        run: |
          echo '=== VERSION ==='
          cat VERSION
          echo '=== clampViewportValue refs ==='
          grep -n "clampViewportValue" js/app.js || true
          echo '=== app imports ==='
          sed -n '1,90p' js/app.js
          echo '=== nearby helper function ==='
          sed -n '2318,2382p' js/app.js
          echo '=== sw helper entries ==='
          grep -n "tool-brief\|store-branch-label\|press-hold-controller" sw.js || true
          echo '=== version-sync helper entries ==='
          grep -n "tool-brief\|store-branch-label\|press-hold-controller" scripts/version-sync.py || true
          echo '=== check-current helper entries ==='
          grep -n "工具説明UI\|店舗番号表示ラベル\|数量長押し管理" scripts/check-current.py || true
          echo '=== changelog top ==='
          sed -n '1,28p' CHANGELOG.md
