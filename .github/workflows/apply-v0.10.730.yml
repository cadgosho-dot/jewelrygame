name: Apply v0.10.730 completion layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-v0.10.730]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.10.730 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files_for_version = [
              Path('game.html'),
              Path('index.html'),
              Path('auth.html'),
              Path('sw.js'),
              Path('js/game-data.js'),
              Path('js/app.js'),
          ]
          for path in files_for_version:
              text = path.read_text(encoding='utf-8')
              if '0.10.729' not in text:
                  raise SystemExit(f'Expected v0.10.729 marker not found in {path}')
              path.write_text(text.replace('0.10.729', '0.10.730'), encoding='utf-8')

          game = Path('game.html')
          text = game.read_text(encoding='utf-8')
          old = '''      body[data-screen="completion"] .result-card > .completion-jewelry-preview {
                box-sizing: border-box !important;
                display: flex !important;
                align-items: flex-start !important;
                justify-content: center !important;
                width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                margin-top: 0 !important;
                padding: 132px 0 6px !important;
                overflow: hidden !important;
              }
              body[data-screen="completion"] .completion-jewelry-artwork {
                margin: 0 !important;
                transform: none !important;
              }
          '''
          new = '''      body[data-screen="completion"] .result-card > .completion-jewelry-preview {
                box-sizing: border-box !important;
                display: flex !important;
                align-items: flex-start !important;
                justify-content: center !important;
                width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                margin: 0 0 4px !important;
                padding: 0 !important;
                overflow: visible !important;
              }
              body[data-screen="completion"] .completion-jewelry-artwork {
                margin: 0 !important;
                transform: none !important;
              }
              body[data-screen="completion"] .result-card > h1 {
                margin: 0.2rem 0 0.6rem !important;
              }
          '''
          if old not in text:
              raise SystemExit('game.html completion block did not match expected v0.10.729 state')
          game.write_text(text.replace(old, new, 1), encoding='utf-8')

          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          old_primary = '''@media (orientation:portrait) and (max-width:820px){
            body[data-screen="completion"] .result-card>.completion-jewelry-preview{box-sizing:border-box!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;width:100%!important;height:auto!important;min-height:0!important;margin-top:0!important;padding:132px 0 6px!important;overflow:hidden!important}
            body[data-screen="completion"] .completion-jewelry-artwork{margin:0!important;transform:none!important}
          }
          '''
          new_primary = '''@media (orientation:portrait) and (max-width:820px){
            body[data-screen="completion"] .result-card>.completion-jewelry-preview{box-sizing:border-box!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;width:100%!important;height:auto!important;min-height:0!important;margin:0 0 4px!important;padding:0!important;overflow:visible!important}
            body[data-screen="completion"] .completion-jewelry-artwork{margin:0!important;transform:none!important}
            body[data-screen="completion"] .result-card>h1{margin:.2rem 0 .6rem!important}
          }
          '''
          if old_primary not in text:
              raise SystemExit('styles.css primary completion block did not match expected v0.10.729 state')
          text = text.replace(old_primary, new_primary, 1)

          old_late = '''/* v0.10.725 store safe spacing / v0.10.729 completion position + compact spacing */
          @media (orientation:portrait) and (max-width:820px){
            body[data-screen="completion"] .result-card>.completion-jewelry-preview{
              height:auto!important;
              min-height:0!important;
              padding:132px 0 6px!important;
            }
            body[data-screen="store"] .store-panel,
            body[data-screen="inventory"] .wide-panel,
            body[data-screen="showcaseSelect"] .showcase-selection-panel,
            body[data-screen="showcaseDetail"] .showcase-detail-panel{
              margin-top:28px!important;
            }
          }
          '''
          new_late = '''/* v0.10.725 store safe spacing / v0.10.730 completion top alignment + compact spacing */
          @media (orientation:portrait) and (max-width:820px){
            body[data-screen="completion"] .result-card>.completion-jewelry-preview{
              height:auto!important;
              min-height:0!important;
              padding:0 0 4px!important;
              overflow:visible!important;
            }
            body[data-screen="completion"] .result-card>h1{
              margin:.2rem 0 .6rem!important;
            }
            body[data-screen="store"] .store-panel,
            body[data-screen="inventory"] .wide-panel,
            body[data-screen="showcaseSelect"] .showcase-selection-panel,
            body[data-screen="showcaseDetail"] .showcase-detail-panel{
              margin-top:28px!important;
            }
          }
          '''
          if old_late not in text:
              raise SystemExit('styles.css late completion block did not match expected v0.10.729 state')
          css.write_text(text.replace(old_late, new_late, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/apply-v0.10.730.yml

          git diff --check
          grep -F "export const VERSION = '0.10.730';" js/game-data.js
          grep -F "const UI_BUILD_VERSION = '0.10.730';" js/app.js
          grep -F "const VERSION = '0.10.730';" sw.js
          grep -F "padding: 0 !important;" game.html
          grep -F "overflow: visible !important;" game.html
          grep -F 'padding:0 0 4px!important;' styles.css

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html index.html auth.html sw.js styles.css js/game-data.js js/app.js .github/workflows/apply-v0.10.730.yml
          git commit -m "v0.10.730 完成品イラスト上詰め・切れ防止"
          git push origin HEAD:main
