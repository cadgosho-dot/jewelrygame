<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JEWELRY×JEWELRY 3Dメガネイベント 携帯確認</title>
<style>
:root{--safe-top:max(8px,env(safe-area-inset-top));--safe-right:max(8px,env(safe-area-inset-right));--safe-bottom:max(8px,env(safe-area-inset-bottom));--safe-left:max(8px,env(safe-area-inset-left));--gold:#ffe5a0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
body{background:radial-gradient(circle at 50% 18%,rgba(60,88,145,.28),transparent 30%),radial-gradient(circle at 20% 70%,rgba(114,52,106,.22),transparent 30%),linear-gradient(180deg,#090b15,#06070b 62%,#120d0d)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 12% 18%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 76% 12%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 88% 48%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 32% 38%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 62% 72%,#fff 0 1px,transparent 1.4px);opacity:.55}
#root,.event-shell,.screen-content{position:absolute;inset:0;overflow:hidden}.jxj-quiz-loose-v2{position:absolute;inset:0;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;isolation:isolate;color:#fff;text-shadow:0 2px 6px #000,0 0 12px rgba(0,0,0,.92)}
.jxj-quiz-character-area-v2{min-width:0;min-height:0;overflow:hidden;pointer-events:none}.jxj-quiz-character-v2{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom;user-select:none;pointer-events:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.58))}
.jxj-quiz-dialogue-panel-v2,.jxj-quiz-question-panel-v2{border:1.25px solid rgba(255,255,255,.62);border-radius:14px;background:rgba(14,12,15,.48);box-shadow:0 9px 30px rgba(0,0,0,.28);backdrop-filter:blur(4px)}
.jxj-quiz-name-v2{display:block;color:var(--gold);font-size:.76rem;font-weight:900;margin-bottom:5px}.jxj-quiz-dialogue-panel-v2>strong{display:block;font-size:clamp(1rem,4.4vw,1.42rem);line-height:1.45}.jxj-quiz-tap-v2{display:block;margin-top:7px;font-size:.68rem;font-weight:800;text-align:right;opacity:.82}
.jxj-quiz-kicker-v2{display:inline-flex;padding:.18rem .5rem;border:1px solid rgba(255,229,160,.5);border-radius:999px;color:var(--gold);font-size:.68rem;font-weight:900}.jxj-quiz-question-panel-v2{display:flex;flex-direction:column;gap:5px;padding:8px}.jxj-quiz-question-panel-v2 h2{margin:5px 0 7px;font-size:clamp(.86rem,4.1vw,1.02rem);line-height:1.28}.jxj-quiz-answer-grid-v2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;margin-top:auto}.jxj-quiz-answer-v2{min-width:0;min-height:48px;display:grid;grid-template-columns:1.65rem minmax(0,1fr);align-items:center;gap:.38rem;padding:.36rem .44rem;border:1.25px solid rgba(232,191,104,.42);border-radius:9px;background:rgba(26,19,13,.86);color:#fff;text-align:left}.jxj-quiz-answer-v2>span{display:grid;place-items:center;width:1.65rem;height:1.65rem;border:1px solid rgba(255,255,255,.55);border-radius:50%;font-weight:1000}.jxj-quiz-answer-v2 strong{font-size:clamp(.68rem,3.2vw,.84rem);line-height:1.24;overflow-wrap:anywhere}
@media (orientation:portrait),(max-aspect-ratio:1/1){.jxj-quiz-stage-dialogue-v2{display:grid!important;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) auto!important;gap:4px!important;padding:max(4px,var(--safe-top)) 6px max(8px,var(--safe-bottom))!important}.jxj-quiz-stage-dialogue-v2>.jxj-quiz-character-area-v2{position:relative!important;grid-row:1!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;min-height:0!important;overflow:hidden!important}.jxj-quiz-stage-dialogue-v2 .jxj-quiz-character-v2{position:relative!important;max-width:min(92vw,430px)!important;max-height:min(66dvh,760px)!important;margin:0 auto!important;object-fit:contain!important;object-position:center bottom!important}.jxj-quiz-stage-dialogue-v2>.jxj-quiz-dialogue-panel-v2{position:relative!important;grid-row:2!important;width:auto!important;max-height:30dvh!important;margin:0!important;overflow-y:auto!important;z-index:20!important;padding:12px 14px!important}.jxj-quiz-stage-question-v2{display:grid!important;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,42%) minmax(0,58%)!important;gap:5px!important;padding:max(4px,var(--safe-top)) 6px max(8px,var(--safe-bottom))!important}.jxj-quiz-stage-question-v2>.jxj-quiz-character-area-v2{position:relative!important;grid-row:1!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;min-height:0!important;overflow:hidden!important}.jxj-quiz-stage-question-v2 .jxj-quiz-character-v2{position:relative!important;max-width:min(78vw,390px)!important;max-height:100%!important;margin:0 auto!important;object-fit:contain!important;object-position:center bottom!important}.jxj-quiz-stage-question-v2>.jxj-quiz-question-panel-v2{position:relative!important;grid-row:2!important;align-self:stretch!important;max-height:100%!important;margin:0!important;overflow-y:auto!important;z-index:20!important}}
@media (orientation:landscape),(min-aspect-ratio:1/1){.jxj-quiz-stage-dialogue-v2{display:block!important;padding:0!important}.jxj-quiz-stage-dialogue-v2>.jxj-quiz-character-area-v2{position:absolute!important;inset:max(4px,var(--safe-top)) 0 clamp(112px,24dvh,160px) 0!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;overflow:hidden!important;z-index:1!important}.jxj-quiz-stage-dialogue-v2 .jxj-quiz-character-v2{position:relative!important;max-width:min(48vw,560px)!important;max-height:100%!important;margin:0 auto!important;object-fit:contain!important;object-position:center top!important}.jxj-quiz-stage-dialogue-v2>.jxj-quiz-dialogue-panel-v2{position:absolute!important;left:12px!important;right:12px!important;bottom:max(6px,var(--safe-bottom))!important;top:auto!important;max-height:min(27dvh,150px)!important;margin:0!important;overflow-y:auto!important;z-index:20!important;padding:9px 12px!important}.jxj-quiz-stage-question-v2{display:grid!important;grid-template-columns:minmax(0,40%) minmax(0,60%)!important;grid-template-rows:minmax(0,1fr)!important;gap:8px!important;padding:max(4px,var(--safe-top)) max(8px,var(--safe-right)) max(4px,var(--safe-bottom)) max(8px,var(--safe-left))!important}.jxj-quiz-stage-question-v2>.jxj-quiz-character-area-v2{position:relative!important;grid-column:1!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;min-height:0!important;overflow:hidden!important}.jxj-quiz-stage-question-v2 .jxj-quiz-character-v2{position:relative!important;max-width:100%!important;max-height:100%!important;margin:0 auto!important;object-fit:contain!important;object-position:center top!important}.jxj-quiz-stage-question-v2>.jxj-quiz-question-panel-v2{position:relative!important;grid-column:2!important;align-self:stretch!important;max-height:100%!important;margin:0!important;overflow-y:auto!important;z-index:20!important}.jxj-quiz-question-panel-v2 h2{font-size:clamp(.78rem,2.6vh,.94rem)!important}.jxj-quiz-answer-v2{min-height:44px!important;padding:.32rem .42rem!important}}
.preview-controls{position:fixed;right:max(8px,var(--safe-right));top:max(8px,var(--safe-top));z-index:9999;display:flex;gap:5px;padding:5px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(0,0,0,.72)}.preview-controls button{border:1px solid rgba(255,229,160,.48);border-radius:7px;padding:6px 9px;background:#241b15;color:#fff;font-weight:800;font-size:12px}.preview-controls button.active{background:#c6973d;color:#17100a}.preview-badge{position:fixed;left:max(8px,var(--safe-left));top:max(8px,var(--safe-top));z-index:9998;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.68);font-size:11px;color:#ddd;pointer-events:none}@media(max-width:520px) and (orientation:portrait){.preview-badge{top:52px}}
</style>
</head>
<body data-screen="looseShopOriginalQuizEvent">
<div id="root"><div class="event-shell"><div class="screen-content"><section id="eventStage" class="jxj-quiz-loose-v2 jxj-quiz-stage-dialogue-v2">
<div class="jxj-quiz-character-area-v2">
<svg class="jxj-quiz-character-v2" viewBox="0 0 720 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3Dメガネの男 位置確認用"><defs><linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#45382d"/><stop offset="1" stop-color="#18130f"/></linearGradient></defs><ellipse cx="360" cy="232" rx="132" ry="154" fill="#d7b38f"/><path d="M226 228c8-117 59-176 136-176 80 0 132 58 136 176-42-38-88-57-136-57-50 0-96 19-136 57z" fill="#241d18"/><rect x="215" y="217" width="132" height="72" rx="28" fill="#202833" stroke="#ec4a4a" stroke-width="12"/><rect x="373" y="217" width="132" height="72" rx="28" fill="#202833" stroke="#4ca7f0" stroke-width="12"/><rect x="347" y="242" width="26" height="16" rx="8" fill="#222"/><circle cx="286" cy="251" r="15" fill="#f9e0bc"/><circle cx="436" cy="251" r="15" fill="#f9e0bc"/><path d="M311 331c31 24 68 24 99 0" fill="none" stroke="#774e3d" stroke-width="12" stroke-linecap="round"/><path d="M150 1090c15-355 72-578 210-641 144 64 197 292 210 641z" fill="url(#coat)"/><path d="M257 495l103 190 106-190" fill="#ece5d7" opacity=".93"/><path d="M329 603h65l18 236-52 67-52-67z" fill="#742927"/></svg>
</div>
<div id="dialoguePanel" class="jxj-quiz-dialogue-panel-v2"><span class="jxj-quiz-name-v2">3Dメガネの男</span><strong>「ちょっと面白いクイズがあるんだけど、付き合わない？」</strong><span class="jxj-quiz-tap-v2">タップして進む</span></div>
<div id="questionPanel" class="jxj-quiz-question-panel-v2" hidden><span class="jxj-quiz-kicker-v2">QUIZ</span><h2>宝石についての問題。正しい答えはどれ？</h2><div class="jxj-quiz-answer-grid-v2"><button class="jxj-quiz-answer-v2"><span>A</span><strong>ダイヤモンド</strong></button><button class="jxj-quiz-answer-v2"><span>B</span><strong>エメラルド</strong></button><button class="jxj-quiz-answer-v2"><span>C</span><strong>ルビー</strong></button><button class="jxj-quiz-answer-v2"><span>D</span><strong>サファイア</strong></button></div></div>
</section></div></div></div>
<div class="preview-badge" id="badge">携帯確認用｜本体・セーブ未接続</div><div class="preview-controls"><button id="dialogueBtn" class="active" type="button">会話</button><button id="quizBtn" type="button">4択</button></div>
<script>(()=>{const s=document.getElementById('eventStage'),d=document.getElementById('dialoguePanel'),q=document.getElementById('questionPanel'),db=document.getElementById('dialogueBtn'),qb=document.getElementById('quizBtn'),b=document.getElementById('badge');function dialogue(){s.className='jxj-quiz-loose-v2 jxj-quiz-stage-dialogue-v2';d.hidden=false;q.hidden=true;db.classList.add('active');qb.classList.remove('active')}function quiz(){s.className='jxj-quiz-loose-v2 jxj-quiz-stage-question-v2';d.hidden=true;q.hidden=false;qb.classList.add('active');db.classList.remove('active')}function badge(){b.textContent='携帯確認用｜'+(innerWidth>innerHeight?'横画面':'縦画面')+'｜本体・セーブ未接続'}db.addEventListener('click',dialogue);qb.addEventListener('click',quiz);addEventListener('resize',badge);addEventListener('orientationchange',badge);badge()})();</script>
</body></html>
