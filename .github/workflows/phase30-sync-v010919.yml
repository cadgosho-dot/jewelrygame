name: Phase30 Formal Sync v0.10.919

on:
  push:
    branches: [main, phase30-kaitenzushi-protection]
    paths:
      - '.github/workflows/phase30-sync-v010919.yml'
      - 'tools/test-kaitenzushi-regression.mjs'
      - 'scripts/check-kaitenzushi-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'phase30-kaitenzushi-protection'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate kaitenzushi protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-kaitenzushi-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.918'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('通常食事処理保護', [sys.executable, str(ROOT / 'scripts/check-manual-meal-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-kaitenzushi-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('回転寿司開始・会計処理保護', [sys.executable, str(ROOT / 'scripts/check-kaitenzushi-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.919\n- 中核処理保護・第30段階：回転寿司 startKaitenzushi() / completeKaitenzushi() と親画面・iframe会計連携の現行挙動を動的回帰テストと静的検査で固定。\n- 皿数・金額照合、予算と所持金の再確認、二重会計防止、0皿退出、無料大将イベント復帰、食事時間・空腹・履歴・保存を検証。\n- ゲーム処理・仕様・価格・イベント・画像・音声・セーブ形式の変更なし。\n'
          assert '## v0.10.919' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-kaitenzushi-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.918', '?v=0.10.919').replace("const UI_BUILD_VERSION = '0.10.918';", "const UI_BUILD_VERSION = '0.10.919';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase30-sync-v010919.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.919 第30段階正式同期'
          git push origin HEAD:main
