name: Phase25 Inspect Staff Operations

on:
  push:
    branches:
      - phase25-staff-operations-regression-v0.10.914
    paths:
      - tmp/phase25-inspect-trigger.txt

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase25-staff-operations-regression-v0.10.914
          fetch-depth: 1
      - name: Extract current staff operations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          out = []

          def line_no(pos):
              return text.count('\n', 0, pos) + 1

          def extract_function(name):
              marker = f'function {name}('
              start = text.find(marker)
              if start < 0:
                  out.append(f'FUNCTION {name}: NOT FOUND')
                  return
              brace = text.find('{', start)
              depth = 0
              quote = None
              esc = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in "'\"`":
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  i += 1
              else:
                  end = len(text)
              out.append(f'===== FUNCTION {name} line {line_no(start)} =====')
              out.append(text[start:end])

          def extract_case(label):
              pattern = re.compile(rf"^(?P<indent>\s*)case ['\"]{re.escape(label)}['\"]:\s*$", re.M)
              m = pattern.search(text)
              if not m:
                  out.append(f'CASE {label}: NOT FOUND')
                  return
              indent = m.group('indent')
              next_case = re.compile(rf"^{re.escape(indent)}(?:case\b|default\s*:)", re.M)
              n = next_case.search(text, m.end())
              end = n.start() if n else min(len(text), m.end() + 12000)
              out.append(f'===== CASE {label} line {line_no(m.start())} =====')
              out.append(text[m.start():end].rstrip())

          extract_function('workshopStaffCraftOne')
          for label in [
              'hire-workshop-staff',
              'hire-employee',
              'toggle-workshop-staff-working',
              'toggle-store-staff-working',
              'toggle-employee-working',
              'toggle-workshop-staff',
          ]:
              extract_case(label)

          out.append('===== STAFF-RELATED CASE LABELS =====')
          for idx, line in enumerate(lines, 1):
              if re.search(r"case ['\"][^'\"]*(?:staff|employee)[^'\"]*['\"]:", line, re.I):
                  out.append(f'{idx}: {line.strip()}')

          out.append('===== STAFF WORKING MUTATION CONTEXTS =====')
          for idx, line in enumerate(lines, 1):
              low = line.lower()
              if ('working' in low and ('employee' in low or 'workshopstaff' in low or 'workshop staff' in low)):
                  lo = max(1, idx - 4); hi = min(len(lines), idx + 4)
                  out.append(f'--- around line {idx} ---')
                  out.extend(f'{j}: {lines[j-1]}' for j in range(lo, hi + 1))

          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/phase25-inspect-output.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/phase25-inspect-output.txt
          git commit -m "tmp: 第25段階スタッフ処理を抽出" || exit 0
          git push origin HEAD:phase25-staff-operations-regression-v0.10.914
