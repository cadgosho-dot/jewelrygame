name: TEMP refresh event probability doc

on:
  push:
    branches:
      - fix/retro-battle-start-readiness-20260914

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: ブランチを取得
        uses: actions/checkout@v6
        with:
          ref: fix/retro-battle-start-readiness-20260914
          fetch-depth: 0

      - name: 確率資料を現行コードから再生成
        run: |
          test "$(cat VERSION)" = "0.10.948"
          python3 scripts/generate-event-probability-list.py --write
          python3 scripts/check-management-docs.py
          python3 scripts/check-retro-battle-frame-loader.py
          git diff --check

      - name: 一時ワークフローを除去して保存
        run: |
          rm -f .github/workflows/temp-refresh-event-probability-doc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EVENT_PROBABILITY_LIST.md .github/workflows/temp-refresh-event-probability-doc.yml
          git commit -m "イベント確率資料の行番号を同期"
          git push origin HEAD:fix/retro-battle-start-readiness-20260914
