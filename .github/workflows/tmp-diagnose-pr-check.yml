name: Temporary Diagnose PR Check

on:
  push:
    branches:
      - fix/wolf-mother-reward-stall

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/wolf-mother-reward-stall
          fetch-depth: 0

      - name: Prepare browser check environment
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Capture full validation failure
        run: |
          set +e
          JXJ_REQUIRE_BROWSER_SMOKE=1 timeout 8m python3 -u scripts/check-current.py > /tmp/pr-check.log 2>&1
          status=$?
          set -e
          {
            echo "exit_status=$status"
            echo "--- tail 350 ---"
            tail -n 350 /tmp/pr-check.log
          } > PR_CHECK_FAILURE.txt

      - name: Commit diagnostic output and remove temporary workflow
        run: |
          rm .github/workflows/tmp-diagnose-pr-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "診断: PR総合検査の失敗内容を記録"
          git push origin HEAD:fix/wolf-mother-reward-stall
