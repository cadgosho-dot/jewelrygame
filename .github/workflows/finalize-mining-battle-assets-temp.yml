name: finalize-mining-battle-assets

on:
  push:
    branches:
      - work/mining-battle-complete-20260921
    paths:
      - .github/workflows/finalize-mining-battle-assets-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mining-battle-complete-20260921
          fetch-depth: 1
      - name: Download approved transparent PNG assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/minigames/mining-battle
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/10c7a091-e143-4f78-b04a-2477b85cecec.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWNkYWU2MWZiYmE1NDM2MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA0NjExMX0.prcWkoAJ8qxS_uU-py4-oHZPekn3zUQbAuf_os34pMo' -o assets/minigames/mining-battle/mole.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/1e7c9eba-f0d5-4b8a-9f4d-4b723e58a842.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODkyZWExZjY5NzFlMDJkNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA0NjcxMH0.dS42x3IZQena96gZnGU9-ARiUVpTr-Yga_T8rI-Tu7A' -o assets/minigames/mining-battle/bat.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/441bd60c-2545-49bd-bd33-b3479580b8e0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWUzZjhlMDc4OGM1MmE2MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA4OTYwN30.YrPlHJP_zMB7L4leK4CLr1BiAB38VdxC36RlYpRB-EY' -o assets/minigames/mining-battle/pickaxe.png
      - name: Verify exact approved bytes
        shell: bash
        run: |
          set -euo pipefail
          echo 'ca3cdb17785999cc6e6fe53d6e28293926e7be12faeadbce633af1367ff5b85d  assets/minigames/mining-battle/mole.png' | sha256sum -c -
          echo '7e1556af88c6315d5c2b1362f0ab08ce18250a3e9ce0dbbf37c512270d475d6e  assets/minigames/mining-battle/bat.png' | sha256sum -c -
          echo '4e13e61fe41c0b6e77b2a6b2bae9a54f28232878429c0315b22d687097780d9c  assets/minigames/mining-battle/pickaxe.png' | sha256sum -c -
      - name: Finalize battle asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/minigames/retro-battle/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('background-image:url("../../images/equipment/basic-pickaxe.png")',
                        'background-image:url("../mining-battle/pickaxe.png")')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit approved assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/minigames/mining-battle/mole.png                   assets/minigames/mining-battle/bat.png                   assets/minigames/mining-battle/pickaxe.png                   assets/minigames/retro-battle/index.html
          git rm .github/workflows/finalize-mining-battle-assets-temp.yml
          git commit -m "採掘戦闘へ承認済み透明PNGを登録"
          git push origin HEAD:work/mining-battle-complete-20260921
