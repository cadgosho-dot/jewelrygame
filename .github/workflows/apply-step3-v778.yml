# trigger v0.10.778 retry
name: Apply step3 v0.10.778

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run step3 v0.10.778 retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply July/August mori soba image
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin step3-v778-assets:refs/remotes/origin/step3-v778-assets
          mkdir -p assets/images/foods
          {
            git show origin/step3-v778-assets:.github/v778-step3/soba-mori.part00.b64
            git show origin/step3-v778-assets:.github/v778-step3/soba-mori.part01.b64
            git show origin/step3-v778-assets:.github/v778-step3/soba-mori.part02.b64
          } | tr -d '\n\r ' | base64 -d > assets/images/foods/soba-mori-v778.webp
          echo 'aa7af9e20e66376d05ad1d27b0789010549093c6f9f32b6e6b8e3b9896f5d1f5  assets/images/foods/soba-mori-v778.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path

          version_files = [
              'VERSION','auth-cache-recovery.js','game.html','hosting-origin-guard.js','index.html',
              'js/app.js','js/firebase-service.js','js/game-data.js','js/memories-screen.js','sw.js'
          ]
          for rel in version_files:
              p = Path(rel)
              s = p.read_text()
              if '0.10.777' not in s and rel != 'VERSION':
                  raise SystemExit(f'expected 0.10.777 in {rel}')
              s = s.replace('0.10.777','0.10.778')
              p.write_text(s)

          app = Path('js/app.js')
          s = app.read_text()
          old = "  soba: './assets/images/foods/soba.png',\n  hamburger: './assets/images/foods/hamburger.png',\n"
          new = "  soba: './assets/images/foods/soba.png',\n  sobaMori: './assets/images/foods/soba-mori-v778.webp',\n  hamburger: './assets/images/foods/hamburger.png',\n"
          if s.count(old) != 1:
              raise SystemExit('soba image anchor mismatch')
          s = s.replace(old, new, 1)

          old_logic = """  if (mealId === 'convenience') {\n    const date = gameDateForDay(state?.game?.day || 1);\n    if (isValidGameDate(date) && date.getMonth() === 11 && (date.getDate() === 24 || date.getDate() === 25)) {\n      return versionedAsset(MEAL_FOOD_IMAGES.convenienceChristmas);\n    }\n  }\n  return versionedAsset(MEAL_FOOD_IMAGES[mealId] || '');\n"""
          new_logic = """  if (mealId === 'convenience') {\n    const date = gameDateForDay(state?.game?.day || 1);\n    if (isValidGameDate(date) && date.getMonth() === 11 && (date.getDate() === 24 || date.getDate() === 25)) {\n      return versionedAsset(MEAL_FOOD_IMAGES.convenienceChristmas);\n    }\n  }\n  if (mealId === 'soba') {\n    const date = gameDateForDay(state?.game?.day || 1);\n    if (isValidGameDate(date) && (date.getMonth() === 6 || date.getMonth() === 7)) {\n      return versionedAsset(MEAL_FOOD_IMAGES.sobaMori);\n    }\n  }\n  return versionedAsset(MEAL_FOOD_IMAGES[mealId] || '');\n"""
          if s.count(old_logic) != 1:
              raise SystemExit('mealFoodImage anchor mismatch')
          s = s.replace(old_logic, new_logic, 1)
          app.write_text(s)
          PY
          node --check js/app.js
          node --check js/firebase-service.js
          python3 scripts/check-current.py
          grep -q '^0.10.778$' VERSION
          grep -q "sobaMori: './assets/images/foods/soba-mori-v778.webp'" js/app.js
          grep -q "date.getMonth() === 6 || date.getMonth() === 7" js/app.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cadgosho-dot'
          git config user.email 'cadgosho@gmail.com'
          git add VERSION auth-cache-recovery.js game.html hosting-origin-guard.js index.html js/app.js js/firebase-service.js js/game-data.js js/memories-screen.js sw.js assets/images/foods/soba-mori-v778.webp
          git commit -m 'v0.10.778: July and August mori soba image'
          git push origin main
