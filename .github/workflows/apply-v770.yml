name: Apply v0.10.770

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v770.yml'

permissions:
  contents: write

concurrency:
  group: jewelrygame-v770-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10

      - name: Rebase latest main
        run: git pull --rebase origin main

      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Apply v0.10.770
        run: python3 scripts/apply-v770-save-diagnostics.py

      - name: Validate
        run: |
          node --check js/app.js
          node --check js/firebase-service.js
          python3 scripts/check-save-diagnostics.py
          python3 scripts/check-current.py
          git diff --check

      - name: Commit implementation and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-v770-save-diagnostics.py .github/workflows/apply-v770.yml
          git add -A
          git commit -m "v0.10.770: Add save capacity diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
