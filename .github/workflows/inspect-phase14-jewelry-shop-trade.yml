name: validate phase14 jewelry shop trade
on:
  push:
    branches:
      - phase14-jewelry-shop-trade-regression-v0.10.903
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate Stage14 protection
        run: |
          node --check js/app.js
          node --check tools/test-jewelry-shop-trade-regression.mjs
          node tools/test-jewelry-shop-trade-regression.mjs
          python3 scripts/check-jewelry-shop-trade-regression.py
          git diff --exit-code 78e4f838fa0aaefd7522d15de9de29683298a8fb -- js/app.js
          echo 'APP.JS UNCHANGED: PASS'
