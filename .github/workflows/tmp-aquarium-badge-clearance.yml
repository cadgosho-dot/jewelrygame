name: One-shot aquarium badge return clearance

on:
  push:
    branches:
      - fix/aquarium-badge-return-clearance-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/aquarium-badge-return-clearance-20260914
          fetch-depth: 0

      - name: Verify exact base and target files
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b7444e6ce9ab2eabef866f88ea990d2b7714bb39"
          test "$(cat VERSION)" = "0.10.947"
          test "$(git hash-object assets/minigames/aquarium/index.html)" = "6b6490544cd21bd2a0a0c25e6f47c9079a832754"
          test "$(git hash-object scripts/check-aquarium-portrait-center.py)" = "90886dc77edefe33de3d601e71b4b3954bf2ccf6"

      - name: Apply isolated mobile clearance fix and regression guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          aquarium = Path('assets/minigames/aquarium/index.html')
          text = aquarium.read_text(encoding='utf-8')
          style_id = 'aquarium-mobile-badge-return-clearance'
          if style_id in text:
              raise SystemExit('aquarium mobile badge clearance already exists')
          needle = '</head><body class="aquarium-waiting">'
          if text.count(needle) != 1:
              raise SystemExit('aquarium head/body insertion point is not unique')
          style = '''<style id="aquarium-mobile-badge-return-clearance">
          /* Mobile aquarium only: keep the breeding-load badge clear of the parent return button. */
          @media (orientation:portrait) and (max-width:820px),
                 (orientation:landscape) and (max-height:700px){
            .badge{
              left:auto!important;
              right:max(8px,env(safe-area-inset-right))!important;
              top:max(8px,env(safe-area-inset-top))!important;
            }
          }
          </style>
          '''
          aquarium.write_text(text.replace(needle, style + needle, 1), encoding='utf-8')

          check = Path('scripts/check-aquarium-portrait-center.py')
          source = check.read_text(encoding='utf-8')
          insert_at = "\nfailed = [name for name, ok in checks.items() if not ok]\n"
          if source.count(insert_at) != 1:
              raise SystemExit('aquarium regression insertion point is not unique')
          guard = '''
          marker = '<style id="aquarium-mobile-badge-return-clearance">'
          mobile_badge_style = text.split(marker, 1)[1].split('</style>', 1)[0] if marker in text else ''
          checks['携帯の飼育負荷を親画面の戻るボタンから右上へ退避'] = all(token in mobile_badge_style for token in (
              '@media (orientation:portrait) and (max-width:820px),',
              '(orientation:landscape) and (max-height:700px)',
              'left:auto!important;',
              'right:max(8px,env(safe-area-inset-right))!important;',
          ))
          checks['水槽PC表示の既存左上バッジ位置を維持'] = '.badge{position:fixed;left:8px;top:8px;' in text
          '''
          check.write_text(source.replace(insert_at, '\n' + guard + insert_at, 1), encoding='utf-8')
          PY

      - name: Run targeted regression checks
        run: |
          python3 scripts/check-aquarium-portrait-center.py
          python3 scripts/version-sync.py --check
          git diff --check

      - name: Remove one-shot workflow and commit verified fix
        run: |
          rm -f .github/workflows/tmp-aquarium-badge-clearance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/minigames/aquarium/index.html scripts/check-aquarium-portrait-center.py .github/workflows/tmp-aquarium-badge-clearance.yml
          git commit -m "水槽の飼育負荷表示と戻るボタンの重なりを修正"
          git push origin HEAD:fix/aquarium-badge-return-clearance-20260914
