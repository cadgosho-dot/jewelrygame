name: v0.10.735 思い出実装

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-v735-memories-lite.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: 思い出機能を適用
        run: python3 scripts/apply-v735-memories-lite.py

      - name: JavaScript構文確認
        run: |
          node --check js/app.js
          node --check js/memories-screen.js
          node --check js/memories-backgrounds.js

      - name: 実装確認
        run: |
          grep -q '__JXJ_MEMORIES_STATE__' js/app.js
          grep -q 'memories-screen.js?v=0.10.735' game.html
          grep -q "export const VERSION = '0.10.735'" js/game-data.js
          grep -q "const VERSION = '0.10.735'" sw.js

      - name: 変更をコミットして公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/game-data.js game.html index.html auth.html sw.js
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "v0.10.735 スマートフォンに思い出を追加"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
