name: Temporary bank header structure fix

on:
  push:
    branches:
      - fix/bank-header-match-shops-20261001
    paths:
      - .github/workflows/temp-bank-header-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded bank header fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          bank = Path('js/finance/bank-ui.js')
          text = bank.read_text()

          text, count = re.subn(
              r'\n\s*#\$\{BANK_SCREEN_ID\}>\.game-header\{\s*position:relative;\s*z-index:4;\s*flex:0 0 auto;\s*\}\s*',
              '\n',
              text,
              count=1,
          )
          assert count == 1, f'bank header CSS override count={count}'

          old = "    header.querySelectorAll('[data-action]').forEach((node) => node.removeAttribute('data-action'));\n"
          new = "    header.querySelector('.header-help-button')?.remove();\n"
          assert text.count(old) == 1, f'data-action stripping line count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = "  screen.id = BANK_SCREEN_ID;\n  screen.setAttribute('aria-label','銀行');\n"
          new = "  screen.id = BANK_SCREEN_ID;\n  screen.classList.add('screen-shell');\n  screen.setAttribute('aria-label','銀行');\n"
          assert text.count(old) == 1, f'bank screen creation block count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = "  content.className = 'jxj-bank-content';\n"
          new = "  content.className = 'screen-content jxj-bank-content';\n"
          assert text.count(old) == 1, f'bank content class line count={text.count(old)}'
          text = text.replace(old, new, 1)
          bank.write_text(text)

          helper = Path('js/events/event-state-helpers.js')
          text = helper.read_text()
          text, count = re.subn(
              r"\n\s*void import\('\.\./finance/bank-portrait-header-fix\.js'\)\.catch\(\(error\) => \{\s*console\.warn\('\[Bank\] portrait header fix unavailable', error\);\s*\}\);\s*",
              '\n',
              text,
              count=1,
          )
          assert count == 1, f'portrait fix import count={count}'
          helper.write_text(text)

          portrait = Path('js/finance/bank-portrait-header-fix.js')
          assert portrait.exists(), 'portrait fix file missing before deletion'
          portrait.unlink()
          PY

      - name: Verify bank regression
        run: node tools/test-bank-regression.mjs

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/finance/bank-ui.js js/events/event-state-helpers.js tools/test-bank-regression.mjs
          git rm js/finance/bank-portrait-header-fix.js
          git rm .github/workflows/temp-bank-header-fix.yml
          git commit -m "fix: use shared shop header structure for bank"
          git push origin HEAD:${GITHUB_REF_NAME}
