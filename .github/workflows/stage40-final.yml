name: stage40-final
on:
  push:
    branches: [refactor-stage40-final]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Apply stage40 install status text refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_version = '0.10.887'
          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          legacy = """function installStatusText() {
            if (isStandaloneApp()) return 'ホーム画面へ追加済みです。';
            if (deferredInstallPrompt || shellInstallAvailable) return 'この端末へ直接追加できます。ブラウザのメニューを開く必要はありません。';
            return '追加ボタンを押してください。直接追加できない環境では、Chromeで開くボタンを表示します。';
          }"""
          wrapper = """function installStatusText() {
            return formatInstallStatusText({
              standalone: isStandaloneApp(),
              directInstallAvailable: Boolean(deferredInstallPrompt || shellInstallAvailable),
            });
          }"""
          if app.count(legacy) != 1:
              raise SystemExit('legacy installStatusText implementation count is not 1')
          app = app.replace(legacy, wrapper, 1)

          import_marker = f"import {{ formatLooseDisplayLabel }} from './ui/loose-display-label.js?v={old_version}';"
          helper_import = f"import {{ formatInstallStatusText }} from './ui/install-status-text.js?v={old_version}';"
          if import_marker not in app:
              raise SystemExit('loose display label helper import marker missing')
          app = app.replace(import_marker, import_marker + '\n' + helper_import, 1)
          app_path.write_text(app, encoding='utf-8')

          Path('js/ui/install-status-text.js').write_text("""export function formatInstallStatusText({ standalone = false, directInstallAvailable = false } = {}) {
            if (standalone) return 'ホーム画面へ追加済みです。';
            if (directInstallAvailable) return 'この端末へ直接追加できます。ブラウザのメニューを開く必要はありません。';
            return '追加ボタンを押してください。直接追加できない環境では、Chromeで開くボタンを表示します。';
          }
          """, encoding='utf-8')

          Path('tools/test-install-status-text.mjs').write_text("""import assert from 'node:assert/strict';
          import { formatInstallStatusText } from '../js/ui/install-status-text.js';
          assert.equal(formatInstallStatusText({ standalone: true, directInstallAvailable: true }), 'ホーム画面へ追加済みです。');
          assert.equal(formatInstallStatusText({ standalone: false, directInstallAvailable: true }), 'この端末へ直接追加できます。ブラウザのメニューを開く必要はありません。');
          assert.equal(formatInstallStatusText({ standalone: false, directInstallAvailable: false }), '追加ボタンを押してください。直接追加できない環境では、Chromeで開くボタンを表示します。');
          assert.equal(formatInstallStatusText(), '追加ボタンを押してください。直接追加できない環境では、Chromeで開くボタンを表示します。');
          console.log('INSTALL STATUS TEXT UNIT: PASS');
          """, encoding='utf-8')

          Path('scripts/check-install-status-text.py').write_text("""#!/usr/bin/env python3
          from __future__ import annotations
          import subprocess, sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          VERSION = (ROOT / 'VERSION').read_text(encoding='utf-8').strip()
          APP = (ROOT / 'js/app.js').read_text(encoding='utf-8')
          HELPER = (ROOT / 'js/ui/install-status-text.js').read_text(encoding='utf-8')
          SW = (ROOT / 'sw.js').read_text(encoding='utf-8')
          VS = (ROOT / 'scripts/version-sync.py').read_text(encoding='utf-8')
          CURRENT = (ROOT / 'scripts/check-current.py').read_text(encoding='utf-8')

          checks = {
              'versioned helper import': f\"from './ui/install-status-text.js?v={VERSION}';\" in APP,
              'active references retained': APP.count('installStatusText(') == 2,
              'standalone check stays in app': 'standalone: isStandaloneApp(),' in APP,
              'install availability stays in app': 'directInstallAvailable: Boolean(deferredInstallPrompt || shellInstallAvailable),' in APP,
              'thin wrapper delegates': 'return formatInstallStatusText({' in APP,
              'legacy standalone text removed from app': \"if (isStandaloneApp()) return 'ホーム画面へ追加済みです。';\" not in APP,
              'helper export': 'export function formatInstallStatusText({ standalone = false, directInstallAvailable = false } = {})' in HELPER,
              'helper standalone branch': \"if (standalone) return 'ホーム画面へ追加済みです。';\" in HELPER,
              'helper direct-install branch': \"if (directInstallAvailable) return 'この端末へ直接追加できます。ブラウザのメニューを開く必要はありません。';\" in HELPER,
              'helper fallback': \"return '追加ボタンを押してください。直接追加できない環境では、Chromeで開くボタンを表示します。';\" in HELPER,
              'service worker precache': f\"./js/ui/install-status-text.js?v={VERSION}\" in SW,
              'version sync precache': \"'install-status-text.js precache key'\" in VS,
              'version sync import': \"'install-status-text.js import key'\" in VS,
              'current audit registration': \"'ホーム画面追加表示'\" in CURRENT and 'check-install-status-text.py' in CURRENT,
          }
          for forbidden in ('state.','state?.','isStandaloneApp','deferredInstallPrompt','shellInstallAvailable','window.','document.','navigator.','localStorage','sessionStorage','indexedDB','firebase','saveGame','loadState','money','inventory','eventState','Math.random','./assets/'):
              checks[f'helper independent: {forbidden}'] = forbidden not in HELPER

          failed = []
          for label, ok in checks.items():
              print(('OK' if ok else 'NG') + ': ' + label)
              if not ok:
                  failed.append(label)

          for source in (ROOT / 'js/app.js', ROOT / 'js/ui/install-status-text.js'):
              result = subprocess.run(['node', '--check', str(source)], cwd=ROOT, text=True, capture_output=True)
              if result.returncode:
                  print(result.stderr, end='')
                  failed.append(source.name + ' syntax')

          unit = subprocess.run(['node', 'tools/test-install-status-text.mjs'], cwd=ROOT, text=True, capture_output=True)
          print(unit.stdout, end='')
          if unit.returncode:
              print(unit.stderr, end='')
              failed.append('unit test')

          if failed:
              print('INSTALL STATUS TEXT INTEGRATION: FAIL')
              for label in failed:
                  print('- ' + label)
              sys.exit(1)
          print('INSTALL STATUS TEXT INTEGRATION: PASS')
          """, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw_marker = f"  './js/ui/loose-display-label.js?v={old_version}',"
          if sw_marker not in sw:
              raise SystemExit('service worker marker missing')
          sw = sw.replace(sw_marker, sw_marker + f"\n  './js/ui/install-status-text.js?v={old_version}',", 1)
          sw_path.write_text(sw, encoding='utf-8')

          vs_path = Path('scripts/version-sync.py')
          lines = vs_path.read_text(encoding='utf-8').splitlines()
          out = []
          pre = False
          imp = False
          for line in lines:
              out.append(line)
              if "'loose-display-label.js precache key'" in line:
                  out.append("    Rule('sw.js', 'install-status-text.js precache key', qparam(r'\\./js/ui/install-status-text\\.js'), keep_prefix),")
                  pre = True
              if "'loose-display-label.js import key'" in line:
                  out.append("    Rule('js/app.js', 'install-status-text.js import key', qparam(r'\\./ui/install-status-text\\.js'), keep_prefix),")
                  imp = True
          if not (pre and imp):
              raise SystemExit('version-sync markers missing')
          vs_path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          current_path = Path('scripts/check-current.py')
          current = current_path.read_text(encoding='utf-8')
          current_marker = "    ('ルース表示名', [sys.executable, str(ROOT / 'scripts/check-loose-display-label.py')]),"
          current_new = "    ('ホーム画面追加表示', [sys.executable, str(ROOT / 'scripts/check-install-status-text.py')]),"
          if current_marker not in current:
              raise SystemExit('check-current marker missing')
          current_path.write_text(current.replace(current_marker, current_marker + '\n' + current_new, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## v0.10.887'
          section = """## v0.10.888
          - ホーム画面追加案内の最終表示文言選択を `js/ui/install-status-text.js` へ分離。
          - `isStandaloneApp()`、`deferredInstallPrompt`、`shellInstallAvailable` による実環境判定は `app.js` 側に維持し、表示文言の選択だけを純粋UI helperへ移動。
          - PWA導線、インストール判定、ゲーム状態、売買、在庫、セーブ、イベント、画像には変更なし。
          - Service Worker、`version-sync.py`、専用単体/統合検査、総合監査へ登録。

          """
          if marker not in changelog:
              raise SystemExit('changelog marker missing')
          changelog_path.write_text(changelog.replace(marker, section + marker, 1), encoding='utf-8')
          PY

          python3 scripts/version-sync.py --set 0.10.888
          python3 scripts/generate-event-probability-list.py --write
          node tools/test-install-status-text.mjs
          python3 scripts/check-install-status-text.py

      - name: Prepare real browser validation
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/generate-assets-manifest.py --write

      - name: Full current-build audit
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: timeout 8m python3 -u scripts/check-current.py

      - name: Verify no media changes and required tool images
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          changed = subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines()
          media = [p for p in changed if p.startswith('assets/') and Path(p).suffix.lower() in {'.png','.jpg','.jpeg','.webp','.gif','.svg','.mp3','.wav','.ogg','.m4a','.mp4','.webm','.mov'}]
          if media:
              raise SystemExit('Unexpected media changes: ' + ', '.join(media))
          print('MEDIA DIFF: PASS — 画像・音声・動画の変更 0件')
          expected = ['bench-peg.png','buffer.png','diamond-polishing-lap.png','dividers.png','electronic-scale.png','engraving-block.png','file.png','gem-polishing-machine.png','graver.png','hammer.png','jewelry-bench.png','loupe.png','magnifier.png','milgrain-tool.png','nipper.png','piercing-saw.png','pliers.png','rolling-mill.png','rotary-tool.png','stamps.png','torch.png','ultrasonic-cleaner.png','wood-block.png']
          missing = [name for name in expected if not (Path('assets/images/tools') / name).is_file()]
          if missing:
              raise SystemExit('Missing required tool images: ' + ', '.join(missing))
          print('TOOL IMAGES: 23/23 PASS')
          PY

      - name: Commit validated stage40 changes
        run: |
          git config user.name "cadgosho-dot"
          git config user.email "cadgosho@gmail.com"
          git add -A ':!.github/workflows/stage40-final.yml'
          git commit -m "v0.10.888 ホーム画面追加表示をhelperへ分離"
          git push origin HEAD:refactor-stage40-final
