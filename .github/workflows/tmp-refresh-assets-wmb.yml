name: 母親・執事イベント ASSETS最終同期

on:
  push:
    branches:
      - feature/wolf-mother-butler-event-safe

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/wolf-mother-butler-event-safe
          fetch-depth: 0

      - name: ASSETSを現在状態から再生成
        run: |
          python3 scripts/generate-assets-manifest.py --write
          python3 scripts/generate-assets-manifest.py --check
          python3 scripts/check-store-rent-escalation.py
          python3 scripts/check-wolf-mother-butler-event.py

      - name: 一時ワークフローを削除して同期結果を保存
        run: |
          rm -f .github/workflows/tmp-refresh-assets-wmb.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "更新なし"
            exit 0
          fi
          git commit -m "母親・執事イベント ASSETS最終同期"
          git push origin HEAD:feature/wolf-mother-butler-event-safe
