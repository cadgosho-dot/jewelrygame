name: v0.10.752 One-Time Version Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-v752:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize v0.10.752 implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def text(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, value):
              (root / path).write_text(value, encoding='utf-8')

          def sub_required(value, pattern, replacement, label, count=1, flags=0):
              updated, n = re.subn(pattern, replacement, value, count=count, flags=flags)
              if n == 0:
                  if re.search(re.escape(replacement), value):
                      print(f'OK already: {label}')
                      return value
                  raise SystemExit(f'ERROR: required target not found: {label}')
              print(f'OK: {label} ({n})')
              return updated

          def sub_optional(value, pattern, replacement, label, count=0, flags=0):
              updated, n = re.subn(pattern, replacement, value, count=count, flags=flags)
              print(f'OK: {label} ({n})')
              return updated

          # js/app.js: actual settings-screen version plus module/image references.
          path = 'js/app.js'
          value = text(path)
          value = sub_required(value, r"const UI_BUILD_VERSION = '0\.10\.\d+';", "const UI_BUILD_VERSION = '0.10.752';", 'app UI_BUILD_VERSION')
          for module in ('audio.js', 'audio-scene-map.js', 'firebase-service.js'):
              value = sub_optional(value, rf"(\./{re.escape(module)}\?v=)0\.10\.\d+", rf"\g<1>0.10.752", f'app {module} query')
          value = sub_required(
              value,
              r"const LOOSE_SHOP_ORIGINAL_QUIZ_IMAGE = '\./assets/images/events/loose-shop-original-quiz(?:-v\d+)?\.png';",
              "const LOOSE_SHOP_ORIGINAL_QUIZ_IMAGE = './assets/images/events/loose-shop-original-quiz-v751.png';",
              '3D glasses event image',
          )
          value = sub_required(
              value,
              r"const characterSrc=`\./assets/images/events/storyteller(?:-v\d+)?\.png\?v=\$\{VERSION\}`;",
              "const characterSrc=`./assets/images/events/storyteller-v751.png?v=${VERSION}`;",
              'storyteller event image',
          )
          write(path, value)

          # Memories: formal version and the same official event PNGs.
          path = 'js/memories-screen.js'
          value = text(path)
          value = sub_optional(value, r"(memories-backgrounds\.js\?v=)0\.10\.\d+", r"\g<1>0.10.752", 'memories backgrounds query')
          value = sub_required(value, r"const VERSION = '0\.10\.\d+';", "const VERSION = '0.10.752';", 'memories VERSION')
          value = sub_optional(value, r"const STYLE_ID = 'jxj-memories-style-v\d+';", "const STYLE_ID = 'jxj-memories-style-v752';", 'memories STYLE_ID')
          value = sub_required(value, r"image:'\./assets/images/events/storyteller(?:-v\d+)?\.png'", "image:'./assets/images/events/storyteller-v751.png'", 'memories storyteller image')
          value = sub_required(value, r"image:'\./assets/images/events/loose-shop-original-quiz(?:-v\d+)?\.png'", "image:'./assets/images/events/loose-shop-original-quiz-v751.png'", 'memories 3D glasses image')
          write(path, value)

          # Formal game-data version.
          path = 'js/game-data.js'
          value = text(path)
          value = sub_optional(value, r"^// v0\.10\.\d+: 正式版のバージョン入口。", "// v0.10.752: 正式版のバージョン入口。", 'game-data comment', count=1, flags=re.M)
          value = sub_required(value, r"export const VERSION = '0\.10\.\d+';", "export const VERSION = '0.10.752';", 'game-data VERSION')
          value = sub_optional(value, r"// 本体側のVERSION依存箇所だけ、\d+の保存バージョンとして整合させる。", "// 本体側のVERSION依存箇所だけ、752の保存バージョンとして整合させる。", 'game-data save comment', count=1)
          write(path, value)

          # game.html: cache-bust actual files without replacing the file wholesale.
          path = 'game.html'
          value = text(path)
          for target in ('hosting-origin-guard.js', 'styles.css', 'js/app.js', 'js/memories-screen.js'):
              value = sub_optional(value, rf"({re.escape(target)}\?v=)0\.10\.\d+", rf"\g<1>0.10.752", f'game.html {target} query')
          write(path, value)

          # index.html was already hotfixed; enforce consistent cache-bust only.
          path = 'index.html'
          value = text(path)
          for target in ('hosting-origin-guard.js', 'game.html', 'viewport-shell.js'):
              value = sub_optional(value, rf"({re.escape(target)}\?v=)0\.10\.\d+", rf"\g<1>0.10.752", f'index.html {target} query')
          write(path, value)

          # Service Worker: new cache namespace while retaining v749 no-store logic.
          path = 'sw.js'
          value = text(path)
          value = sub_required(value, r"const VERSION = '0\.10\.\d+';", "const VERSION = '0.10.752';", 'service worker VERSION')
          for module in ('audio.js', 'audio-scene-map.js', 'memories-screen.js', 'memories-backgrounds.js', 'google-auth-bridge.js', 'firebase-service.js'):
              value = sub_optional(value, rf"(\./js/{re.escape(module)}\?v=)0\.10\.\d+", rf"\g<1>0.10.752", f'sw {module} query')
          write(path, value)

          # Verify the implementation, not just the displayed version number.
          app = text('js/app.js')
          memories = text('js/memories-screen.js')
          game_data = text('js/game-data.js')
          game = text('game.html')
          index = text('index.html')
          sw = text('sw.js')
          guard = text('hosting-origin-guard.js')
          viewport = text('viewport-shell.js')
          bridge = text('memories-event-image-overrides-v751.js')

          checks = {
              'settings version 752': "const UI_BUILD_VERSION = '0.10.752';" in app,
              'formal data version 752': "export const VERSION = '0.10.752';" in game_data,
              'service worker version 752': "const VERSION = '0.10.752';" in sw,
              'game app cache-bust 752': 'js/app.js?v=0.10.752' in game,
              'index game cache-bust 752': 'game.html?v=0.10.752' in index,
              '3D event official image': "loose-shop-original-quiz-v751.png" in app,
              'storyteller event official image': "storyteller-v751.png" in app,
              '3D memories official image': "loose-shop-original-quiz-v751.png" in memories,
              'storyteller memories official image': "storyteller-v751.png" in memories,
              '3D portrait background fix': 'loose-shop-portrait-v385.webp' in bridge,
              '3D landscape background fix': 'loose-shop-v385.webp' in bridge,
              '3D landscape max width': 'max-width:360px!important' in bridge,
              '3D contain': 'object-fit:contain!important' in bridge,
              'v749 Android width retained': 'width:90%!important' in guard and 'max-width:430px!important' in guard and 'max-height:72vh!important' in guard,
              'v749 shell compatibility retained': 'loose-quiz-legacy-android-v749-shell' in viewport and 'max-width:430px!important' in viewport,
              'no-store retained': "fetch(request, { cache: 'no-store' })" in sw,
              'normal metals workflow retained': (root / '.github/workflows/update-metals.yml').exists(),
              '3D PNG exists': (root / 'assets/images/events/loose-shop-original-quiz-v751.png').exists(),
              'storyteller PNG exists': (root / 'assets/images/events/storyteller-v751.png').exists(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('OK ' if ok else 'NG ') + name)
          if failed:
              raise SystemExit('Verification failed: ' + ', '.join(failed))
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/v752-version-sync.yml

      - name: Commit verified v0.10.752
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "v0.10.752 3Dメガネ縦横修正とバージョン統一"
          git pull --rebase origin main
          git push origin HEAD:main
