name: Stage46 Static Regex Fix

on:
  push:
    branches: [protect-stage46]
    paths:
      - '.github/workflows/stage46-static-regex-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: protect-stage46
          fetch-depth: 1
      - name: Fix multiline whitespace matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-emerald-captain-kebab-meal-regression.py')
          text = path.read_text(encoding='utf-8')
          old = "    pattern = re.compile(rf'(?m)^\\s*(?:async\\s+)?function\\s+{re.escape(name)}\\s*\\(')"
          new = "    pattern = re.compile(rf'(?m)^[ \\t]*(?:async[ \\t]+)?function[ \\t]+{re.escape(name)}[ \\t]*\\(')"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/stage46-static-regex-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-emerald-captain-kebab-meal-regression.py
          git commit -m '第46段階 静的抽出の改行誤認を修正'
          git push origin HEAD:protect-stage46
