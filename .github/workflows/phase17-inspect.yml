name: Phase17 Inspect Core Candidates
on:
  push:
    branches: [phase17-inspect]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print target function and nearby helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('js/app.js').read_text(encoding='utf-8')

          def extract(name):
            m = re.search(rf'(?m)^function\s+{re.escape(name)}\s*\(', text)
            if not m: return None, None
            start = m.start()
            brace = text.find('{', start)
            depth = 0; quote = None; esc = False
            for i in range(brace, len(text)):
              c = text[i]
              if quote:
                if esc: esc = False
                elif c == '\\': esc = True
                elif c == quote: quote = None
              else:
                if c in "'\"`": quote = c
                elif c == '{': depth += 1
                elif c == '}':
                  depth -= 1
                  if depth == 0:
                    return text.count('\n', 0, start) + 1, text[start:i+1]
            return text.count('\n', 0, start) + 1, text[start:]

          names = [
            'processMonthlyFixedCosts','previousMonthKey','parseGameStartDate',
            'monthlyStoreFixedCost','monthlyWorkshopStaffCost','monthlyStoreStaffCost',
            'ensureOutstandingCosts','outstandingCostTotal','currentStoreBranch'
          ]
          for name in names:
            line, body = extract(name)
            print(f'===== {name} line={line} =====')
            print(body if body else 'NOT_FOUND')
          PY
