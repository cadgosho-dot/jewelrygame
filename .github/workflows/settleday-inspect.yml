name: settleday-inspect
on:
  push:
    branches: [protect-settleday-inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect settleDay and related tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('js/app.js').read_text(encoding='utf-8')
          lines = app.splitlines()

          def extract_function(name):
              pat = re.compile(rf'^\s*function\s+{re.escape(name)}\s*\([^)]*\)\s*\{{')
              for i, line in enumerate(lines):
                  if not pat.match(line):
                      continue
                  depth = 0
                  seen = False
                  for j in range(i, len(lines)):
                      s = lines[j]
                      depth += s.count('{') - s.count('}')
                      if '{' in s:
                          seen = True
                      if seen and depth <= 0:
                          return i + 1, j + 1, '\n'.join(lines[i:j+1])
              return None

          rec = extract_function('settleDay')
          print('=== settleDay ===')
          print(rec[2] if rec else 'NOT FOUND')

          if rec:
              body = rec[2]
              calls = []
              for name in re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(', body):
                  if name not in calls and name not in {'if','for','while','switch','catch','Math','Number','String','Boolean','Array','Object','Date','Set','Map'}:
                      calls.append(name)
              print('\n=== direct calls in settleDay ===')
              print('\n'.join(calls))
              print('\n=== selected dependency definitions ===')
              for name in calls:
                  dep = extract_function(name)
                  if dep and (dep[1]-dep[0]+1) <= 80:
                      print(f'--- {name} L{dep[0]}-L{dep[1]} ---')
                      print(dep[2])

          print('\n=== existing tests/checkers mentioning settle/day/end-of-day ===')
          for root in [Path('tools'), Path('scripts')]:
              for p in sorted(root.glob('*')):
                  if not p.is_file():
                      continue
                  try:
                      txt = p.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  low = txt.lower()
                  if 'settleday' in low or 'settle day' in low or 'day result' in low or 'end of day' in low or '日終了' in txt or '日跨' in txt or '翌日' in txt:
                      print(f'--- {p} ---')
                      for no, line in enumerate(txt.splitlines(), 1):
                          if any(k in line.lower() for k in ['settleday','settle day','day result','end of day']) or any(k in line for k in ['日終了','日跨','翌日']):
                              print(f'{no}: {line}')
          PY
