name: stage32-apply
on:
  push:
    branches: [refactor-stage32-inspect]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply stage32 game date display helper
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path

          VERSION='0.10.879'
          NEXT='0.10.880'
          assert Path('VERSION').read_text(encoding='utf-8').strip() == VERSION

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          helper = """const GAME_DATE_WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

          export function formatGameDateLabel(date) {
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日（${GAME_DATE_WEEKDAYS[date.getDay()]}）`;
          }
          """.replace('          ','')
          Path('js/ui/game-date-label.js').write_text(helper,encoding='utf-8')

          import_anchor = f"import {{ formatBirthdayJapaneseLabel }} from './ui/birthday-japanese-label.js?v={VERSION}';\n"
          replace_once('js/app.js', import_anchor, import_anchor + f"import {{ formatGameDateLabel }} from './ui/game-date-label.js?v={VERSION}';\n")

          legacy = """function gameDateLabel(dayNumber = state?.game?.day || 1) {
            const date = gameDateForDay(dayNumber);
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日（${weekdays[date.getDay()]}）`;
          }""".replace('          ','')
          wrapper = """function gameDateLabel(dayNumber = state?.game?.day || 1) {
            return formatGameDateLabel(gameDateForDay(dayNumber));
          }""".replace('          ','')
          replace_once('js/app.js', legacy, wrapper)

          sw_anchor = f"  './js/ui/birthday-japanese-label.js?v={VERSION}',\n"
          replace_once('sw.js', sw_anchor, sw_anchor + f"  './js/ui/game-date-label.js?v={VERSION}',\n")

          vs_pre = "    Rule('sw.js', 'birthday-japanese-label.js precache key', qparam(r'\\./js/ui/birthday-japanese-label\\.js'), keep_prefix),\n"
          vs_imp = "    Rule('js/app.js', 'birthday-japanese-label.js import key', qparam(r'\\./ui/birthday-japanese-label\\.js'), keep_prefix),\n"
          replace_once('scripts/version-sync.py', vs_pre, vs_pre + "    Rule('sw.js', 'game-date-label.js precache key', qparam(r'\\./js/ui/game-date-label\\.js'), keep_prefix),\n")
          replace_once('scripts/version-sync.py', vs_imp, vs_imp + "    Rule('js/app.js', 'game-date-label.js import key', qparam(r'\\./ui/game-date-label\\.js'), keep_prefix),\n")

          current_anchor = "    ('誕生日日本語表示', [sys.executable, str(ROOT / 'scripts/check-birthday-japanese-label.py')]),\n"
          replace_once('scripts/check-current.py', current_anchor, current_anchor + "    ('ゲーム内日付表示', [sys.executable, str(ROOT / 'scripts/check-game-date-label.py')]),\n")

          unit = """import assert from 'node:assert/strict';
          import { formatGameDateLabel } from '../js/ui/game-date-label.js';

          const fakeDate = (year, monthIndex, day, weekday) => ({
            getFullYear: () => year,
            getMonth: () => monthIndex,
            getDate: () => day,
            getDay: () => weekday,
          });

          assert.equal(formatGameDateLabel(fakeDate(2026, 8, 5, 6)), '2026年9月5日（土）');
          assert.equal(formatGameDateLabel(fakeDate(2027, 0, 1, 5)), '2027年1月1日（金）');
          assert.equal(formatGameDateLabel(fakeDate(2028, 1, 29, 2)), '2028年2月29日（火）');
          console.log('GAME DATE LABEL UNIT: PASS');
          """.replace('          ','')
          Path('tools/test-game-date-label.mjs').write_text(unit,encoding='utf-8')

          checker = '''#!/usr/bin/env python3
          """Verify game-date Japanese display stays a pure UI helper."""
          from __future__ import annotations
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          VERSION = (ROOT / 'VERSION').read_text(encoding='utf-8').strip()
          APP_PATH = ROOT / 'js/app.js'
          HELPER_PATH = ROOT / 'js/ui/game-date-label.js'
          SW_PATH = ROOT / 'sw.js'
          VS_PATH = ROOT / 'scripts/version-sync.py'
          CURRENT_PATH = ROOT / 'scripts/check-current.py'
          APP = APP_PATH.read_text(encoding='utf-8')
          HELPER = HELPER_PATH.read_text(encoding='utf-8')
          SW = SW_PATH.read_text(encoding='utf-8')
          VS = VS_PATH.read_text(encoding='utf-8')
          CURRENT = CURRENT_PATH.read_text(encoding='utf-8')

          legacy_function = """function gameDateLabel(dayNumber = state?.game?.day || 1) {
            const date = gameDateForDay(dayNumber);
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日（${weekdays[date.getDay()]}）`;
          }"""
          wrapper = """function gameDateLabel(dayNumber = state?.game?.day || 1) {
            return formatGameDateLabel(gameDateForDay(dayNumber));
          }"""

          checks = {
              'versioned helper import exists': f"from './ui/game-date-label.js?v={VERSION}';" in APP,
              'app keeps thin gameDateLabel wrapper': wrapper in APP,
              'legacy implementation removed from app': legacy_function not in APP,
              'gameDateLabel remains actively referenced': APP.count('gameDateLabel(') >= 10,
              'game-date calculation remains in app wrapper': 'formatGameDateLabel(gameDateForDay(dayNumber))' in APP,
              'wrapper delegates once': APP.count('return formatGameDateLabel(gameDateForDay(dayNumber));') == 1,
              'helper exports formatter': 'export function formatGameDateLabel(date)' in HELPER,
              'helper keeps weekday order': "['日', '月', '火', '水', '木', '金', '土']" in HELPER,
              'helper keeps Japanese year/month/day display': '年${date.getMonth() + 1}月${date.getDate()}日' in HELPER,
              'helper keeps Japanese weekday parentheses': '（${GAME_DATE_WEEKDAYS[date.getDay()]}）' in HELPER,
              'service worker precaches helper': f"./js/ui/game-date-label.js?v={VERSION}" in SW,
              'version sync knows helper precache': "'game-date-label.js precache key'" in VS,
              'version sync knows helper import': "'game-date-label.js import key'" in VS,
              'current audit registers checker': "'ゲーム内日付表示'" in CURRENT and 'check-game-date-label.py' in CURRENT,
          }
          for forbidden in (
              'state.', 'state =', 'gameDateForDay', 'saveGame', 'loadState', 'localStorage',
              'sessionStorage', 'indexedDB', 'firebase', 'money', 'inventory', 'eventState',
              'screenData', 'document.', 'window.', 'navigator.', 'setTimeout', 'setInterval',
              './assets/', 'Math.random', 'advanceTime', 'delete', 'write', 'cloud',
          ):
              checks[f'helper has no reverse dependency: {forbidden}'] = forbidden not in HELPER

          failed = []
          for label, ok in checks.items():
              print(('OK' if ok else 'NG') + ': ' + label)
              if not ok:
                  failed.append(label)
          for source in (APP_PATH, HELPER_PATH):
              syntax = subprocess.run(['node', '--check', str(source)], cwd=ROOT, text=True, capture_output=True)
              if syntax.returncode:
                  failed.append(f'{source.name} JavaScript syntax')
                  print(syntax.stdout)
                  print(syntax.stderr)
          unit = subprocess.run(['node', 'tools/test-game-date-label.mjs'], cwd=ROOT, text=True, capture_output=True)
          print(unit.stdout, end='')
          if unit.stderr:
              print(unit.stderr, file=sys.stderr, end='')
          if unit.returncode:
              failed.append('game date label unit test')
          if failed:
              print('\\nGAME DATE LABEL INTEGRATION: FAIL')
              for label in failed:
                  print(f'- {label}')
              sys.exit(1)
          print('\\nGAME DATE LABEL INTEGRATION: PASS')
          print('ゲーム内日付の算出はapp.js側に維持し、Dateを日本語の日付・曜日表示へ変える処理だけをUI helperへ分離しています。')
          '''.replace('          ','')
          Path('scripts/check-game-date-label.py').write_text(checker,encoding='utf-8')

          change_anchor = '## v0.10.879\n'
          change_entry = '''## v0.10.880
          - ゲーム内日付の日本語表示変換だけを `js/ui/game-date-label.js` へ分離。
          - 既存 `gameDateLabel()` は薄いラッパーとして残し、ゲーム内日付を算出する `gameDateForDay()` は `app.js` 側に維持。Dateを `YYYY年M月D日（曜）` と表示する既存規則だけをhelperへ移動。
          - ゲーム内日付・時間進行・曜日判定・イベント・セーブ・所持金・在庫・画像には変更なし。
          - 新UI helperをService Workerと `version-sync.py` へ正式登録し、専用単体/統合検査を総合監査へ追加。
          '''.replace('          ','')
          replace_once('CHANGELOG.md', change_anchor, change_entry + change_anchor)
          PY

          python3 scripts/version-sync.py --set 0.10.880
          python3 scripts/generate-event-probability-list.py --write
          python3 scripts/generate-assets-manifest.py --write
          node tools/test-game-date-label.mjs
          python3 scripts/check-game-date-label.py

      - name: Prepare real browser validation
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Full current-build audit
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 8m python3 -u scripts/check-current.py

      - name: Verify no media changes and required tool images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          media_ext={'.png','.jpg','.jpeg','.webp','.gif','.svg','.mp3','.wav','.ogg','.m4a','.mp4','.webm','.mov'}
          media=[p for p in changed if Path(p).suffix.lower() in media_ext]
          print('changed files:', len(changed))
          print('media changes:', media)
          if media:
              raise SystemExit('Unexpected media changes: '+', '.join(media))
          expected=[
              'bench-peg.png','buffer.png','diamond-polishing-lap.png','dividers.png','electronic-scale.png',
              'engraving-block.png','file.png','gem-polishing-machine.png','graver.png','hammer.png','jewelry-bench.png',
              'loupe.png','magnifier.png','milgrain-tool.png','nipper.png','piercing-saw.png','pliers.png','rolling-mill.png',
              'rotary-tool.png','stamps.png','torch.png','ultrasonic-cleaner.png','wood-block.png',
          ]
          root=Path('assets/images/tools')
          missing=[name for name in expected if not (root/name).is_file()]
          if missing:
              raise SystemExit('Missing required tool images: '+', '.join(missing))
          print(f'required tool images: {len(expected)}/23')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/stage32-inspect.yml
          git config user.name 'cadgosho-dot'
          git config user.email 'cadgosho@gmail.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'v0.10.880 ゲーム内日付表示をhelperへ分離'
          git push origin HEAD:refactor-stage32-inspect
