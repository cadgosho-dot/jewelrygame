name: 自宅物件前払い家賃後検査

on:
  push:
    branches:
      - feature/home-property-b-v010944-clean
    paths:
      - '.github/workflows/home-property-post-marker-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/home-property-b-v010944-clean
      - name: 構文
        run: node --check js/app.js
      - name: VERSION同期
        run: python3 scripts/version-sync.py --check
      - name: 自宅家賃回帰
        run: python3 scripts/check-home-rent-regression.py
      - name: 前払い家賃の当月二重請求防止
        run: |
          grep -Fq 'const moveDate = gameDate();' js/app.js
          grep -Fq 'state.business.lastProcessedHomeRentMonth = `${moveDate.getFullYear()}-${String(moveDate.getMonth() + 1).padStart(2, '\''0'\'' )}`' js/app.js || grep -Fq 'state.business.lastProcessedHomeRentMonth = `${moveDate.getFullYear()}-${String(moveDate.getMonth() + 1).padStart(2, '\''0'\'')}`' js/app.js
      - name: 回帰検査用Pillow
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: 中核回帰
        run: python3 scripts/check-regression-baseline.py
      - name: 店舗家賃回帰
        run: python3 scripts/check-store-rent-escalation.py
      - name: 母親イベント保持
        run: python3 scripts/check-wolf-mother-butler-event.py
