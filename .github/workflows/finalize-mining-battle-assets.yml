name: finalize-mining-battle-assets

on:
  push:
    branches:
      - work/mining-battle-final-20260916
    paths:
      - assets/minigames/mining-battle/mole.png
      - assets/minigames/mining-battle/bat.png
      - assets/minigames/mining-battle/pickaxe.png

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved assets and finalize paths
        run: python tools/finalize-mining-battle-assets.py
      - name: Run focused regression checks
        run: |
          python scripts/check-retro-battle-frame-loader.py
          node tools/test-mining-battle-event.mjs
          node tools/test-mining-battle-integration.mjs
      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/minigames/mining-battle/mole.png \
                  assets/minigames/mining-battle/bat.png \
                  assets/minigames/mining-battle/pickaxe.png \
                  assets/minigames/retro-battle/index.html \
                  js/events/mining-battle-event.js \
                  tools/test-mining-battle-event.mjs \
                  tools/test-mining-battle-integration.mjs
          git rm .github/workflows/finalize-mining-battle-assets.yml tools/finalize-mining-battle-assets.py
          git commit -m "採掘戦闘へ正式画像を反映"
          git push
