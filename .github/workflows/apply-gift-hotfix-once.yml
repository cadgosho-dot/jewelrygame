name: プレゼント分割セーブ修正（一回限り）

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-gift-hotfix-once.yml'

permissions:
  contents: write

concurrency:
  group: jewelrygame-gift-hotfix-once
  cancel-in-progress: false

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 最新mainを取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 一時適用スクリプトを組み立て
        run: cat scripts/.gift-hotfix-part-*.pyfrag > scripts/apply-gift-hotfix-temp.py

      - name: 画像検査用ライブラリを準備
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: プレゼント分割セーブ修正を適用
        run: python3 scripts/apply-gift-hotfix-temp.py

      - name: 一時スクリプトを除去
        run: rm -f scripts/apply-gift-hotfix-temp.py

      - name: 公開前の全自動検査
        run: |
          node --check js/firebase-service.js
          timeout 8m python3 -u scripts/check-current.py

      - name: 検査済み修正だけをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/firebase-service.js scripts/check-current.py scripts/check-gift-chunked-save.py
          if git diff --cached --quiet; then
            echo "適用対象の変更がありません。"
            exit 1
          fi
          git commit -m "Fix gift chunked save flow"
          git pull --rebase origin main
          git push origin HEAD:main
