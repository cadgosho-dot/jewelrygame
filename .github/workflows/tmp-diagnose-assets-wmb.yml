name: 母親・執事イベント ASSETS不一致診断

on:
  push:
    branches:
      - feature/wolf-mother-butler-event-safe

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/wolf-mother-butler-event-safe
          fetch-depth: 0

      - name: ASSETS整合を段階診断
        shell: bash
        run: |
          set +e
          echo '===== HEAD / STATUS ====='
          git rev-parse HEAD
          git status --short
          sha256sum ASSETS.md scripts/generate-assets-manifest.py scripts/check-management-docs.py

          echo '===== DIRECT CHECK ====='
          python3 scripts/generate-assets-manifest.py --check
          DIRECT=$?
          echo "DIRECT_EXIT=$DIRECT"

          echo '===== MANAGEMENT CHECK ====='
          python3 scripts/check-management-docs.py
          MGMT=$?
          echo "MGMT_EXIT=$MGMT"

          echo '===== REGENERATE + DIFF ====='
          cp ASSETS.md /tmp/ASSETS.before.md
          python3 scripts/generate-assets-manifest.py --write
          WRITE=$?
          echo "WRITE_EXIT=$WRITE"
          git --no-pager diff -- ASSETS.md
          echo '===== CHANGED LINES ====='
          diff -u /tmp/ASSETS.before.md ASSETS.md || true

          echo '===== CHECK AFTER WRITE ====='
          python3 scripts/generate-assets-manifest.py --check
          AFTER=$?
          echo "AFTER_EXIT=$AFTER"

          exit 0
