name: v0.10.748 思い出修正版適用

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/memories-fix-v748b.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 正しい縦背景を復元
        run: |
          mkdir -p assets/images/ui
          cat .tmp/memories-bg-v748-0.part .tmp/memories-bg-v748-1.part .tmp/memories-bg-v748-2.part .tmp/memories-bg-v748-3.part .tmp/memories-bg-v748-4.part .tmp/memories-bg-v748-5.part | base64 --decode > assets/images/ui/memories-bg-portrait-v748.webp
          echo '5bf9215c04862d31e673d2c0d8aa84c01d6e027c60e8af447bbf55b2251fd777  assets/images/ui/memories-bg-portrait-v748.webp' | sha256sum -c -

      - name: カワハラ判定と748読み込みを修正
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          p = Path('js/memories-screen.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "{ key:'glabVisitVideoEvent', fallbackKey:'kawaharaKnowledgeEvent', eventKeys:['glabVisitVideoEvent','kawaharaKnowledgeEvent'], name:'カワハラ', image:'./assets/images/events/glab-kawahara.png', description:'g-Lab.で出会うジュエリー職人。' },",
              "{ key:'kawaharaKnowledgeEvent', name:'カワハラ', image:'./assets/images/events/glab-kawahara.png', description:'g-Lab.で出会うジュエリー職人。' },",
              'kawahara catalog')
          s = replace_once(s,
              "const AUTO_MEMORY_IGNORED_NAMES = new Set(['', '心の声', '支払い', 'SYSTEM', '御徒町・パンダ広場']);",
              "const AUTO_MEMORY_IGNORED_NAMES = new Set(['', '心の声', '支払い', 'SYSTEM', '御徒町・パンダ広場']);\nconst AUTO_MEMORY_IGNORED_SCREENS = new Set(['glabVisitVideoEvent']);",
              'ignored screens')
          s = replace_once(s,
              "if (!activeScreen || CATALOG_KEYS.has(activeScreen) || document.getElementById(OVERLAY_ID)) return;",
              "if (!activeScreen || CATALOG_KEYS.has(activeScreen) || AUTO_MEMORY_IGNORED_SCREENS.has(activeScreen) || document.getElementById(OVERLAY_ID)) return;",
              'capture guard')
          s = replace_once(s,
              ".filter((item) => !staticKeys.has(item.key) && !staticNames.has(item.name))",
              ".filter((item) => !staticKeys.has(item.key) && !staticNames.has(item.name) && item.name !== 'カワハラ' && !String(item.key).startsWith('glabVisitVideoEvent'))",
              'stale dynamic kawahara')
          s = re.sub(r"(memories-backgrounds\.js\?v=)0\.10\.\d+", r"\g<1>0.10.748", s, count=1)
          s = re.sub(r"const VERSION = '0\.10\.\d+';", "const VERSION = '0.10.748';", s, count=1)
          s = re.sub(r"const STYLE_ID = 'jxj-memories-style-v\d+';", "const STYLE_ID = 'jxj-memories-style-v748';", s, count=1)
          p.write_text(s, encoding='utf-8')

          p = Path('js/memories-backgrounds.js')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r"export const MEMORIES_BG_PORTRAIT = '[^']+';", "export const MEMORIES_BG_PORTRAIT = './assets/images/ui/memories-bg-portrait-v748.webp';", s, count=1)
          if n != 1: raise SystemExit('portrait background ref not found')
          p.write_text(s, encoding='utf-8')

          p = Path('js/game-data.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"^// v0\.10\.\d+: 正式版のバージョン入口。", "// v0.10.748: 正式版のバージョン入口。", s, count=1, flags=re.M)
          s, n = re.subn(r"export const VERSION = '0\.10\.\d+';", "export const VERSION = '0.10.748';", s, count=1)
          if n != 1: raise SystemExit('game-data VERSION not found')
          s = re.sub(r"// 本体側のVERSION依存箇所だけ、\d+の保存バージョンとして整合させる。", "// 本体側のVERSION依存箇所だけ、748の保存バージョンとして整合させる。", s, count=1)
          p.write_text(s, encoding='utf-8')

          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r"const UI_BUILD_VERSION = '0\.10\.\d+';", "const UI_BUILD_VERSION = '0.10.748';", s, count=1)
          if n != 1: raise SystemExit('UI_BUILD_VERSION not found')
          for f in ('audio.js','audio-scene-map.js','firebase-service.js'):
              s = re.sub(rf"(\./{re.escape(f)}\?v=)0\.10\.\d+", rf"\g<1>0.10.748", s)
          p.write_text(s, encoding='utf-8')

          p = Path('game.html')
          s = p.read_text(encoding='utf-8')
          for f in ('hosting-origin-guard.js','styles.css','js/app.js','js/memories-screen.js'):
              s = re.sub(rf"({re.escape(f)}\?v=)0\.10\.\d+", rf"\g<1>0.10.748", s)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for f in ('hosting-origin-guard.js','viewport-shell.css','game.html','viewport-shell.js'):
              s = re.sub(rf"({re.escape(f)}\?v=)0\.10\.\d+", rf"\g<1>0.10.748", s)
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r"const VERSION = '0\.10\.\d+';", "const VERSION = '0.10.748';", s, count=1)
          if n != 1: raise SystemExit('sw VERSION not found')
          for f in ('audio.js','audio-scene-map.js','memories-screen.js','memories-backgrounds.js','google-auth-bridge.js','firebase-service.js'):
              s = re.sub(rf"(\./js/{re.escape(f)}\?v=)0\.10\.\d+", rf"\g<1>0.10.748", s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: 修正内容を検証
        run: |
          node --check js/app.js
          node --check js/game-data.js
          node --check js/memories-screen.js
          node --check sw.js
          grep -F "{ key:'kawaharaKnowledgeEvent', name:'カワハラ'" js/memories-screen.js
          ! grep -F "eventKeys:['glabVisitVideoEvent','kawaharaKnowledgeEvent']" js/memories-screen.js
          grep -F "AUTO_MEMORY_IGNORED_SCREENS = new Set(['glabVisitVideoEvent'])" js/memories-screen.js
          grep -F "memories-bg-portrait-v748.webp" js/memories-backgrounds.js

      - name: 一時ファイルを削除してmainへ反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/memories-fix-v748.yml .github/workflows/memories-fix-v748b.yml .tmp/memories-bg-v748.b64 .tmp/trigger-v748.txt .tmp/memories-bg-v748-0.part .tmp/memories-bg-v748-1.part .tmp/memories-bg-v748-2.part .tmp/memories-bg-v748-3.part .tmp/memories-bg-v748-4.part .tmp/memories-bg-v748-5.part
          git add js/memories-screen.js js/memories-backgrounds.js js/game-data.js js/app.js game.html index.html sw.js assets/images/ui/memories-bg-portrait-v748.webp
          git commit -m "v0.10.748 思い出背景とカワハラ判定を修正"
          git pull --rebase origin main
          git push origin HEAD:main
