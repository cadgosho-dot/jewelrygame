name: Phase40 Formal Sync v0.10.929

on:
  push:
    branches: [main, protect-stage40]
    paths:
      - '.github/workflows/phase40-sync-v010929.yml'
      - 'tools/test-finance-ledger-regression.mjs'
      - 'scripts/check-finance-ledger-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'protect-stage40'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate shared finance ledger protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-finance-ledger-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.928'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('イベント緊急確定処理保護', [sys.executable, str(ROOT / 'scripts/check-event-emergency-settlement-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-finance-ledger-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('共通収支記録処理保護', [sys.executable, str(ROOT / 'scripts/check-finance-ledger-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.929\n- 中核処理保護・第40段階：全売買・食事・固定費などで共通利用する収支記録処理 `addFinance()` を動的回帰テストと静的検査で固定。\n- 収支行ID、ゲーム内日付、収入・支出、履歴圧縮、当日収入/支出の累計、複数回記録の積算順序を検証。\n- ゲーム仕様・価格・在庫・イベント・画像・音声・セーブ形式・クラウド保存形式の変更なし。\n'
          assert '## v0.10.929' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-finance-ledger-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.928', '?v=0.10.929').replace("const UI_BUILD_VERSION = '0.10.928';", "const UI_BUILD_VERSION = '0.10.929';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase40-sync-v010929.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.929 第40段階正式同期'
          git push origin HEAD:main
