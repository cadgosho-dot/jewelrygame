name: Inspect staged ONE LOVE assets

on:
  push:
    branches: [one-love-v783-work]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect staged ONE LOVE assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one-love-v783-work
      - name: Inspect staged assets
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io
          from PIL import Image
          candidates = []
          p = Path('.tmp-one-love')
          if p.exists():
              parts = sorted(p.glob('part*.txt'))
              candidates.append(('original-staged', ''.join(x.read_text().strip() for x in parts), [x.name for x in parts]))
          p = Path('.tmp-one-love512')
          if p.exists():
              parts = sorted(p.glob('part*.txt'))
              candidates.append(('staged-512', ''.join(x.read_text().strip() for x in parts), [x.name for x in parts]))
          for name, text, parts in candidates:
              print('CANDIDATE', name, 'parts=', parts, 'b64chars=', len(text))
              try:
                  raw = base64.b64decode(text, validate=True)
                  print(' bytes=', len(raw), 'sha256=', hashlib.sha256(raw).hexdigest())
                  im = Image.open(io.BytesIO(raw)); im.load()
                  print(' format=', im.format, 'size=', im.size, 'mode=', im.mode)
                  if 'A' in im.getbands():
                      a = im.getchannel('A')
                      print(' alpha_extrema=', a.getextrema(), 'alpha_bbox=', a.getbbox())
              except Exception as e:
                  print(' ERROR=', repr(e))
          PY
