name: Stage 44 Core Protection Audit

on:
  push:
    branches: [protect-stage44]
    paths:
      - '.github/workflows/stage44-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rank unprotected stateful functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('js/app.js').read_text(encoding='utf-8')
          protection_text = ''
          for p in list(Path('scripts').glob('check-*-regression.py')) + list(Path('tools').glob('test-*-regression.mjs')):
              try:
                  protection_text += '\n' + p.read_text(encoding='utf-8')
              except Exception:
                  pass

          funcs=[]
          pat=re.compile(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\([^)]*\)\s*\{')
          for m in pat.finditer(app):
              name=m.group(1); start=m.start(); i=app.find('{',m.start()); depth=0; quote=None; esc=False
              j=i
              while j < len(app):
                  ch=app[j]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in "'\"`": quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              j+=1; break
                  j+=1
              body=app[start:j]
              if name in protection_text:
                  continue
              score=0; reasons=[]
              rules=[
                  (r'state\.[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*\s*(?:=|\+=|-=|\+\+|--)',6,'state mutation'),
                  (r'\.push\s*\(',3,'push'),
                  (r'\.splice\s*\(',4,'splice'),
                  (r'saveGame\s*\(',5,'save'),
                  (r'addFinance\s*\(',5,'finance'),
                  (r'spend(?:Minutes|Hours)\s*\(',4,'time'),
                  (r'adjust(?:LooseInventory|MetalInventory)\s*\(',4,'inventory'),
                  (r'removeJewelry\s*\(',5,'jewelry removal'),
                  (r'notify\s*\(',1,'notify'),
              ]
              for rx,w,label in rules:
                  n=len(re.findall(rx,body))
                  if n: score += min(n,5)*w; reasons.append(f'{label}:{n}')
              if score:
                  funcs.append((score,name,len(body.splitlines()),', '.join(reasons)))
          funcs.sort(reverse=True)
          print('TOP UNPROTECTED STATEFUL FUNCTIONS')
          for row in funcs[:50]: print('%4d  %-42s lines=%-4d %s' % row)
          print('\nTOP 15 SOURCE EXCERPTS')
          top={name for _,name,_,_ in funcs[:15]}
          for m in pat.finditer(app):
              name=m.group(1)
              if name not in top: continue
              i=app.find('{',m.start()); depth=0; quote=None; esc=False; j=i
              while j < len(app):
                  ch=app[j]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in "'\"`": quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: j+=1; break
                  j+=1
              body=app[m.start():j]
              print(f'\n===== {name} =====')
              print(body[:12000])
          PY
