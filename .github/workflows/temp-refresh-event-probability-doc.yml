name: TEMP refresh generated management docs

on:
  push:
    branches:
      - fix/retro-battle-start-readiness-20260914

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: ブランチを取得
        uses: actions/checkout@v6
        with:
          ref: fix/retro-battle-start-readiness-20260914
          fetch-depth: 0

      - name: 変更に伴う管理資料を再生成
        run: |
          test "$(cat VERSION)" = "0.10.948"
          python3 scripts/generate-assets-manifest.py --write
          python3 scripts/generate-event-probability-list.py --write
          python3 scripts/check-management-docs.py
          python3 scripts/check-retro-battle-frame-loader.py
          python3 scripts/version-sync.py --check
          git diff --check

      - name: 一時ワークフローを除去して保存
        run: |
          rm -f .github/workflows/temp-refresh-event-probability-doc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASSETS.md EVENT_PROBABILITY_LIST.md .github/workflows/temp-refresh-event-probability-doc.yml
          git commit -m "戦闘起動修正に伴う管理資料を同期"
          git push origin HEAD:fix/retro-battle-start-readiness-20260914
