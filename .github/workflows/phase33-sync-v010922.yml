name: Phase33 Formal Sync v0.10.922

on:
  push:
    branches: [main, phase33-gift-transaction-protection]
    paths:
      - '.github/workflows/phase33-sync-v010922.yml'
      - 'tools/test-gift-transaction-regression.mjs'
      - 'scripts/check-gift-transaction-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'phase33-gift-transaction-protection'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate gift transaction protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-gift-transaction-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.921'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('プレゼント在庫移動処理保護', [sys.executable, str(ROOT / 'scripts/check-gift-inventory-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-gift-transaction-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('プレゼント取引制御処理保護', [sys.executable, str(ROOT / 'scripts/check-gift-transaction-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.922\n- 中核処理保護・第33段階：プレゼントの発行・受取・取消をつなぐクラウド取引制御を動的回帰テストと静的検査で固定。\n- 発行前保存とクラウド保存確認、取引コールバック、取引結果の反映、受取画面更新、取消復元、受取済み取消時の送信履歴補正、処理中ロック解除を検証。\n- ゲーム処理・プレゼント仕様・クラウド取引仕様・価格・イベント・画像・音声・セーブ形式の変更なし。\n'
          assert '## v0.10.922' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-gift-transaction-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.921', '?v=0.10.922').replace("const UI_BUILD_VERSION = '0.10.921';", "const UI_BUILD_VERSION = '0.10.922';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase33-sync-v010922.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.922 第33段階正式同期'
          git push origin HEAD:main
