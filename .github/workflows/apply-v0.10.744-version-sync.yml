name: Apply v0.10.744 version sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v0.10.744-version-sync.yml'

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync active version and cache references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = '0.10.744'
          active_old = ('0.10.738', '0.10.741', '0.10.742', '0.10.743')

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_active_queries(text):
              for old in active_old:
                  text = text.replace(f'?v={old}', f'?v={target}')
              return text

          # 正式ゲームVERSION
          p = Path('js/game-data.js')
          t = read(p)
          t = re.sub(r"export const VERSION = '0\.10\.738';", f"export const VERSION = '{target}';", t, count=1)
          t = t.replace('// v0.10.738: 正式版のバージョン入口。', '// v0.10.744: 正式版のバージョン入口。')
          write(p, t)

          # アプリ本体のUIビルド番号と主要モジュールのキャッシュ参照
          p = Path('js/app.js')
          t = read(p)
          t = re.sub(r"const UI_BUILD_VERSION = '0\.10\.738';", f"const UI_BUILD_VERSION = '{target}';", t, count=1)
          t = replace_active_queries(t)
          write(p, t)

          # Service Workerの正式キャッシュVERSION
          p = Path('sw.js')
          t = read(p)
          t = re.sub(r"const VERSION = '0\.10\.738';", f"const VERSION = '{target}';", t, count=1)
          t = replace_active_queries(t)
          write(p, t)

          # 思い出本体
          p = Path('js/memories-screen.js')
          t = read(p)
          t = re.sub(r"const VERSION = '0\.10\.742';", f"const VERSION = '{target}';", t, count=1)
          t = t.replace("const STYLE_ID = 'jxj-memories-style-v742';", "const STYLE_ID = 'jxj-memories-style-v744';")
          if "from './memories-backgrounds.js';" in t:
              t = t.replace("from './memories-backgrounds.js';", f"from './memories-backgrounds.js?v={target}';", 1)
          t = replace_active_queries(t)
          write(p, t)

          # 出会った回数補助スクリプトも744へ更新して旧ファイルを残さない
          old_helper = Path('memories-encounter-count-v743.js')
          new_helper = Path('memories-encounter-count-v744.js')
          if old_helper.exists():
              t = read(old_helper).replace('v743', 'v744').replace('0.10.743', target)
              write(new_helper, t)
              old_helper.unlink()

          # HTML側の有効なキャッシュ番号を統一
          for name in ('index.html', 'game.html', 'auth.html'):
              p = Path(name)
              if not p.exists():
                  continue
              t = read(p)
              t = replace_active_queries(t)
              t = t.replace('memories-encounter-count-v743.js', 'memories-encounter-count-v744.js')
              write(p, t)

          # indexのゲームフレームは必ず744へ
          p = Path('index.html')
          t = read(p)
          t = re.sub(r"src=\"\./game\.html\?v=0\.10\.\d+\"", f'src="./game.html?v={target}"', t, count=1)
          write(p, t)

          # game.htmlで主要アセットを確実に744へ
          p = Path('game.html')
          t = read(p)
          t = re.sub(r"href=\"\./styles\.css\?v=0\.10\.\d+\"", f'href="./styles.css?v={target}"', t, count=1)
          t = re.sub(r"src=\"\./js/app\.js(?:\?v=0\.10\.\d+)?\"", f'src="./js/app.js?v={target}"', t, count=1)
          t = re.sub(r"src=\"\./js/memories-screen\.js(?:\?v=0\.10\.\d+)?\"", f'src="./js/memories-screen.js?v={target}"', t, count=1)
          write(p, t)

          # 期待値チェック
          checks = {
              'js/game-data.js': f"export const VERSION = '{target}';",
              'js/app.js': f"const UI_BUILD_VERSION = '{target}';",
              'sw.js': f"const VERSION = '{target}';",
              'js/memories-screen.js': f"const VERSION = '{target}';",
              'index.html': f'./game.html?v={target}',
              'game.html': f'./styles.css?v={target}',
          }
          failed = []
          for path, needle in checks.items():
              if needle not in read(path):
                  failed.append(f'{path}: missing {needle}')
          if failed:
              raise SystemExit('\n'.join(failed))

          # アクティブ入口に旧738/741/742/743が残っていないことを確認
          for path in ('js/game-data.js','js/app.js','sw.js','js/memories-screen.js','index.html','game.html','auth.html'):
              if not Path(path).exists():
                  continue
              text = read(path)
              leftovers = [old for old in active_old if f'?v={old}' in text]
              if leftovers:
                  raise SystemExit(f'{path}: stale active cache refs: {leftovers}')
          PY

      - name: Syntax checks
        shell: bash
        run: |
          node --check js/app.js
          node --check js/game-data.js
          node --check js/memories-screen.js
          node --check memories-encounter-count-v744.js
          node --check sw.js

      - name: Commit synchronized version and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'cadgosho-dot'
          git config user.email 'cadgosho@gmail.com'
          git rm .github/workflows/apply-v0.10.744-version-sync.yml
          git add index.html game.html auth.html sw.js js/app.js js/game-data.js js/memories-screen.js memories-encounter-count-v744.js
          git add -u memories-encounter-count-v743.js || true
          git commit -m 'v0.10.744 バージョンとキャッシュ番号を統一'
          git push origin HEAD:main
