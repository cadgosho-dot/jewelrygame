name: Temporary bank menu balance layout

on:
  push:
    branches:
      - fix/bank-menu-balance-layout-20261001
    paths:
      - .github/workflows/temp-bank-menu-balance-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply bank balance-first menu layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('js/finance/bank-ui.js')
          text = ui.read_text()

          old = '.jxj-bank-menu{display:grid; gap:16px; width:100%;}'
          new = '.jxj-bank-menu{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; width:100%;}'
          assert text.count(old) == 1, f'menu grid count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = '''    @media (orientation:landscape){\n      .jxj-bank-menu{grid-template-columns:repeat(3,minmax(0,1fr));}\n    }\n'''
          assert text.count(old) == 1, f'landscape three-column rule count={text.count(old)}'
          text = text.replace(old, '', 1)

          old = '      .jxj-bank-menu{gap:16px;}\n'
          new = '      .jxj-bank-menu{grid-template-columns:1fr; gap:16px;}\n'
          assert text.count(old) == 1, f'portrait menu rule count={text.count(old)}'
          text = text.replace(old, new, 1)

          marker = '    .jxj-bank-balance-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}\n'
          assert text.count(marker) == 1, f'balance grid marker count={text.count(marker)}'
          insert = '''    .jxj-bank-menu-balance{margin-bottom:16px;}\n    .jxj-bank-menu-balance small{font-size:clamp(16px,2.8vw,20px);}\n    .jxj-bank-menu-balance strong{font-size:clamp(34px,7vw,54px);}\n'''
          text = text.replace(marker, insert + marker, 1)

          old = '''  panel.innerHTML = `\n    ${currentInterestHtml()}\n    <div class="jxj-bank-menu">\n      <button type="button" class="jxj-bank-menu-button" data-bank-mode="deposit">預ける</button>\n      <button type="button" class="jxj-bank-menu-button" data-bank-mode="withdraw">引き出す</button>\n      <button type="button" class="jxj-bank-menu-button" data-bank-mode="balance">残高確認</button>\n    </div>`;\n}\n\nfunction renderBalance() {\n  const panel = document.querySelector(`#${BANK_SCREEN_ID} .jxj-bank-panel`);\n  if (!panel) return;\n  panel.innerHTML = `\n    <div class="jxj-bank-balance-card">\n      <small>銀行残高</small>\n      <strong>${yen(lastSnapshot?.bank?.balance)}</strong>\n    </div>\n    <p class="jxj-bank-note">預金利息：30日ごとに1%</p>\n    <button type="button" class="jxj-bank-secondary" data-bank-menu>戻る</button>`;\n}\n'''
          new = '''  panel.innerHTML = `\n    ${currentInterestHtml()}\n    <div class="jxj-bank-balance-card jxj-bank-menu-balance">\n      <small>銀行残高</small>\n      <strong>${yen(lastSnapshot?.bank?.balance)}</strong>\n    </div>\n    <div class="jxj-bank-menu">\n      <button type="button" class="jxj-bank-menu-button" data-bank-mode="deposit">預ける</button>\n      <button type="button" class="jxj-bank-menu-button" data-bank-mode="withdraw">引き出す</button>\n    </div>`;\n}\n'''
          assert text.count(old) == 1, f'menu/renderBalance block count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = "    if (mode === 'balance') { bankMode = 'balance'; renderBalance(); return; }\n"
          assert text.count(old) == 1, f'balance handler count={text.count(old)}'
          text = text.replace(old, '', 1)
          ui.write_text(text)

          test = Path('tools/test-bank-regression.mjs')
          test_text = test.read_text()
          old = "assert.match(bankUiSource, /@media \\(orientation:landscape\\)\\{[\\s\\S]*?\\.jxj-bank-menu\\{grid-template-columns:repeat\\(3,minmax\\(0,1fr\\)\\);/, '横画面は3つの銀行メニューボタンを横並びにする');\n"
          assert test_text.count(old) == 1, f'old landscape assertion count={test_text.count(old)}'
          new = "assert.match(bankUiSource, /\\.jxj-bank-menu\\{display:grid; grid-template-columns:repeat\\(2,minmax\\(0,1fr\\)\\);/, '銀行トップは預ける・引き出すの2ボタンを横並びにする');\nassert.match(bankUiSource, /\\.jxj-bank-menu-balance strong\\{font-size:clamp\\(34px,7vw,54px\\);\\}/, '銀行トップの残高を大きく表示する');\nassert.match(bankUiSource, /class=\\\"jxj-bank-balance-card jxj-bank-menu-balance\\\"/, '銀行トップに残高カードを表示する');\nassert.doesNotMatch(bankUiSource, /data-bank-mode=\\\"balance\\\"/, '残高確認ボタンを表示しない');\nassert.doesNotMatch(bankUiSource, /function renderBalance\\(/, '残高確認専用画面を残さない');\nassert.match(bankUiSource, /@media \\(orientation:portrait\\)\\{[\\s\\S]*?\\.jxj-bank-menu\\{grid-template-columns:1fr; gap:16px;\\}/, '縦画面は預ける・引き出すを縦並びにする');\n"
          test_text = test_text.replace(old, new, 1)
          test.write_text(test_text)
          PY

      - name: Verify bank regression
        run: node tools/test-bank-regression.mjs

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/finance/bank-ui.js tools/test-bank-regression.mjs
          git rm .github/workflows/temp-bank-menu-balance-layout.yml
          git commit -m "fix: show bank balance above deposit and withdrawal"
          git push origin HEAD:${GITHUB_REF_NAME}
