name: v0.10.860 clipboard fallback implementation

on:
  push:
    branches:
      - codex/v0-10-860-clipboard-fallback

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Apply the single v0.10.860 seam
        run: |
          python3 tools/apply-v0-10-860.py
          python3 scripts/version-sync.py --set 0.10.860
          python3 scripts/generate-event-probability-list.py --write

      - name: Static and dedicated checks
        run: |
          node --check js/app.js
          node --check js/ui/clipboard-fallback.js
          python3 scripts/version-sync.py --check
          python3 scripts/check-clipboard-fallback.py
          python3 scripts/generate-event-probability-list.py --check
          git diff --check

      - name: Prepare real-browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Run full current-build audit
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 8m python3 -u scripts/check-current.py

      - name: Verify narrow final diff
        run: |
          test ! -e .github/workflows/v0-10-860-apply-and-test.yml
          test ! -e tools/apply-v0-10-860.py
          test "$(cat VERSION)" = "0.10.860"
          git status --short
          git diff --stat
          git diff -- js/app.js sw.js scripts/version-sync.py scripts/check-current.py CHANGELOG.md EVENT_PROBABILITY_LIST.md

      - name: Commit validated v0.10.860
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.10.860 クリップボードフォールバックをUI helperへ分離"
          git push origin "HEAD:${GITHUB_REF_NAME}"
