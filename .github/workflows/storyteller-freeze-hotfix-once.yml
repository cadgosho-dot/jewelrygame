name: storyteller-freeze-hotfix-once

on:
  push:
    branches:
      - fix/storyteller-quiz-freeze-20260913
    paths:
      - .github/workflows/storyteller-freeze-hotfix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storyteller-quiz-freeze-20260913
      - name: Patch hunger allowlist and add regression check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          anchor = "const HUNGER_ALLOWED_ACTIONS = new Set(["
          start = s.find(anchor)
          if start < 0:
              raise SystemExit('HUNGER_ALLOWED_ACTIONS not found')
          end = s.find(']);', start)
          if end < 0:
              raise SystemExit('HUNGER_ALLOWED_ACTIONS end not found')
          block = s[start:end]
          actions = ['storyteller-event-next', 'storyteller-quiz-answer', 'storyteller-reward-next']
          missing = [a for a in actions if f"'{a}'" not in block]
          if missing:
              insert = "\n  " + ", ".join(repr(a) for a in missing) + ","
              s = s[:start + len(anchor)] + insert + s[start + len(anchor):]
              p.write_text(s, encoding='utf-8')
          elif len(missing) == 0:
              print('Storyteller actions already allowed')

          test = Path('scripts/check-storyteller-hunger-progression.py')
          test.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport re\n\ns = Path("js/app.js").read_text(encoding="utf-8")\nm = re.search(r"const HUNGER_ALLOWED_ACTIONS = new Set\\(\\[(.*?)\\]\\);", s, re.S)\nassert m, "HUNGER_ALLOWED_ACTIONS not found"\nblock = m.group(1)\nfor action in ("storyteller-event-next", "storyteller-quiz-answer", "storyteller-reward-next"):\n    assert f"\\'{action}\\'" in block, f"{action} must remain allowed while hungry"\nassert "case \'storyteller-quiz-answer\':" in s, "storyteller answer dispatcher missing"\nassert "answerStorytellerQuiz(String(button.dataset.key || \'\'));" in s, "storyteller answer dispatch changed"\nassert "e.stage = e.correct ? \'correct\' : \'incorrect\';" in s, "storyteller answer stage transition changed"\nprint("PASS: storyteller event progression remains available while hunger lock is active")\n''', encoding='utf-8')
          PY
          python3 scripts/check-storyteller-hunger-progression.py
          python3 scripts/check-storyteller-v2-layout.py
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
      - name: Record changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          entry='''## v0.10.944 — ストーリーテラー4択停止修正\n\n- 空腹状態でもストーリーテラーイベント内の会話進行・4択回答・報酬進行を許可し、4択画面で操作不能になる問題を修正。\n- クイズイベントUI、登録済みセリフ、画像、BGM、発生条件、報酬内容、セーブ形式は変更なし。\n- `scripts/check-storyteller-hunger-progression.py` を追加し、空腹制限下でもイベント進行操作が遮断されないことを回帰保護。\n\n'''
          if '## v0.10.944 — ストーリーテラー4択停止修正' not in s:
              p.write_text(entry+s, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/storyteller-freeze-hotfix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js scripts/check-storyteller-hunger-progression.py VERSION game.html index.html sw.js CHANGELOG.md || true
          git add -u
          git commit -m "ストーリーテラー4択停止を修正"
          git push origin HEAD:fix/storyteller-quiz-freeze-20260913
