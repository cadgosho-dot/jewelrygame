name: 自宅物件クリーン適用

on:
  push:
    branches:
      - feature/home-property-b-v010944-clean
    paths:
      - '.github/workflows/home-property-clean-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 最新main基準ブランチ取得
        uses: actions/checkout@v6
        with:
          ref: feature/home-property-b-v010944-clean
          fetch-depth: 0

      - name: 自宅物件差分を3-way適用
        run: |
          git fetch origin feature/home-property-b-v010944
          git diff c3a2b51764f1c853f1cc562253d307e3f91d34e8 ad078b21f8004ecc019dfc3e23506210a2b255ac -- \
            ':(exclude).github/workflows/home-property-preflight.yml' > /tmp/home-property.patch
          git apply --3way --index /tmp/home-property.patch

      - name: 既存の母親イベント修正が保持されていることを確認
        run: |
          grep -q "createEventStateHelpers" js/app.js
          grep -q "event-state-helpers.js?v=0.10.944" js/app.js
          test -f js/events/event-state-helpers.js

      - name: 構文とVERSION同期確認
        run: |
          node --check js/app.js
          python3 scripts/version-sync.py --check

      - name: 変更を保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v0.10.944 自宅物件機能を最新mainへ安全適用'
          git push origin HEAD:feature/home-property-b-v010944-clean
