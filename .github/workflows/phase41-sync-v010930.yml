name: Phase41 Formal Sync v0.10.930

on:
  push:
    branches: [main, protect-stage41]
    paths:
      - '.github/workflows/phase41-sync-v010930.yml'
      - 'tools/test-load-game-regression.mjs'
      - 'scripts/check-load-game-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'protect-stage41'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate save load protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-load-game-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.929'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('共通収支記録処理保護', [sys.executable, str(ROOT / 'scripts/check-finance-ledger-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-load-game-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('セーブ読込・復旧処理保護', [sys.executable, str(ROOT / 'scripts/check-load-game-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.930\n- 中核処理保護・第41段階：起動時の保存データ読込・移行・整合性確認・復旧通知を担う `loadGame()` を動的回帰テストと静的検査で固定。\n- 保存データ未存在、移行、候補判定、スキーマ更新、不要な空腹通知除去、移行失敗・不正データ時の復旧案内、既存復旧案内維持を検証。\n- ゲーム仕様・価格・在庫・イベント・画像・音声・セーブ形式・クラウド保存形式の変更なし。\n'
          assert '## v0.10.930' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-load-game-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.929', '?v=0.10.930').replace("const UI_BUILD_VERSION = '0.10.929';", "const UI_BUILD_VERSION = '0.10.930';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase41-sync-v010930.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.930 第41段階正式同期'
          git push origin HEAD:main
