name: Phase15 Inspect Workshop Tool Logic

on:
  push:
    branches:
      - phase15-workshop-tool-regression-v0.10.904
    paths:
      - .stage15-inspect-trigger

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase15-workshop-tool-regression-v0.10.904
          fetch-depth: 0
      - name: Extract workshop tool related functions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          line_starts = [0]
          for m in re.finditer(r'\n', text):
              line_starts.append(m.end())

          def line_no(pos):
              import bisect
              return bisect.bisect_right(line_starts, pos)

          def extract_end(open_pos):
              depth = 0
              quote = None
              esc = False
              i = open_pos
              while i < len(text):
                  ch = text[i]
                  nxt = text[i+1] if i + 1 < len(text) else ''
                  if quote:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('\"', "'", '`'):
                      quote = ch
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      j = text.find('\n', i + 2)
                      i = len(text) if j < 0 else j + 1
                      continue
                  if ch == '/' and nxt == '*':
                      j = text.find('*/', i + 2)
                      i = len(text) if j < 0 else j + 2
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i + 1
                  i += 1
              return len(text)

          blocks = []
          pat = re.compile(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\([^\n]*?\)\s*\{')
          for m in pat.finditer(text):
              name = m.group(1)
              open_pos = text.find('{', m.start(), m.end())
              end = extract_end(open_pos)
              body = text[m.start():end]
              low = body.lower()
              score = 0
              if 'tool' in name.lower(): score += 4
              if 'workshop' in name.lower(): score += 3
              if 'tool' in low: score += 2
              if 'repair' in low or '修理' in body: score += 3
              if 'purchase' in low or 'buy' in low or '購入' in body: score += 3
              if 'workshop' in low: score += 2
              if 'savegame' in low: score += 1
              if 'state.game.money' in low: score += 1
              if score >= 6:
                  blocks.append((line_no(m.start()), name, score, body))

          out = []
          out.append('PHASE15 WORKSHOP TOOL INSPECTION')
          out.append(f'app.js lines: {text.count(chr(10)) + 1}')
          for ln, name, score, body in blocks:
              out.append('\n' + '=' * 80)
              out.append(f'FUNCTION {name} line={ln} score={score}')
              out.append(body)

          # Also include direct keyword hits for state/data naming context.
          out.append('\n' + '=' * 80)
          out.append('KEYWORD HITS')
          keywords = ('WORKSHOP_TOOLS', 'repairTool', 'buyTool', 'purchaseTool', 'toolRepair', 'toolPurchase', '修理費', '工具を購入', '設備を購入')
          lines = text.splitlines()
          seen = set()
          for idx, line in enumerate(lines, 1):
              if any(k in line for k in keywords):
                  for j in range(max(1, idx - 3), min(len(lines), idx + 3) + 1):
                      if j not in seen:
                          seen.add(j)
                          out.append(f'{j}: {lines[j-1]}')

          Path('_phase15-workshop-tool-inspection.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f'candidates={len(blocks)}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _phase15-workshop-tool-inspection.txt
          git commit -m '第15段階 工房工具処理の調査結果' || exit 0
          git push origin HEAD:phase15-workshop-tool-regression-v0.10.904
