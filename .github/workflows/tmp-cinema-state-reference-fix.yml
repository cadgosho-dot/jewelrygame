name: 一時 映画館イベント状態参照修正

on:
  push:
    branches:
      - fix/cinema-event-state-references-20260914

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: ブランチを取得
        uses: actions/checkout@v4
        with:
          ref: fix/cinema-event-state-references-20260914
          fetch-depth: 0

      - name: 最小修正を適用
        run: python tools/tmp-fix-cinema-state-references.py

      - name: 専用回帰検査
        run: |
          python scripts/check-cinema-event-state-reference-regression.py
          python scripts/check-event-emergency-settlement-regression.py
          python scripts/check-apprentice-cinema-center.py

      - name: 一時ファイルを除去してコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-cinema-state-reference-fix.yml tools/tmp-fix-cinema-state-references.py
          git add js/app.js scripts/check-current.py scripts/check-cinema-event-state-reference-regression.py
          git diff --cached --check
          git commit -m "映画館イベントの状態参照切れを防止"
          git push origin HEAD:fix/cinema-event-state-references-20260914
