name: Apply ONE LOVE v783 on work branch

on:
  push:
    branches: [one-love-v783-work]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry ONE LOVE v783 work patch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one-love-v783-work
          fetch-depth: 1
      - name: Prepare validation dependencies
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Correct patcher regex escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_v783_one_love_event.py')
          s = p.read_text(encoding='utf-8')
          before = s.count(r'\\d')
          s = s.replace(r'\\d', r'\d')
          p.write_text(s, encoding='utf-8')
          print(f'corrected double-backslash regex fragments: {before}')
          PY
      - name: Use non-committed placeholder only for pre-image code validation
        run: cp assets/images/events/workshop-kappa-jade.png assets/images/events/one-love.png
      - name: Apply and capture result
        id: apply
        shell: bash
        run: |
          set +e
          python3 -u scripts/apply_v783_one_love_event.py > /tmp/one-love-v783-patch-log.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/one-love-v783-patch-log.txt
          exit 0
      - name: Remove placeholder image
        run: rm -f assets/images/events/one-love.png
      - name: Save failure log or commit validated code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.apply.outputs.exit_code }}' != '0' ]; then
            git reset --hard HEAD
            git clean -fd
            cp /tmp/one-love-v783-patch-log.txt .github/one-love-v783-patch-log.txt
            git add .github/one-love-v783-patch-log.txt
            git commit -m 'Save ONE LOVE v783 retry failure log'
            git push origin HEAD:one-love-v783-work
            exit 0
          fi
          rm -f .github/one-love-v783-patch-log.txt
          git add VERSION auth-cache-recovery.js game.html hosting-origin-guard.js index.html sw.js \
            js/app.js js/audio-scene-map.js js/firebase-service.js js/game-data.js js/memories-screen.js \
            scripts/check-current.py scripts/check-one-love-event.py scripts/apply_v783_one_love_event.py
          git commit -m 'v0.10.783: Implement ONE LOVE event code'
          git push origin HEAD:one-love-v783-work
