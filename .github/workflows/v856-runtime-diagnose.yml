name: v0.10.856 次の小領域診断

on:
  push:
    branches:
      - codex/v0-10-856-next-small-runtime

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 検証ブランチを取得
        uses: actions/checkout@v6
        with:
          ref: codex/v0-10-856-next-small-runtime
          fetch-depth: 1

      - name: 冬文字効果の定義と依存を表示
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('js/app.js').read_text(encoding='utf-8').splitlines()
          hits = [i for i, line in enumerate(lines) if 'WinterCold' in line or 'winterCold' in line]
          print('HITS', [i + 1 for i in hits])
          covered = set()
          for hit in hits:
              start = max(0, hit - 20)
              end = min(len(lines), hit + 45)
              for i in range(start, end):
                  if i in covered:
                      continue
                  covered.add(i)
                  print(f'{i+1:05d}: {lines[i]}')
          PY
