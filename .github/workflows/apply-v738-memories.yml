name: v0.10.738 思い出の背景・人物記録を更新

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-v738-memories.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: 思い出機能を更新
        run: python3 scripts/apply-v738-memories.py

      - name: JavaScript構文確認
        run: |
          node --check js/app.js
          node --check js/memories-screen.js
          node --check js/memories-backgrounds.js
          node --check js/game-data.js
          node --check sw.js

      - name: 実装確認
        run: |
          grep -q "export const VERSION = '0.10.738'" js/game-data.js
          grep -q "const VERSION = '0.10.738'" sw.js
          grep -q "name:'中華料理屋'" js/memories-screen.js
          grep -q "name:'キャベツ野郎'" js/memories-screen.js
          grep -q "name:'ホワイト・バニー'" js/memories-screen.js
          grep -q "name:'インド料理屋の店長'" js/memories-screen.js
          grep -q "name:'外来種'" js/memories-screen.js
          grep -q "name:'幼なじみ'" js/memories-screen.js
          grep -q "name:'通りすがりのクイズ王'" js/memories-screen.js
          grep -q "pazupan-miner.png" js/memories-screen.js
          grep -q "__JXJ_MEMORIES_RECORD__" js/app.js
          test -s assets/images/ui/memories-bg-landscape-v738.webp
          test -s assets/images/ui/memories-bg-portrait-v738.webp

      - name: 一時ファイルを削除
        run: rm -f scripts/apply-v738-memories.py .github/workflows/apply-v738-memories.yml

      - name: 変更をコミットして公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.10.738 思い出の背景復旧と人物自動記録"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
