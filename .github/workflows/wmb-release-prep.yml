name: 母親・執事イベント v0.10.942 最終準備

on:
  push:
    branches:
      - feature/wolf-mother-butler-event-safe
    paths:
      - '.github/workflows/wmb-release-prep.yml'

permissions:
  contents: write

jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 安全ブランチを取得
        uses: actions/checkout@v6
        with:
          ref: feature/wolf-mother-butler-event-safe
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: ブラウザ検査環境を準備
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: v0.10.942へ同期
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          # version-sync.py は --set の最後に全 root js/*.js の ?v= を検査するため、
          # 明示Rule外のイベント参照を先に現行941から942へ揃える。
          for path in sorted((root / 'js').glob('*.js')):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('?v=0.10.941', '?v=0.10.942')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          python3 scripts/version-sync.py --set 0.10.942
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          current = root / 'scripts/check-current.py'
          text = current.read_text(encoding='utf-8')
          entry = "    ('母親・執事イベント', [sys.executable, str(ROOT / 'scripts/check-wolf-mother-butler-event.py')]),\n"
          anchor = "    ('イベント保存往復', [sys.executable, str(ROOT / 'scripts/check-event-save-roundtrip.py')]),\n"
          if entry not in text:
              if anchor not in text:
                  raise SystemExit('check-current insertion point not found')
              text = text.replace(anchor, anchor + entry, 1)
              current.write_text(text, encoding='utf-8')

          assets_generator = root / 'scripts/generate-assets-manifest.py'
          text = assets_generator.read_text(encoding='utf-8')
          event_entry = "    'js/wolf-mother-butler-event.js',\n"
          event_anchor = "    'js/wolf-boy-ring-event.js',\n"
          if event_entry not in text:
              if event_anchor not in text:
                  raise SystemExit('asset source event insertion point not found')
              text = text.replace(event_anchor, event_anchor + event_entry, 1)
          test_entry = "    'scripts/check-wolf-mother-butler-event.py',\n"
          test_anchor = "    'scripts/check-current.py',\n"
          if test_entry not in text:
              if test_anchor not in text:
                  raise SystemExit('asset source test insertion point not found')
              text = text.replace(test_anchor, test_anchor + test_entry, 1)
          assets_generator.write_text(text, encoding='utf-8')
          PY
          python3 scripts/generate-assets-manifest.py --write
          python3 scripts/generate-event-probability-list.py --write
          python3 scripts/version-sync.py --check

      - name: 母親・執事イベント専用検査
        run: python3 scripts/check-wolf-mother-butler-event.py

      - name: 総合監査
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: timeout 9m python3 -u scripts/check-current.py

      - name: v0.10.942変更をコミット
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md CHANGELOG.md GAME_RULES.md ASSETS.md TODO.md EVENT_PROBABILITY_LIST.md \
            index.html game.html auth.html sw.js hosting-origin-guard.js auth-cache-recovery.js \
            js scripts/check-current.py scripts/generate-assets-manifest.py
          if git diff --cached --quiet; then
            echo 'No release-prep changes to commit.'
            exit 0
          fi
          git commit -m 'v0.10.942 母親・執事イベント最終同期と回帰保護'
          git push origin HEAD:feature/wolf-mother-butler-event-safe

# 2026-09-12 final trigger after formal asset manifest sync
