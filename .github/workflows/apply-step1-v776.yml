name: Apply step1 v0.10.776

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage step1 v0.10.776 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Christmas convenience meal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          version_files = [
              'VERSION','auth-cache-recovery.js','game.html','hosting-origin-guard.js','index.html',
              'js/app.js','js/firebase-service.js','js/game-data.js','js/memories-screen.js','sw.js'
          ]
          for rel in version_files:
              p = Path(rel)
              s = p.read_text()
              if '0.10.775' not in s and rel != 'VERSION':
                  raise SystemExit(f'expected 0.10.775 in {rel}')
              s = s.replace('0.10.775','0.10.776')
              p.write_text(s)

          app = Path('js/app.js')
          s = app.read_text()
          old = "  convenience: './assets/images/foods/convenience.png',\n"
          new = old + "  convenienceChristmas: './assets/images/foods/convenience-christmas-v776.webp',\n"
          if s.count(old) != 1:
              raise SystemExit('convenience image anchor mismatch')
          s = s.replace(old, new, 1)
          old_fn = """function mealFoodImage(mealId) {
            return versionedAsset(MEAL_FOOD_IMAGES[mealId] || '');
          }
          """
          new_fn = """function mealFoodImage(mealId) {
            if (mealId === 'convenience') {
              const date = gameDateForDay(state?.game?.day || 1);
              if (isValidGameDate(date) && date.getMonth() === 11 && (date.getDate() === 24 || date.getDate() === 25)) {
                return versionedAsset(MEAL_FOOD_IMAGES.convenienceChristmas);
              }
            }
            return versionedAsset(MEAL_FOOD_IMAGES[mealId] || '');
          }
          """
          if s.count(old_fn) != 1:
              raise SystemExit('mealFoodImage anchor mismatch')
          s = s.replace(old_fn, new_fn, 1)
          app.write_text(s)
          PY
          test -f assets/images/foods/convenience-christmas-v776.webp
          node --check js/app.js
          node --check js/firebase-service.js
          python3 scripts/check-current.py
          grep -q '^0.10.776$' VERSION
          grep -q "convenienceChristmas: './assets/images/foods/convenience-christmas-v776.webp'" js/app.js
          grep -q "date.getMonth() === 11" js/app.js
          grep -q "date.getDate() === 24 || date.getDate() === 25" js/app.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cadgosho-dot'
          git config user.email 'cadgosho@gmail.com'
          git add VERSION auth-cache-recovery.js game.html hosting-origin-guard.js index.html js/app.js js/firebase-service.js js/game-data.js js/memories-screen.js sw.js assets/images/foods/convenience-christmas-v776.webp
          git commit -m 'v0.10.776: Christmas convenience chicken'
          git push origin main
