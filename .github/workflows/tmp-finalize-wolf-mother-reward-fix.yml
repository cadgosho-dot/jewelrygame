name: Temporary Finalize Wolf Mother Reward Fix

on:
  push:
    branches:
      - fix/wolf-mother-reward-stall

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/wolf-mother-reward-stall
          fetch-depth: 0

      - name: Modularize helper and strengthen regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if version != '0.10.943':
              raise SystemExit(f'unexpected VERSION: {version}')

          # Keep app.js as wiring only. Remove the temporary inline helper implementation.
          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          start_token = 'globalThis.__JXJ_EVENT_STATE_HELPERS__ = Object.freeze({'
          end_token = 'globalThis.__JXJ_MEMORIES_STATE__'
          start = app.find(start_token)
          if start < 0:
              raise SystemExit('inline event helper start not found')
          end = app.find(end_token, start)
          if end < 0:
              raise SystemExit('inline event helper end marker not found')
          app = app[:start] + app[end:]

          import_old = "import { createPressHoldController } from './ui/press-hold-controller.js?v=0.10.943';"
          import_new = import_old + " import { createEventStateHelpers } from './events/event-state-helpers.js?v=0.10.943';"
          if app.count(import_old) != 1:
              raise SystemExit(f'press-hold import marker count={app.count(import_old)}')
          app = app.replace(import_old, import_new, 1)

          state_old = 'let state = null;\nglobalThis.__JXJ_MEMORIES_STATE__'
          state_new = 'let state = null; globalThis.__JXJ_EVENT_STATE_HELPERS__ = createEventStateHelpers(() => state, saveGame, showToast, playSfx, roundedMetalWeight, METALS);\nglobalThis.__JXJ_MEMORIES_STATE__'
          if app.count(state_old) != 1:
              raise SystemExit(f'state wiring marker count={app.count(state_old)}')
          app = app.replace(state_old, state_new, 1)
          app_path.write_text(app, encoding='utf-8')

          helper_path = Path('js/events/event-state-helpers.js')
          helper_path.parent.mkdir(parents=True, exist_ok=True)
          helper_path.write_text("""export function createEventStateHelpers(getState, saveGame, showToast, playSfx, roundedMetalWeight, metals) {
  const readState = () => {
    try { return getState?.() || null; } catch (_) { return null; }
  };
  const persist = () => {
    try { void saveGame?.(); } catch (_) {}
  };
  return Object.freeze({
    patchEventState(eventKey, patch) {
      try {
        const state = readState();
        if (!state) return { ok:false, reason:'state-unavailable' };
        const key = String(eventKey || '').trim();
        if (!key || !patch || typeof patch !== 'object' || Array.isArray(patch)) return { ok:false, reason:'invalid-arguments' };
        state.events = state.events && typeof state.events === 'object' && !Array.isArray(state.events) ? state.events : {};
        const current = state.events[key] && typeof state.events[key] === 'object' && !Array.isArray(state.events[key]) ? state.events[key] : {};
        state.events[key] = { ...current, ...patch };
        persist();
        return { ok:true };
      } catch (error) {
        console.warn('[EventStateHelpers] patchEventState failed', error);
        return { ok:false, error };
      }
    },
    grantMetalIgnoreCapacity(metalKey, amount, options = {}) {
      try {
        const state = readState();
        if (!state) return { ok:false, reason:'state-unavailable' };
        const key = String(metalKey || '').trim();
        const quantity = Number(amount);
        if (!metals?.[key] || !Number.isFinite(quantity) || quantity <= 0) return { ok:false, reason:'invalid-arguments' };
        state.inventory = state.inventory && typeof state.inventory === 'object' && !Array.isArray(state.inventory) ? state.inventory : {};
        state.inventory.metals = state.inventory.metals && typeof state.inventory.metals === 'object' && !Array.isArray(state.inventory.metals) ? state.inventory.metals : {};
        const current = Math.max(0, Number(state.inventory.metals[key]) || 0);
        state.inventory.metals[key] = roundedMetalWeight(current + quantity);
        if (options?.message) showToast?.(String(options.message), options.type || 'success');
        if (options?.withSound !== false) playSfx?.('coin', { gain:.9 });
        persist();
        return { ok:true, value:state.inventory.metals[key] };
      } catch (error) {
        console.warn('[EventStateHelpers] grantMetalIgnoreCapacity failed', error);
        return { ok:false, error };
      }
    },
  });
}
""", encoding='utf-8')

          unit_path = Path('tools/test-event-state-helpers.mjs')
          unit_path.write_text("""import assert from 'node:assert/strict';
import { createEventStateHelpers } from '../js/events/event-state-helpers.js';

const state = { events:{ wolfMotherButlerEvent:{ active:true, stage:'reward' } }, inventory:{ metals:{ gold:5 } } };
let saves = 0;
const toasts = [];
const sounds = [];
const helper = createEventStateHelpers(
  () => state,
  () => { saves += 1; },
  (...args) => toasts.push(args),
  (...args) => sounds.push(args),
  (value) => Math.round(Math.max(0, Number(value) || 0) * 10) / 10,
  { gold:{} },
);

const reward = helper.grantMetalIgnoreCapacity('gold', 20, { message:'K18YGが20g追加されました', type:'success', withSound:false });
assert.equal(reward.ok, true);
assert.equal(state.inventory.metals.gold, 25);
assert.equal(toasts.length, 1);
assert.equal(sounds.length, 0);
assert.equal(saves, 1);

const progress = helper.patchEventState('wolfMotherButlerEvent', { stage:'dialogue8', rewardGranted:true });
assert.equal(progress.ok, true);
assert.equal(state.events.wolfMotherButlerEvent.stage, 'dialogue8');
assert.equal(state.events.wolfMotherButlerEvent.rewardGranted, true);
assert.equal(state.events.wolfMotherButlerEvent.active, true);
assert.equal(saves, 2);

const secondTap = helper.grantMetalIgnoreCapacity('unknown', 20);
assert.equal(secondTap.ok, false);
assert.equal(state.inventory.metals.gold, 25);
assert.equal(saves, 2);

console.log('EVENT STATE HELPERS TEST: PASS');
console.log('K18YG 20g付与とreward→dialogue8進行状態の保存を確認しました。');
""", encoding='utf-8')

          # Precache the new startup dependency without adding an extra physical line.
          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw_old = "'./js/ui/press-hold-controller.js?v=0.10.943', './js/audio.js?v=0.10.943'"
          sw_new = "'./js/ui/press-hold-controller.js?v=0.10.943', './js/events/event-state-helpers.js?v=0.10.943', './js/audio.js?v=0.10.943'"
          if sw.count(sw_old) != 1:
              raise SystemExit(f'sw marker count={sw.count(sw_old)}')
          sw_path.write_text(sw.replace(sw_old, sw_new, 1), encoding='utf-8')

          # Teach future version bumps about both references.
          vs_path = Path('scripts/version-sync.py')
          vs = vs_path.read_text(encoding='utf-8')
          sw_rule = "    Rule('sw.js', 'press-hold-controller.js precache key', qparam(r'\\./js/ui/press-hold-controller\\.js'), keep_prefix),"
          sw_rule_new = sw_rule + "\n    Rule('sw.js', 'event-state-helpers.js precache key', qparam(r'\\./js/events/event-state-helpers\\.js'), keep_prefix),"
          if vs.count(sw_rule) != 1:
              raise SystemExit(f'version-sync sw marker count={vs.count(sw_rule)}')
          vs = vs.replace(sw_rule, sw_rule_new, 1)
          app_rule = "    Rule('js/app.js', 'press-hold-controller.js import key', qparam(r'\\./ui/press-hold-controller\\.js'), keep_prefix),"
          app_rule_new = app_rule + "\n    Rule('js/app.js', 'event-state-helpers.js import key', qparam(r'\\./events/event-state-helpers\\.js'), keep_prefix),"
          if vs.count(app_rule) != 1:
              raise SystemExit(f'version-sync app marker count={vs.count(app_rule)}')
          vs_path.write_text(vs.replace(app_rule, app_rule_new, 1), encoding='utf-8')

          # Strengthen the event checker: app only wires; behavior lives in the event module.
          test_path = Path('scripts/check-wolf-mother-butler-event.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('import hashlib\nfrom pathlib import Path', 'import hashlib\nimport subprocess\nimport sys\nfrom pathlib import Path', 1)
          test = test.replace("APP = ROOT / 'js/app.js'\nBOOTSTRAP", "APP = ROOT / 'js/app.js'\nHELPERS = ROOT / 'js/events/event-state-helpers.js'\nUNIT = ROOT / 'tools/test-event-state-helpers.mjs'\nBOOTSTRAP", 1)
          test = test.replace("    require(APP.exists(), 'app.js がありません')\n    require(BOOTSTRAP.exists()", "    require(APP.exists(), 'app.js がありません')\n    require(HELPERS.exists(), 'event-state-helpers.js がありません')\n    require(UNIT.exists(), 'test-event-state-helpers.mjs がありません')\n    require(BOOTSTRAP.exists()", 1)
          test = test.replace("    app_source = APP.read_text(encoding='utf-8')\n    bootstrap", "    app_source = APP.read_text(encoding='utf-8')\n    helper_source = HELPERS.read_text(encoding='utf-8')\n    bootstrap", 1)
          old_checks = """    require('globalThis.__JXJ_EVENT_STATE_HELPERS__' in app_source, 'イベント状態ヘルパーがapp.jsに公開されていません')
    require('patchEventState(eventKey, patch)' in app_source, 'イベント状態保存ヘルパーがありません')
    require('grantMetalIgnoreCapacity(metalKey, amount' in app_source, '容量無視の地金付与ヘルパーがありません')
    require('state.events[key] = { ...current, ...patch };' in app_source, 'イベント進行状態を実stateへ保存していません')
    require('state.inventory.metals[key] = roundedMetalWeight(current + quantity);' in app_source, '報酬地金を実stateへ加算していません')
"""
          new_checks = """    require(f\"from './events/event-state-helpers.js?v={version}'\" in app_source, 'イベント状態ヘルパーのVERSION付きimportがありません')
    require('globalThis.__JXJ_EVENT_STATE_HELPERS__ = createEventStateHelpers(() => state, saveGame, showToast, playSfx, roundedMetalWeight, METALS);' in app_source, 'app.jsのイベント状態ヘルパー接続がありません')
    require('patchEventState(eventKey, patch)' in helper_source, 'イベント状態保存ヘルパーがありません')
    require('grantMetalIgnoreCapacity(metalKey, amount' in helper_source, '容量無視の地金付与ヘルパーがありません')
    require('state.events[key] = { ...current, ...patch };' in helper_source, 'イベント進行状態を実stateへ保存していません')
    require('state.inventory.metals[key] = roundedMetalWeight(current + quantity);' in helper_source, '報酬地金を実stateへ加算していません')
"""
          if test.count(old_checks) != 1:
              raise SystemExit(f'event checker integration block count={test.count(old_checks)}')
          test = test.replace(old_checks, new_checks, 1)
          finish_marker = "    print('OK: 母親・執事イベントの発生条件・登録済みセリフ・通常イベントUI・報酬・音声制御・正式アセットを確認しました。')"
          unit_run = """    unit = subprocess.run(['node', str(UNIT)], cwd=ROOT, text=True, capture_output=True)
    print(unit.stdout, end='')
    if unit.stderr:
        print(unit.stderr, file=sys.stderr, end='')
    require(unit.returncode == 0, 'イベント状態ヘルパーの実動テストに失敗しました')

""" + finish_marker
          if test.count(finish_marker) != 1:
              raise SystemExit('event checker finish marker not unique')
          test_path.write_text(test.replace(finish_marker, unit_run, 1), encoding='utf-8')

          # Register the event regression in the normal comprehensive audit.
          current_path = Path('scripts/check-current.py')
          current = current_path.read_text(encoding='utf-8')
          current_marker = "    ('イベント構造整合', [sys.executable, str(ROOT / 'scripts/check-event-integrity.py')]),"
          current_new = "    ('狼の母親・執事イベント', [sys.executable, str(ROOT / 'scripts/check-wolf-mother-butler-event.py')]),\n" + current_marker
          if current.count(current_marker) != 1 or 'check-wolf-mother-butler-event.py' in current:
              raise SystemExit('check-current event marker unexpected')
          current_path.write_text(current.replace(current_marker, current_new, 1), encoding='utf-8')

          # Keep the change history accurate after moving logic out of app.js.
          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          old_line = '- 狼の母親・執事イベントで、K18YG 20gの報酬タップ時に地金付与処理へ接続できず進行停止する不具合を修正。イベント状態保存と容量無視の報酬付与を既存stateへ接続する最小限のブリッジを追加。'
          new_line = '- 狼の母親・執事イベントで、K18YG 20gの報酬タップ時に地金付与処理へ接続できず進行停止する不具合を修正。状態保存・容量無視の報酬付与は `js/events/event-state-helpers.js` へ分離し、`app.js` には既存stateへの最小限の接続だけを追加。'
          if changelog.count(old_line) != 1:
              raise SystemExit('changelog hotfix line not found uniquely')
          changelog_path.write_text(changelog.replace(old_line, new_line, 1), encoding='utf-8')

          Path('PR_CHECK_FAILURE.txt').unlink(missing_ok=True)
          PY

      - name: Prepare full validation environment
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Run focused and full checks
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-wolf-mother-butler-event.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-management-docs.py
          python3 scripts/check-metal-weight-label.py
          timeout 8m python3 -u scripts/check-current.py

      - name: Commit validated fix and remove temporary workflow
        run: |
          rm .github/workflows/tmp-finalize-wolf-mother-reward-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.10.943 狼の母親イベント報酬修正をモジュール化"
          git push origin HEAD:fix/wolf-mother-reward-stall
