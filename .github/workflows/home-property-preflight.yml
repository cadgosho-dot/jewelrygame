name: 自宅物件事前検査

on:
  push:
    branches:
      - feature/home-property-b-v010944
    paths:
      - '.github/workflows/home-property-preflight.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ブランチ取得
        uses: actions/checkout@v6
        with:
          ref: feature/home-property-b-v010944
          fetch-depth: 0

      - name: 自宅物件検査を総合監査へ登録
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-current.py')
          text = p.read_text(encoding='utf-8')
          marker = "    ('店舗家賃年次上昇', [sys.executable, str(ROOT / 'scripts/check-store-rent-escalation.py')]),\n"
          line = "    ('自宅物件A・物件Ｂ', [sys.executable, str(ROOT / 'scripts/check-home-property.py')]),\n"
          if line not in text:
              if text.count(marker) != 1:
                  raise SystemExit('FAIL: check-current insertion point')
              p.write_text(text.replace(marker, marker + line, 1), encoding='utf-8')
          PY
          if ! git diff --quiet -- scripts/check-current.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/check-current.py
            git commit -m '自宅物件検査を総合監査へ登録'
            git push origin HEAD:feature/home-property-b-v010944
          fi

      - name: JavaScript構文確認
        run: node --check js/app.js

      - name: VERSION同期確認
        run: python3 scripts/version-sync.py --check

      - name: 自宅家賃回帰保護
        run: python3 scripts/check-home-rent-regression.py

      - name: 自宅物件計算ロジック
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { HOME_PROPERTY_UNLOCK_DAY, HOME_MOVE_COST, HOME_PROPERTY_B_MONTHLY_RENT, normalizeHomeProperty, homePropertyUnlocked, homePropertyMonthlyRent, homePropertyMoveTotal, homePropertyBackgroundAsset } from './js/finance/home-property.js';
          assert.equal(HOME_PROPERTY_UNLOCK_DAY, 351);
          assert.equal(HOME_MOVE_COST, 1000000);
          assert.equal(HOME_PROPERTY_B_MONTHLY_RENT, 200000);
          assert.equal(homePropertyUnlocked(350), false);
          assert.equal(homePropertyUnlocked(351), true);
          assert.equal(normalizeHomeProperty(undefined), 'A');
          assert.equal(homePropertyMonthlyRent('A', 70000), 70000);
          assert.equal(homePropertyMonthlyRent('B', 70000), 200000);
          assert.equal(homePropertyMoveTotal('A', 70000), 1070000);
          assert.equal(homePropertyMoveTotal('B', 70000), 1200000);
          assert.equal(homePropertyBackgroundAsset('A', false), 'sleep');
          assert.equal(homePropertyBackgroundAsset('B', true), 'home-property-b-portrait');
          console.log('HOME PROPERTY PREFLIGHT: PASS');
          NODE

      - name: 中核回帰基準
        run: python3 scripts/check-regression-baseline.py

      - name: 店舗家賃回帰確認
        run: python3 scripts/check-store-rent-escalation.py
