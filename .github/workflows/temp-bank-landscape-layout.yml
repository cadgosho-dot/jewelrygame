name: Temporary bank landscape layout fix

on:
  push:
    branches:
      - fix/bank-landscape-menu-layout-20261001
    paths:
      - .github/workflows/temp-bank-landscape-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded landscape layout fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/finance/bank-ui.js')
          text = path.read_text()

          old = '''    .jxj-bank-content{\n      position:relative; z-index:2; flex:1; min-height:0; overflow:auto;\n      display:grid; align-items:center;\n      padding:clamp(12px,2vw,24px);\n      padding-bottom:max(18px,var(--safe-bottom,8px));\n    }\n'''
          new = '''    .jxj-bank-content{\n      position:relative; z-index:2; flex:1; min-height:0; overflow:auto;\n      display:grid; align-items:center;\n      padding-inline:clamp(12px,2vw,24px);\n      padding-bottom:max(18px,var(--safe-bottom,8px));\n    }\n'''
          assert text.count(old) == 1, f'base content padding block count={text.count(old)}'
          text = text.replace(old, new, 1)

          marker = '''    @media (orientation:landscape) and (max-height:650px){\n'''
          insert = '''    @media (orientation:landscape){\n      .jxj-bank-menu{grid-template-columns:repeat(3,minmax(0,1fr));}\n    }\n    @media (orientation:landscape) and (max-height:650px){\n'''
          assert text.count(marker) == 1, f'landscape media marker count={text.count(marker)}'
          text = text.replace(marker, insert, 1)

          old = '''      .jxj-bank-content{padding:10px 18px;}\n'''
          new = '''      .jxj-bank-content{padding-inline:18px; padding-bottom:10px;}\n'''
          assert text.count(old) == 1, f'compact landscape padding count={text.count(old)}'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify bank regression
        run: node tools/test-bank-regression.mjs

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/finance/bank-ui.js
          git rm .github/workflows/temp-bank-landscape-layout.yml
          git commit -m "fix: separate bank landscape menu from header"
          git push origin HEAD:${GITHUB_REF_NAME}
