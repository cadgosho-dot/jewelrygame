name: Phase17 Validate Monthly Fixed Costs

on:
  push:
    branches:
      - phase17-protect-monthly-fixed-costs

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check
        run: |
          node --check js/app.js
          node --check tools/test-process-monthly-fixed-costs-regression.mjs
          python3 -m py_compile scripts/check-process-monthly-fixed-costs-regression.py
      - name: Dynamic regression
        run: node tools/test-process-monthly-fixed-costs-regression.mjs
      - name: Static protection checker
        run: python3 scripts/check-process-monthly-fixed-costs-regression.py
