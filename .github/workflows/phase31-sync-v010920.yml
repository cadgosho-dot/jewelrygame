name: Phase31 Formal Sync v0.10.920

on:
  push:
    branches: [main, phase31-aquarium-mortality-protection]
    paths:
      - '.github/workflows/phase31-sync-v010920.yml'
      - 'tools/test-aquarium-mortality-regression.mjs'
      - 'scripts/check-aquarium-mortality-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'phase31-aquarium-mortality-protection'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate aquarium mortality protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-aquarium-mortality-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.919'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('回転寿司開始・会計処理保護', [sys.executable, str(ROOT / 'scripts/check-kaitenzushi-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-aquarium-mortality-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('水槽死亡・枯死確定処理保護', [sys.executable, str(ROOT / 'scripts/check-aquarium-mortality-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.920\n- 中核処理保護・第31段階：水槽の魚・水草の1日ごとの死亡／枯死確定処理を動的回帰テストと静的検査で固定。\n- 同日二重処理防止、対象個体の抽選、個体配列・水槽数・所有数の減算、累計死亡／枯死数、通知履歴30件上限、同期リビジョン更新を検証。\n- ゲーム処理・死亡率・枯死率・仕様・価格・イベント・画像・音声・セーブ形式の変更なし。\n'
          assert '## v0.10.920' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-aquarium-mortality-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.919', '?v=0.10.920').replace("const UI_BUILD_VERSION = '0.10.919';", "const UI_BUILD_VERSION = '0.10.920';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase31-sync-v010920.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.920 第31段階正式同期'
          git push origin HEAD:main
