name: ボムじいさん画像を少し暗くする

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-bomjii-darken.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Pillowを準備
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: ボムじいさん画像のみ少し暗くする
        run: python3 scripts/apply-bomjii-darken.py

      - name: 変更対象を確認
        run: |
          git diff --name-only
          test "$(git diff --name-only | tr '\n' ' ')" = "assets/images/events/pazupan-miner.png "

      - name: 一時ファイルを削除
        run: rm -f scripts/apply-bomjii-darken.py .github/workflows/apply-bomjii-darken.yml

      - name: 更新をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ボムじいさん画像のみ少し暗く調整"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
