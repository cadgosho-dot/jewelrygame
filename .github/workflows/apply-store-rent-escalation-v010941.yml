name: Apply store rent escalation v0.10.941

on:
  push:
    branches:
      - feature/store-rent-escalation-v010941

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/store-rent-escalation-v010941
          fetch-depth: 0

      - name: Apply store rent escalation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          text = app_path.read_text(encoding='utf-8')
          old = """function storeMonthlyRent(branchNumber = 1) {
            return Math.max(0, Number(STORE_MONTHLY_RENTS[branchNumber]) || 0);
          }
          """
          new = """const STORE_RENT_ESCALATION_PERIOD_DAYS = 360;
          const STORE_RENT_ESCALATION_MAX_YEARS = 10;
          const STORE_RENT_ESCALATION_RATE = 1.2;
          const STORE_RENT_ESCALATION_ROUNDING_UNIT = 1000;

          function storeMonthlyRent(branchNumber = 1) {
            const baseRent = Math.max(0, Number(STORE_MONTHLY_RENTS[branchNumber]) || 0);
            if (!baseRent) return 0;

            const branch = (state?.store?.branches || []).find((entry) => Number(entry?.number) === Number(branchNumber));
            if (!branch) return baseRent;

            const currentDay = Math.max(1, Math.floor(Number(state?.game?.day) || 1));
            const rentedDay = Math.max(1, Math.floor(Number(branch?.rentedDay) || 1));
            const elapsedDays = Math.max(0, currentDay - rentedDay);
            const increaseYears = Math.min(
              STORE_RENT_ESCALATION_MAX_YEARS,
              Math.floor(elapsedDays / STORE_RENT_ESCALATION_PERIOD_DAYS),
            );

            let rent = baseRent;
            for (let year = 0; year < increaseYears; year += 1) {
              rent = Math.ceil((rent * STORE_RENT_ESCALATION_RATE) / STORE_RENT_ESCALATION_ROUNDING_UNIT)
                * STORE_RENT_ESCALATION_ROUNDING_UNIT;
            }
            return rent;
          }
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one storeMonthlyRent target, found {count}')
          app_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > scripts/check-store-rent-escalation.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import math

          ROOT = Path(__file__).resolve().parents[1]
          APP = (ROOT / 'js/app.js').read_text(encoding='utf-8')

          required = [
              'const STORE_RENT_ESCALATION_PERIOD_DAYS = 360;',
              'const STORE_RENT_ESCALATION_MAX_YEARS = 10;',
              'const STORE_RENT_ESCALATION_RATE = 1.2;',
              'const STORE_RENT_ESCALATION_ROUNDING_UNIT = 1000;',
              'Math.floor(elapsedDays / STORE_RENT_ESCALATION_PERIOD_DAYS)',
              'Math.ceil((rent * STORE_RENT_ESCALATION_RATE) / STORE_RENT_ESCALATION_ROUNDING_UNIT)',
              '(state?.store?.branches || []).find',
              'Number(branch?.rentedDay)',
          ]
          for needle in required:
              if needle not in APP:
                  raise SystemExit(f'STORE RENT ESCALATION: missing {needle}')

          def rent_for(base, elapsed_days):
              years = min(10, max(0, elapsed_days) // 360)
              rent = base
              for _ in range(years):
                  rent = math.ceil((rent * 1.2) / 1000) * 1000
              return rent

          cases = {
              150000: [150000, 180000, 216000, 260000, 312000, 375000, 450000, 540000, 648000, 778000, 934000],
              400000: [400000, 480000, 576000, 692000, 831000, 998000, 1198000, 1438000, 1726000, 2072000, 2487000],
              700000: [700000, 840000, 1008000, 1210000, 1452000, 1743000, 2092000, 2511000, 3014000, 3617000, 4341000],
          }
          for base, expected in cases.items():
              actual = [rent_for(base, year * 360) for year in range(11)]
              if actual != expected:
                  raise SystemExit(f'STORE RENT ESCALATION: {base} sequence mismatch: {actual}')

          boundary = [
              (150000, 359, 150000),
              (150000, 360, 180000),
              (150000, 719, 180000),
              (150000, 720, 216000),
              (150000, 3599, 778000),
              (150000, 3600, 934000),
              (150000, 99999, 934000),
          ]
          for base, elapsed, expected in boundary:
              actual = rent_for(base, elapsed)
              if actual != expected:
                  raise SystemExit(f'STORE RENT ESCALATION boundary failed: {base}, {elapsed}: {actual} != {expected}')

          print('STORE RENT ESCALATION: PASS')
          PY

      - name: Synchronize version
        run: |
          python3 scripts/version-sync.py --set 0.10.941
          python3 scripts/version-sync.py --check

      - name: Run focused regression checks
        run: |
          python3 scripts/check-store-rent-escalation.py
          python3 scripts/check-process-monthly-fixed-costs-regression.py
          python3 scripts/check-rent-next-store-regression.py

      - name: Run current audit
        run: python3 scripts/check-current.py

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-store-rent-escalation-v010941.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "店舗家賃を契約から10年間毎年1.2倍へ更新"
          git push origin HEAD:feature/store-rent-escalation-v010941
