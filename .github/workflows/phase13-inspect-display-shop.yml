name: Phase13 Inspect Display Shop

on:
  push:
    branches:
      - phase13-display-shop-regression-v0.10.902

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.head_commit.message != 'phase13 compact inspection output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase13-display-shop-regression-v0.10.902
          fetch-depth: 1
      - name: Extract compact current display-shop purchase code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('js/app.js').read_text(encoding='utf-8')
          lines = text.splitlines()
          out = []
          m = re.search(r'(?m)^function\s+buyDisplayProduct\s*\([^\n]*\)\s*\{', text)
          if not m:
              raise SystemExit('buyDisplayProduct not found')
          brace = text.find('{', m.start())
          depth = 0; quote = None; escape = False; end = None
          i = brace
          while i < len(text):
              c = text[i]
              if quote:
                  if escape: escape = False
                  elif c == '\\': escape = True
                  elif c == quote: quote = None
              else:
                  if c in "'\"`": quote = c
                  elif c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1; break
              i += 1
          if end is None: raise SystemExit('function end not found')
          out.append(text[m.start():end])
          out.append('\n--- DISPLAY_SHOP_PRODUCTS CONTEXT ---')
          for idx, line in enumerate(lines):
              if 'DISPLAY_SHOP_PRODUCTS' in line and ('const ' in line or 'Object.freeze' in line):
                  lo=max(0, idx-2); hi=min(len(lines), idx+16)
                  out.extend(lines[lo:hi]); break
          Path('_phase13-buy-display-product.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _phase13-buy-display-product.txt
          if ! git diff --cached --quiet; then
            git commit -m 'phase13 compact inspection output'
            git push origin HEAD:phase13-display-shop-regression-v0.10.902
          fi