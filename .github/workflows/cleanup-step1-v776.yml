name: Cleanup step1 v0.10.776

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run cleanup step1 v0.10.776'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-step1-v776.yml
          rm -rf .github/v776-step1
          rm -f .github/workflows/cleanup-step1-v776.yml
          git config user.name 'cadgosho-dot'
          git config user.email 'cadgosho@gmail.com'
          git add -A .github
          git commit -m 'Clean v0.10.776 staging files'
          git push origin main
