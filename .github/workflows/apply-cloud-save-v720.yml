name: Apply cloud save v720

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_cloud_save_v720.py'
      - '.github/workflows/apply-cloud-save-v720.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.10.720 hotfix
        run: python3 scripts/apply_cloud_save_v720.py

      - name: Validate JavaScript syntax
        run: |
          node --check js/firebase-service.js
          node --check js/app.js
          node --check js/game-data.js

      - name: Validate release markers
        run: |
          grep -q "0.10.720" js/game-data.js
          grep -q "0.10.720" js/app.js
          grep -q "0.10.720" sw.js
          grep -q "CLOUD_INLINE_SAFE_BYTES" js/firebase-service.js
          grep -q "cloudSaveFailureActive" js/app.js
          test -f PATCH_MANIFEST_v0.10.720.txt

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "720 cloud save reliability fix"
          git push origin main
