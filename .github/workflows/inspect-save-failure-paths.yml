name: Inspect save failure paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-save-failure-paths.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Print startup failure fallback and newest-save chooser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def show(path, start, end):
              lines=Path(path).read_text(encoding='utf-8').splitlines()
              print(f'--- {path} lines {start}-{end} ---')
              for i in range(start-1, min(end,len(lines))): print(f'{i+1}: {lines[i]}')

          app=Path('js/app.js').read_text(encoding='utf-8').splitlines()
          hit=next(i for i,l in enumerate(app) if 'cloudSave = await loadState(user.uid)' in l)
          show('js/app.js', max(1,hit+1-25), hit+1+150)

          core=Path('js/game-data-core.js').read_text(encoding='utf-8').splitlines()
          hits=[i for i,l in enumerate(core) if 'chooseNewestSavedState' in l]
          for hit in hits[:3]: show('js/game-data-core.js', max(1,hit+1-25), hit+1+90)
          PY
