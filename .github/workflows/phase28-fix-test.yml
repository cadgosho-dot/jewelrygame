name: Phase28 Fix Test Extractor
on:
  push:
    branches: [phase28-autopilot-protection]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase28-autopilot-protection
          fetch-depth: 1
      - name: Fix extractor and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/test-autopilot-regression.mjs')
          text = p.read_text(encoding='utf-8')
          old = '''function extractFunction(name) {
  const re = new RegExp(`(?:async\\\\s+)?function\\\\s+${name}\\\\s*\\\\(`);
  const match = re.exec(source);
  assert.ok(match, `function ${name} not found`);
  const open = source.indexOf('{', match.index);
  assert.ok(open >= 0, `function ${name} opening brace not found`);
  let depth = 0;
  for (let i = open; i < source.length; i += 1) {
    const ch = source[i];
    if (ch === '{') depth += 1;
    else if (ch === '}') {
      depth -= 1;
      if (depth === 0) return source.slice(match.index, i + 1);
    }
  }
  throw new Error(`function ${name} closing brace not found`);
}
'''
          new = '''function extractFunction(name) {
  const re = new RegExp(`(?:async\\\\s+)?function\\\\s+${name}\\\\s*\\\\(`);
  const match = re.exec(source);
  assert.ok(match, `function ${name} not found`);
  const parenOpen = source.indexOf('(', match.index);
  assert.ok(parenOpen >= 0, `function ${name} parameter list not found`);
  let parenDepth = 0;
  let parenClose = -1;
  for (let i = parenOpen; i < source.length; i += 1) {
    if (source[i] === '(') parenDepth += 1;
    else if (source[i] === ')') {
      parenDepth -= 1;
      if (parenDepth === 0) {
        parenClose = i;
        break;
      }
    }
  }
  assert.ok(parenClose >= 0, `function ${name} parameter list did not close`);
  const open = source.indexOf('{', parenClose);
  assert.ok(open >= 0, `function ${name} opening brace not found`);
  let depth = 0;
  for (let i = open; i < source.length; i += 1) {
    const ch = source[i];
    if (ch === '{') depth += 1;
    else if (ch === '}') {
      depth -= 1;
      if (depth === 0) return source.slice(match.index, i + 1);
    }
  }
  throw new Error(`function ${name} closing brace not found`);
}
'''
          if old not in text:
              raise SystemExit('old extractor block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase28-fix-test.yml
          git add tools/test-autopilot-regression.mjs
          git commit -m "第28段階 テスト関数抽出器を修正"
          git push origin HEAD:phase28-autopilot-protection
