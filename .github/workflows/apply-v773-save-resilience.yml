name: Apply v0.10.773 save resilience

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v773-save-resilience.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - name: Patch save resilience
        run: python3 scripts/apply-v773-save-resilience.py
      - name: Syntax and resilience tests
        run: |
          node --check js/firebase-service.js
          node --check js/app.js
          node --check js/game-data-core.js
          python3 scripts/check-save-resilience-v773.py
          python3 scripts/check-long-term-history.py
          python3 scripts/check-save-diagnostics.py
          python3 scripts/check-current.py
      - name: Verify version and protected workflow
        run: |
          test "$(cat VERSION)" = "0.10.773"
          grep -q "pip install.*Pillow\|pip install Pillow" .github/workflows/update-metals.yml
          git diff --check
          git status --short
      - name: Commit implementation
        run: |
          git config user.name "cadgosho-dot"
          git config user.email "cadgosho@gmail.com"
          git add VERSION index.html service-worker.js js/app.js js/game-data.js js/game-data-core.js js/firebase-service.js scripts/check-save-resilience-v773.py
          git commit -m "v0.10.773: Harden save recovery and concurrency"
          git push origin main
