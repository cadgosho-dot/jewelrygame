name: 第30段階一時検証

on:
  push:
    branches:
      - refactor-stage30-save-diagnostic-capacity-label

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ブランチ取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: 第30段階を適用
        run: python3 tools/apply-stage30.py

      - name: 検証環境を準備
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: 管理資料を再生成
        run: |
          python3 scripts/generate-event-probability-list.py --write
          python3 scripts/generate-assets-manifest.py --write

      - name: 一時ファイルを作業ツリーから除去
        run: |
          rm -f tools/apply-stage30.py
          rm -f .github/workflows/stage30-temp.yml

      - name: 専用検査
        run: |
          node tools/test-save-diagnostic-capacity-label.mjs
          python3 scripts/check-save-diagnostic-capacity-label.py

      - name: 総合監査と実ブラウザ検査
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: python3 -u scripts/check-current.py

      - name: 画像差分と工具画像を確認
        run: |
          if git diff --name-only -- assets | grep -E '\.(png|jpe?g|webp|gif|svg|wav|mp3|mp4)$'; then
            echo '画像・音声・動画ファイルに意図しない差分があります。'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          expected = [
              'bench-peg.png','buffer.png','diamond-polishing-lap.png','dividers.png','electronic-scale.png',
              'engraving-block.png','file.png','gem-polishing-machine.png','graver.png','hammer.png','jewelry-bench.png',
              'loupe.png','magnifier.png','milgrain-tool.png','nipper.png','piercing-saw.png','pliers.png','rolling-mill.png',
              'rotary-tool.png','stamps.png','torch.png','ultrasonic-cleaner.png','wood-block.png',
          ]
          root = Path('assets/images/tools')
          missing = [name for name in expected if not (root / name).is_file()]
          if missing:
              raise SystemExit('工具・設備画像不足: ' + ', '.join(missing))
          print(f'工具・設備画像: {len(expected)}/23')
          PY

      - name: 第30段階をコミット
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.10.878 セーブ診断容量判定表示をhelperへ分離'
          git push origin "HEAD:${GITHUB_REF_NAME}"
