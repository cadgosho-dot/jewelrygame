name: phase9 inspect core
on:
  push:
    branches: [phase9-protect-core-v010898]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate phase9 purchase protection
        run: |
          set -euo pipefail
          node --check tools/test-purchase-regression.mjs
          node tools/test-purchase-regression.mjs
          python3 scripts/check-purchase-regression.py
          git fetch --depth=1 origin db18180682df83487b4297364953ba1980b80162
          test -z "$(git diff db18180682df83487b4297364953ba1980b80162 -- js/app.js)"
          echo "APP LOGIC DIFF: PASS (js/app.js unchanged)"
