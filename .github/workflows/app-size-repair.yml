name: app.js肥大化修正

on:
  push:
    paths:
      - '.github/workflows/app-size-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: 最新mainを取得
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: 食事画像定義をUIモジュールへ分離
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          module_path = Path('js/ui/meal-food-images.js')
          sw_path = Path('sw.js')

          app = app_path.read_text(encoding='utf-8')
          before_size = len(app.encode('utf-8'))
          marker = 'const MEAL_FOOD_IMAGES = Object.freeze({'
          if app.count(marker) != 1:
              raise SystemExit(f'MEAL_FOOD_IMAGES marker count must be 1, got {app.count(marker)}')
          if module_path.exists():
              raise SystemExit('meal-food-images.js already exists; refusing to overwrite')

          start = app.index(marker)
          brace_start = app.index('{', start)
          depth = 0
          close = None
          for index in range(brace_start, len(app)):
              ch = app[index]
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      close = index
                      break
          if close is None or app[close + 1:close + 3] != ');':
              raise SystemExit('Could not safely locate MEAL_FOOD_IMAGES closing token')

          end = close + 3
          block = app[start:end]
          if 'chineseGyoza' not in block or 'chinese' not in block or 'soba' not in block:
              raise SystemExit('Meal image definition sanity check failed')

          app = app[:start] + app[end:]
          import_anchor = "import { mealTimeUnavailableText } from './ui/meal-time-message.js?v=0.10.964';\n"
          import_line = "import { MEAL_FOOD_IMAGES } from './ui/meal-food-images.js';\n"
          if app.count(import_anchor) != 1 or import_line in app:
              raise SystemExit('Meal image import anchor sanity check failed')
          app = app.replace(import_anchor, import_anchor + import_line, 1)

          module = (
              '// Static meal artwork paths extracted from app.js. Keep gameplay/state logic in app.js.\n'
              + 'export ' + block + '\n'
          )
          module_path.write_text(module, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          sw_anchor = "  './js/ui/meal-time-message.js?v=0.10.964',\n"
          sw_line = "  './js/ui/meal-food-images.js',\n"
          if sw.count(sw_anchor) != 1 or sw_line in sw:
              raise SystemExit('Service Worker precache anchor sanity check failed')
          sw = sw.replace(sw_anchor, sw_anchor + sw_line, 1)
          sw_path.write_text(sw, encoding='utf-8')

          after_size = len(app.encode('utf-8'))
          if after_size > 1_411_760:
              raise SystemExit(f'app.js still exceeds limit: {after_size} bytes')
          if before_size - after_size < 500:
              raise SystemExit(f'Unexpectedly small reduction: {before_size - after_size} bytes')

          final_app = app_path.read_text(encoding='utf-8')
          final_module = module_path.read_text(encoding='utf-8')
          if final_app.count(import_line.strip()) != 1:
              raise SystemExit('Meal image module import missing or duplicated')
          if marker in final_app:
              raise SystemExit('Inline meal image definition still present')
          if 'export const MEAL_FOOD_IMAGES = Object.freeze({' not in final_module:
              raise SystemExit('Exported meal image definition missing')
          if 'function mealFoodImage(mealId)' not in final_app:
              raise SystemExit('mealFoodImage function unexpectedly changed/removed')

          print(f'app.js: {before_size} -> {after_size} bytes (-{before_size - after_size})')
          print('meal image module extraction: PASS')
          PY

      - name: 変更差分を限定確認
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git status --short
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort | tr '\n' ' ')"
          test "$changed" = "js/app.js js/ui/meal-food-images.js sw.js "

      - name: 修正をmainへ保存
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/ui/meal-food-images.js sw.js
          git commit -m 'app.jsの食事画像定義をUIモジュールへ分離'
          git push origin main
