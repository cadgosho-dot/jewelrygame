name: Phase26 Formal Sync v0.10.915
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register Stage26 checker and sync version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-current.py')
          text = p.read_text(encoding='utf-8')
          needle = "    ('スタッフ運用・職人スタッフ自動制作処理保護', [sys.executable, str(ROOT / 'scripts/check-staff-operations-regression.py')]),\n"
          insert = needle + "    ('スマホアイテム・装備処理保護', [sys.executable, str(ROOT / 'scripts/check-phone-item-equipment-regression.py')]),\n"
          if 'check-phone-item-equipment-regression.py' not in text:
              if needle not in text:
                  raise SystemExit('Stage26 insertion point not found')
              text = text.replace(needle, insert, 1)
              p.write_text(text, encoding='utf-8')
          PY
          python3 scripts/version-sync.py --set 0.10.915
          python3 scripts/version-sync.py --check
          python3 scripts/check-phone-item-equipment-regression.py
      - name: Commit formal sync and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase26-sync-v010915.yml
          git add -A
          git commit -m "v0.10.915 第26段階正式同期"
          git push origin HEAD:main
