name: 母親・執事イベント ASSETS差分診断

on:
  push:
    branches:
      - feature/wolf-mother-butler-event-safe

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/wolf-mother-butler-event-safe
          fetch-depth: 0

      - name: ASSETS差分を表示
        shell: bash
        run: |
          cp ASSETS.md /tmp/ASSETS.before.md
          python3 scripts/generate-assets-manifest.py --write
          echo '===== ASSETS DIFF START ====='
          git --no-pager diff -- ASSETS.md || true
          echo '===== ASSETS DIFF END ====='
          python3 scripts/generate-assets-manifest.py --check
