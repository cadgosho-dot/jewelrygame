name: Phase27 Validate
on:
  push:
    branches: [phase27-protect-home-rent]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify unchanged version
        run: python3 scripts/version-sync.py --check
      - name: Run Stage27 dynamic regression
        run: node tools/test-home-rent-regression.mjs
      - name: Run Stage27 protection checker
        run: python3 scripts/check-home-rent-regression.py
