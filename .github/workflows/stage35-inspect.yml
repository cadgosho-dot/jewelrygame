name: stage35-inspect
on:
  push:
    branches: [refactor-stage35-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect customer preference label
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path('js/app.js').read_text(encoding='utf-8').splitlines()
          name = 'customerPreferenceLabel'
          refs = [i for i,line in enumerate(lines,1) if re.search(r'\b'+name+r'\s*\(', line)]
          print('refs:', refs)
          start = refs[0]
          depth = 0
          begun = False
          for j in range(start, min(len(lines), start + 40) + 1):
              line = lines[j-1]
              print(f'{j}: {line}')
              for ch in line:
                  if ch == '{':
                      depth += 1; begun = True
                  elif ch == '}':
                      depth -= 1
              if begun and depth == 0:
                  break
          PY
