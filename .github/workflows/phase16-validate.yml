name: Phase16 Validate Store Rental

on:
  push:
    branches:
      - phase16-core-protection-v0.10.905

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase16-core-protection-v0.10.905
      - name: Run Stage16 checks
        run: |
          node --check js/app.js
          node --check tools/test-rent-next-store-regression.mjs
          node tools/test-rent-next-store-regression.mjs
          python3 scripts/check-rent-next-store-regression.py
