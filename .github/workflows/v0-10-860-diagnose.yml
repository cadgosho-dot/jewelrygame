name: v0.10.860 UI seam diagnosis

on:
  push:
    branches:
      - codex/v0-10-860-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect safest UI seam candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          lines = Path('js/app.js').read_text(encoding='utf-8').splitlines()
          targets = [
              'fallbackCopyText',
              'copyText',
              'updateRockVisual',
              'applyCurrentBackground',
              'syncTodayGemHeaderLayout',
          ]
          for target in targets:
              print(f'\n=== {target} occurrences ===')
              hits = [i for i, line in enumerate(lines) if re.search(rf'\b{re.escape(target)}\b', line)]
              print('count=', len(hits), 'lines=', ','.join(str(i + 1) for i in hits))
              for i in hits:
                  lo = max(0, i - 14)
                  hi = min(len(lines), i + 20)
                  print(f'--- context around {i + 1} ---')
                  for n in range(lo, hi):
                      print(f'{n + 1:6}: {lines[n]}')
          PY
