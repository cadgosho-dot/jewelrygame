name: Save interruption resilience v0.10.772

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-save-interruptions-v772.yml'

jobs:
  resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Simulate interrupted and concurrent saves
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json

          firebase = Path('js/firebase-service.js').read_text(encoding='utf-8')
          app = Path('js/app.js').read_text(encoding='utf-8')
          core = Path('js/game-data-core.js').read_text(encoding='utf-8')

          def require(cond, message):
              if not cond:
                  raise AssertionError(message)

          # Lock the simulation to the actual v0.10.772 implementation shape.
          require("const CLOUD_CHUNK_RAW_BYTES = 384 * 1024;" in firebase, 'chunk size changed')
          require("const CLOUD_CHUNK_MAX_COUNT = 64;" in firebase, 'chunk count changed')
          chunk_loop = firebase.index("for (let index = 0; index < encoded.chunks.length; index += 1)")
          meta_write = firebase.index("await setDoc(cloudSaveMetaRef(uid), metadata);", chunk_loop)
          catch_cleanup = firebase.index("writtenChunkRefs.filter(Boolean).map((ref) => deleteDoc(ref))", meta_write)
          require(chunk_loop < meta_write < catch_cleanup, 'save commit ordering changed')
          require("jxj/cloud-save-chunk-missing" in firebase, 'missing chunk guard absent')
          require("jxj/cloud-save-decode-failed" in firebase, 'decode guard absent')
          require("if (!state || !currentUser || sessionTakenOver) return" in app, 'takeover save stop absent')
          require("cloudSave = await loadState(user.uid);" in app, 'cloud boot load call absent')
          require("screen = 'login';" in app and "showToast('クラウドデータを読み込めませんでした。', 'error');" in app, 'cloud boot failure path changed')
          require("if (localRevision !== cloudRevision)" in core, 'revision chooser absent')

          CHUNK = 384 * 1024

          def encode(state):
              raw = json.dumps(state, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              chunks=[base64.b64encode(raw[i:i+CHUNK]).decode('ascii') for i in range(0,len(raw),CHUNK)]
              return raw, chunks

          class Store:
              def __init__(self):
                  self.meta=None
                  self.chunks={}
              def put_chunks(self, gen, state):
                  raw,chunks=encode(state)
                  for i,c in enumerate(chunks): self.chunks[(gen,i)]=c
                  return {'mode':'chunked','generation':gen,'count':len(chunks),'bytes':len(raw),'saveRevision':state['saveRevision'],'updatedAt':state['updatedAt']}
              def load(self):
                  if not self.meta: return None
                  gen=self.meta['generation']; count=self.meta['count']
                  encoded=[]
                  for i in range(count):
                      key=(gen,i)
                      if key not in self.chunks: raise RuntimeError('jxj/cloud-save-chunk-missing')
                      encoded.append(self.chunks[key])
                  try:
                      raw=b''.join(base64.b64decode(x) for x in encoded)
                      return json.loads(raw.decode('utf-8'))
                  except Exception as e:
                      raise RuntimeError('jxj/cloud-save-decode-failed') from e

          def state(rev, marker):
              return {'saveRevision':rev,'updatedAt':f'2026-08-27T00:00:{rev%60:02d}.000Z','marker':marker,'payload':'X'*900000}

          results=[]
          def ok(name, detail): results.append({'name':name,'status':'PASS','detail':detail})
          def warn(name, detail): results.append({'name':name,'status':'WARN','detail':detail})

          # Baseline current cloud generation.
          s=Store(); base=state(10,'BASE'); s.meta=s.put_chunks('G0',base)
          require(s.load()['marker']=='BASE','baseline failed')

          # 1) Ordinary network failure: partial new generation is cleaned; metadata never switches.
          new=state(11,'NETWORK_FAIL'); raw,chunks=encode(new); written=[]
          for i,c in enumerate(chunks):
              if i==1: break
              s.chunks[('G1',i)]=c; written.append(('G1',i))
          for key in written: s.chunks.pop(key,None)
          require(s.meta['generation']=='G0' and s.load()['marker']=='BASE','network failure replaced current save')
          ok('network_failure_before_meta','old committed generation remains readable')

          # 2) Hard app/process kill during chunk upload: cleanup callback never runs, but pointer stays old.
          raw,chunks=encode(state(11,'HARD_KILL_MID'))
          for i,c in enumerate(chunks[:1]): s.chunks[('G2',i)]=c
          require(s.meta['generation']=='G0' and s.load()['marker']=='BASE','hard kill mid upload damaged pointer')
          ok('hard_kill_mid_chunks','partial orphan is ignored because metadata still points to G0')

          # 3) Hard kill after all chunks, before metadata commit: full orphan ignored.
          m=s.put_chunks('G3',state(11,'HARD_KILL_PRE_META'))
          require(s.meta['generation']=='G0' and s.load()['marker']=='BASE','pre-meta kill damaged current save')
          ok('hard_kill_after_chunks_before_meta','complete orphan is ignored; G0 remains current')

          # 4) Hard kill immediately after metadata commit, before deleting old generation.
          m=s.put_chunks('G4',state(11,'POST_META_KILL')); s.meta=m
          require(s.load()['marker']=='POST_META_KILL','post-meta committed state unreadable')
          ok('hard_kill_after_meta','new generation is complete before pointer switch, so new save loads')

          # 5) Current generation loses one chunk: never silently assembles a mixed/partial state.
          victim=('G4',1); saved=s.chunks.pop(victim)
          try:
              s.load(); raise AssertionError('missing current chunk was accepted')
          except RuntimeError as e:
              require(str(e)=='jxj/cloud-save-chunk-missing','wrong missing-chunk failure')
          s.chunks[victim]=saved
          ok('missing_current_chunk','detected explicitly; partial save is not accepted')

          # 6) Corrupt current chunk: decode/JSON failure is explicit.
          original=s.chunks[('G4',0)]
          s.chunks[('G4',0)]='!!!not-base64-json!!!'
          try:
              s.load(); raise AssertionError('corrupt chunk was accepted')
          except RuntimeError as e:
              require(str(e)=='jxj/cloud-save-decode-failed','wrong corrupt-data failure')
          s.chunks[('G4',0)]=original
          ok('corrupt_current_chunk','detected explicitly; corrupt cloud state is not accepted')

          # 7) Two devices write unique generations. No chunk mixing is possible, but pointer is last-writer-wins.
          c=Store(); c.meta=c.put_chunks('C0',state(100,'BASE100'))
          meta_a=c.put_chunks('A101',state(101,'DEVICE_A'))
          meta_b=c.put_chunks('B102',state(102,'DEVICE_B'))
          c.meta=meta_b
          require(c.load()['marker']=='DEVICE_B','newer concurrent generation failed')
          c.meta=meta_a
          loaded=c.load()
          require(loaded['marker']=='DEVICE_A' and loaded['saveRevision']==101,'generation mixing occurred')
          ok('concurrent_generation_integrity','each generation stays internally consistent; chunks never mix')
          warn('concurrent_freshness_race','saveState has no metadata compare-and-swap; if an older device commits last during takeover race, cloud revision can move backward')

          # 8) Same-client queue and takeover checks exist in app source.
          require("saveQueue = saveQueue" in app and ".then(async () =>" in app and "return saveState(userId, snapshot);" in app,'same-client queue changed')
          ok('same_client_serialization','saveQueue serializes cloud writes from one running client')
          ok('takeover_guard','sessionTakenOver blocks subsequent local/autosave calls after watcher detects another session')

          # 9) Startup cloud corruption behavior: device save is read first, but loadState exception aborts boot to login.
          cloud_call=app.index("cloudSave = await loadState(user.uid);")
          catch_pos=app.index("showToast('クラウドデータを読み込めませんでした。', 'error');", cloud_call)
          local_read=app.rfind("indexedDbSave = await readIndexedDbSave(user.uid);", 0, cloud_call)
          require(local_read!=-1 and local_read < cloud_call < catch_pos,'boot fallback structure changed')
          warn('boot_cloud_error_fallback','IndexedDB is already read, but a thrown cloud chunk/decode error sends the screen to login instead of continuing from the valid device save')

          report={'version':'0.10.772','result':'PASS_WITH_WARNINGS','tests':results,'passCount':sum(r['status']=='PASS' for r in results),'warnCount':sum(r['status']=='WARN' for r in results)}
          print('SAVE_INTERRUPTION_RESULT_START')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print('SAVE_INTERRUPTION_RESULT_END')
          Path('/tmp/save-interruption-results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: save-interruption-v772
          path: /tmp/save-interruption-results.json
          retention-days: 3
