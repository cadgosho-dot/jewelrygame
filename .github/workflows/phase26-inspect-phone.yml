name: Phase26 Inspect Phone Core

on:
  push:
    branches:
      - phase26-phone-item-equipment-v0.10.915

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase26-phone-item-equipment-v0.10.915
          fetch-depth: 1
      - name: Extract current phone core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          def line_no(pos):
              return text.count('\n', 0, pos) + 1

          def extract_function(name):
              m = re.search(rf'\bfunction\s+{re.escape(name)}\s*\(', text)
              if not m:
                  return None, None
              brace = text.find('{', m.end())
              if brace < 0:
                  return None, None
              i = brace
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i + 1 < len(text) else ''
                  if line_comment:
                      if c == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c == '/' and n == '/':
                      line_comment = True
                      i += 2
                      continue
                  if c == '/' and n == '*':
                      block_comment = True
                      i += 2
                      continue
                  if c in ('"', "'", '`'):
                      quote = c
                      i += 1
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return text[m.start():i+1], line_no(m.start())
                  i += 1
              return None, None

          out = ['# Phase26 phone core inspection', '']
          for name in ('usePhoneItem', 'togglePhoneEquipment'):
              body, ln = extract_function(name)
              out += [f'## {name} (line {ln})', '```js', body or 'NOT FOUND', '```', '']

          for token in ('usePhoneItem', 'togglePhoneEquipment'):
              out += [f'## References: {token}']
              for idx, line in enumerate(lines, start=1):
                  if token in line:
                      lo = max(1, idx - 4)
                      hi = min(len(lines), idx + 4)
                      out += [f'### lines {lo}-{hi}', '```js']
                      out += [f'{j}: {lines[j-1]}' for j in range(lo, hi + 1)]
                      out += ['```', '']

          Path('_phase26-phone-inspect.md').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _phase26-phone-inspect.md
          git commit -m "Phase26 phone core inspection" || exit 0
          git push origin HEAD:phase26-phone-item-equipment-v0.10.915
