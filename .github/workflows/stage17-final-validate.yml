name: stage17-final-validate
on:
  push:
    branches:
      - jxj-stage17-v0.10.865
    paths:
      - stage17-final-trigger.txt
permissions:
  contents: write
jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: jxj-stage17-v0.10.865
          fetch-depth: 0
      - name: Apply exact stage 17 patch
        run: |
          python3 scripts/stage17-apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-viewport-clamp.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("print('" + chr(10) + "VIEWPORT CLAMP INTEGRATION: FAIL')", r"print('\nVIEWPORT CLAMP INTEGRATION: FAIL')")
          text = text.replace("print('" + chr(10) + "VIEWPORT CLAMP INTEGRATION: PASS')", r"print('\nVIEWPORT CLAMP INTEGRATION: PASS')")
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/version-sync.py --set 0.10.865
          python3 scripts/generate-event-probability-list.py --write
          git rm scripts/stage17-apply.py
      - name: Commit implementation tree
        run: |
          git config user.name "cadgosho-dot"
          git config user.email "cadgosho@gmail.com"
          git add -A
          echo '=== staged files ==='
          git diff --cached --name-only
          if git diff --cached --name-only | grep -Ei '\.(png|jpe?g|webp|gif)$'; then
            echo 'Image diff detected; aborting.' >&2
            exit 1
          fi
          git commit -m "v0.10.865 表示倍率クランプをhelperへ分離"
      - name: Dedicated checks
        run: |
          node --check js/app.js
          node --check js/ui/viewport-clamp.js
          node tools/test-viewport-clamp.mjs
          python3 scripts/check-viewport-clamp.py
          python3 scripts/version-sync.py --check
          python3 scripts/generate-event-probability-list.py --check
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Full current audit with browser smoke
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 8m python3 -u scripts/check-current.py
      - name: Verify no image changes and push
        run: |
          echo '=== diff from exact main baseline ==='
          git diff --name-only 3d359c54ab3273faa105405b96b18f07c977726d HEAD
          if git diff --name-only 3d359c54ab3273faa105405b96b18f07c977726d HEAD | grep -Ei '\.(png|jpe?g|webp|gif)$'; then
            echo 'Image diff detected; aborting.' >&2
            exit 1
          fi
          test "$(cat VERSION)" = '0.10.865'
          test ! -e scripts/stage17-apply.py
          git push origin HEAD:jxj-stage17-v0.10.865
