name: v0.10.735 思い出実装

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-v735-memories.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: 思い出画面を実装
        run: python3 scripts/apply-v735-memories.py

      - name: JavaScript構文確認
        run: node --check js/app.js

      - name: 実装確認
        run: |
          grep -q 'data-tab="memories"' js/app.js
          grep -q 'function renderPhoneMemories()' js/app.js
          grep -q "case 'open-memory-image'" js/app.js
          grep -q "export const VERSION = '0.10.735'" js/game-data.js
          grep -q "const VERSION = '0.10.735'" sw.js
          grep -q 'phone-memories-background' styles-memories-v735.css

      - name: 一時ファイルを削除
        run: rm -f scripts/apply-v735-memories.py .github/workflows/apply-v735-memories.yml

      - name: 変更をコミットして公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "v0.10.735 スマートフォンに思い出を追加"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
