name: stage21-diagnose
on:
  push:
    branches: [jxj-stage21-diagnose-20260904]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract low-risk used display helpers
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('js/app.js').read_text(encoding='utf-8')
          lines = text.splitlines()
          decl = re.compile(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(')
          forbidden = (
              'state', 'save', 'storage', 'firebase', 'money', 'inventory', 'aquarium',
              'event', 'document', 'window', 'navigator', 'settimeout', 'setinterval',
              'playsfx', 'showmodal', 'showtoast', 'location', 'screen', 'goto', 'advance',
              'order', 'purchase', 'customer', 'hunger', 'sleep', 'weather', 'birthday',
              'unpaid', 'currentuser', 'random', 'math.random', 'indexeddb', 'localstorage',
          )
          preferred = re.compile(r'(label|name|text|message|title|format|display|caption|description)', re.I)
          found=[]
          for i,line in enumerate(lines):
              m=decl.match(line)
              if not m: continue
              name=m.group(1)
              paren=0; sig=False; depth=0; started=False; end=None
              for j in range(i,min(len(lines),i+20)):
                  for ch in lines[j]:
                      if not sig:
                          if ch=='(': paren+=1
                          elif ch==')':
                              paren-=1
                              if paren==0: sig=True
                          continue
                      if ch=='{': depth+=1; started=True
                      elif ch=='}': depth-=1
                  if started and depth==0:
                      end=j; break
              if end is None or end-i+1>10: continue
              body='\n'.join(lines[i:end+1])
              low=body.lower()
              if any(tok in low for tok in forbidden): continue
              refs=len(re.findall(r'\b'+re.escape(name)+r'\s*\(',text))
              if refs < 2: continue
              calls=re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(', '\n'.join(lines[i+1:end]))
              external=[c for c in calls if c not in {name,'String','Number','Boolean','Object','Array','Math'}]
              score=(0 if preferred.search(name) else 1, len(external), end-i+1, refs, name)
              found.append((score,i+1,name,refs,body,external))
          found.sort(key=lambda x:x[0])
          print('STAGE21 USED DISPLAY CANDIDATES')
          print('COUNT=',len(found))
          for score,line_no,name,refs,body,external in found[:80]:
              print('\n'+'='*72)
              print(f'{name} line={line_no} refs={refs} external_calls={external}')
              print(body)
          PY
