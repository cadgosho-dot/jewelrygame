name: v0.10.855 VERSION同期最終検証

on:
  push:
    branches:
      - codex/v0-10-855-extract-finished-video-cache-warm

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 対象ブランチを取得
        uses: actions/checkout@v6
        with:
          ref: codex/v0-10-855-extract-finished-video-cache-warm
          fetch-depth: 1

      - name: VERSION同期ルールを補正
        run: |
          python3 tools/fix-version-sync-v855.py
          python3 scripts/version-sync.py --check
          node tools/test-finished-video-cache-warm.mjs
          python3 scripts/check-finished-video-cache-warm.py

      - name: 総合検査環境を準備
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: 現行ビルド総合検査
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 8m python3 -u scripts/check-current.py

      - name: 検査済みVERSION同期ルールを反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/version-sync.py
          git commit -m "build: track finished video cache module version (v0.10.855)"
          git push origin HEAD:codex/v0-10-855-extract-finished-video-cache-warm
