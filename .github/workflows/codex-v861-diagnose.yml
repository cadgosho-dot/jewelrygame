name: codex v0.10.861 diagnose

on:
  push:
    branches:
      - codex/v0-10-861-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find stable gift persistence boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('js/app.js').read_text(encoding='utf-8')
          lines = text.splitlines()
          start = next(i for i, line in enumerate(lines) if 'function persistTransactionalGiftState' in line)
          print(f'persistTransactionalGiftState starts at {start+1}')
          count = 0
          for i in range(start, min(len(lines), start + 160)):
              m = re.match(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', lines[i])
              if m:
                  print(f'{i+1}: {m.group(1)}')
                  count += 1
                  if count >= 8:
                      break
          print('--- context ---')
          for i in range(max(0, start-3), min(len(lines), start+80)):
              print(f'{i+1:05d}: {lines[i]}')
          PY
