name: Phase37 Formal Sync v0.10.926

on:
  push:
    branches: [main, phase37-customer-visit-protection]
    paths:
      - '.github/workflows/phase37-sync-v010926.yml'
      - 'tools/test-customer-visit-regression.mjs'
      - 'scripts/check-customer-visit-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'phase37-customer-visit-protection'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate customer visit protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-customer-visit-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.925'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('就寝・翌日遷移処理保護', [sys.executable, str(ROOT / 'scripts/check-sleep-transition-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-customer-visit-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('顧客来店管理処理保護', [sys.executable, str(ROOT / 'scripts/check-customer-visit-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.926\n- 中核処理保護・第37段階：顧客の来店開始・通常来店抽選を担う `startCustomerVisit()` / `clearCustomerVisitsForIllness()` / `scheduleCustomerVisit()` を動的回帰テストと静的検査で固定。\n- 体調不良時の来店抑止、営業・制作条件、同時来店防止、来店支店、接客希望状態初期化、ブラウンバニー特別来店、通常客の初回来店・再来店間隔、スタッフ/支店来店率補正、通知を検証。\n- 来店率・接客仕様・店舗仕様・顧客データ・価格・在庫・イベント・画像・音声・セーブ形式の変更なし。\n'
          assert '## v0.10.926' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-customer-visit-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.925', '?v=0.10.926').replace("const UI_BUILD_VERSION = '0.10.925';", "const UI_BUILD_VERSION = '0.10.926';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase37-sync-v010926.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.926 第37段階正式同期'
          git push origin HEAD:main
