name: stage19-final-validate
on:
  push:
    branches: [jxj-stage19-v0.10.867]
permissions:
  contents: write
jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: jxj-stage19-v0.10.867
          fetch-depth: 0
      - name: Gate implementation run
        id: gate
        shell: bash
        run: |
          if [ -f scripts/stage19-apply.py ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Implementation already applied; validation push detected.'
          fi
      - name: Apply exact stage 19 patch
        if: steps.gate.outputs.apply == 'true'
        run: |
          python3 scripts/stage19-apply.py
          python3 scripts/version-sync.py --set 0.10.867
          python3 scripts/generate-event-probability-list.py --write
      - name: Commit implementation tree
        if: steps.gate.outputs.apply == 'true'
        run: |
          git config user.name "cadgosho-dot"
          git config user.email "cadgosho@gmail.com"
          git rm scripts/stage19-apply.py
          git add -A
          echo '=== staged files ==='
          git diff --cached --name-only
          if git diff --cached --name-only | grep -Ei '\.(png|jpe?g|webp|gif)$'; then
            echo 'Image diff detected; aborting.' >&2
            exit 1
          fi
          git commit -m "v0.10.867 ルースカット表示ラベルをhelperへ分離"
      - name: Dedicated checks
        if: steps.gate.outputs.apply == 'true'
        run: |
          node --check js/app.js
          node --check js/ui/loose-shape-label.js
          node tools/test-loose-shape-label.mjs
          python3 scripts/check-loose-shape-label.py
          python3 scripts/version-sync.py --check
          python3 scripts/generate-event-probability-list.py --check
      - name: Prepare browser audit
        if: steps.gate.outputs.apply == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Full current audit with browser smoke
        if: steps.gate.outputs.apply == 'true'
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: timeout 8m python3 -u scripts/check-current.py
      - name: Verify no image changes and push
        if: steps.gate.outputs.apply == 'true'
        run: |
          echo '=== diff from exact main baseline ==='
          git diff --name-only b0e29f4aa493bc2037d268cb12ccacc42800a40e HEAD
          if git diff --name-only b0e29f4aa493bc2037d268cb12ccacc42800a40e HEAD | grep -Ei '\.(png|jpe?g|webp|gif)$'; then
            echo 'Image diff detected; aborting.' >&2
            exit 1
          fi
          test "$(cat VERSION)" = '0.10.867'
          test ! -e scripts/stage19-apply.py
          git push origin HEAD:jxj-stage19-v0.10.867
