name: phase32 gift inspect

on:
  push:
    branches:
      - phase32-core-discovery

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: プレゼント処理本体を表示
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('js/app.js').read_text(encoding='utf-8')
          def extract(name):
              m=re.search(r'(?m)^\s*(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(',src)
              if not m: return '<missing>'
              start=m.start(); brace=src.find('{',m.start()); depth=0; quote=None; esc=False
              for i in range(brace,len(src)):
                  c=src[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"`": quote=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return src[start:i+1]
              return '<unterminated>'
          for name in ['removeGiftFromGameState','addGiftToGameState','restoreGiftToGameState','createGiftFromDraft','claimGiftPreview','cancelGift']:
              print('\n===== '+name+' =====')
              print(extract(name))
          PY
