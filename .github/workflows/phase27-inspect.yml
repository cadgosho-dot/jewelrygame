name: Phase27 Inspect

on:
  push:
    branches:
      - phase27-inspect

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect home-rent constants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('js/app.js').read_text(encoding='utf-8')
          for name in ['HOME_MONTHLY_RENT','MIN_LIVING_CASH_RESERVE']:
              print(f'===== {name} =====')
              for m in re.finditer(r'^(?:const|let|var)\s+' + re.escape(name) + r'\s*=.*$', src, re.M):
                  print(m.group(0))
                  print('line', src.count('\n', 0, m.start()) + 1)
          for name in ['automaticPaymentCapacity','payFixedCost','processHomeRent']:
              print(name, 'occurrences', len(re.findall(r'\b' + re.escape(name) + r'\s*\(', src)))
          PY
