name: One-shot v0.10.816 release

on:
  push:
    branches:
      - chatgpt-release-v0.10.816

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt-release-v0.10.816
          fetch-depth: 0

      - name: Verify exact release base
        env:
          EXPECTED_MAIN: 9dde98e143a61d5d3d1d1d017ce0ce2b6351ded7
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          test "$(cat VERSION)" = "0.10.815"
          grep -Fq "const OYATSU_DAISUKI_EVENT_CHANCE = 0.04;" js/app.js
          grep -Fq "return clamp((baseRisk + acclimationRisk) * vulnerability * Math.max(0.2, Number(tankFactor) || 1), 0, 0.45);" js/app.js
          ! grep -Fq "AQUARIUM_FISH_MORTALITY_RATE_MULTIPLIER" js/app.js

      - name: Apply probability adjustments
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              'const OYATSU_DAISUKI_EVENT_CHANCE = 0.04;',
              'const OYATSU_DAISUKI_EVENT_CHANCE = 1 / 35;',
              'oyatsu chance',
          )
          mortality_anchor = "// 購入直後・同日複数死亡・連日死亡を禁止する保護ルールは置かない。\nconst AQUARIUM_FISH_MORTALITY = Object.freeze({"
          mortality_replacement = "// 購入直後・同日複数死亡・連日死亡を禁止する保護ルールは置かない。\n// v0.10.816: 魚の最終死亡抽選だけを従来計算値の50%へ下げ、種類別寿命・個体差・日ごとの揺らぎは維持する。\nconst AQUARIUM_FISH_MORTALITY_RATE_MULTIPLIER = 0.5;\nconst AQUARIUM_FISH_MORTALITY = Object.freeze({"
          app = replace_once(app, mortality_anchor, mortality_replacement, 'fish mortality multiplier constant')
          old_return = '  return clamp((baseRisk + acclimationRisk) * vulnerability * Math.max(0.2, Number(tankFactor) || 1), 0, 0.45);'
          new_return = '  return clamp((baseRisk + acclimationRisk) * vulnerability * Math.max(0.2, Number(tankFactor) || 1), 0, 0.45) * AQUARIUM_FISH_MORTALITY_RATE_MULTIPLIER;'
          app = replace_once(app, old_return, new_return, 'fish final mortality chance')
          app_path.write_text(app, encoding='utf-8')

          rules_path = Path('GAME_RULES.md')
          rules = rules_path.read_text(encoding='utf-8')
          rules = replace_once(
              rules,
              '- 固定寿命ではなく、魚種別の寿命傾向・個体差・購入直後の不安定さ・日ごとの水槽全体の揺らぎを使用。',
              '- 固定寿命ではなく、魚種別の寿命傾向・個体差・購入直後の不安定さ・日ごとの水槽全体の揺らぎを使用。\n- v0.10.816以降、各個体の最終死亡確率は従来計算値の **50%** に調整。',
              'GAME_RULES fish mortality note',
          )
          rules_path.write_text(rules, encoding='utf-8')

          check_lines = [
              '#!/usr/bin/env python3',
              'from pathlib import Path',
              'import sys',
              '',
              "ROOT = Path(__file__).resolve().parents[1]",
              "app = (ROOT / 'js/app.js').read_text(encoding='utf-8')",
              "prob = (ROOT / 'EVENT_PROBABILITY_LIST.md').read_text(encoding='utf-8')",
              'checks = {',
              "    'おやつ大好きが35回に1回': 'const OYATSU_DAISUKI_EVENT_CHANCE = 1 / 35;' in app,",
              "    '熱帯魚死亡倍率が50%': 'const AQUARIUM_FISH_MORTALITY_RATE_MULTIPLIER = 0.5;' in app,",
              "    '最終死亡抽選へ倍率適用': 'return clamp((baseRisk + acclimationRisk) * vulnerability * Math.max(0.2, Number(tankFactor) || 1), 0, 0.45) * AQUARIUM_FISH_MORTALITY_RATE_MULTIPLIER;' in app,",
              "    '旧おやつ4%が残っていない': 'const OYATSU_DAISUKI_EVENT_CHANCE = 0.04;' not in app,",
              "    '確率資料が約1/35': '| おやつ大好き | **2.86%** | 約1/35 |' in prob,",
              '}',
              'failed = [name for name, ok in checks.items() if not ok]',
              'if failed:',
              "    print('AQUARIUM MORTALITY / OYATSU RATE: FAIL')",
              '    for name in failed:',
              "        print(f'- {name}')",
              '    sys.exit(1)',
              "print('AQUARIUM MORTALITY / OYATSU RATE: PASS')",
              '',
          ]
          Path('scripts/check-aquarium-mortality-rate.py').write_text('\n'.join(check_lines), encoding='utf-8')

          current_path = Path('scripts/check-current.py')
          current = current_path.read_text(encoding='utf-8')
          anchor = "    ('水槽正本・再設置', [sys.executable, str(ROOT / 'scripts/check-aquarium-runtime.py')]),\n"
          addition = anchor + "    ('水槽死亡率・おやつ発生率', [sys.executable, str(ROOT / 'scripts/check-aquarium-mortality-rate.py')]),\n"
          current = replace_once(current, anchor, addition, 'check-current aquarium probability entry')
          current_path.write_text(current, encoding='utf-8')
          PY

      - name: Build v0.10.816 and regenerate managed docs
        run: |
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/generate-event-probability-list.py --write
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          marker = '## v0.10.815 — 水槽縦配置・プレゼント取消・3種クイズUI統一\n'
          entry = (
              '## v0.10.816 — おやつ大好き発生率・熱帯魚死亡率調整\n\n'
              '- 「おやつ大好き」の条件成立時の抽選確率を4%（約1/25）から **1/35（約2.86%）** へ変更。\n'
              '- 熱帯魚は魚種別寿命・個体差・購入直後の不安定さ・日ごとの水槽全体の揺らぎを維持したまま、各個体の最終死亡確率を従来計算値の **50%** へ調整。\n'
              '- 水草の枯死率には変更なし。\n'
              '- `scripts/check-aquarium-mortality-rate.py` を追加し、上記2設定を総合監査へ組み込んだ。\n\n'
          )
          if entry not in s:
              if marker not in s:
                  raise SystemExit('CHANGELOG insertion marker missing')
              s = s.replace(marker, entry + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/generate-assets-manifest.py --write

      - name: Targeted validation
        run: |
          test "$(cat VERSION)" = "0.10.816"
          node --check js/app.js
          python3 scripts/version-sync.py --check
          python3 scripts/generate-event-probability-list.py --check
          python3 scripts/check-aquarium-mortality-rate.py
          grep -Fq '| おやつ大好き | **2.86%** | 約1/35 |' EVENT_PROBABILITY_LIST.md

      - name: Install browser validation environment
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Full current-build audit
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 10m python3 -u scripts/check-current.py

      - name: Commit verified release and fast-forward main
        env:
          EXPECTED_MAIN: 9dde98e143a61d5d3d1d1d017ce0ce2b6351ded7
        run: |
          rm -f .github/workflows/release-v816.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.10.816 おやつ大好き発生率・熱帯魚死亡率調整"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git push origin HEAD:main
