name: 第27段階候補診断
on:
  push:
    branches:
      - jxj-stage27-diagnose-20260904
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: jxj-stage27-diagnose-20260904
          fetch-depth: 0
      - name: 小さな純粋表示関数候補を抽出
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          excluded_names = {
              'metalPriceDateLabel','metalMarketDateLabel','metalWeightLabel','workshopLooseDisplayName',
              'workshopStaffQualityDescription','timeRemainingLabel','roughDisplayName','looseShapeLabel',
              'mealTimeUnavailableMessage','clampViewportValue','storeBranchLabel','renderToolBrief',
          }
          forbidden = (
              'state.', 'state =', 'saveGame', 'localStorage', 'sessionStorage', 'indexedDB', 'firebase',
              'document.', 'window.', 'navigator.', 'setTimeout', 'setInterval', 'Math.random',
              'advanceTime', 'showModal', 'closeModal', 'showToast', 'playSfx', 'switchAudio', 'fetch(',
          )
          wanted = ('label','Label','name','Name','text','Text','format','Format','display','Display','message','Message')
          out = []
          i = 0
          while i < len(lines):
              m = re.match(r'^function\s+([A-Za-z0-9_$]+)\s*\(([^)]*)\)\s*\{\s*$', lines[i])
              if not m:
                  i += 1
                  continue
              name = m.group(1)
              depth = 0
              j = i
              while j < len(lines):
                  depth += lines[j].count('{') - lines[j].count('}')
                  if depth == 0:
                      break
                  j += 1
              body_lines = lines[i:j+1]
              body = '\n'.join(body_lines)
              length = j - i + 1
              if (
                  name not in excluded_names
                  and length <= 14
                  and any(token in name for token in wanted)
                  and not any(token in body for token in forbidden)
              ):
                  refs = len(re.findall(rf'\b{re.escape(name)}\s*\(', text))
                  out.append((length, refs, i+1, name, body))
              i = max(j + 1, i + 1)

          out.sort(key=lambda x: (x[0], x[3]))
          chunks = [f'VERSION={(Path("VERSION").read_text(encoding="utf-8").strip())}', f'CANDIDATES={len(out)}', '']
          for length, refs, lineno, name, body in out[:40]:
              chunks.append(f'--- {name} | line={lineno} | lines={length} | refs={refs}')
              chunks.append(body)
              chunks.append('')
          Path('stage27_candidates.txt').write_text('\n'.join(chunks), encoding='utf-8')
          PY
      - name: 診断結果だけを保存
        run: |
          rm -f .github/workflows/stage27-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '第27段階候補診断結果'
          git push origin HEAD:jxj-stage27-diagnose-20260904
