name: Emerald Captain Purchase Hotfix v753

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run emerald captain v753 hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped emerald captain hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')

          def app_replace_once(old, new):
              global app
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'js/app.js: expected exactly one match, found {count}: {old[:140]!r}')
              app = app.replace(old, new, 1)

          app_replace_once("const UI_BUILD_VERSION = '0.10.752';", "const UI_BUILD_VERSION = '0.10.753';")

          app_replace_once(
              "  'childhood-friend-event-next', 'childhood-friend-meal-finish', 'childhood-friend-event-recover', 'emerald-captain-kebab-event-next', 'emerald-captain-kebab-meal-finish',",
              "  'childhood-friend-event-next', 'childhood-friend-meal-finish', 'childhood-friend-event-recover', 'emerald-captain-kebab-event-next', 'emerald-captain-kebab-buy', 'emerald-captain-kebab-meal-finish',",
          )

          repair_code = r'''function repairEmeraldCaptainKebabEventState({ save = false } = {}) {
            if (!state) return false;
            const eventState = emeraldCaptainKebabEventState();
            let changed = false;
            const currentPrice = emeraldCaptainKebabEventTotalCost();

            // 古い保存状態で価格が欠けている場合だけ、現在の正規価格を補う。
            if (!(Number(eventState.gemTotalPrice) > 0) && currentPrice > 0) {
              eventState.gemTotalPrice = currentPrice;
              changed = true;
            }

            // 購入処理は完了したのに画面遷移前に中断した保存だけ、安全に次段階へ復旧する。
            if (eventState.active && eventState.purchased && eventState.stage === 'showcase') {
              eventState.stage = 'purchaseResult';
              changed = true;
            }

            if (eventState.active && !eventState.pendingMealId) {
              eventState.pendingMealId = EMERALD_CAPTAIN_KEBAB_EVENT_MEAL_ID;
              changed = true;
            }

            if (changed && save) void saveGame();
            return changed;
          }

          '''
          app_replace_once('function maybeStartEmeraldCaptainKebabEvent() {', repair_code + 'function maybeStartEmeraldCaptainKebabEvent() {')

          buy_code = r'''function buyEmeraldCaptainKebab() {
            const eventState = emeraldCaptainKebabEventState();
            if (!eventState.active || eventState.stage !== 'showcase') return false;
            if (!applyEmeraldCaptainKebabPurchase()) {
              showToast('所持金が足りません。', 'error');
              return false;
            }
            eventState.stage = 'purchaseResult';
            saveGame();
            playSfx('emerald-captain-purchase', { gain: 0.92, rate: 1.0 });
            render();
            return true;
          }

          '''
          app_replace_once('async function advanceEmeraldCaptainKebabEvent() {', buy_code + 'async function advanceEmeraldCaptainKebabEvent() {')

          old_showcase = r'''  if (eventState.stage === 'showcase') {
            if (!applyEmeraldCaptainKebabPurchase()) {
              showToast('所持金が足りません。', 'error');
              return;
            }
            eventState.stage = 'purchaseResult';
            saveGame();
            playSfx('emerald-captain-purchase', { gain: 0.92, rate: 1.0 });
            render();
            return;
          }'''
          new_showcase = r'''  if (eventState.stage === 'showcase') {
            buyEmeraldCaptainKebab();
            return;
          }'''
          app_replace_once(old_showcase, new_showcase)

          old_button = 'panel = `<button type="button" class="kappa-jade-reward-button emerald-captain-kebab-reward-button" data-action="emerald-captain-kebab-event-next" aria-label="エメラルド一式を購入する">'
          new_button = 'panel = `<button type="button" class="kappa-jade-reward-button emerald-captain-kebab-reward-button" data-action="emerald-captain-kebab-buy" aria-label="エメラルド一式を購入する">'
          app_replace_once(old_button, new_button)

          app_replace_once(
              "function renderEmeraldCaptainKebabEvent() {\n  const eventState = emeraldCaptainKebabEventState();",
              "function renderEmeraldCaptainKebabEvent() {\n  repairEmeraldCaptainKebabEventState({ save: true });\n  const eventState = emeraldCaptainKebabEventState();",
          )

          app_replace_once(
              "    case 'emerald-captain-kebab-event-next':\n      await advanceEmeraldCaptainKebabEvent();\n      break;",
              "    case 'emerald-captain-kebab-buy':\n      buyEmeraldCaptainKebab();\n      break;\n    case 'emerald-captain-kebab-event-next':\n      await advanceEmeraldCaptainKebabEvent();\n      break;",
          )

          app_replace_once(
              "'terry-california-event-decline', 'ridley-okazaki-soba-event-next'].includes(action)",
              "'terry-california-event-decline', 'ridley-okazaki-soba-event-next', 'emerald-captain-kebab-buy'].includes(action)",
          )

          app_path.write_text(app, encoding='utf-8')

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          marker = '/* v0.10.753 エメラルド班班長購入タップ互換 */'
          if marker in styles:
              raise SystemExit('styles.css: v753 emerald captain block already exists')
          styles += r'''

          /* v0.10.753 エメラルド班班長購入タップ互換 */
          /* 古いAndroid/WebViewでも、見えている購入カードと実タップ領域を一致させる。 */
          body[data-screen="emeraldCaptainKebabEvent"] .emerald-captain-kebab-reward-button{
            position:absolute!important;
            z-index:24!important;
            left:50%!important;
            top:48%!important;
            transform:translate(-50%,-50%)!important;
            width:86vw!important;
            max-width:620px!important;
            min-height:170px!important;
            pointer-events:auto!important;
            touch-action:manipulation!important;
            -webkit-tap-highlight-color:transparent!important;
            -webkit-appearance:none!important;
            appearance:none!important;
            cursor:pointer!important;
          }
          body[data-screen="emeraldCaptainKebabEvent"] .emerald-captain-kebab-reward-button>*{
            pointer-events:none!important;
          }
          body[data-screen="emeraldCaptainKebabEvent"] .emerald-captain-kebab-reward-button img{
            width:72vw!important;
            max-width:430px!important;
            max-height:31vh!important;
            object-fit:contain!important;
          }
          @media (orientation:portrait){
            body[data-screen="emeraldCaptainKebabEvent"] .emerald-captain-kebab-reward-button{
              width:90vw!important;
              max-width:620px!important;
            }
          }
          @media (orientation:landscape){
            body[data-screen="emeraldCaptainKebabEvent"] .emerald-captain-kebab-reward-button{
              width:52vw!important;
              max-width:620px!important;
            }
            body[data-screen="emeraldCaptainKebabEvent"] .emerald-captain-kebab-reward-button img{
              width:40vw!important;
              max-width:430px!important;
              max-height:34vh!important;
            }
          }
          '''
          styles_path.write_text(styles, encoding='utf-8')

          replace_once('js/game-data.js', "export const VERSION = '0.10.752';", "export const VERSION = '0.10.753';")
          replace_once('game.html', '<link rel="stylesheet" href="./styles.css?v=0.10.752">', '<link rel="stylesheet" href="./styles.css?v=0.10.753">')
          replace_once('game.html', '<script type="module" src="./js/app.js?v=0.10.752"></script>', '<script type="module" src="./js/app.js?v=0.10.753"></script>')
          replace_once('index.html', 'src="./game.html?v=0.10.752"', 'src="./game.html?v=0.10.753"')
          replace_once('sw.js', "const VERSION = '0.10.752';", "const VERSION = '0.10.753';")

          workflow = Path('.github/workflows/emerald-captain-hotfix-v753.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify scoped changes
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          grep -q "const UI_BUILD_VERSION = '0.10.753';" js/app.js
          grep -q "emerald-captain-kebab-buy" js/app.js
          grep -q "repairEmeraldCaptainKebabEventState" js/app.js
          grep -q "v0.10.753 エメラルド班班長購入タップ互換" styles.css
          grep -q "export const VERSION = '0.10.753';" js/game-data.js
          grep -q "const VERSION = '0.10.753';" sw.js
          test ! -e .github/workflows/emerald-captain-hotfix-v753.yml

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js styles.css js/game-data.js game.html index.html sw.js .github/workflows/emerald-captain-hotfix-v753.yml
          git commit -m "v0.10.753 エメラルド班班長の購入タップを修正"
          git push origin HEAD:main
