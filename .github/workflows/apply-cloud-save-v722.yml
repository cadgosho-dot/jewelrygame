name: Apply cloud save v722

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_cloud_save_v722.py'
      - '.github/workflows/apply-cloud-save-v722.yml'

permissions:
  contents: write

# trigger: v0.10.722
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.10.722
        run: python3 scripts/apply_cloud_save_v722.py
      - name: Validate JavaScript
        run: |
          node --check js/firebase-service.js
          node --check js/app.js
          node --check js/game-data.js
      - name: Validate markers
        run: |
          grep -q "0.10.722" js/game-data.js
          grep -q "saveMeta.*current" js/firebase-service.js
          grep -q "session.*current" js/firebase-service.js
          grep -q "0.10.722" sw.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "722 cloud save root-limit bypass"
          git push origin main
