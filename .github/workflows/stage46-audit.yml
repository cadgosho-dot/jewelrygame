name: Stage46 Audit

on:
  push:
    branches: [protect-stage46]
    paths:
      - '.github/workflows/stage46-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: protect-stage46
          fetch-depth: 1
      - name: Inspect stage46 candidate bodies
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          src = Path('js/app.js').read_text(encoding='utf-8')
          names = [
            'startEmeraldCaptainKebabMeal',
            'finishEmeraldCaptainKebabMeal',
            'receiveYowamushiRoseQuartzReward',
          ]
          pat = re.compile(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(')

          def body_for(m):
              i = src.find('{', m.end())
              if i < 0:
                  return ''
              depth = 0
              j = i
              quote = None
              esc = False
              line_comment = False
              block_comment = False
              while j < len(src):
                  c = src[j]
                  n = src[j + 1] if j + 1 < len(src) else ''
                  if line_comment:
                      if c == '\n':
                          line_comment = False
                      j += 1
                      continue
                  if block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                          j += 2
                          continue
                      j += 1
                      continue
                  if quote:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == quote:
                          quote = None
                      j += 1
                      continue
                  if c == '/' and n == '/':
                      line_comment = True
                      j += 2
                      continue
                  if c == '/' and n == '*':
                      block_comment = True
                      j += 2
                      continue
                  if c in ('\"', "'", '`'):
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          j += 1
                          break
                  j += 1
              return src[m.start():j]

          matches = {m.group(1): m for m in pat.finditer(src)}
          lines = []
          for name in names:
              lines.append(f'===== {name} =====')
              m = matches.get(name)
              if not m:
                  lines.append('NOT FOUND')
                  lines.append('')
                  continue
              body = body_for(m)
              score = 0
              for token, weight in {
                  'state.': 8,
                  'saveGame(': 7,
                  'addFinance(': 8,
                  'spendHours(': 7,
                  'spendMinutes(': 7,
                  '.push(': 3,
                  '.splice(': 4,
                  'money': 5,
                  'inventory': 5,
                  'rough': 3,
                  'loose': 3,
                  'jewelry': 3,
                  'event': 3,
                  'reward': 4,
                  'addItem(': 5,
                  'removeJewelry(': 8,
                  'history': 3,
              }.items():
                  score += body.count(token) * weight
              lines.append(f'SCORE={score} LINES={len(body.splitlines())}')
              lines.append(body)
              lines.append('')
          Path('stage46-audit-report.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stage46-audit-report.txt
          git commit -m '第46段階 候補関数本体を記録'
          git push origin HEAD:protect-stage46
