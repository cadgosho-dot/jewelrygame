name: Temporary event state stale-reference scan

on:
  push:
    branches:
      - fix/event-state-reference-audit-20260914

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan event-state retained references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('js/app.js').read_text(encoding='utf-8')
          starts = list(re.finditer(r'(?m)^(async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(', source))
          funcs = {}
          async_funcs = set()
          for i, m in enumerate(starts):
              end = starts[i + 1].start() if i + 1 < len(starts) else len(source)
              funcs[m.group(2)] = source[m.start():end]
              if m.group(1):
                  async_funcs.add(m.group(2))

          state_funcs = {
              name for name, body in funcs.items()
              if name.endswith('EventState') and 'state.events' in body
          }

          def assignments_after(body, var, pos):
              pattern = re.compile(rf'\b{re.escape(var)}\.[A-Za-z0-9_$]+\s*(?:=|\+=|-=|\+\+|--)')
              return [m.start() for m in pattern.finditer(body, pos)]

          direct_async = []
          nested = []
          for caller, body in funcs.items():
              for decl in re.finditer(r'\b(?:const|let)\s+([A-Za-z0-9_$]+)\s*=\s*([A-Za-z0-9_$]+EventState)\s*\(', body):
                  var, state_fn = decl.group(1), decl.group(2)
                  if state_fn not in state_funcs:
                      continue
                  await_match = re.search(r'\bawait\b', body[decl.end():])
                  if caller in async_funcs and await_match:
                      await_pos = decl.end() + await_match.start()
                      if assignments_after(body, var, await_pos):
                          direct_async.append((caller, var, state_fn))

                  for called in re.finditer(r'\b([A-Za-z0-9_$]+)\s*\(', body[decl.end():]):
                      helper = called.group(1)
                      if helper in {caller, state_fn} or helper not in funcs:
                          continue
                      helper_body = funcs[helper]
                      if not re.search(rf'\b{re.escape(state_fn)}\s*\(', helper_body):
                          continue
                      call_pos = decl.end() + called.start()
                      if assignments_after(body, var, call_pos):
                          nested.append((caller, var, state_fn, helper))

          print('=== DIRECT ASYNC RETAINED-REFERENCE CANDIDATES ===')
          for row in sorted(set(direct_async)):
              print(' | '.join(row))
          print(f'TOTAL_DIRECT_ASYNC={len(set(direct_async))}')
          print('=== NESTED SAME-STATE ACCESSOR CANDIDATES ===')
          for row in sorted(set(nested)):
              print(' | '.join(row))
          print(f'TOTAL_NESTED={len(set(nested))}')
          PY
