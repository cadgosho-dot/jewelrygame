name: TEMP bank background transfer

on:
  push:
    branches:
      - fix/bank-background-original-png-20261001

permissions:
  contents: write

jobs:
  transfer:
    if: ${{ !contains(github.event.head_commit.message, '[bank-bg-transfer-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact user-provided bank backgrounds
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-4bbc-8206-95d5-54827df9214c/raw?se=2026-10-01T01%3A54%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=7c9781b0-50d7-4024-bde7-afa095faf1c6&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T00%3A50%3A15Z&ske=2026-10-02T00%3A50%3A15Z&sks=b&skv=2026-02-06&sig=F5G5QOa5EGmGUg9%2FKV8EJIUAIUiIOLGCKKpu7qvo7mE%3D' -o assets/images/backgrounds/bank-okachimachi-landscape.jpg
          curl -L --fail --retry 3 'https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-decc-8206-8e63-c46872b8390f/raw?se=2026-10-01T01%3A53%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=00a661e8-b7ab-49ce-9b76-eab011fe6ddb&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T00%3A45%3A55Z&ske=2026-10-02T00%3A45%3A55Z&sks=b&skv=2026-02-06&sig=2EJqQbneVlcmNqUPrF1GwhgmiG03accR7%2B2t60ExF5o%3D' -o assets/images/backgrounds/bank-okachimachi-portrait.jpg

      - name: Verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          echo 'b3d305d85a5b8c80869cf15059527af805eba09ee571bba1b7496e8c1cf59a2b  assets/images/backgrounds/bank-okachimachi-landscape.jpg' | sha256sum -c -
          echo '8d4ef397962eba026238d7f3d8c7083fea93ffb052b3dc0d16d320e1cf91a6d3  assets/images/backgrounds/bank-okachimachi-portrait.jpg' | sha256sum -c -
          test "$(stat -c%s assets/images/backgrounds/bank-okachimachi-landscape.jpg)" = '397148'
          test "$(stat -c%s assets/images/backgrounds/bank-okachimachi-portrait.jpg)" = '476320'

      - name: Replace bank background references only
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/backgrounds/bank-okachimachi-landscape.webp
          rm -f assets/images/backgrounds/bank-okachimachi-portrait.webp
          sed -i 's/bank-okachimachi-landscape\.webp/bank-okachimachi-landscape.jpg/g' js/finance/bank-ui.js tools/test-bank-regression.mjs
          sed -i 's/bank-okachimachi-portrait\.webp/bank-okachimachi-portrait.jpg/g' js/finance/bank-ui.js tools/test-bank-regression.mjs
          node tools/test-bank-regression.mjs

      - name: Commit exact originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/backgrounds/bank-okachimachi-landscape.jpg assets/images/backgrounds/bank-okachimachi-portrait.jpg assets/images/backgrounds/bank-okachimachi-landscape.webp assets/images/backgrounds/bank-okachimachi-portrait.webp js/finance/bank-ui.js tools/test-bank-regression.mjs
          git commit -m '[bank-bg-transfer-done] Use exact original bank backgrounds'
          git push
