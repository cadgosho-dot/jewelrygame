name: v0.10.859 自動セーブ状態表示分離 一時検証

on:
  push:
    branches:
      - codex/v0-10-859-autosave-status-presenter

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 対象ブランチを取得
        uses: actions/checkout@v6
        with:
          ref: codex/v0-10-859-autosave-status-presenter
          fetch-depth: 1

      - name: 自動セーブ状態表示だけUI moduleへ分離
        run: |
          python3 tools/apply-autosave-status-presenter-v859.py
          python3 scripts/version-sync.py --set 0.10.859
          python3 scripts/generate-event-probability-list.py --write

      - name: 総合検査環境を準備
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/generate-assets-manifest.py --write

      - name: 専用検査
        run: |
          node --check js/app.js
          node tools/test-autosave-status-presenter.mjs
          python3 scripts/check-autosave-status-presenter.py

      - name: 現行ビルド総合検査
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 8m python3 -u scripts/check-current.py

      - name: 変更範囲を確認
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              'VERSION', 'README.md', 'CHANGELOG.md', 'GAME_RULES.md', 'ASSETS.md', 'TODO.md', 'EVENT_PROBABILITY_LIST.md',
              'auth-cache-recovery.js', 'auth.html', 'game.html', 'hosting-origin-guard.js', 'index.html', 'sw.js',
              'js/app.js', 'js/audio.js', 'js/firebase-service.js', 'js/game-data-core.js', 'js/game-data.js', 'js/memories-screen.js',
              'scripts/version-sync.py', 'scripts/check-current.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          required = {'VERSION', 'CHANGELOG.md', 'js/app.js', 'sw.js', 'scripts/version-sync.py', 'scripts/check-current.py'}
          missing = sorted(required - changed)
          if unexpected:
              raise SystemExit(f'UNEXPECTED CHANGED FILES: {unexpected}')
          if missing:
              raise SystemExit(f'REQUIRED CHANGED FILES MISSING: {missing}')
          print('CHANGE SCOPE: PASS')
          print('\n'.join(sorted(changed)))
          PY

      - name: 検査済み実装をブランチへ反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md CHANGELOG.md GAME_RULES.md ASSETS.md TODO.md EVENT_PROBABILITY_LIST.md \
            auth-cache-recovery.js auth.html game.html hosting-origin-guard.js index.html sw.js \
            js/app.js js/audio.js js/firebase-service.js js/game-data-core.js js/game-data.js js/memories-screen.js \
            scripts/version-sync.py scripts/check-current.py
          git commit -m "refactor: extract autosave status presenter UI (v0.10.859)"
          git push origin HEAD:codex/v0-10-859-autosave-status-presenter
