name: Temporary event transition audit

on:
  push:
    branches:
      - audit/event-transition-surfaces-20260914

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit video skip and timer transition surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('js/app.js').read_text(encoding='utf-8')

          def functions(src):
              out = []
              pattern = re.compile(r'(?m)^(?:async\s+)?function\s+(\w+)\s*\([^\n]*\)\s*\{')
              for m in pattern.finditer(src):
                  start = m.start()
                  brace = src.find('{', m.start(), m.end()+1)
                  depth = 0
                  quote = ''
                  escaped = False
                  for i in range(brace, len(src)):
                      ch = src[i]
                      if quote:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == quote:
                              quote = ''
                          continue
                      if ch in "'\"`":
                          quote = ch
                          continue
                      if ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              out.append((m.group(1), src[start:i+1]))
                              break
              return out

          blocks = functions(source)
          by_name = dict(blocks)

          print('=== GENERIC MOVIE SKIP RENDERERS ===')
          skip_renderers = []
          for name, body in blocks:
              if 'data-action="event-movie-skip"' in body:
                  skip_renderers.append(name)
                  markers = sorted(set(re.findall(r'data-([\w-]+)-(?:intro-)?video', body)))
                  print(f'{name}: markers={markers}')
          print(f'COUNT={len(skip_renderers)}')

          print('\n=== skipCurrentEventIntroVideo ===')
          skip = by_name.get('skipCurrentEventIntroVideo', '')
          print(skip if skip else 'MISSING')

          print('\n=== AUTO TIMER / SCHEDULE FUNCTIONS ===')
          for name, body in blocks:
              if 'setTimeout(' in body and (name.startswith('schedule') or name.startswith('recover') or 'Event' in name):
                  print(f'--- {name} ---')
                  for line in body.splitlines():
                      if any(token in line for token in ('setTimeout(', 'queueMicrotask(', 'stage', 'setScreen(', 'saveGame()', 'render()')):
                          print(line[:240])

          print('\n=== RENDERERS THAT REARM SCHEDULE/TIMER ===')
          for name, body in blocks:
              if name.startswith('render') and ('queueMicrotask(schedule' in body or 'setTimeout(' in body):
                  lines = [line.strip() for line in body.splitlines() if 'queueMicrotask(schedule' in line or 'setTimeout(' in line]
                  print(f'{name}: {lines}')

          print('\n=== REWARD ACTION RENDERERS ===')
          for name, body in blocks:
              if name.startswith('render') and re.search(r'data-action="[^\"]*(?:reward|receive)[^\"]*"', body):
                  actions = sorted(set(re.findall(r'data-action="([^\"]*(?:reward|receive)[^\"]*)"', body)))
                  print(f'{name}: {actions}')
          PY
