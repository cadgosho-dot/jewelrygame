name: Temporary store theft recovery state fix

on:
  push:
    branches:
      - fix/store-theft-recovery-state-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal recovery reference fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          app_path = root / 'js/app.js'
          app = app_path.read_text(encoding='utf-8')

          def section(source, name):
              match = re.search(rf'(?m)^(?:async\s+)?function\s+{re.escape(name)}\s*\([^\n]*\)\s*\{{', source)
              if not match:
                  raise SystemExit(f'{name}: function not found')
              following = re.search(r'(?m)^(?:async\s+)?function\s+', source[match.end():])
              end = match.end() + following.start() if following else len(source)
              return match.start(), end, source[match.start():end]

          start, end, body = section(app, 'recoverStoreTheftDisappearanceSequence')
          old_decl = '  const eventState = storeTheftEventState();'
          old_flow = "  applyStoreTheftEventLoss();\n  eventState.stage = 'theftNotice';"
          if body.count(old_decl) != 1:
              raise SystemExit('recoverStoreTheftDisappearanceSequence: state declaration target not found exactly once')
          if body.count(old_flow) != 1:
              raise SystemExit('recoverStoreTheftDisappearanceSequence: loss/stage target not found exactly once')
          body = body.replace(old_decl, '  let eventState = storeTheftEventState();', 1)
          body = body.replace(
              old_flow,
              "  applyStoreTheftEventLoss();\n  eventState = storeTheftEventState();\n  eventState.stage = 'theftNotice';",
              1,
          )
          app = app[:start] + body + app[end:]
          app_path.write_text(app, encoding='utf-8')

          guard_path = root / 'scripts/check-event-state-reference-audit-regression.py'
          guard = guard_path.read_text(encoding='utf-8')
          if "store_recover = section('recoverStoreTheftDisappearanceSequence')" not in guard:
              addition_lines = [
                  '',
                  "store_loss = section('applyStoreTheftEventLoss')",
                  "checks['store theft loss helper reacquires event state'] = 'const eventState = storeTheftEventState();' in store_loss",
                  "store_recover = section('recoverStoreTheftDisappearanceSequence')",
                  "checks['store theft recovery reacquires state after loss helper'] = (",
                  "    'let eventState = storeTheftEventState();' in store_recover",
                  "    and 'applyStoreTheftEventLoss();' in store_recover",
                  "    and 'eventState = storeTheftEventState();' in store_recover",
                  "    and \"eventState.stage = 'theftNotice';\" in store_recover",
                  "    and store_recover.index('applyStoreTheftEventLoss();') < store_recover.index('eventState = storeTheftEventState();')",
                  "    and store_recover.index('eventState = storeTheftEventState();') < store_recover.index(\"eventState.stage = 'theftNotice';\")",
                  ")",
                  '',
              ]
              addition = '\n'.join(addition_lines)
              insert_at = guard.index("\nfor name, ok in checks.items():")
              guard = guard[:insert_at] + addition + guard[insert_at:]
              guard_path.write_text(guard, encoding='utf-8')
          PY

      - name: Run event-state reference regression
        run: python scripts/check-event-state-reference-audit-regression.py

      - name: Run emergency settlement regression
        run: python scripts/check-event-emergency-settlement-regression.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js scripts/check-event-state-reference-audit-regression.py
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "老婆の窃盗イベント復旧時の状態参照切れを修正"
          git push origin HEAD
