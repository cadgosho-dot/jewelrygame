name: stage16-implement
on:
  push:
    branches:
      - jxj-stage16-v0.10.864
permissions:
  contents: write
jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: jxj-stage16-v0.10.864
          fetch-depth: 1
      - name: Apply stage 16 exact patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: exact target count={count}, expected=1\nTARGET:\n{old}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          app = Path('js/app.js').read_text(encoding='utf-8')
          if app.count('storeBranchLabel(') != 31:
              raise SystemExit(f"js/app.js: storeBranchLabel occurrence count={app.count('storeBranchLabel(')}, expected=31")

          replace_once(
              'js/app.js',
              "import { renderToolBriefMarkup } from './ui/tool-brief.js?v=0.10.863';\nimport { createPressHoldController } from './ui/press-hold-controller.js?v=0.10.863';",
              "import { renderToolBriefMarkup } from './ui/tool-brief.js?v=0.10.863';\nimport { formatStoreBranchLabel } from './ui/store-branch-label.js?v=0.10.863';\nimport { createPressHoldController } from './ui/press-hold-controller.js?v=0.10.863';",
          )
          replace_once(
              'js/app.js',
              "function storeBranchLabel(number = 1) {\n  const branchNumber = Math.max(1, Number(number) || 1);\n  return `店舗${branchNumber}`;\n}",
              "function storeBranchLabel(number = 1) {\n  return formatStoreBranchLabel(number);\n}",
          )

          Path('js/ui/store-branch-label.js').write_text("""// Pure presentation helper for store branch number labels.\nexport function formatStoreBranchLabel(number = 1) {\n  const branchNumber = Math.max(1, Number(number) || 1);\n  return `店舗${branchNumber}`;\n}\n""", encoding='utf-8')

          Path('tools/test-store-branch-label.mjs').write_text("""import assert from 'node:assert/strict';\nimport { formatStoreBranchLabel } from '../js/ui/store-branch-label.js';\n\nfunction legacyStoreBranchLabel(number = 1) {\n  const branchNumber = Math.max(1, Number(number) || 1);\n  return `店舗${branchNumber}`;\n}\n\nconst cases = [undefined, null, 0, 1, 2, 3, -1, '2', ' 3 ', 2.5, NaN, Infinity, -Infinity, 'abc'];\nfor (const value of cases) {\n  const expected = value === undefined ? legacyStoreBranchLabel() : legacyStoreBranchLabel(value);\n  const actual = value === undefined ? formatStoreBranchLabel() : formatStoreBranchLabel(value);\n  assert.equal(actual, expected, `store branch label mismatch: ${String(value)}`);\n}\n\nassert.equal(formatStoreBranchLabel(), '店舗1');\nassert.equal(formatStoreBranchLabel(3), '店舗3');\nconsole.log('STORE BRANCH LABEL TEST: PASS');\n""", encoding='utf-8')

          Path('scripts/check-store-branch-label.py').write_text("""#!/usr/bin/env python3\n\"\"\"Verify store branch label formatting stays isolated and behavior-compatible.\"\"\"\nfrom __future__ import annotations\n\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nVERSION = (ROOT / 'VERSION').read_text(encoding='utf-8').strip()\nAPP_PATH = ROOT / 'js/app.js'\nHELPER_PATH = ROOT / 'js/ui/store-branch-label.js'\nSW_PATH = ROOT / 'sw.js'\nVS_PATH = ROOT / 'scripts/version-sync.py'\nCURRENT_PATH = ROOT / 'scripts/check-current.py'\n\nAPP = APP_PATH.read_text(encoding='utf-8')\nHELPER = HELPER_PATH.read_text(encoding='utf-8')\nSW = SW_PATH.read_text(encoding='utf-8')\nVS = VS_PATH.read_text(encoding='utf-8')\nCURRENT = CURRENT_PATH.read_text(encoding='utf-8')\n\nwrapper = \"\"\"function storeBranchLabel(number = 1) {\n  return formatStoreBranchLabel(number);\n}\"\"\"\n\nchecks = {\n    'versioned helper import exists': f\"from './ui/store-branch-label.js?v={VERSION}';\" in APP,\n    'app keeps thin storeBranchLabel wrapper': wrapper in APP,\n    'legacy formatter body removed from app': 'const branchNumber = Math.max(1, Number(number) || 1);' not in APP,\n    'existing storeBranchLabel call sites retained': APP.count('storeBranchLabel(') == 31,\n    'wrapper delegates once': APP.count('return formatStoreBranchLabel(number);') == 1,\n    'helper exports formatter': 'export function formatStoreBranchLabel(number = 1)' in HELPER,\n    'minimum branch number behavior retained': 'Math.max(1, Number(number) || 1)' in HELPER,\n    'Japanese label format retained': 'return `店舗${branchNumber}`;' in HELPER,\n    'service worker precaches helper': f\"./js/ui/store-branch-label.js?v={VERSION}\" in SW,\n    'version sync knows helper precache': \"'store-branch-label.js precache key'\" in VS,\n    'version sync knows helper import': \"'store-branch-label.js import key'\" in VS,\n    'current audit registers checker': \"'店舗番号表示ラベル'\" in CURRENT and 'check-store-branch-label.py' in CURRENT,\n}\n\nfor forbidden in (\n    'state.', 'state =', 'saveGame', 'localStorage', 'indexedDB', 'firebase',\n    'money', 'inventory', 'aquarium', 'eventState', 'screenData', 'document.', 'window.', './assets/',\n):\n    checks[f'helper has no reverse dependency: {forbidden}'] = forbidden not in HELPER\n\nfailed = []\nfor label, ok in checks.items():\n    print(('OK' if ok else 'NG') + ': ' + label)\n    if not ok:\n        failed.append(label)\n\nfor source in (APP_PATH, HELPER_PATH):\n    syntax = subprocess.run(['node', '--check', str(source)], cwd=ROOT, text=True, capture_output=True)\n    if syntax.returncode:\n        failed.append(f'{source.name} JavaScript syntax')\n        print(syntax.stdout)\n        print(syntax.stderr)\n\nunit = subprocess.run(['node', 'tools/test-store-branch-label.mjs'], cwd=ROOT, text=True, capture_output=True)\nprint(unit.stdout, end='')\nif unit.stderr:\n    print(unit.stderr, file=sys.stderr, end='')\nif unit.returncode:\n    failed.append('store branch label unit test')\n\nif failed:\n    print('\\nSTORE BRANCH LABEL INTEGRATION: FAIL')\n    for label in failed:\n        print(f'- {label}')\n    sys.exit(1)\n\nprint('\\nSTORE BRANCH LABEL INTEGRATION: PASS')\nprint('店舗番号の表示文字列変換だけをUI helperへ分離し、店舗状態・所持金・在庫・販売・画面遷移はapp.js側に維持しています。')\n""", encoding='utf-8')

          replace_once(
              'sw.js',
              "  './js/ui/tool-brief.js?v=0.10.863',",
              "  './js/ui/tool-brief.js?v=0.10.863',\n  './js/ui/store-branch-label.js?v=0.10.863',",
          )
          replace_once(
              'scripts/version-sync.py',
              "    Rule('sw.js', 'tool-brief.js precache key', qparam(r'\\./js/ui/tool-brief\\.js'), keep_prefix),\n    Rule('sw.js', 'press-hold-controller.js precache key', qparam(r'\\./js/ui/press-hold-controller\\.js'), keep_prefix),",
              "    Rule('sw.js', 'tool-brief.js precache key', qparam(r'\\./js/ui/tool-brief\\.js'), keep_prefix),\n    Rule('sw.js', 'store-branch-label.js precache key', qparam(r'\\./js/ui/store-branch-label\\.js'), keep_prefix),\n    Rule('sw.js', 'press-hold-controller.js precache key', qparam(r'\\./js/ui/press-hold-controller\\.js'), keep_prefix),",
          )
          replace_once(
              'scripts/version-sync.py',
              "    Rule('js/app.js', 'tool-brief.js import key', qparam(r'\\./ui/tool-brief\\.js'), keep_prefix),\n    Rule('js/app.js', 'press-hold-controller.js import key', qparam(r'\\./ui/press-hold-controller\\.js'), keep_prefix),",
              "    Rule('js/app.js', 'tool-brief.js import key', qparam(r'\\./ui/tool-brief\\.js'), keep_prefix),\n    Rule('js/app.js', 'store-branch-label.js import key', qparam(r'\\./ui/store-branch-label\\.js'), keep_prefix),\n    Rule('js/app.js', 'press-hold-controller.js import key', qparam(r'\\./ui/press-hold-controller\\.js'), keep_prefix),",
          )
          replace_once(
              'scripts/check-current.py',
              "    ('工具説明UI', [sys.executable, str(ROOT / 'scripts/check-tool-brief.py')]),\n    ('数量長押し管理', [sys.executable, str(ROOT / 'scripts/check-press-hold-controller.py')]),",
              "    ('工具説明UI', [sys.executable, str(ROOT / 'scripts/check-tool-brief.py')]),\n    ('店舗番号表示ラベル', [sys.executable, str(ROOT / 'scripts/check-store-branch-label.py')]),\n    ('数量長押し管理', [sys.executable, str(ROOT / 'scripts/check-press-hold-controller.py')]),",
          )
          replace_once(
              'CHANGELOG.md',
              "## v0.10.863\n",
              "## v0.10.864\n- 店舗1・店舗2・店舗3などの店舗番号表示文字列を作る純粋処理だけを `js/ui/store-branch-label.js` へ分離。\n- 既存 `storeBranchLabel()` は薄いラッパーとして残し、既存の全呼び出し位置・店舗表示文言・数値変換ルールを維持。\n- 店舗状態・所持金・在庫・販売・家賃・来店・通知・画面遷移・セーブ・イベント・画像には変更なし。\n- 新UI helperをService Workerと `version-sync.py` へ正式登録し、専用単体/統合検査を総合監査へ追加。\n\n## v0.10.863\n",
          )
          PY
          python3 scripts/version-sync.py --set 0.10.864
          python3 scripts/generate-event-probability-list.py --write
          git rm .github/workflows/stage16-implement.yml
      - name: Commit exact stage 16 tree locally
        run: |
          git config user.name "cadgosho-dot"
          git config user.email "cadgosho@gmail.com"
          git add VERSION README.md CHANGELOG.md GAME_RULES.md ASSETS.md TODO.md EVENT_PROBABILITY_LIST.md game.html index.html auth.html auth-cache-recovery.js hosting-origin-guard.js sw.js js/app.js js/game-data.js js/game-data-core.js js/memories-screen.js js/firebase-service.js js/audio.js js/ui/store-branch-label.js scripts/version-sync.py scripts/check-current.py scripts/check-store-branch-label.py tools/test-store-branch-label.mjs .github/workflows/stage16-implement.yml || true
          echo '=== staged files ==='
          git diff --cached --name-only
          if git diff --cached --name-only | grep -Ei '\.(png|jpe?g|webp|gif)$'; then
            echo 'Image diff detected; aborting.' >&2
            exit 1
          fi
          git commit -m "v0.10.864 店舗番号表示ラベルをhelperへ分離"
      - name: Dedicated checks
        run: |
          node --check js/app.js
          node --check js/ui/store-branch-label.js
          node tools/test-store-branch-label.mjs
          python3 scripts/check-store-branch-label.py
          python3 scripts/version-sync.py --check
          python3 scripts/generate-event-probability-list.py --check
      - name: Prepare full audit environment
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Full current audit with browser smoke
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          timeout 8m python3 -u scripts/check-current.py
      - name: Verify final diff and push implementation branch
        run: |
          echo '=== final diff from stage base ==='
          git diff --name-only 8e64c8c1539fbe752f7a53bff00574d2f9f9aa81 HEAD
          if git diff --name-only 8e64c8c1539fbe752f7a53bff00574d2f9f9aa81 HEAD | grep -Ei '\.(png|jpe?g|webp|gif)$'; then
            echo 'Image diff detected; aborting.' >&2
            exit 1
          fi
          test "$(cat VERSION)" = '0.10.864'
          test ! -e .github/workflows/stage16-implement.yml
          git push origin HEAD:jxj-stage16-v0.10.864
