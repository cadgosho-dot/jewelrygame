<!doctype html><html lang="ja" data-device-class="phone" data-orientation="portrait" style="--safe-top:0px;--safe-bottom:0px;--jwj-ui-scale:1;--jwj-edge-gap:7px;--jwj-layout-width:100%;--jwj-layout-height:100dvh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./styles.css"></head>
<body data-screen="mining" data-header-mode="two-bar"><div id="root"><main class="screen-shell"><header class="game-header"><div class="status-left" aria-label="日付、曜日、何日目、天気、時間、名前、空腹度"><div class="status-top-line"><div class="status-primary-line"><span class="header-status-item header-calendar-date">2026年7月30日</span><span class="header-status-item header-weekday weekday-normal">（木）</span><span class="header-status-item header-day">17日目</span><span class="header-status-item header-weather">☀ 晴れ</span><span class="header-time-slot header-time-primary"><span class="header-status-item header-time game-time-panel normal">18:00</span></span></div><div class="status-secondary-line"><span class="header-time-slot header-time-secondary"><span class="header-status-item header-time game-time-panel normal">18:00</span></span><span class="header-status-item header-player-name">川原プレイヤー</span><span class="header-status-item header-hunger">空腹度 5／7</span></div></div></div><div class="header-money-area"><div class="header-primary-actions"><button class="small-button header-main-button">メイン画面</button></div><span class="header-money"><span class="header-money-value">123,456円</span></span></div><div class="header-center"><button class="icon-button" aria-label="戻る">←</button><div class="header-title"><strong>採掘</strong></div><div class="header-actions header-secondary-actions"><button class="icon-button header-help-button">?</button><button class="small-button header-main-button">メイン画面</button></div></div></header><section class="screen-content"><div class="split-layout"><section class="scene-space"></section><section class="action-panel glass-panel"><h1 id="content-start">採掘場所</h1><p>本文は上部バーの下から開始します。</p><button>河原</button></section></div></section></main></div><script>
addEventListener('load',()=>{const h=document.querySelector('.game-header').getBoundingClientRect();const c=document.querySelector('.screen-content').getBoundingClientRect();const s=document.querySelector('#content-start').getBoundingClientRect();const b1=getComputedStyle(document.querySelector('.game-header'),'::before');const b2=getComputedStyle(document.querySelector('.game-header'),'::after');document.body.dataset.test=JSON.stringify({header:{top:h.top,bottom:h.bottom,height:h.height},content:{top:c.top},start:{top:s.top},beforeHeight:b1.height,afterHeight:b2.height,overlap:s.top<h.bottom});});
</script></body></html>
