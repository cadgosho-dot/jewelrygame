name: mining-battle-inspect-temp
on:
  push:
    branches: [work/mining-battle-approved-20260916]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .tmp/mining-battle-inspect.py
      - uses: actions/upload-artifact@v4
        with:
          name: mining-battle-inspection
          path: .tmp/mining-battle-inspection.txt
          retention-days: 1
