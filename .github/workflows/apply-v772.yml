name: Apply v0.10.772 deep cleanup

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-v772-deep-cleanup.py'
      - '.github/workflows/apply-v772.yml'

jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Rebase latest main
        run: git pull --rebase origin main

      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Repair temporary test quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-v772-deep-cleanup.py')
          text = path.read_text(encoding='utf-8')
          first_old = "long_term_test = r'''#!/usr/bin/env python3"
          first_new = 'long_term_test = r"""#!/usr/bin/env python3'
          second_old = "\n'''\nwrite('scripts/check-long-term-misc-cleanup.py', long_term_test)"
          second_new = '\n"""\nwrite(\'scripts/check-long-term-misc-cleanup.py\', long_term_test)'
          if text.count(first_old) != 1:
              raise SystemExit(f'first repair marker count={text.count(first_old)}')
          if text.count(second_old) != 1:
              raise SystemExit(f'second repair marker count={text.count(second_old)}')
          text = text.replace(first_old, first_new, 1).replace(second_old, second_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply-v772-deep-cleanup.py

      - name: Apply deep cleanup
        run: python3 scripts/apply-v772-deep-cleanup.py

      - name: Bump build version
        run: python3 scripts/version-sync.py --bump-patch

      - name: JavaScript syntax checks
        run: |
          node --check js/game-data-core.js
          node --check js/game-data.js
          node --check js/firebase-service.js
          node --check js/app.js

      - name: Focused cleanup checks
        run: |
          python3 scripts/check-long-term-history.py
          python3 scripts/check-long-term-misc-cleanup.py
          python3 scripts/check-cloud-delete-policy.py
          python3 scripts/check-orphan-chunk-cleanup.py
          python3 scripts/check-indexeddb-save-policy.py

      - name: Full current-build audit
        run: python3 -u scripts/check-current.py

      - name: Diff check
        run: git diff --check

      - name: Commit implementation and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-v772.yml scripts/apply-v772-deep-cleanup.py
          git add -A
          git commit -m "v0.10.772: Deep-clean long-term save data"
          git pull --rebase origin main
          git push origin HEAD:main
