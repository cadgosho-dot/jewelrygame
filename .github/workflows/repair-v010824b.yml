name: v0.10.824 exact repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v010824b.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 3

      - name: Patch exact integration gaps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected source was not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Gray-hood: runtime stage allowlist.
          p = Path('js/app.js')
          app = p.read_text(encoding='utf-8')
          m = re.search(r"(grayHoodAquariumEvent\s*:\s*new Set\(\[)([^\]]*)(\]\))", app)
          if not m:
              raise SystemExit('gray hood app stage set not found')
          stages = m.group(2)
          if 'intro2b' not in stages:
              stages = stages.replace("'intro2',", "'intro2','intro2b',", 1)
          if 'intro3b' not in stages:
              stages = stages.replace("'intro3',", "'intro3','intro3b',", 1)
          app = app[:m.start()] + m.group(1) + stages + m.group(3) + app[m.end():]
          p.write_text(app, encoding='utf-8')

          # Gray-hood: save/load normalization allowlist. This is the exact block reported by the audit.
          replace_once(
              'js/game-data-core.js',
              "const grayHoodStages = new Set(['idle', 'video', 'intro1', 'intro2', 'intro3', 'reward', 'farewell', 'unlockMessage', 'completed']);",
              "const grayHoodStages = new Set(['idle', 'video', 'intro1', 'intro2', 'intro2b', 'intro3', 'intro3b', 'reward', 'farewell', 'unlockMessage', 'completed']);",
              'gray hood saved stage allowlist',
          )
          replace_once(
              'js/game-data-core.js',
              "grayHoodAquariumEvent.stageAfterVideo = ['intro1', 'intro2', 'intro3', 'reward', 'farewell'].includes(grayHoodAquariumEvent.stageAfterVideo) ? grayHoodAquariumEvent.stageAfterVideo : '';",
              "grayHoodAquariumEvent.stageAfterVideo = ['intro1', 'intro2', 'intro2b', 'intro3', 'intro3b', 'reward', 'farewell'].includes(grayHoodAquariumEvent.stageAfterVideo) ? grayHoodAquariumEvent.stageAfterVideo : '';",
              'gray hood stageAfterVideo allowlist',
          )

          # Battle iframe owns its own BGM/SE; silence the parent scene while battle is open.
          audio_path = Path('js/audio-scene-map.js')
          audio = audio_path.read_text(encoding='utf-8')
          if 'retroBattleEvent:' not in audio:
              marker = "  oyatsuDaisukiEvent: 'okachimachi',"
              if marker not in audio:
                  raise SystemExit('battle audio insertion marker not found')
              audio = audio.replace(marker, marker + "\n  retroBattleEvent: 'silent',", 1)
              audio_path.write_text(audio, encoding='utf-8')

          # Production CSP blocks page-side eval used by Playwright wait_for_function.
          smoke_path = Path('scripts/check-browser-smoke.py')
          smoke = smoke_path.read_text(encoding='utf-8')
          helper_marker = "def free_port() -> int:\n"
          if 'def wait_screen(page, name: str' not in smoke:
              helper = '''def wait_screen(page, name: str, timeout: int = 10_000) -> None:\n    page.locator(f'body[data-screen="{name}"]').wait_for(state='attached', timeout=timeout)\n\n\ndef wait_saved_day_advance(page, before_day: int, timeout: int = 30_000) -> None:\n    deadline = time.monotonic() + timeout / 1000\n    while time.monotonic() < deadline:\n        raw = page.evaluate(f"localStorage.getItem({json.dumps(SAVE_KEY)})")\n        if raw:\n            try:\n                if int(json.loads(raw).get('game', {}).get('day') or 0) > int(before_day):\n                    return\n            except (TypeError, ValueError, json.JSONDecodeError):\n                pass\n        page.wait_for_timeout(100)\n    raise RuntimeError('就寝後の保存データで翌日への進行を確認できませんでした。')\n\n\n'''
              if helper_marker not in smoke:
                  raise SystemExit('browser smoke helper marker not found')
              smoke = smoke.replace(helper_marker, helper + helper_marker, 1)
          smoke = smoke.replace("page.wait_for_function(\"document.body.dataset.screen === 'main'\", timeout=15_000)", "wait_screen(page, 'main', 15_000)")
          smoke = smoke.replace("page.wait_for_function(\"document.body.dataset.screen === 'phone'\", timeout=10_000)", "wait_screen(page, 'phone', 10_000)")
          smoke = smoke.replace("page.wait_for_function(\"document.body.dataset.screen === 'main'\", timeout=10_000)", "wait_screen(page, 'main', 10_000)")
          smoke = smoke.replace("aquarium.wait_for_function(\"!document.body.classList.contains('aquarium-waiting')\", timeout=10_000)", "aquarium.locator('body:not(.aquarium-waiting)').wait_for(state='attached', timeout=10_000)")
          sleep_wait = re.compile(
              r"\s*page\.wait_for_function\(\n"
              r"\s*f\"\"\"\(\) => \{\{\n"
              r"\s*const raw = localStorage\.getItem\('\{SAVE_KEY\}'\);\n"
              r"\s*if \(!raw\) return false;\n"
              r"\s*try \{\{ return \(Number\(JSON\.parse\(raw\)\.game\.day\) \|\| 0\) > \{int\(before_day\)\}; \}\} catch \(_\) \{\{ return false; \}\}\n"
              r"\s*\}\}\"\"\",\n"
              r"\s*timeout=30_000,\n"
              r"\s*\)"
          )
          smoke, count = sleep_wait.subn("\n                wait_saved_day_advance(page, before_day, 30_000)", smoke, count=1)
          if 'wait_for_function(' in smoke:
              raise SystemExit('browser smoke still contains wait_for_function')
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

      - name: Synchronize v0.10.824 and generated files
        run: |
          python3 scripts/version-sync.py --set 0.10.824
          python3 scripts/generate-event-probability-list.py --write
          python3 scripts/generate-assets-manifest.py --write
          python3 scripts/version-sync.py --check
          node --check js/app.js

      - name: Install Chromium audit runtime
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Run mandatory full audit
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: timeout 8m python3 -u scripts/check-current.py

      - name: Commit repaired build
        run: |
          rm -f .github/workflows/repair-v010824.yml .github/workflows/repair-v010824b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair v0.10.824 build audit"
          git pull --rebase origin main
          git push origin HEAD:main
