name: code-audit-stage40
on:
  push:
    branches: [audit-after-stage40]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit selected high-risk functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('js/app.js').read_text(encoding='utf-8')
          lines=text.splitlines()
          names=['render','settleDay','runEventEmergencySettlement','customerBuy','saveGame','renderStore','renderOrders','scheduleCustomerVisit','deliverOrder','craft']
          def extract(name):
              pat=re.compile(rf'^\s*function\s+{re.escape(name)}\s*\([^)]*\)\s*\{{')
              start=None
              for i,l in enumerate(lines):
                  if pat.match(l): start=i; break
              if start is None: return None
              depth=0; seen=False; end=start
              for j in range(start,len(lines)):
                  s=lines[j].split('//',1)[0]
                  depth += s.count('{')-s.count('}')
                  if '{' in s: seen=True
                  if seen and depth<=0:
                      end=j; break
              return start+1,end+1,'\n'.join(lines[start:end+1])
          for name in names:
              item=extract(name)
              if not item:
                  print(f'=== {name}: NOT FOUND ==='); continue
              start,end,body=item
              metrics={
                'state_refs':len(re.findall(r'\bstate\b',body)),
                'state_assignments':len(re.findall(r'\bstate(?:\?\.)?(?:\.[A-Za-z_$][\w$]*)+\s*(?:\+\+|--|[+\-*/]?=)',body)),
                'save_calls':len(re.findall(r'\bsaveGame\s*\(',body)),
                'advance_time_calls':len(re.findall(r'\badvanceTime\s*\(',body)),
                'random_refs':len(re.findall(r'Math\.random|\brandom\w*\s*\(',body,re.I)),
                'render_calls':len(re.findall(r'\brender[A-Za-z0-9_$]*\s*\(',body)),
                'money_refs':len(re.findall(r'\bmoney\b|finance|revenue|payment|price|cost',body,re.I)),
                'inventory_refs':len(re.findall(r'inventory|stock|materials|\bloose\b',body,re.I)),
                'event_refs':len(re.findall(r'eventState|\bevent\b|Event',body)),
              }
              calls=[]
              seen=set()
              for m in re.finditer(r'\b([A-Za-z_$][\w$]*)\s*\(',body):
                  c=m.group(1)
                  if c in {'if','for','while','switch','function','Math','String','Number','Boolean','Array','Object','Date','Set','Map'}: continue
                  if c not in seen:
                      seen.add(c); calls.append(c)
              print(f'=== {name} L{start}-L{end} lines={end-start+1} refs={text.count(name+"(")} ===')
              print('METRICS ' + ' '.join(f'{k}={v}' for k,v in metrics.items()))
              print('CALLS ' + ', '.join(calls[:40]))
              print('STATE PATHS ' + ', '.join(sorted(set(re.findall(r'\bstate(?:\?\.)?((?:\.[A-Za-z_$][\w$]*){1,4})',body)))[:30]))
          PY
