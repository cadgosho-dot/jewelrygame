name: diag 3D glasses production
on:
  push:
    branches: [fix/3d-glasses-production-implementation-20260909]
    paths: ['.github/workflows/diag-3d-glasses-production.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact production event blocks
        shell: bash
        run: |
          echo '=== app.js 11735-11855 ==='
          sed -n '11735,11855p' js/app.js
          echo '=== render loose matches ==='
          grep -nE 'renderLooseShopOriginal|incorrectAnswer|jxj-quiz-loose-v2' js/app.js | tail -n 160 || true
