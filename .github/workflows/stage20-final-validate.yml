name: stage20-final-validate
on:
  push:
    branches: [jxj-stage20-v0.10.868]
    paths: [stage20-final-trigger.txt]
permissions:
  contents: write
jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: jxj-stage20-v0.10.868
          fetch-depth: 0
      - name: Apply exact stage 20 patch
        run: |
          test "$(git merge-base HEAD 353d71419cd5e576882845fc663b3dc5e4ab0f8a)" = '353d71419cd5e576882845fc663b3dc5e4ab0f8a'
          python3 scripts/stage20-apply.py
          python3 scripts/version-sync.py --set 0.10.868
          python3 scripts/generate-event-probability-list.py --write
      - name: Commit implementation tree
        run: |
          git config user.name "cadgosho-dot"
          git config user.email "cadgosho@gmail.com"
          git rm scripts/stage20-apply.py
          git add -A
          echo '=== staged files ==='
          git diff --cached --name-only
          if git diff --cached --name-only | grep -Ei '\.(png|jpe?g|webp|gif)$'; then
            echo 'Image diff detected; aborting.' >&2
            exit 1
          fi
          git commit -m "v0.10.868 原石表示ラベルをhelperへ分離"
      - name: Dedicated checks
        run: |
          node --check js/app.js
          node --check js/ui/rough-display-name.js
          node tools/test-rough-display-name.mjs
          python3 scripts/check-rough-display-name.py
          python3 scripts/version-sync.py --check
          python3 scripts/generate-event-probability-list.py --check
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Full current audit with browser smoke
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: timeout 8m python3 -u scripts/check-current.py
      - name: Verify exact diff and push
        run: |
          echo '=== diff from exact main baseline ==='
          git diff --name-only 353d71419cd5e576882845fc663b3dc5e4ab0f8a HEAD
          if git diff --name-only 353d71419cd5e576882845fc663b3dc5e4ab0f8a HEAD | grep -Ei '\.(png|jpe?g|webp|gif)$'; then
            echo 'Image diff detected; aborting.' >&2
            exit 1
          fi
          test "$(cat VERSION)" = '0.10.868'
          test ! -e scripts/stage20-apply.py
          git push origin HEAD:jxj-stage20-v0.10.868
