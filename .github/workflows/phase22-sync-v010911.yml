name: Phase22 Formal Sync v0.10.911

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register Stage22 checker and sync version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-current.py')
          text = p.read_text(encoding='utf-8')
          needle = "    ('工房拡張処理保護', [sys.executable, str(ROOT / 'scripts/check-expand-workshop-regression.py')]),\n"
          insert = needle + "    ('店舗レベルアップ処理保護', [sys.executable, str(ROOT / 'scripts/check-upgrade-store-level-regression.py')]),\n"
          if 'check-upgrade-store-level-regression.py' not in text:
              if needle not in text:
                  raise SystemExit('Stage22 insertion point not found')
              text = text.replace(needle, insert, 1)
              p.write_text(text, encoding='utf-8')
          PY
          python3 scripts/version-sync.py --set 0.10.911
          python3 scripts/version-sync.py --check
          python3 scripts/check-upgrade-store-level-regression.py
      - name: Commit formal sync and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase22-sync-v010911.yml
          git add -A
          git commit -m "v0.10.911 第22段階正式同期"
          git push origin HEAD:main
