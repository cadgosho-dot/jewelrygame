name: implement approved 3D glasses event
on:
  push:
    branches:
      - fix/3d-glasses-production-implementation-20260909
    paths:
      - .github/workflows/implement-3d-glasses-approved.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/implement_3d_glasses_approved.py
      - name: Verify
        run: |
          node --check js/app.js
          test "$(cat VERSION)" = "0.10.937"
          grep -Fq "session.stage = 'incorrectAnswer';" js/app.js
          grep -Fq "grantLooseShopOriginalQuizReward();" js/app.js
          grep -Fq "v0.10.937 — 3Dメガネイベント実機承認レイアウト" quiz-event-v2.css
          grep -Fq "transform:translateY(clamp(60px,7dvh,100px))!important;" quiz-event-v2.css
          grep -Fq "max-width:70vw!important;" quiz-event-v2.css
          grep -Fq "margin-top:10px!important;" quiz-event-v2.css
      - name: Commit
        run: |
          rm -f .github/workflows/diag-3d-glasses-production.yml
          rm -f .github/workflows/implement-3d-glasses-approved.yml
          rm -f scripts/implement_3d_glasses_approved.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.10.937 3Dメガネイベント承認済み表示を本番実装"
          git push
