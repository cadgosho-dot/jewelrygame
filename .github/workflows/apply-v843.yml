name: Apply v0.10.843 integration

on:
  push:
    branches:
      - tmp-v843-apply

permissions:
  contents: write

concurrency:
  group: jewelrygame-v843-integration
  cancel-in-progress: false

jobs:
  apply-v843:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: tmp-v843-apply
          fetch-depth: 0

      - name: Apply v0.10.841-v0.10.843
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(tr -d '\r\n' < VERSION)"
          if [ "$current_version" != "0.10.840" ]; then
            echo "Unexpected VERSION: $current_version" >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = Path('.github/v843.patch.zlib.b64').read_text(encoding='utf-8').strip()
          Path('/tmp/v843.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          git apply --check /tmp/v843.patch
          git apply /tmp/v843.patch
          python3 scripts/version-sync.py --set 0.10.843
          python3 scripts/generate-assets-manifest.py --write
          python3 scripts/generate-event-probability-list.py --write

      - name: Verify integrated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.10.843"
          node --check js/app.js
          python3 scripts/version-sync.py --check
          python3 scripts/check-current.py

      - name: Commit integrated build and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .github/workflows/apply-v843.yml .github/v843.patch.zlib.b64
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate workshop fixes v0.10.843"
          git push origin HEAD:tmp-v843-apply

# retry after generator flag correction
