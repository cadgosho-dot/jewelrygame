name: Phase45 Formal Sync v0.10.934

on:
  push:
    branches: [main, protect-stage45]
    paths:
      - '.github/workflows/phase45-sync-v010934.yml'
      - 'tools/test-robbery-event-regression.mjs'
      - 'scripts/check-robbery-event-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'protect-stage45'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate robbery event protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          test ! -e .github/workflows/stage45-audit.yml
          python3 scripts/version-sync.py --check
          python3 scripts/check-robbery-event-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.933'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('謎の中華料理 食事確定処理保護', [sys.executable, str(ROOT / 'scripts/check-mystery-chinese-meal-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-robbery-event-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('強盗事件 完成品盗難確定処理保護', [sys.executable, str(ROOT / 'scripts/check-robbery-event-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.934\n- 中核処理保護・第45段階：強盗事件の完成品盗難確定 `maybeTriggerRobberyEvent()` を動的回帰テストと静的検査で固定。\n- 発生抑止、未処理報告による二重実行防止、木刀による発生率補正、盗難対象・損失額、完成品除去、盗難情報、履歴上限、通知を検証。\n- ゲーム仕様・強盗発生率・木刀効果・価格・在庫・イベント内容・画像・音声・セーブ形式・クラウド保存形式の変更なし。\n'
          assert '## v0.10.934' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-robbery-event-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.933', '?v=0.10.934').replace("const UI_BUILD_VERSION = '0.10.933';", "const UI_BUILD_VERSION = '0.10.934';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase45-sync-v010934.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.934 第45段階正式同期'
          git push origin HEAD:main
