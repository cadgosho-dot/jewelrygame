name: Phase39 Formal Sync v0.10.928

on:
  push:
    branches: [main, protect-stage39]
    paths:
      - '.github/workflows/phase39-sync-v010928.yml'
      - 'tools/test-event-emergency-settlement-regression.mjs'
      - 'scripts/check-event-emergency-settlement-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'protect-stage39'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate event emergency settlement protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-event-emergency-settlement-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.927'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('セーブ統括処理保護', [sys.executable, str(ROOT / 'scripts/check-save-game-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-event-emergency-settlement-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('イベント緊急確定処理保護', [sys.executable, str(ROOT / 'scripts/check-event-emergency-settlement-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.928\n- 中核処理保護・第39段階：イベント中断・異常終了時の共通確定処理 `runEventEmergencySettlement()` を動的回帰テストと静的検査で固定。\n- 報酬の二重付与防止、通行費・募金・お祓い・映画代の二重課金防止、映画の時間消費、加工知識復旧、盗難確定、イベント別20分岐を検証。\n- ゲーム仕様・イベント内容・価格・在庫・画像・音声・セーブ形式・クラウド保存形式の変更なし。\n'
          assert '## v0.10.928' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-event-emergency-settlement-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.927', '?v=0.10.928').replace("const UI_BUILD_VERSION = '0.10.927';", "const UI_BUILD_VERSION = '0.10.928';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase39-sync-v010928.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.928 第39段階正式同期'
          git push origin HEAD:main
