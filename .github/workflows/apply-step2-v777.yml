name: Apply step2 v0.10.777

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run step2 v0.10.777'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Indian curry and naan image
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin step2-v777-assets:refs/remotes/origin/step2-v777-assets
          mkdir -p assets/images/foods
          git show origin/step2-v777-assets:.github/v777-step2/indian.b64 | base64 -d > assets/images/foods/indian-v777.webp
          echo '0cde6d1ffbca293901e3941d424ac397caa47e93bfc80117ed93a8ba12d36241  assets/images/foods/indian-v777.webp' | sha256sum -c -
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          version_files = [
              'VERSION','auth-cache-recovery.js','game.html','hosting-origin-guard.js','index.html',
              'js/app.js','js/firebase-service.js','js/game-data.js','js/memories-screen.js','sw.js'
          ]
          for rel in version_files:
              p = Path(rel)
              s = p.read_text()
              if '0.10.776' not in s and rel != 'VERSION':
                  raise SystemExit(f'expected 0.10.776 in {rel}')
              s = s.replace('0.10.776','0.10.777')
              p.write_text(s)

          app = Path('js/app.js')
          s = app.read_text()
          old = "  indian: './assets/images/foods/indian.png',\n"
          new = "  indian: './assets/images/foods/indian-v777.webp',\n"
          if s.count(old) != 1:
              raise SystemExit('indian image anchor mismatch')
          s = s.replace(old, new, 1)
          app.write_text(s)
          PY
          node --check js/app.js
          node --check js/firebase-service.js
          python3 scripts/check-current.py
          grep -q '^0.10.777$' VERSION
          grep -q "indian: './assets/images/foods/indian-v777.webp'" js/app.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cadgosho-dot'
          git config user.email 'cadgosho@gmail.com'
          git add VERSION auth-cache-recovery.js game.html hosting-origin-guard.js index.html js/app.js js/firebase-service.js js/game-data.js js/memories-screen.js sw.js assets/images/foods/indian-v777.webp
          git commit -m 'v0.10.777: Indian curry and naan image'
          git push origin main
