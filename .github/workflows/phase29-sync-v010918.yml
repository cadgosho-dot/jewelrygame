name: Phase29 Formal Sync v0.10.918

on:
  push:
    branches: [main, phase29-manual-meal-protection]
    paths:
      - '.github/workflows/phase29-sync-v010918.yml'
      - 'tools/test-manual-meal-regression.mjs'
      - 'scripts/check-manual-meal-regression.py'

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  validate-feature:
    if: github.ref_name == 'phase29-manual-meal-protection'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate manual meal protection
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-manual-meal-regression.py
          python3 scripts/check-current.py

  formal-sync:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register protection and synchronize version
        run: |
          test "$(tr -d '\n' < VERSION)" = '0.10.917'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-current.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    ('自動操縦処理保護', [sys.executable, str(ROOT / 'scripts/check-autopilot-regression.py')]),"
          assert text.count(anchor) == 1
          assert 'check-manual-meal-regression.py' not in text
          text = text.replace(anchor, anchor + "\n    ('通常食事処理保護', [sys.executable, str(ROOT / 'scripts/check-manual-meal-regression.py')]),")
          path.write_text(text, encoding='utf-8')
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## v0.10.'
          position = text.index(marker)
          entry = '\n## v0.10.918\n- 中核処理保護・第29段階：通常食事 eatMeal() とイベント再開・食事時間ヘルパーの現行挙動を動的回帰テストと静的検査で固定。\n- 連打防止、各開始条件、イベント優先、料金・60分消費・空腹回復・履歴の確定保存、確定前の巻き戻し、確定後の画面復旧を検証。\n- ゲーム処理・仕様・価格・イベント・画像・音声・セーブ形式の変更なし。\n'
          assert '## v0.10.918' not in text
          path.write_text(text[:position] + entry + text[position:], encoding='utf-8')
          PY
          python3 scripts/version-sync.py --bump-patch
          python3 scripts/version-sync.py --check
          python3 scripts/check-manual-meal-regression.py
      - name: Verify sync only changes version references in app
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:js/app.js'], text=True)
          after = Path('js/app.js').read_text(encoding='utf-8')
          expected = before.replace('?v=0.10.917', '?v=0.10.918').replace("const UI_BUILD_VERSION = '0.10.917';", "const UI_BUILD_VERSION = '0.10.918';")
          assert after == expected
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/'], text=True).strip()
          PY
      - name: Commit formal sync and remove this one-shot workflow
        run: |
          git rm .github/workflows/phase29-sync-v010918.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'v0.10.918 第29段階正式同期'
          git push origin HEAD:main
