<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>9月イベント「月見」確認用</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    body{display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
    .notice{width:min(100%,520px);font-size:12px;line-height:1.5;color:#e7e9f2;background:#171b27;border:1px solid #3a4053;border-radius:10px;padding:8px 10px}.notice b{color:#ffd98b}
    .toolbar{width:min(100%,520px);display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.toolbar button{white-space:nowrap;background:#202636;color:#fff;border:1px solid #4c556d;border-radius:999px;padding:7px 10px;font-size:12px}
    .phone{position:relative;width:min(100%,430px);height:min(78vh,820px);min-height:620px;overflow:hidden;border-radius:18px;background:#111;border:1px solid #30384a;box-shadow:0 15px 45px #0008}
    .scene{position:absolute;inset:0;background-image:linear-gradient(#0810203b,#04060b88),url('../assets/images/okachimachi-night-portrait.webp');background-size:cover;background-position:center;overflow:hidden}
    .moon{position:absolute;right:9%;top:7%;width:98px;height:98px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#fffde8 0 45%,#f8edbd 68%,#d5c78c 100%);box-shadow:0 0 20px #fff6bd99,0 0 60px #fff2a744}.moon:after{content:"";position:absolute;width:18px;height:11px;border-radius:50%;left:23px;top:26px;background:#b8ae7d24;box-shadow:35px 18px 0 5px #b8ae7d1d,13px 44px 0 2px #b8ae7d1f}
    .character{position:absolute;z-index:2;left:50%;bottom:18%;transform:translateX(-50%);width:54%;max-width:245px;height:54%;pointer-events:none;filter:drop-shadow(0 10px 12px #0008);transition:.18s ease}.head{position:absolute;width:32%;aspect-ratio:1;border-radius:50%;left:34%;top:6%;background:linear-gradient(145deg,#2e3240,#10131b)}.body{position:absolute;left:12%;right:12%;bottom:0;height:78%;background:linear-gradient(90deg,#11141c,#303544 50%,#11141c);clip-path:polygon(35% 0,65% 0,78% 16%,100% 100%,0 100%,22% 16%);border-radius:42% 42% 8% 8%}.sleeve{position:absolute;width:23%;height:48%;top:38%;background:#151923;border-radius:50%}.sleeve.l{left:0;transform:rotate(9deg)}.sleeve.r{right:0;transform:rotate(-9deg)}.brooch{position:absolute;left:43%;top:38%;width:14%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 30%,#f9fbff,#9cb6d7 35%,#60789c 58%,#e6e9f2 62%,#8c98ac 75%,#fff 100%);box-shadow:0 0 14px #b8d5ff88}
    .name{position:absolute;z-index:5;left:18px;bottom:154px;font-weight:700;font-size:15px;text-shadow:0 2px 5px #000,0 0 8px #000}
    .dialogue{position:absolute;z-index:4;left:16px;right:16px;bottom:24px;min-height:112px;padding:13px 7px 18px;background:transparent;border:0;font-size:17px;line-height:1.75;text-shadow:0 2px 4px #000,0 0 8px #000,0 0 14px #000}.tap{position:absolute;right:7px;bottom:0;font-size:11px;color:#e6ebf6cc;text-shadow:0 2px 5px #000}
    .quiz{position:absolute;z-index:6;left:12px;right:12px;bottom:14px;background:transparent;border:0;padding:0;text-shadow:0 2px 6px #000}.quiz h2{font-size:16px;line-height:1.5;margin:0 3px 10px;padding:8px 9px;background:#070a10b5;border-radius:9px}.choices{display:grid;gap:7px}.choices button{width:100%;text-align:left;padding:11px 12px;border-radius:9px;border:1px solid #737c91;background:#121722db;color:#fff;font-size:14px;line-height:1.3;box-shadow:0 3px 9px #0007}.choices button:active{transform:scale(.99)}
    .phone.mode-quiz .character{bottom:42%;width:45%;height:40%}.phone.mode-quiz .name{bottom:39%;left:16px}
    .result{position:absolute;z-index:7;left:16px;right:16px;bottom:24px;background:transparent;border:0;padding:8px 3px;line-height:1.75;font-size:16px;text-shadow:0 2px 5px #000,0 0 10px #000}.result h2{font-size:21px;margin:0 0 6px}.result button,.reward button,.end button{width:100%;margin-top:12px;padding:12px;border:1px solid #8791aa;border-radius:10px;background:#151b27dc;color:#fff;font-size:15px;box-shadow:0 3px 9px #0007}.phone.mode-result .character{bottom:25%;height:48%}.phone.mode-result .name{bottom:182px}
    .reward{position:absolute;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:transparent}.reward-card{width:min(92%,350px);text-align:center;background:transparent;border:0;padding:24px 18px;text-shadow:0 2px 5px #000,0 0 12px #000}.gem{width:96px;height:96px;margin:0 auto 14px;clip-path:polygon(50% 0,86% 20%,100% 58%,75% 100%,25% 100%,0 58%,14% 20%);background:radial-gradient(circle at 32% 25%,#fff 0 8%,#e4edf9 24%,#8fa8c7 48%,#526d94 70%,#dce7f4 88%,#8194ad);filter:drop-shadow(0 0 22px #c6dcffcc)}.reward h2{font-size:18px;margin:0 0 7px}.reward strong{font-size:23px}
    .end{position:absolute;z-index:9;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:20px;background:transparent}.end-card{width:100%;text-align:center;background:transparent;border:0;padding:20px 5px;line-height:1.7;text-shadow:0 2px 5px #000,0 0 12px #000}
    .hidden{display:none!important}
    @media (orientation:landscape){body{padding:6px}.notice,.toolbar{width:min(100%,850px)}.phone{width:min(92vw,850px);height:min(82vh,500px);min-height:420px}.scene{background-image:linear-gradient(#0810203b,#04060b88),url('../assets/images/okachimachi-night.webp')}.moon{right:12%;top:6%;width:82px;height:82px}.character,.phone.mode-quiz .character,.phone.mode-result .character{width:27%;height:70%;bottom:auto;top:3%}.name,.phone.mode-quiz .name,.phone.mode-result .name{left:3%;bottom:122px}.dialogue{left:3%;right:3%;bottom:15px;min-height:96px;padding:9px 5px 15px;font-size:15px}.quiz,.result{left:3%;right:3%;bottom:10px}.choices{grid-template-columns:1fr 1fr}.choices button{padding:8px 10px}.quiz h2{font-size:14px;margin-bottom:7px;padding:6px 8px}.reward-card{padding:12px}.gem{width:72px;height:72px;margin-bottom:8px}}
  </style>
</head>
<body>
  <div class="notice"><b>確認用・本番未実装</b>　9月イベント「月見」案です。キャラクター、セリフ、4択、正誤、報酬、終了までイベント全体を本番想定の配置で確認できます。発生日・発生率・BGMは実装時に確定します。</div>
  <div class="toolbar" aria-label="確認用ジャンプ"><button data-jump="intro0">開始</button><button data-jump="quiz">4択</button><button data-jump="correct">正解</button><button data-jump="wrong">不正解</button><button data-jump="reward">報酬</button><button data-jump="end">終了</button></div>
  <main class="phone" id="phone">
    <div class="scene">
      <div class="moon" aria-hidden="true"></div>
      <div class="character" aria-label="月見客"><div class="head"></div><div class="body"></div><div class="sleeve l"></div><div class="sleeve r"></div><div class="brooch"></div></div>
      <div class="name" id="name">月見客</div>
      <section class="dialogue" id="dialogue"><span id="dialogueText"></span><span class="tap">タップで次へ</span></section>
      <section class="quiz hidden" id="quiz"><h2>ムーンストーンに見られる、石の内部から青白い光が漂うように見える効果を何という？</h2><div class="choices"><button data-answer="correct">A　アデュラレッセンス</button><button data-answer="wrong">B　アベンチュレッセンス</button><button data-answer="wrong">C　プレイ・オブ・カラー</button><button data-answer="wrong">D　キャッツアイ効果</button></div></section>
      <section class="result hidden" id="result"><h2 id="resultTitle"></h2><div id="resultText"></div><button id="resultNext"></button></section>
      <section class="reward hidden" id="reward"><div class="reward-card"><div class="gem" aria-hidden="true"></div><h2>報酬を手に入れた</h2><strong>ムーンストーン × 1</strong><button id="rewardNext">次へ</button></div></section>
      <section class="end hidden" id="end"><div class="end-card"><div>月見客は月を見上げながら、静かに去っていった。</div><button id="restart">イベント終了</button></div></section>
    </div>
  </main>
<script>
(()=>{
  const phone=document.getElementById('phone'),dialogue=document.getElementById('dialogue'),dialogueText=document.getElementById('dialogueText'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText'),resultNext=document.getElementById('resultNext'),reward=document.getElementById('reward'),end=document.getElementById('end'),name=document.getElementById('name');
  const lines=['今夜は、月がずいぶん明るいですね。','月の名を持つ宝石にも、月明かりのような光があります。','職人さん。ひとつ、問題です。'];let line=0;
  const hideAll=()=>{phone.className='phone';dialogue.classList.add('hidden');quiz.classList.add('hidden');result.classList.add('hidden');reward.classList.add('hidden');end.classList.add('hidden');name.classList.remove('hidden')};
  function intro(index=0){hideAll();line=index;dialogueText.textContent=lines[line];dialogue.classList.remove('hidden')}
  function showQuiz(){hideAll();phone.classList.add('mode-quiz');quiz.classList.remove('hidden')}
  function showCorrect(){hideAll();phone.classList.add('mode-result');resultTitle.textContent='正解';resultText.textContent='その通り。あの光は「アデュラレッセンス」。石の中を漂う月光みたいでしょう。これは今夜の記念に。';resultNext.textContent='報酬を見る';resultNext.onclick=showReward;result.classList.remove('hidden')}
  function showWrong(){hideAll();phone.classList.add('mode-result');resultTitle.textContent='不正解';resultText.textContent='惜しい。答えは「アデュラレッセンス」です。光が石の内部を漂うように見える、ムーンストーンを代表する効果です。';resultNext.textContent='次へ';resultNext.onclick=showEnd;result.classList.remove('hidden')}
  function showReward(){hideAll();reward.classList.remove('hidden');name.classList.add('hidden')}
  function showEnd(){hideAll();end.classList.remove('hidden');name.classList.add('hidden')}
  dialogue.addEventListener('click',()=>{if(line<lines.length-1){line++;dialogueText.textContent=lines[line]}else showQuiz()});document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>b.dataset.answer==='correct'?showCorrect():showWrong()));document.getElementById('rewardNext').onclick=showEnd;document.getElementById('restart').onclick=()=>intro(0);document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>({intro0:()=>intro(0),quiz:showQuiz,correct:showCorrect,wrong:showWrong,reward:showReward,end:showEnd})[b.dataset.jump]()));intro(0);
})();
</script>
</body>
</html>
