name: Wolf Boy Event Prepare

on:
  push:
    branches:
      - feature/wolf-boy-ring-event

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print current asset hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum assets/images/events/wolf-boy.png
          sha256sum assets/images/events/wolf-boy-ring.png
          sha256sum assets/videos/wolf-boy-ring-event.mp4
          wc -c assets/images/events/wolf-boy.png assets/images/events/wolf-boy-ring.png assets/videos/wolf-boy-ring-event.mp4
