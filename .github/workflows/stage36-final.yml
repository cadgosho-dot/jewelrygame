name: stage36-final
on:
  push:
    branches: [refactor-stage36-final]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Apply stage36 customer template text refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_version = '0.10.883'
          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          legacy = """function customerTemplateText(template, request = {}) {
            const itemLabel = ITEMS[request.item]?.name || 'ジュエリー';
            return String(template || '').replace(/\{item\}/g, itemLabel);
          }"""
          wrapper = """function customerTemplateText(template, request = {}) {
            const itemLabel = ITEMS[request.item]?.name || 'ジュエリー';
            return formatCustomerTemplateText(template, itemLabel);
          }"""
          if app.count(legacy) != 1:
              raise SystemExit('legacy customerTemplateText implementation count is not 1')
          app = app.replace(legacy, wrapper, 1)

          import_marker = f"import {{ formatCustomerPreferenceLabel }} from './ui/customer-preference-label.js?v={old_version}';"
          helper_import = f"import {{ formatCustomerTemplateText }} from './ui/customer-template-text.js?v={old_version}';"
          if import_marker not in app:
              raise SystemExit('customer preference helper import marker missing')
          app = app.replace(import_marker, import_marker + '\n' + helper_import, 1)
          app_path.write_text(app, encoding='utf-8')

          Path('js/ui/customer-template-text.js').write_text("""export function formatCustomerTemplateText(template, itemLabel = 'ジュエリー') {
            return String(template || '').replace(/\{item\}/g, itemLabel);
          }
          """, encoding='utf-8')

          Path('tools/test-customer-template-text.mjs').write_text("""import assert from 'node:assert/strict';
          import { formatCustomerTemplateText } from '../js/ui/customer-template-text.js';
          assert.equal(formatCustomerTemplateText('ご希望は{item}です', 'リング'), 'ご希望はリングです');
          assert.equal(formatCustomerTemplateText('{item}と{item}を確認', 'ペンダント'), 'ペンダントとペンダントを確認');
          assert.equal(formatCustomerTemplateText('置換なし', 'ピアス'), '置換なし');
          assert.equal(formatCustomerTemplateText('', 'リング'), '');
          assert.equal(formatCustomerTemplateText(null, 'リング'), '');
          assert.equal(formatCustomerTemplateText('{item}'), 'ジュエリー');
          console.log('CUSTOMER TEMPLATE TEXT UNIT: PASS');
          """, encoding='utf-8')

          Path('scripts/check-customer-template-text.py').write_text("""#!/usr/bin/env python3
          from __future__ import annotations
          import subprocess, sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          VERSION = (ROOT / 'VERSION').read_text(encoding='utf-8').strip()
          APP = (ROOT / 'js/app.js').read_text(encoding='utf-8')
          HELPER = (ROOT / 'js/ui/customer-template-text.js').read_text(encoding='utf-8')
          SW = (ROOT / 'sw.js').read_text(encoding='utf-8')
          VS = (ROOT / 'scripts/version-sync.py').read_text(encoding='utf-8')
          CURRENT = (ROOT / 'scripts/check-current.py').read_text(encoding='utf-8')

          checks = {
              'versioned helper import': f\"from './ui/customer-template-text.js?v={VERSION}';\" in APP,
              'active references retained': APP.count('customerTemplateText(') == 4,
              'item lookup stays in app': \"const itemLabel = ITEMS[request.item]?.name || 'ジュエリー';\" in APP,
              'wrapper delegates': 'return formatCustomerTemplateText(template, itemLabel);' in APP,
              'legacy replace removed from app': \"return String(template || '').replace(/\\{item\\}/g, itemLabel);\" not in APP,
              'helper export': \"export function formatCustomerTemplateText(template, itemLabel = 'ジュエリー')\" in HELPER,
              'helper replacement': \"String(template || '').replace(/\\{item\\}/g, itemLabel)\" in HELPER,
              'service worker precache': f\"./js/ui/customer-template-text.js?v={VERSION}\" in SW,
              'version sync precache': \"'customer-template-text.js precache key'\" in VS,
              'version sync import': \"'customer-template-text.js import key'\" in VS,
              'current audit registration': \"'顧客テンプレート表示'\" in CURRENT and 'check-customer-template-text.py' in CURRENT,
          }
          for forbidden in ('ITEMS','GEMS','METALS','DESIGNS','state.','saveGame','loadState','localStorage','sessionStorage','indexedDB','firebase','money','inventory','eventState','document.','window.','navigator.','Math.random','./assets/'):
              checks[f'helper independent: {forbidden}'] = forbidden not in HELPER

          failed = []
          for label, ok in checks.items():
              print(('OK' if ok else 'NG') + ': ' + label)
              if not ok:
                  failed.append(label)

          for source in (ROOT / 'js/app.js', ROOT / 'js/ui/customer-template-text.js'):
              result = subprocess.run(['node', '--check', str(source)], cwd=ROOT, text=True, capture_output=True)
              if result.returncode:
                  print(result.stderr, end='')
                  failed.append(source.name + ' syntax')

          unit = subprocess.run(['node', 'tools/test-customer-template-text.mjs'], cwd=ROOT, text=True, capture_output=True)
          print(unit.stdout, end='')
          if unit.returncode:
              print(unit.stderr, end='')
              failed.append('unit test')

          if failed:
              print('CUSTOMER TEMPLATE TEXT INTEGRATION: FAIL')
              for label in failed:
                  print('- ' + label)
              sys.exit(1)
          print('CUSTOMER TEMPLATE TEXT INTEGRATION: PASS')
          """, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw_marker = f"  './js/ui/customer-preference-label.js?v={old_version}',"
          if sw_marker not in sw:
              raise SystemExit('service worker marker missing')
          sw = sw.replace(sw_marker, sw_marker + f"\n  './js/ui/customer-template-text.js?v={old_version}',", 1)
          sw_path.write_text(sw, encoding='utf-8')

          vs_path = Path('scripts/version-sync.py')
          lines = vs_path.read_text(encoding='utf-8').splitlines()
          out = []
          pre = False
          imp = False
          for line in lines:
              out.append(line)
              if "'customer-preference-label.js precache key'" in line:
                  out.append("    Rule('sw.js', 'customer-template-text.js precache key', qparam(r'\\./js/ui/customer-template-text\\.js'), keep_prefix),")
                  pre = True
              if "'customer-preference-label.js import key'" in line:
                  out.append("    Rule('js/app.js', 'customer-template-text.js import key', qparam(r'\\./ui/customer-template-text\\.js'), keep_prefix),")
                  imp = True
          if not (pre and imp):
              raise SystemExit('version-sync markers missing')
          vs_path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          current_path = Path('scripts/check-current.py')
          current = current_path.read_text(encoding='utf-8')
          current_marker = "    ('顧客希望表示', [sys.executable, str(ROOT / 'scripts/check-customer-preference-label.py')]),"
          current_new = "    ('顧客テンプレート表示', [sys.executable, str(ROOT / 'scripts/check-customer-template-text.py')]),"
          if current_marker not in current:
              raise SystemExit('check-current marker missing')
          current_path.write_text(current.replace(current_marker, current_marker + '\n' + current_new, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## v0.10.883'
          section = """## v0.10.884
          - 店頭接客の顧客セリフ内 `{item}` 表示置換を `js/ui/customer-template-text.js` へ分離。
          - `ITEMS` から商品名を解決する処理と既存の「ジュエリー」フォールバックは `app.js` 側に維持し、テンプレート文字列の置換だけを純粋UI helperへ移動。
          - 顧客生成・注文内容・接客判定・商品提案・価格・販売・所持金・在庫・セーブ・イベント・画像には変更なし。
          - Service Worker、`version-sync.py`、専用単体/統合検査、総合監査へ登録。

          """
          if marker not in changelog:
              raise SystemExit('changelog marker missing')
          changelog_path.write_text(changelog.replace(marker, section + marker, 1), encoding='utf-8')
          PY

          python3 scripts/version-sync.py --set 0.10.884
          python3 scripts/generate-event-probability-list.py --write
          node tools/test-customer-template-text.mjs
          python3 scripts/check-customer-template-text.py

      - name: Prepare real browser validation
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/generate-assets-manifest.py --write

      - name: Full current-build audit
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: timeout 8m python3 -u scripts/check-current.py

      - name: Verify no media changes and required tool images
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          changed = subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines()
          media = [p for p in changed if p.startswith('assets/') and Path(p).suffix.lower() in {'.png','.jpg','.jpeg','.webp','.gif','.svg','.mp3','.wav','.ogg','.m4a','.mp4','.webm','.mov'}]
          if media:
              raise SystemExit('Unexpected media changes: ' + ', '.join(media))
          print('MEDIA DIFF: PASS — 画像・音声・動画の変更 0件')
          expected = ['bench-peg.png','buffer.png','diamond-polishing-lap.png','dividers.png','electronic-scale.png','engraving-block.png','file.png','gem-polishing-machine.png','graver.png','hammer.png','jewelry-bench.png','loupe.png','magnifier.png','milgrain-tool.png','nipper.png','piercing-saw.png','pliers.png','rolling-mill.png','rotary-tool.png','stamps.png','torch.png','ultrasonic-cleaner.png','wood-block.png']
          missing = [name for name in expected if not (Path('assets/images/tools') / name).is_file()]
          if missing:
              raise SystemExit('Missing required tool images: ' + ', '.join(missing))
          print('TOOL IMAGES: 23/23 PASS')
          PY

      - name: Commit validated stage36 changes
        run: |
          git config user.name "cadgosho-dot"
          git config user.email "cadgosho@gmail.com"
          git add -A ':!.github/workflows/stage36-final.yml'
          git commit -m "v0.10.884 顧客テンプレート表示をhelperへ分離"
          git push origin HEAD:refactor-stage36-final
