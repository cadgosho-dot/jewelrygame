name: v0.10.731 更新後に通常ワークフローへ復帰

on:
  push:
    branches:
      - main

jobs:
  restore-workflow:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 通常ワークフローへ戻す
        run: |
          git show 0d5adffe4edf407cbd531aca225e0e87c6ac2a47:.github/workflows/update-metals.yml > .github/workflows/update-metals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-metals.yml
          if git diff --cached --quiet; then
            echo "すでに通常ワークフローです。"
            exit 0
          fi
          git commit -m "v0.10.731更新後に通常ワークフローへ復帰"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
