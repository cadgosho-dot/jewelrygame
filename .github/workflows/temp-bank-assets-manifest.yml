name: Temporary bank asset manifest refresh

on:
  push:
    branches:
      - fix/bank-background-original-png-20261001
    paths:
      - .github/workflows/temp-bank-assets-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Regenerate ASSETS.md with official generator
        run: |
          python scripts/generate-assets-manifest.py --write
          python scripts/generate-assets-manifest.py --check
          python scripts/check-repository-hygiene.py

      - name: Commit generated manifest and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASSETS.md
          git rm .github/workflows/temp-bank-assets-manifest.yml
          git commit -m "chore: refresh bank asset manifest"
          git push origin HEAD:${GITHUB_REF_NAME}
