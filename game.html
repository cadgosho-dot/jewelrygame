  <style id="event-video-contain-v638">
    /* v0.10.632: Event movies must always show the complete source frame.
       Landscape: maximize by available height. Portrait: maximize by available width. */
    :is(
      video[data-western-union-intro-video],
      video[data-tattoo-woman-amber-intro-video],
      video[data-cinema-event-video],
      video[data-apprentice-cinema-video],
      video[data-mystery-chinese-meal-intro-video],
      video[data-gray-hood-aquarium-intro-video],
      video[data-terry-california-intro-video],
      video[data-okachimachi-quiz-intro-video],
      video[data-glab-visit-video],
      video[data-kawahara-knowledge-intro-video]
    ) {
      object-fit: contain !important;
      object-position: center center !important;
      max-width: 100% !important;
      max-height: 100% !important;
      margin: auto !important;
    }

    @media (orientation: landscape) {
      :is(
        video[data-western-union-intro-video],
        video[data-tattoo-woman-amber-intro-video],
        video[data-cinema-event-video],
        video[data-apprentice-cinema-video],
        video[data-mystery-chinese-meal-intro-video],
        video[data-gray-hood-aquarium-intro-video],
        video[data-terry-california-intro-video],
        video[data-okachimachi-quiz-intro-video],
      video[data-glab-visit-video],
        video[data-kawahara-knowledge-intro-video]
      ) {
        width: auto !important;
        height: 100% !important;
      }
    }

    @media (orientation: portrait) {
      :is(
        video[data-western-union-intro-video],
        video[data-tattoo-woman-amber-intro-video],
        video[data-cinema-event-video],
        video[data-apprentice-cinema-video],
        video[data-mystery-chinese-meal-intro-video],
        video[data-gray-hood-aquarium-intro-video],
        video[data-terry-california-intro-video],
        video[data-okachimachi-quiz-intro-video],
      video[data-glab-visit-video],
        video[data-kawahara-knowledge-intro-video]
      ) {
        width: 100% !important;
        height: auto !important;
      }
    }


    /* g-Lab. 1/30 visit movie: preserve the whole frame and use pure black letterbox/pillarbox space. */
    .glab-visit-video-screen,
    .glab-visit-video-stage,
    .kawahara-knowledge-video-screen,
    .kawahara-knowledge-video-stage {
      background: #000 !important;
    }

    .glab-visit-video-screen,
    .kawahara-knowledge-video-screen {
      width: 100% !important;
      min-height: 100dvh !important;
      height: 100dvh !important;
      overflow: hidden !important;
    }

    .glab-visit-video-stage,
    .kawahara-knowledge-video-stage {
      width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
    }


    /* v0.10.642: Completion fallback caps; JS also emits direct completion sizing so ring/pendant silhouettes stay visible even with stale CSS. */
    .completion-jewelry-preview:not(.item-earrings) .jewelry-loose-set .center-gem {
      width: 84px !important;
      max-width: 84px !important;
    }
    .completion-jewelry-preview.item-pendant .jewelry-loose-set .center-gem {
      width: 74px !important;
      max-width: 74px !important;
    }
    .completion-jewelry-preview .jewelry-loose-set .center-gem > img.jewelry-loose-preview {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: 84px !important;
      object-fit: contain !important;
    }
    .completion-jewelry-preview.item-pendant .jewelry-loose-set .center-gem > img.jewelry-loose-preview {
      max-height: 74px !important;
    }
    @media (max-width: 700px) {
      .completion-jewelry-preview:not(.item-earrings) .jewelry-loose-set .center-gem {
        width: 70px !important;
        max-width: 70px !important;
      }
      .completion-jewelry-preview.item-pendant .jewelry-loose-set .center-gem {
        width: 62px !important;
        max-width: 62px !important;
      }
      .completion-jewelry-preview .jewelry-loose-set .center-gem > img.jewelry-loose-preview {
        max-height: 70px !important;
      }
      .completion-jewelry-preview.item-pendant .jewelry-loose-set .center-gem > img.jewelry-loose-preview {
        max-height: 62px !important;
      }
    }


    /* v0.10.643: Completion earrings use smaller stones; on portrait phones move the whole earring artwork slightly down. */
    .completion-jewelry-preview.item-earrings .jewelry-loose-set .center-gem {
      width: 48px !important;
      max-width: 48px !important;
      min-width: 0 !important;
    }
    .completion-jewelry-preview.item-earrings .jewelry-loose-set .center-gem > img.jewelry-loose-preview {
      display: block !important;
      width: 48px !important;
      height: 48px !important;
      max-width: 48px !important;
      max-height: 48px !important;
      object-fit: contain !important;
    }
    html[data-device-class="phone"] .completion-jewelry-preview.item-earrings .jewelry-loose-set .center-gem {
      width: 42px !important;
      max-width: 42px !important;
    }
    html[data-device-class="phone"] .completion-jewelry-preview.item-earrings .jewelry-loose-set .center-gem > img.jewelry-loose-preview {
      width: 42px !important;
      height: 42px !important;
      max-width: 42px !important;
      max-height: 42px !important;
    }
    html[data-device-class="phone"][data-orientation="portrait"] .completion-jewelry-preview.item-earrings .jewelry-item-shape.item-earrings,
    html[data-device-class="phone"][data-orientation="portrait"] .completion-jewelry-preview.item-earrings .jewelry-preview-loose {
      transform: translateY(16px) !important;
    }
  </style>
