name: Apply v0.10.725 UI and quantity fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v725_ui_quantity_fix.py'
      - '.github/workflows/apply-v725.yml'
      - 'TRIGGER_V725.txt'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch with diagnostics
        id: patch
        shell: bash
        run: |
          set +e
          python3 scripts/apply_v725_ui_quantity_fix.py > PATCH_LOG_V725.txt 2>&1
          status=$?
          echo "exit_status=$status" >> PATCH_LOG_V725.txt
          cat PATCH_LOG_V725.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate JavaScript
        if: steps.patch.outputs.status == '0'
        run: |
          node --check js/app.js
          node --check js/game-data.js
          node --check js/firebase-service.js
      - name: Validate markers
        if: steps.patch.outputs.status == '0'
        run: |
          grep -q "0.10.725" js/game-data.js
          grep -q "longPressQuantityDelta" js/app.js
          grep -q "padding: 116px 0 0" game.html
          grep -q "0.10.725" sw.js
      - name: Commit result or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.patch.outputs.status }}" = "0" ]; then
            git commit -m "725 portrait spacing and fast quantity hold"
          else
            git commit -m "725 patch diagnostic"
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 2
          done
          exit 1
