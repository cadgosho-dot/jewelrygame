name: Phase16 Formal Sync v0.10.905

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jewelrygame-pages-and-metals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Register Stage16 checker and sync version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-current.py')
          text = p.read_text(encoding='utf-8')
          needle = "    ('工房工具購入・修理処理保護', [sys.executable, str(ROOT / 'scripts/check-workshop-tool-trade-regression.py')]),\n"
          insert = needle + "    ('店舗契約処理保護', [sys.executable, str(ROOT / 'scripts/check-rent-next-store-regression.py')]),\n"
          if "check-rent-next-store-regression.py" not in text:
              if needle not in text:
                  raise SystemExit('Stage16 insertion point not found')
              text = text.replace(needle, insert, 1)
              p.write_text(text, encoding='utf-8')
          PY
          python3 scripts/version-sync.py --set 0.10.905
          python3 scripts/version-sync.py --check
          python3 scripts/check-rent-next-store-regression.py
      - name: Commit formal sync and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase16-sync-v010905.yml
          git add -A
          git commit -m "v0.10.905 第16段階正式同期"
          git push origin HEAD:main
