name: Temporary startup cloud timeout repair

on:
  push:
    branches:
      - fix/startup-cloud-timeout-v0.10.891

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/startup-cloud-timeout-v0.10.891
          fetch-depth: 1

      - name: Apply startup recovery patch
        run: python3 tools/tmp-apply-startup-cloud-timeout-fix.py

      - name: Install audit dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Validate repair
        env:
          JXJ_REQUIRE_BROWSER_SMOKE: '1'
        run: |
          python3 scripts/version-sync.py --check
          python3 scripts/check-startup-cloud-timeout.py
          python3 scripts/check-startup-cloud-timeout-browser.py
          timeout 10m python3 -u scripts/check-current.py

      - name: Commit repair and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-startup-cloud-timeout-fix.yml tools/tmp-apply-startup-cloud-timeout-fix.py
          git add VERSION CHANGELOG.md js/app.js scripts/check-current.py scripts/check-startup-cloud-timeout.py scripts/check-startup-cloud-timeout-browser.py
          git commit -m "v0.10.891 起動時クラウド無応答でも端末セーブから復旧"
          git push origin HEAD:fix/startup-cloud-timeout-v0.10.891
