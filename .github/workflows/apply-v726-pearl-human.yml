name: Apply v0.10.726 Pearl Human event

on:
  push:
    branches: [main]
    paths:
      - 'TRIGGER_V726_PEARL_HUMAN.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Restore one-shot patch script
        run: |
          base64 -d scripts/apply-v726-pearl-human.py.gz.b64 | gzip -d > scripts/apply_v726_pearl_human_event.py

      - name: Apply v0.10.726
        run: python scripts/apply_v726_pearl_human_event.py

      - name: Validate JavaScript and build markers
        run: |
          node --check js/app.js
          node --check js/game-data.js
          node --check js/audio-scene-map.js
          node --check js/firebase-service.js
          grep -q "export const VERSION = '0.10.726';" js/game-data.js
          grep -q "export const SAVE_SCHEMA_VERSION = 1;" js/game-data.js
          grep -q "pearlHumanEvent" js/app.js
          grep -q "Math.floor(Math.random() \* 30)" js/app.js
          grep -q "pearlHumanEffectActive() ? 2 : 1" js/app.js
          grep -q "pearlHumanEvent: 'displayShop'" js/audio-scene-map.js
          test -s assets/images/events/pearl-human.png
          grep -q "0.10.726" sw.js
          grep -q "0.10.726" game.html
          test -s VALIDATION_v0.10.726.txt

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Pearl Human display shop event v0.10.726"
          git push
