name: Build wolf boy event assets

on:
  push:
    branches:
      - feature/wolf-boy-ring-event
    paths:
      - 'tmp/wolf-boy-assets/asset-build.ready'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wolf-boy-ring-event
          fetch-depth: 0
      - name: Decode and verify approved assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/events assets/videos
          cat tmp/wolf-boy-assets/character.part.* | base64 --decode > assets/images/events/wolf-boy.png
          cat tmp/wolf-boy-assets/ring.part.* | base64 --decode > assets/images/events/wolf-boy-ring.png
          cat tmp/wolf-boy-assets/video.part.* | base64 --decode > assets/videos/wolf-boy-ring-event.mp4
          echo 'd96c5a4299bfe42c65cc05f5cb861f5be7b72e3986f40807157573439520c128  assets/images/events/wolf-boy.png' | sha256sum --check
          echo 'd0f428c3ee409bb39bba6f3fd9fa69729762bdab15ffe986185a1f278d79b7ff  assets/images/events/wolf-boy-ring.png' | sha256sum --check
          echo 'e19c6d8d64023ad1b475d3dac049b8f27963b2f1ebdc6a0144c444b78a8695e6  assets/videos/wolf-boy-ring-event.mp4' | sha256sum --check
          file assets/images/events/wolf-boy.png assets/images/events/wolf-boy-ring.png assets/videos/wolf-boy-ring-event.mp4
      - name: Commit binary assets and remove transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/wolf-boy-assets
          rm -f .github/workflows/build-wolf-boy-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '狼少年イベント承認済みアセットを追加'
          git push origin HEAD:feature/wolf-boy-ring-event
