name: codex v0.10.863 diagnose

on:
  push:
    branches:
      - codex/v0-10-863-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect tool brief dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('js/app.js').read_text(encoding='utf-8')
          lines = text.splitlines()
          for name in ['esc', 'renderToolBrief']:
              print(f'=== {name} ===')
              hits = [i for i, line in enumerate(lines) if re.search(rf'\b{re.escape(name)}\b', line)]
              print(f'occurrences={len(hits)}')
              for hit in hits:
                  lo = max(0, hit - 7)
                  hi = min(len(lines), hit + 10)
                  print(f'--- context {lo+1}-{hi} ---')
                  for j in range(lo, hi):
                      print(f'{j+1:05d}: {lines[j]}')
              print()

          forbidden = ['state.', 'saveGame', 'localStorage', 'indexedDB', 'firebase', 'money', 'inventory', 'aquarium', 'eventState', 'Math.random', 'Date(', 'gameDate', 'spendMinutes', 'spendHours']
          start = text.index('function renderToolBrief(')
          next_fn = text.find('\nfunction ', start + 1)
          block = text[start: next_fn if next_fn >= 0 else len(text)]
          print('=== renderToolBrief forbidden dependency scan ===')
          for token in forbidden:
              print(f'{token}: {token in block}')
          PY
